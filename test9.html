btain $740-0.46t$."], "visual": null, "source": "Panda Test 6 · Native conversion", "level": "Medium", "answer": "1", "choices": ["$740-0.125t$", "$740-0.46t$", "$740-23t$", "$740-27.6t$"]}, {"skill": "Functions", "domain": "Advanced", "referenceModule": 3, "referenceQuestion": 6, "id": "t9-native-6", "parentTestId": "test-9", "prompt": "If $f(x)=\\sqrt x+1$, what is $f(x^2+4)$?", "steps": ["Replace the entire input of $f$ with $x^2+4$.", "This gives $\\sqrt{x^2+4}+1$."], "visual": null, "source": "Panda Test 6 · Native conversion", "level": "Medium", "answer": "2", "choices": ["$x+3$", "$x+5$", "$\\sqrt{x^2+4}+1$", "$\\sqrt{x^3+4x}+1$"]}, {"skill": "Interpreting linear models", "domain": "Algebra", "referenceModule": 3, "referenceQuestion": 7, "id": "t9-native-7", "parentTestId": "test-9", "prompt": "A hospital models minutes per patient as $y=30-3x$, where $x$ is the number of forms a doctor fills out each day. What does 3 mean?", "steps": ["The slope is $-3$ minutes per patient per form.", "An increase of one daily form predicts 3 fewer minutes with each patient."], "visual": null, "source": "Panda Test 6 · Native conversion", "level": "Medium", "answer": "2", "choices": ["A form takes 3 minutes to fill out.", "A doctor fills out 3 forms per patient.", "Each additional daily form decreases modeled time per patient by 3 minutes.", "The doctor spends 3 minutes with each patient."]}, {"skill": "Exponents and radicals", "domain": "Advanced", "referenceModule": 3, "referenceQuestion": 8, "id": "t9-native-8", "parentTestId": "test-9", "prompt": "If $2^{a+4}=8^a$, what is $a$?", "steps": ["Write $8^a=2^{3a}$.", "Then $a+4=3a$, so $a=2$."], "visual": null, "source": "Panda Test 6 · Native conversion", "level": "Medium", "answer": "1", "choices": ["1", "2", "3", "4"]}, {"skill": "Solving equations", "domain": "Algebra", "referenceModule": 3, "referenceQuestion": 9, "id": "t9-native-9", "parentTestId": "test-9", "prompt": "If $\\frac{2a+2b}{3c+3d}=1$, what is $\\frac{3a+3b function rich(value) {

function calculate(src, vars = {}) {

    function expr() {
        let a = term();
        while (t[i] === '+' || t[i] === '-') {
            let op = t[i++],
                b = term();
            a = op === '+' ? a + b : a - b;
        }
        return a;
    }

    function term() {
        let a = unary();
        while (t[i] === '*' || t[i] === '/') {
            let op = t[i++],
                b = unary();
            a = op === '*' ? a * b : a / b;
        }
        return a;
    }

    function unary() {
        if (t[i] === '+') {
            i++;
            return unary();
        }
        if (t[i] === '-') {
            i++;
            return -unary();
        }
        return power();
    }

    function power() {

        if (t[i] === '^') {

    }

    function atom() {

            let a = expr();
            if (t[i++] !== ')') throw Error('Missing closing parenthesis.');
            return a;
        }

        if (c === 'e') return Math.E;
        if (c in vars) return vars[c];
        if (/^(sqrt|sin|cos|tan|ln|log|abs)$/.test(c || '')) {

            let a = expr();
            if (t[i++] !== ')') throw Error('Missing closing parenthesis.');

                sin: Math.sin,
                cos: Math.cos,

            skills[q.skill] = skills[q.skill] || {

                ok: 0

    $('app').querySelectorAll('[data-answer]').forEach(b => b.onclick = () => selectChoice(Number(b.dataset.answer)));
    $('app').querySelectorAll('[data-eliminate]').forEach(b => b.onclick = () => {
        let n = Number(b.dataset.eliminate),
            a = s.eliminated[q.id] || [];
        s.eliminated[q.id] = a.includes(n) ? a.filter(x => x !== n) : [...a, n];
        if (s.answers[q.id] === String(n)) delete s.answers[q.id];
        render();
    });
    bind('response', e => {
        const wasBlank = isBlank(s.answers[q.id]);
        s.answers[q.id] = e.target.value;
        if (wasBlank && !isBlank(e.target.value)) logActivity();
        if (showSolution) {
            showSolution = false;
            document.querySelector('.solution')?.remove();
            if ($('checkBtn')) $('checkBtn').textContent = 'Check & see solution';
        }
        const bad = e.target.value.trim() && !Number.isFinite(numeric(e.target.value));
        $('inputError').textContent = bad ? 'Enter a finite number or a fraction.' : '';
        const fb = $('instantFb'),
            show = instant && !isBlank(e.target.value) && !bad,
            good = show && correct(q, e.target.value);
        fb.className = 'mini instant-fb ' + (show ? (good ? 'good' : 'bad') : 'hide');
        fb.textContent = show ? (good ? '✓ Correct' : '✗ Not yet — keep working') : '';
        e.target.classList.toggle('ok', show && good);
        e.target.classList.toggle('bad', show && !good);
        updateGridCell();
        save();
    }, 'input');
    bind('instantToggle', e => {
        db.prefs.instantCheck = e.target.checked;
        render();
    }, 'change');
    bind('nextBlank', nextUnanswered);
    bind('flagBtn', () => {
        s.flags[q.id] = !s.flags[q.id];
        render();
    });
    bind('clearAnswer', () => {
        delete s.answers[q.id];
        render();
    });
    bind('hintBtn', () => {
        showHint = !showHint;
        if (showHint) s.assisted[q.id] = true;
        render();
    });
    bind('checkBtn', () => {
        showSolution = !showSolution;
        if (showSolution) {s.assisted[q.id] = true;if(!correct(q,s.answers[q.id])&&!isBlank(s.answers[q.id])){queueMiss(q,s.answers[q.id]);save();}}
        render();
    });
    bind('prevBtn', () => go(s.index - 1));
    bind('nextBtn', () => s.index === hi - 1 ? requestFinish() : go(s.index + 1));
    bind('finishBtn', requestFinish);
    bind('newTest', () => {
        view = 'library';
        render();
    });
    bind('calcBtn', calculatorWindow);
    bind('refBtn', referenceWindow);
    bind('scratchBtn', notesWindow);
    bindAIControls('similar', [q], false, s.parentTestId);
    updateTimer();
}

function selectChoice(n) {
    const s = db.session,
        q = s.questions[s.index];
    if (!q.choices || n < 0 || n >= q.choices.length) return;
    if (isBlank(s.answers[q.id])) logActivity();
    s.answers[q.id] = String(n);
    s.eliminated[q.id] = (s.eliminated[q.id] || []).filter(x => x !== n);
    render();
}

function updateGridCell() {
    const s = db.session,
        b = document.querySelector('[data-q="' + s.index + '"]');
    if (b) b.classList.toggle('answered', !isBlank(s.answers[s.questions[s.index].id]));
}

function nextUnanswered() {
    const s = db.session,
        [lo, hi] = activeRange();
    for (let k = 1; k <= hi - lo; k++) {
        const i = lo + ((s.index - lo + k) % (hi - lo));
        if (isBlank(s.answers[s.questions[i].id])) {
            go(i);
            return;
        }
    }
    toast('Every question in this module has an answer.');
}
// Keyboard shortcuts for the workspace. Ignored inside inputs and floating windows.
function handleShortcut(e) {
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    const t = e.target;
    if (t.closest && (t.closest('.window') || t.matches('input,textarea,select,[contenteditable]'))) return;
    if (e.key === '?') {
        e.preventDefault();
        shortcutsWindow();
        return;
    }
    if (view !== 'practice' || db.session.complete || activePopupSet) return;
    const s = db.session,
        q = s.questions[s.index],
        [lo, hi] = activeRange(),
        k = e.key.toLowerCase();
    if (e.key === 'ArrowRight' || k === 'j') {
        if (s.index < hi - 1) go(s.index + 1);
    } else if (e.key === 'ArrowLeft' || k === 'k') {
        if (s.index > lo) go(s.index - 1);
    } else if (/^[1-4]$/.test(k) && q.choices) selectChoice(Number(k) - 1);
    else if (/^[a-d]$/.test(k) && q.choices) selectChoice(k.charCodeAt(0) - 97);
    else if (k === 'f') {
        s.flags[q.id] = !s.flags[q.id];
        render();
    } else if (k === 'n') nextUnanswered();
    else if (k === 'c' && !s.timed) $('checkBtn')?.click();
    else if (k === 'h' && !s.timed) $('hintBtn')?.click();
    else if (k === 'x' && !q.choices) $('response')?.focus();
    else if (k === '=') calculatorWindow();
    else if (k === 'r') referenceWindow();
    else if (k === 's') notesWindow();
    else return;
    e.preventDefault();
}

function go(i) {
    const [lo, hi] = activeRange();
    i = Math.max(lo, Math.min(hi - 1, i));
    db.session.index = i;
    showSolution = false;
    showHint = false;
    lastTick = Date.now();
    render();
}

function requestFinish() {
    let s = db.session,
        [lo, hi] = activeRange(),
        blank = s.questions.slice(lo, hi).filter(q => s.answers[q.id] == null || String(s.answers[q.id]).trim() === '').length;
    confirmWindow(s.timed && s.module === 0 ? 'Submit section 3?' : 'Finish this set?', `${blank?blank+' unanswered question'+(blank===1?'':'s')+'. ':''}${s.timed?'You cannot return to this section after submitting.':'Your report will include every question, including unanswered ones.'}`, () => finish());
}

function finish() {
    let s = db.session;
    if (s.complete) return;
    if (s.timed && s.module === 0) {
        s.module = 1;
        s.index = 20;
        s.deadline = Date.now() + 55 * 60000;
        showSolution = false;
        save();
        render();
        toast('Section 4 started. Section 3 is locked.');
        return;
    }
    s.complete = true;
    s.finished = Date.now();
    s.deadline = null;
    showHint = false;
    logActivity();
    db.history.unshift(structuredClone(s));
    syncMissedHistory();
    reportId = s.id;
    view = 'report';
    showSolution = false;
    render();
}

function startSet(qs, name, timed = false, parentTestId = qs[0]?.parentTestId || 'test-9', startIndex = 0) {
    if (!qs.length) return toast('No questions to practice.');
    const run = () => {
        if ($('aiPracticeWindow')) closeAIPractice();

function updateTimer() {
    const s = db.session;
    if (!s.timed || s.complete) return;
    let left = Math.max(0, Math.ceil((s.deadline - Date.now()) / 1000));
    if ($('timer')) {
        $('timer').textContent = String(Math.floor(left / 60)).padStart(2, '0') + ':' + String(left % 60).padStart(2, '0');
        $('timer').classList.toggle('warn', left < 300);
    }
    if (left === 0) {
        document.querySelectorAll('.window').forEach(w => w.remove());
        finish();

function trendChart(history) {
    const pts = history.slice().filter(h => h.finished).sort((a, b) => a.finished - b.finished).slice(-12).map(h => Math.round(100 * h.questions.filter(q => correct(q, h.answers[q.id])).length / h.questions.length));
    if (pts.length < 2) return '<p class="mini muted">Finish two or more sets to see your accuracy trend.</p>';
    const W = 420,
        H = 170,
        X = i => 34 + i * (W - 50) / (pts.length - 1),
        Y = v => 18 + (100 - v) * (H - 48) / 100;
    let o = '<svg class="chart trend" viewBox="0 0 ' + W + ' ' + H + '" role="img"><title>Accuracy across your last ' + pts.length + ' attempts</title>';
    for (const v of [0, 25, 50, 75, 100]) o += '<path d="M34 ' + Y(v) + 'H' + (W - 12) + '" stroke="var(--line)"/><text x="28" y="' + (Y(v) + 4) + '" text-anchor="end" font-size="11" fill="var(--muted)">' + v + '</text>';
    o += '<path d="' + pts.map((v, i) => (i ? 'L' : 'M') + X(i).toFixed(1) + ' ' + Y(v).toFixed(1)).join('') + '" fill="none" stroke="var(--accent)" stroke-width="3" stroke-linejoin="round"/>';
    o += pts.map((v, i) => '<circle cx="' + X(i) + '" cy="' + Y(v) + '" r="4.5" fill="var(--accent)"><title>Attempt ' + (i + 1) + ': ' + v + '%</title></circle><text x="' + X(i) + '" y="' + (H - 8) + '" text-anchor="middle" font-size="11" fill="var(--muted)">' + (i + 1) + '</text>').join('');
    return o + '</svg>';
}

function domainBars(domains, keys = Object.keys(DOMAIN_NAMES)) {
    return keys.map(d => {
        const x = domains[d];
        if (!x) return '<div class="domain"><div class="row between"><strong>' + esc(DOMAIN_NAMES[d]) + '</strong><span class="mini muted">Not yet practiced</span></div><div class="meter"><i style="width:0"></i></div></div>';
        const pct = Math.round(100 * x.ok / x.n);
        return '<div class="domain"><div class="row between"><strong>' + esc(DOMAIN_NAMES[d]) + '</strong><span>' + pct + '% · ' + x.ok + '/' + x.n + '</span></div><div class="meter"><i class="' + (pct < 60 ? 'low' : pct < 80 ? 'mid' : '') + '" style="width:' + pct + '%"></i></div></div>';
    }).join('');
}

function weakSkills(stats, limit = 5) {
    return Object.entries(stats.skills).filter(([, v]) => v.n >= 1 && v.ok < v.n).sort((a, b) => a[1].ok / a[1].n - b[1].ok / b[1].n || b[1].n - a[1].n).slice(0, limit);
}

function drillWindow(testId = db.selectedTestId) {
    const test = db.tests.find(t => t.id === testId) || db.tests[0],
        originals = testQuestions(test),
        aiQs = testSets(test.id).flatMap(x => x.questions),
        levels = ['Easy', 'Hard', 'Harder'],
        domains = Object.keys(DOMAIN_NAMES),
        prefs = db.drillPrefs || {
            domains,
            levels,
            ai: true,
            count: 10,
            shuffle: true,
            onlyMissed: false
        };
    const missedIds = new Set(db.history.flatMap(h => h.questions.filter(q => !correct(q, h.answers[q.id])).map(q => q.id)));
    openWindow('drillWindow', esc(test.name) + ' · Custom drill', '<div class="field"><label>Domains</label><div class="check-grid">' + domains.map(d => '<label class="switch"><input type="checkbox" data-dom="' + d + '" ' + (prefs.domains.includes(d) ? 'checked' : '') + '><span>' + esc(DOMAIN_NAMES[d]) + '</span></label>').join('') + '</div></div><div class="field"><label>Levels</label><div class="check-grid three">' + levels.map(l => '<label class="switch"><input type="checkbox" data-lvl="' + l + '" ' + (prefs.levels.includes(l) ? 'checked' : '') + '><span>' + l + '</span></label>').join('') + '</div></div><div class="field check-grid"><label class="switch"><input type="checkbox" id="drillAI" ' + (prefs.ai ? 'checked' : '') + ' ' + (aiQs.length ? '' : 'disabled') + '><span>Include AI sets (' + aiQs.length + ')</span></label><label class="switch"><input type="checkbox" id="drillMissed" ' + (prefs.onlyMissed ? 'checked' : '') + '><span>Only questions I have missed</span></label><label class="switch"><input type="checkbox" id="drillShuffle" ' + (prefs.shuffle ? 'checked' : '') + '><span>Shuffle order</span></label></div><div class="field"><label for="drillCount">Length</label><div class="row">' + [5, 10, 15, 20].map(n => '<button class="small" data-dcount="' + n + '">' + n + '</button>').join('') + '<button class="small" data-dcount="all">All</button><input id="drillCount" type="number" min="1" max="200" value="' + prefs.count + '" style="width:80px" aria-label="Number of questions"></div></div><p id="drillMatch" class="mini" role="status"></p><button id="drillStart" class="primary full">Start drill</button>');
    const w = $('drillWindow');
    const current = () => {
        const doms = [...w.querySelectorAll('[data-dom]:checked')].map(x => x.dataset.dom),
            lv = [...w.querySelectorAll('[data-lvl]:checked')].map(x => x.dataset.lvl),
            useAI = $('drillAI').checked,
            onlyMissed = $('drillMissed').checked;
        const pool = [...originals, ...(useAI ? aiQs : [])].filter(q => doms.includes(q.domain) && lv.includes(q.level) && (!onlyMissed || missedIds.has(q.id)));
        return {
            doms,
            lv,
            useAI,
            onlyMissed,
            pool
        };
    };
    const refresh = () => {
        const {
            pool
        } = current();
        $('drillMatch').textContent = pool.length ? pool.length + ' question' + (pool.length === 1 ? '' : 's') + ' match these filters.' : 'No stored questions match. Widen the filters or generate AI practice.';
        $('drillStart').disabled = !pool.length;
    };
    w.querySelectorAll('input[type=checkbox]').forEach(x => x.onchange = refresh);
    w.querySelectorAll('[data-dcount]').forEach(b => b.onclick = () => {
        $('drillCount').value = b.dataset.dcount === 'all' ? current().pool.length || 1 : b.dataset.dcount;
        w.querySelectorAll('[data-dcount]').forEach(x => x.classList.toggle('dark', x === b));
    });
    bind('drillStart', () => {
        const c = current(),
            n = Math.max(1, Math.min(200, Number($('drillCount').value) || 10)),
            ordered = $('drillShuffle').checked ? shuffle(c.pool) : c.pool,
            qs = ordered.slice(0, n);
        db.drillPrefs = {
            domains: c.doms,
            levels: c.lv,
            ai: c.useAI,
            count: n,
            shuffle: $('drillShuffle').checked,
            onlyMissed: c.onlyMissed
        };
        save();
        w.remove();
        startSet(qs, 'Drill · ' + (c.doms.length === domains.length ? 'Mixed domains' : c.doms.map(d => DOMAIN_NAMES[d]).join(', ')) + ' · ' + qs.length + ' q', false, test.id);
    });
    refresh();
}

function parseMissedFile(text){let data;try{const marker=text.match(/<!-- VERTEX_MISSED_JSON -->\s*(`{3,})json\n([\s\S]*?)\n\1/);const embedded=text.match(/<script type="application\/json" id="vertex-review-data">([\s\S]*?)<\/script>/);data=JSON.parse(marker?marker[2]:embedded?embedded[1]:text);}catch{throw Error('Use a missed-question JSON or Markdown file exported by Vertex.');}if(data?.format!=='vertex-missed-questions'||data.version!==1||!Array.isArray(data.questions)||!data.questions.length||data.questions.length>500)throw Error('This is not a supported missed-question export.');if(data.testId!=='test-9')throw Error('This file belongs to another test. Import it in that test’s page.');for(const item of data.questions){const q=item.question;if(!q||typeof q.prompt!=='string'||q.prompt.length>10000||typeof q.skill!=='string'||!q.skill.length||q.skill.length>150||!['Algebra','Advanced','Data','Geometry'].includes(q.domain)||!Array.isArray(q.steps)||q.steps.some(t=>typeof t!=='string'))throw Error('The file contains an invalid question.');if(q.choices&&(!Array.isArray(q.choices)||q.choices.length!==4||q.choices.some(x=>typeof x!=='string')||!Number.isInteger(Number(q.answer))||Number(q.answer)<0||Number(q.answer)>3))throw Error('Invalid answer choices.');const v=q.visual;if(v){if(v.type==='table'){if(!Array.isArray(v.headers)||v.headers.length>10||v.headers.some(x=>typeof x!=='string')||!Array.isArray(v.rows)||v.rows.length>100||v.rows.some(r=>!Array.isArray(r)||r.length!==v.headers.length||r.some(x=>!['string','number'].includes(typeof x))))throw Error('Invalid table.');}else if(['curve','scatter'].includes(v.type)){if(!Array.isArray(v.range)||v.range.length!==4||v.range.some(x=>!Number.isFinite(x)||Math.abs(x)>1e6)||v.range[1]-v.range[0]<1e-6||v.range[3]-v.range[2]<1e-6)throw Error('Invalid graph range.');if(v.type==='curve'&&(!Array.isArray(v.coeff)||v.coeff.length>8||v.coeff.some(x=>!Number.isFinite(x))))throw Error('Invalid curve.');if(v.type==='scatter'&&(!Array.isArray(v.points)||v.points.length>500||v.points.some(p=>!Array.isArray(p)||p.length!==2||p.some(x=>!Number.isFinite(x)))))throw Error('Invalid scatterplot.');}else if(['triangle','rightTriangle'].includes(v.type)){if(!Array.isArray(v.labels)||v.labels.length!==3)throw Error('Invalid triangle labels.');}else if(['circleArcs','parallelVertical','histograms','choiceTables','lineSeries','exponential'].includes(v.type))validateSpecialVisual(v);else if(v.type==='nativeSVG'){const original=BANK.find(b=>b.visual?.type==='nativeSVG'&&b.visual.name===v.name);if(!original)throw Error('Unknown native figure.');q.visual=structuredClone(original.visual);}else if(v.type!=='parallel')throw Error('Unsupported diagram.');}}return data;}

function skillAdvice(skill,domain){const name=skill.toLowerCase();if(/percent|growth|exponential/.test(name))return['Translate percentages into multipliers: increase by p% uses 1 + p/100; decrease uses 1 − p/100. Identify the starting value and count growth periods.','Do not confuse the percent change with the multiplier or apply it to the wrong starting quantity.'];if(/system|substitution|perpendicular|dependent/.test(name))return['Use substitution or elimination. Write a line in slope-intercept form when comparing slopes, and check a solution in both original equations.','Parallel lines have equal slopes; perpendicular nonvertical lines have slopes whose product is −1.'];if(/quadratic|roots|zeros|discriminant|minimum|extrema/.test(name))return['Choose factoring for roots, vertex form for an extremum, or the discriminant b² − 4ac for the number of real roots. Check any stated sign restriction.','The vertex x-coordinate is not the minimum or maximum output. Report the quantity the question asks for.'];if(/circle|area|volume|triangle|pythagorean|radian|angle|geometry/.test(name))return['Label the known dimensions. Choose the relevant geometry relationship, keep units consistent, and distinguish radius from diameter.','Length scales by k, area by k², and volume by k³. Round only at the final step.'];if(/mean|frequency|probability|scatter|statistics/.test(name))return['Identify what each value or frequency represents. Use the full sample size for probabilities and a weighted total for a frequency-table mean.','A zero-frequency row is not an observed value. A correlation alone does not establish causation.'];if(/unit|rate/.test(name))return['Write the rate as a fraction with units. Multiply by conversion factors so unwanted units cancel.','Square conversion factors for area and cube them for volume.'];if(/budget|inequal|constraint/.test(name))return['Separate the fixed charge from the per-unit charge, then write the budget inequality. Enforce whole-number restrictions i // Nonmodal movable windows; pointer capture supports mouse and touch, arrows move the title bar.
function openWindow(id, title, html, onClose = null) {
    let prev = document.activeElement;
    if ($(id)) {
        $(id).style.zIndex = ++z;
        return $(id);
    }
    let w = document.createElement('section');
    w.id = id;
    w.className = 'window';
    w.style.zIndex = ++z;
    w.setAttribute('role', 'dialog');
    w.setAttribute('aria-label', title);
    w.innerHTML = '<div class="window-bar" tabindex="0" aria-label="Drag window; arrow keys move it"><span>' + esc(title) + '</span><button aria-label="Close window">×</button></div><div class="window-body">' + html + '</div>';
    $('windows').append(w);
    w.style.top = Math.min(100 + (z % 4) * 16, Math.max(12, window.innerHeight - w.offsetHeight - 12)) + 'px';
    let close = () => {
        if (id === 'genWindow' && genController) {
            genController.abort();
        }
        w.remove();
        if (onClose) onClose();
        if (prev?.isConnected) prev.focus();
    };
    w.querySelector('.window-bar button').onclick = close;
    w.addEventListener('pointerdown', () => w.style.zIndex = ++z);
    w.addEventListener('keydown', e => {
        if (e.key === 'Escape') {
            e.stopPropagation();
            close();
        }
    });
    let bar = w.firstElementChild,
        drag = null;

    function move(x, y) {
        w.style.left = Math.max(0, Math.min(innerWidth - w.offsetWidth, x)) + 'px';
        w.style.top = Math.max(0, Math.min(innerHeight - 55, y)) + 'px';
    }
    bar.onpointerdown = e => {
        if (e.target.closest('button')) return;
        let r = w.getBoundingClientRect();
        drag = {
            x: e.clientX - r.left,
            y: e.clientY - r.top
        };
        bar.setPointerCapture(e.pointerId);
    };
    bar.onpointermove = e => {
        if (drag) move(e.clientX - drag.x, e.clientY - drag.y);
    };
    bar.onpointerup = () => drag = null;
    bar.onpointercancel = () => drag = null;
    bar.onkeydown = e => {
        if (['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown'].includes(e.key)) {
            e.preventDefault();
            let r = w.getBoundingClientRect();
            move(r.left + (e.key === 'ArrowRight' ? 15 : e.key === 'ArrowLeft' ? -15 : 0), r.top + (e.key === 'ArrowDown' ? 15 : e.key === 'ArrowUp' ? -15 : 0));
        }
    };
    bar.focus();
    return w;
}

function verifiedAbsoluteVariants(sources, count, level, offset) {
    const result=[];
    for(let i=0;i<count;i++){
        const source=sources[i%sources.length],text=source.generationText||source.searchText||source.prompt||'';
        if(!/absolute value/i.test(source.skill||'') || !/(?:\\frac|\/).*x/.test(text) || !/[<>]/.test(text))return null;
        const k=3+((offset+i)*7)%97,N=k+5+(offset+i)%8,p=2+(offset+i)%3,q=3+(offset+i)%4;
        const mode=(offset+i+(level==='Harder'?1:0))%6;let prompt,answer,steps;
        if(mode===0){answer=2*(N-k);prompt=`How many integers $x$ in the interval $-${N}\\le x\\le ${N}$ satisfy $0<|\\frac{${k}}{x}|<1$?`;
            steps=[`The denominator must be nonzero. The inequality is equivalent to $|x|>${k}$.`,`The positive integers are ${k+1} through ${N}, giving ${N-k} choices.`,`There are equally many negative choices, for a total of $2(${N-k})=${answer}$.`];}
        if(mode===1){answer=(k+1+N)*(N-k)/2;prompt=`Find the sum of all positive integers $x\\le ${N}$ satisfying $|\\frac{${k}}{x}|<1$.`;
            steps=[`For positive x, the inequality requires $x>${k}$.`,`The solutions are the consecutive integers ${k+1} through ${N}, a total of ${N-k} terms.`,`Their sum is $\\frac{(${k+1}+${N})(${N-k})}{2}=${answer}$.`];}
        if(mode===2){answer=Math.floor(k*q/p)+1;prompt=`What is the least positive integer $x$ for which $|\\frac{${k}}{x}|<\\frac{${p}}{${q}}$?`;
            steps=[`For positive x, remove the absolute value and multiply by the positive quantity $${q}x$.`,`This gives $${k*q}<${p}x$, or $x>\\frac{${k*q}}{${p}}$.`,`The least integer strictly above this bound is ${answer}.`];}
        if(mode===3){answer=Math.ceil(k*q/p)-1;prompt=`What is the greatest positive integer $x$ satisfying $|\\frac{${k}}{x}|>\\frac{${p}}{${q}}$?`;
            steps=[`Since x is positive, multiply both sides by $${q}x$ without changing the inequality direction.`,`Then $${k*q}>${p}x$, so $x<\\frac{${k*q}}{${p}}$.`,`The greatest integer strictly below this bound is ${answer}.`];}
        if(mode===4){answer=k;prompt=`The constant $c$ is a positive integer. The least positive integer satisfying $|\\frac{c}{x}|<1$ is ${k+1}. What is $c$?`;
            steps=[`For positive x, the inequality is equivalent to $x>c$.`,`Because c is an integer, the least possible positive integer x is $c+1$.`,`Thus $c+1=${k+1}$ and $c=${k}$.`];}
        if(mode===5){answer=2*(k+1);prompt=`Among the integer solutions to $0<|\\frac{${k}}{x}|<1$, let $u$ be the greatest negative solution and $v$ the least positive solution. What is the distance between $u$ and $v$ on the number line?`;
            steps=[`The inequality is equivalent to $|x|>${k}$.`,`The two solutions closest to zero are $u=-${k+1}$ and $v=${k+1}$.`,`Their distance is $v-u=${k+1}-(-${k+1})=${answer}$.`];}
        result.push({id:'verified-absolute-'+Date.now()+'-'+i+'-'+Math.random().toString(36).slice(2,8),prompt,answer:String(answer),steps,choices:null,visual:null,tolerance:0,skill:source.skill,domain:source.domain,level,source:'Vertex verified generator',modelUsed:'Built-in absolute-value generator',verification:'Constructed and checked with exact arithmetic',sourceQuestionId:source.id,similarityChecked:true,variationAngle:'Absolute-value reasoning variant '+mode,validationParameters:{k,N,p,q,mode}});
    }
    return result;
}

function mapQuestionReviews(review, batch) {
    if(!review || !Array.isArray(review.reviews) || review.reviews.length!==batch.length)throw Error('Incomplete review response.');
    const rows=review.reviews, ids=rows.map(r=>r && (typeof r.id==='string'||typeof r.id==='number')?String(r.id).trim():null);
    if(ids.some(id=>id===null)||new Set(ids).size!==batch.length)throw Error('Missing or duplicate review identifiers.');
    const schemes=[batch.map((_,i)=>'item-'+(i+1)),batch.map(q=>String(q.id)),batch.map((_,i)=>String(i)),batch.map((_,i)=>String(i+1))];
    const scheme=schemes.find(keys=>new Set(keys).size===batch.length && keys.every(key=>ids.includes(key)));
    if(!scheme)throw Error('Review identifiers do not match the submitted questions.');
    return rows.map((r,i)=>({...r,id:scheme.indexOf(ids[i])}));
}
async function requestQuestionReview(prompt,batch,signal) {
    const schema=structuredClone(reviewSchema),aliases=batch.map((_,i)=>'item-'+(i+1));
    schema.properties.reviews.items.properties.computedExpression={type:'string'};
    schema.properties.reviews.items.required=[...new Set([...schema.properties.reviews.items.required,'computedExpression'])];
    schema.properties.reviews.items.properties.id={type:'string',enum:aliases};
    const submitted=batch.map((q,i)=>({...q,id:aliases[i]}));
    const instructions=' For each item provide computedExpression: a numeric arithmetic expression reconstructed independently from the question data using only numbers, parentheses, + - * / and ^. Use it for directly evaluable percentage calculations, isolated linear-equation solutions, area/volume calculations and arithmetic. Do not merely repeat the final answer as a constant. Use an empty string for problems that cannot be checked this way. Verify that the expression models the question before marking valid. Review IDs are identifiers, not positions. Copy each question id exactly: '+JSON.stringify(aliases)+'. Return exactly one review per supplied id, with no missing or duplicate ids. Generated questions: '+JSON.stringify(submitted);
    for(let attempt=0;attempt<2;attempt++){
        if(signal.aborted)throw new DOMException('Cancelled','AbortError');
        const result=await gemini(prompt+instructions+(attempt?' The preceding response had malformed review identifiers. Review these same questions again and copy the supplied item ids exactly.':''),schema,signal);
        try{return {reviews:mapQuestionReviews(result,batch)};}
        catch(e){if(attempt)throw Error('The model returned an unusable review twice. Your existing practice is unchanged; no unchecked questions were saved.');setGenStatus('Correcting review labels; keeping the generated questions…');}
    }
}

function practicePattern(text) {
    return String(text || '').toLowerCase().replace(/\b(?:the value of|value of)\b/g, '').replace(/\\[a-z]+/g, ' ').replace(/-?\d+(?:\.\d+)?/g, '#').replace(/\b[a-z]\b/g, '@').replace(/[^a-z#@]+/g, ' ').trim();

// Parse arithmetic without executing model-supplied JavaScript.
function checkedArithmetic(expression) {
 const s=String(expression).replace(/\s+/g,'');
 if(!s||s.length>500||!/^[0-9.+*/()^\-]+$/.test(s))throw Error('Unsupported arithmetic expression.');
 let i=0,depth=0;
 function atom(){if(++depth>40)throw Error('Expression too deeply nested.');let v;if(s[i]==='('){i++;v=sum();if(s[i++]!==')')throw Error('Unbalanced arithmetic.');}else{const m=s.slice(i).match(/^(?:\d+(?:\.\d*)?|\.\d+)/);if(!m)throw Error('Missing number.');i+=m[0].length;v=Number(m[0]);}depth--;return v;}
 function power(){let v=atom();if(s[i]==='^'){i++;v=v**unary();}return v;}
 function unary(){if(s[i]==='+'){i++;return unary();}if(s[i]==='-'){i++;return -unary();}return power();}
 function product(){let v=unary();while(s[i]==='*'||s[i]==='/'){const op=s[i++],r=unary();v=op==='*'?v*r:v/r;}return v;}
 function sum(){let v=product();while(s[i]==='+'||s[i]==='-'){const op=s[i++],r=product();v=op==='+'?v+r:v-r;}return v;}
 const value=sum();if(i!==s.length||!Number.isFinite(value))throw Error('Invalid or nonfinite arithmetic.');return value;
}

 }catch{return false;}
}

function generationExemplar(q) {
    const resolve = value => String(value || '').replace(/@@([^@]+)@@/g, (_, key) => {
        const html = typeof SOURCE_HTML !== 'undefined' ? SOURCE_HTML[key] || '' : '';
        return html.replace(/<svg[\s\S]*?<\/svg>/g, ' [Source mathematical graphic: use the full source text below.] ').replace(/<[^>]+>/g, ' ');
    });
    return {sourceId:q.id, skill:q.skill, domain:q.domain,
        prompt:q.generationText || (!String(q.prompt || '').includes('@@') ? q.prompt : q.searchText || resolve(q.prompt)),
        choices:(q.choices || []).map(resolve), visual:q.visual || null,
        solution:q.steps || [], mistakeContext:q.mistakeContext || null};
}

function abortableWait(ms, signal) {
    return new Promise((resolve, reject) => {
        if (signal.aborted) {
            reject(new DOMException('Cancelled', 'AbortError'));
            return;
        }
        let timer = setTimeout(() => {
            signal.removeEventListener('abort', cancel);
            resolve();
        }, ms);

        function cancel() {
            clearTimeout(timer);
            signal.removeEventListener('abort', cancel);
            reject(new DOMException('Cancelled', 'AbortError'));
        }
        signal.addEventListener('abort', cancel, {
            once: true
        });
    });
}
async function generationWait(ms, signal, message) {
    const until = Date.now() + ms;
    while (Date.now() < until) {
        setGenStatus(message + ' ' + Math.ceil((until - Date.now()) / 1000) + 's…');
        await abortableWait(Math.min(1000, until - Date.now()), signal);
    }
}

function retryInfo(response, data) {
    const e = data?.error || {},
        details = Array.isArray(e.details) ? e.details : [];
    let delay = 0;
    const header = response.headers?.get('Retry-After');
    if (header) {
        delay = /^\d+(\.\d+)?$/.test(header) ? Number(header) * 1000 : Math.max(0, Date.parse(header) - Date.now());
    }
    for (const d of details) {
        if (typeof d.retryDelay === 'string' && /^\d+(\.\d+)?s$/.test(d.retryDelay)) delay = Math.max(delay || 0, parseFloat(d.retryDelay) * 1000);
    }
    const quota = JSON.stringify(details) + ' ' + String(e.message || '');
    const hardQuota = response.status === 429 && (/per[ _]?day|daily|limit:\s*0\b/i.test(quota));
    return {
        delay: Number.isFinite(delay) ? delay : 0,
        hardQuota
    };
}

            continue;
        }
        if (data?.promptFeedback?.blockReason) throw Error('Google blocked this generation. Try a different focus.');
        let candidate = data?.candidates?.[0];
        if (candidate?.finishReason !== 'STOP') throw Error('Google returned an incomplete response. Try fewer questions.');
        let raw = candidate?.content?.parts?.filter(p => !p.thought && p.text).map(p => p.text).join('');
        if (!raw) throw Error('Google returned no question data.');
        try {
            return JSON.parse(raw);
        } catch {
            throw Error('Google returned unreadable question data. Try again.');
        }
    }
}

function validateQuestions(data, n, skills, level) {
    if (!data || !Array.isArray(data.questions) || data.questions.length !== n) throw Error('The AI returned an unexpected question count. No set saved.');
    return data.questions.map((q, i) => {
        if (typeof q.prompt !== 'string' || q.prompt.length < 15 || q.prompt.length > 4000 || !Number.isFinite(numeric(q.answer)) || !Array.isArray(q.steps) || q.steps.length < 2 || q.steps.length > 12 || q.steps.some(s => typeof s !== 'string' || s.length > 3000) || !['Algebra', 'Advanced', 'Data', 'Geometry'].includes(q.domain) || !Number.isFinite(q.tolerance) || q.tolerance < 0 || q.tolerance > 0.5) throw Error('A question failed the content validation. Try generating again.');
        let v = q.visual;
        if (v && v.type !== 'none') {
            if (v.type === 'table') {
                if (!Array.isArray(v.headers) || v.headers.length < 2 || v.headers.length > 6 || !Array.isArray(v.rows) || v.rows.length < 1 || v.rows.length > 25 || v.rows.some(r => !Array.isArray(r) || r.length !== v.headers.length || r.some(x => typeof x !== 'string' || x.length > 100))) throw Error('A generated table was invalid. Try again.');
            } else if (v.type === 'curve' || v.type === 'scatter') {
                if (!Array.isArray(v.range) || v.range.length !== 4 || v.range.some(x => !Number.isFinite(x) || Math.abs(x) > 1e6) || v.range[0] >= v.range[1] || v.range[2] >= v.range[3]) throw Error('A graph had invalid bounds.');
                if (v.type === 'curve' && (!Array.isArray(v.coeff) || v.coeff.length < 2 || v.coeff.length > 5 || v.coeff.some(x => !Number.isFinite(x)))) throw Error('A graph had invalid polynomial data.');
                if (v.type === 'scatter' && (!Array.isArray(v.points) || v.points.length < 2 || v.points.length > 100 || v.points.some(p => !Array.isArray(p) || p.length !== 2 || p.some(x => !Number.isFinite(x))))) throw Error('A scatterplot had invalid points.');
            } else throw Error('Unsupported diagram type. Try again.');
        }
        return {
            ...q,
            skill: skills[i],
            id: 'ai-' + Date.now() + '-' + i + '-' + Math.random().toString(36).slice(2, 8),
            choices: null,
            level,
            source: hubRunSettings?.provider==='lmstudio'?'LM Studio':'Gemini',
            modelUsed: hubRunSettings?.provider==='lmstudio'?hubRunSettings.localModel:workingModel || model,
            visual: v?.type === 'none' ? null : v
        };
    });
}

const MONTHLY_AI_LIMIT=10;
function budgetMonth(){return new Date().toISOString().slice(0,7);}
function monthlyBudget(){let all,pending;try{all=JSON.parse(localStorage.getItem(VertexHub.settingsKey+':costs')||'[]');pending=JSON.parse(localStorage.getItem(VertexHub.settingsKey+':budget-pending')||'null');if(!Array.isArray(all))throw Error();}catch{throw Error('Cost history is unavailable. Gemini is paused to protect the monthly budget.');}
 const month=budgetMonth();let checkpoint;try{checkpoint=JSON.parse(localStorage.getItem(VertexHub.settingsKey+':budget-checkpoint')||'null');}catch{throw Error('Budget reconciliation data is unavailable.');}const current=checkpoint?.month===month;if(current&&(!Number.isFinite(checkpoint.total)||checkpoint.total<0||!Number.isInteger(checkpoint.index)||checkpoint.index<0||checkpoint.index>all.length))throw Error('Budget reconciliation data is invalid.');const rows=(current?all.slice(checkpoint.index):all).filter(x=>String(x.time).startsWith(month));const spent=(current?checkpoint.total:0)+rows.reduce((a,r)=>a+(Number.isFinite(r.usd)?Math.max(0,r.usd):0),0);
 return {month,spent,remaining:Math.max(0,MONTHLY_AI_LIMIT-spent),uncertain:!!(pending&&pending.month===month)||rows.some(r=>r.tier==='paid'&&r.usd===null)};
}
function beginBudgetRequest(selectedModel){const b=monthlyBudget();if(b.uncertain)throw Error('Gemini paused after an interrupted request. Open Cost → Reconcile month to confirm spending and resume. The $10 limit remains active.');if(b.spent>=MONTHLY_AI_LIMIT)throw Error('$10 monthly Gemini budget reached. Use LM Studio or wait until next month (UTC).');
 const settings=hubRunSettings||VertexHub.load(),tier=settings[hubWorkingSlot==='key2'?'billing2':'billing1']||(hubWorkingSlot==='key2'?'paid':'free');
 if(tier==='paid'){if(!VertexHub.rates(settings,selectedModel))throw Error('Set pricing for this model in AI setup before paid generation.');if(b.remaining<0.25)throw Error('Gemini paused: less than $0.25 remains in the $10 monthly budget. This safety margin reduces overshoot. LM Studio remains available.');}
 try{localStorage.setItem(VertexHub.settingsKey+':budget-pending',JSON.stringify({month:b.month,started:new Date().toISOString(),tier}));}catch{throw Error('Cannot save budget tracking. Gemini is paused.');}
}
function finishBudgetRequest(usage,status){if(usage||[400,401,403,404,429].includes(status))localStorage.removeItem(VertexHub.settingsKey+':budget-pending');}

function reconcileMonthAmount(value){
 if(typeof value==='string'&&!value.trim())throw Error('Enter the checked month-to-date amount.');const amount=Number(value);if(!Number.isFinite(amount)||amount<0)throw Error('Enter a valid nonnegative dollar amount.');
 const budget=monthlyBudget(),history=costHistory();if(amount+1e-8<budget.spent)throw Error('Use at least the tracked estimate of $'+budget.spent.toFixed(5)+'.');
 const checkpoint={month:budget.month,index:history.length,total:Math.max(amount,budget.spent),reconciledAt:new Date().toISOString()};
 localStorage.setItem(VertexHub.settingsKey+':budget-checkpoint',JSON.stringify(checkpoint));localStorage.removeItem(VertexHub.settingsKey+':budget-pending');return checkpoint;
}
function reconcileBudgetWindow(){openWindow('reconcileBudgetWindow','Reconcile monthly spending','<p>A cancelled, timed-out or interrupted request may have incurred a charge even if its token usage was not received.</p><p>Check month-to-date Gemini API spending for both projects in Google AI Studio or Cloud Billing. Billing updates may be delayed. Enter a conservative total covering those requests; use at least the tracked estimate.</p><label for="reconcileAmount">Month-to-date total · USD</label><input id="reconcileAmount" class="full" type="number" min="0" step="any" placeholder="Enter checked total"><label style="margin-top:12px"><input id="reconcileChecked" type="checkbox"> I checked usage and included interrupted requests.</label><p class="mini muted">Keeps request history and the $10 limit. New request costs are added to this total. This does not change Google billing.</p><p id="reconcileError" class="error" role="status"></p><button id="reconcileSave" class="primary">Save total</button>');bind('reconcileSave',async()=>{const button=$('reconcileSave');try{if(!$('reconcileChecked').checked)throw Error('Check your usage and tick the confirmation first.');if(!navigator.locks)throw Error('Use Chrome or Edge on HTTPS or localhost.');button.disabled=true;await navigator.locks.request(VertexHub.settingsKey+':budget-lock',{ifAvailable:true},lock=>{if(!lock)throw Error('A Gemini request is still running in another tab. Wait for it to finish.');reconcileMonthAmount($('reconcileAmount').value);});$('reconcileBudgetWindow')?.remove();setGenStatus('');costWindow();toast('Budget updated. Generate again if funds remain.');}catch(e){$('reconcileError').textContent=e.message;button.disabled=false;}});}

function costTotal(rows){const known=rows.reduce((a,r)=>a+(r.usd||0),0);return '$'+known.toFixed(5)+(rows.some(r=>r.usd===null)?' + unknown':'');}
function costHistory(){try{return JSON.parse(localStorage.getItem(VertexHub.settingsKey+':costs')||'[]');}catch{return [];}}
function recordCost(usage,selectedModel,status){const item={...VertexHub.estimateUsage(hubRunSettings||VertexHub.load(),selectedModel,hubWorkingSlot,usage),time:new Date().toISOString(),status};if(!usage&&[400,401,403,404,429].includes(status)){item.usd=0;item.rejected=true;}else if(!usage)item.usd=null;runCosts.push(item);try{localStorage.setItem(VertexHub.settingsKey+':costs',JSON.stringify([...costHistory(),item]));}catch{throw Error('Cannot save cost history. Gemini is paused for budget protection.');}if($('costBtn'))$('costBtn').textContent='Est. '+costTotal(runCosts);}
function costWindow(){const budget=monthlyBudget();const all=costHistory(),today=new Date().toISOString().slice(0,10),recent=all.filter(x=>x.time.startsWith(today));openWindow('costWindow','Estimated API cost','<h3>Monthly Gemini budget: $'+budget.spent.toFixed(4)+' / $10.00</h3><p>Remaining: $'+budget.remaining.toFixed(4)+' · '+budget.month+' (UTC)'+(budget.uncertain?' · Paused: unconfirmed cost':'')+'</p><h3>This generation: '+costTotal(runCosts)+'</h3><p>Today (UTC): '+costTotal(recent)+' · Recorded total: '+costTotal(all)+'</p><table class="full"><thead><tr><th>Key</th><th>Input tokens</th><th>Output + thinking</th><th>Estimate</th></tr></thead><tbody>'+['key1','key2'].map((slot,i)=>{const rows=runCosts.filter(r=>r.slot===slot);return '<tr><td>API '+(i+1)+'</td><td>'+rows.reduce((a,r)=>a+(r.input||0),0)+'</td><td>'+rows.reduce((a,r)=>a+(r.output||0),0)+'</td><td>'+costTotal(rows)+'</td></tr>';}).join('')+'</tbody></table><p class="mini muted">Includes generation and answer-check requests received by this browser, even if the set fails validation. Missing usage, failed requests and unknown prices are marked unknown. Local mode has no Gemini API cost. Totals are estimates, not your Google bill. Cache discounts are not applied; cached input is conservatively estimated at the full input rate. Pricing and free/paid key settings are in AI setup.</p><div class="row"><button id="exportCosts">Export cost history</button><button id="reconcileBudget" class="small">Reconcile month</button></div>');bind('reconcileBudget',reconcileBudgetWindow);bind('exportCosts',()=>download('vertex-cost-history.json',JSON.stringify(all,null,2),'application/json'));}
bind('costBtn',costWindow);

}
