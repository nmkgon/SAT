 dark:{ink:'#e9eef8',slate:'#98a5bd',rule:'#2c3752',wash:'#101827',paper:'#1b2436',scene:'#131b2b',signal:'#7ba4ff',signalSoft:'#22304f',marker:'#f0b64a',markerSoft:'#3d3018',check:'#42cb8d',checkSoft:'#15382a',miss:'#ff7d75',missSoft:'#3d1f1f',orange:'#ff9f57',teal:'#3fd0d0',purple:'#b596ff',grid1:'#2a3550',grid2:'#33405f',grid3:'#3d4c6f'}};
/* Scene colours are stored as tokens ("@signal") so a generated problem keeps working
   after the user flips themes; tokens resolve to hex at paint time. */
const C={};for(const k in PALETTES.light)C[k]='@'+k;
let PAL=PALETTES.light;
const TC=v=>(typeof v==='string'&&v.charCodeAt(0)===64)?(PAL[v.slice(1)]||v):v;
function applyScenePalette(mode){PAL=PALETTES[mode]||PALETTES.light}
const ease=t=>t<0?0:t>1?1:t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;
const fmt=(n,d=2)=>{if(!isFinite(n))return'';const s=(+n).toFixed(d);return s.includes('.')?s.replace(/\.?0+$/,''):s};
const money=n=>'$'+(+n).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
const cm=n=>(+n).toLocaleString('en-US');
function canvasMathText(value){
  let s=String(value??'').replace(/⟦([^⟧]+)⟧/g,(_,x)=>{try{return decodeURIComponent(x)}catch{return x}});
  let prev='';
  while(prev!==s){prev=s;s=s.replace(/\\frac\{([^{}]*)\}\{([^{}]*)\}/g,'$1/$2')}
  return s.replace(/\\(?:mathit|mathrm|text)\{([^{}]*)\}/g,'$1').replace(/\^\{([^{}]*)\}/g,'^$1')
    .replace(/\\times/g,'×').replace(/\\div/g,'÷').replace(/\\le/g,'≤').replace(/\\ge/g,'≥')
    .replace(/\\approx/g,'≈').replace(/\\pm/g,'±').replace(/\\cdot/g,'·').replace(/\\pi/g,'π')
    .replace(/\\circ/g,'°').replace(/\\left|\\right/g,'').replace(/\\\$/g,'$').replace(/[{}]/g,'');
}
function txt(g,s,x,y,o={}){s=canvasMathText(s);const c=g.ctx;c.save();c.font=`${o.bold?'600 ':''}${o.size||12}px ${o.serif?'Georgia,serif':'Roboto,system-ui,sans-serif'}`;c.fillStyle=o.color||C.ink;c.textAlign=o.align||'center';c.textBaseline=o.base||'middle';if(o.bg){const w=c.measureText(s).width+10;c.fillStyle=o.bg;const ax=o.align==='left'?x-5:o.align==='right'?x-w+5:x-w/2;c.fillRect(ax,y-9,w,18);c.fillStyle=o.color||C.ink}c.fillText(s,x,y);c.restore()}
function ln(g,x1,y1,x2,y2,o={}){const c=g.ctx;c.save();c.strokeStyle=o.color||C.ink;c.lineWidth=o.w||1.5;if(o.dash)c.setLineDash(o.dash);c.beginPath();c.moveTo(x1,y1);c.lineTo(x2,y2);c.stroke();c.restore()}
function arrow(g,x1,y1,x2,y2,o={}){ln(g,x1,y1,x2,y2,o);const c=g.ctx,a=Math.atan2(y2-y1,x2-x1),s=o.head||7;c.save();c.fillStyle=o.color||C.ink;c.beginPath();c.moveTo(x2,y2);c.lineTo(x2-s*Math.cos(a-.45),y2-s*Math.sin(a-.45));c.lineTo(x2-s*Math.cos(a+.45),y2-s*Math.sin(a+.45));c.closePath();c.fill();c.restore()}

function axes(g,v,o){const {W,H}=g;const L=o.L||50,R=o.R||16,T=o.T||18,B=o.B||34;const ax={x0:L,x1:W-R,y0:H-B,y1:T,xmax:v.xmax,ymax:v.ymax,xmin:v.xmin||0,ymin:v.ymin||0};ax.sx=x=>ax.x0+(x-ax.xmin)/(ax.xmax-ax.xmin)*(ax.x1-ax.x0);ax.sy=y=>ax.y0-(y-ax.ymin)/(ax.ymax-ax.ymin)*(ax.y0-ax.y1);
  const xs=nice(ax.xmax-ax.xmin),ys=nice(ax.ymax-ax.ymin);
  for(let y=ax.ymin;y<=ax.ymax+1e-9;y+=ys){ln(g,ax.x0,ax.sy(y),ax.x1,ax.sy(y),{color:C.rule,w:1});txt(g,fmt(y),ax.x0-6,ax.sy(y),{align:'right',color:C.slate,size:11})}
  for(let x=ax.xmin;x<=ax.xmax+1e-9;x+=xs){ln(g,ax.sx(x),ax.y0,ax.sx(x),ax.y1,{color:C.rule,w:1});txt(g,fmt(x),ax.sx(x),ax.y0+12,{color:C.slate,size:11})}
  ln(g,ax.x0,ax.y0,ax.x1,ax.y0,{color:C.slate});ln(g,ax.x0,ax.y0,ax.x0,ax.y1,{color:C.slate});
  if(v.xlabel)txt(g,v.xlabel,(ax.x0+ax.x1)/2,ax.y0+27,{color:C.slate,size:11});
  if(v.ylabel){const c=g.ctx;c.save();c.translate(12,(ax.y0+ax.y1)/2);c.rotate(-Math.PI/2);txt(g,v.ylabel,0,0,{color:C.slate,size:11});c.restore()}

function plotFn(g,ax,f,xa,xb,o){const c=g.ctx;c.save();c.strokeStyle=o.color||C.signal;c.lineWidth=o.w||2.5;if(o.dash)c.setLineDash(o.dash);c.beginPath();let pen=false;const n=80;for(let i=0;i<=n;i++){const x=xa+(xb-xa)*i/n,y=f(x);if(y<ax.ymin-1e-9||y>ax.ymax+1e-9){pen=false;continue}const px=ax.sx(x),py=ax.sy(y);pen?c.lineTo(px,py):c.moveTo(px,py);pen=true}c.stroke();c.restore()}

const R={};
/* ---- motion: movers on a track (meeting) or in lanes (combined work) ---- */
R.motion=(g,v,t,f)=>{const {W,H}=g,x0=44,x1=W-44,sc=(x1-x0)/v.len,time=ease(t)*v.T;

  if(lanes){ys.forEach(y=>ln(g,x0,y,x1,y,{color:C.rule,w:12}));txt(g,v.unit,x1+2,ys[0]+16,{align:'left',color:C.slate,size:11})}else txt(g,v.unit,x1,ys[0]+30,{align:'right',color:C.slate,size:11});
  let total=0;
  v.movers.forEach((m,i)=>{const y=ys[i];const d=Math.min(m.speed*time,v.len);total+=d;const px=x0+(m.start+m.dir*d)*sc;
    ln(g,x0+m.start*sc,y+(lanes?0:(i?6:-6)),px,y+(lanes?0:(i?6:-6)),{color:m.color,w:lanes?12:5});
    dot(g,px,y,9,m.color,C.paper);const lx=Math.min(Math.max(px,70),W-70);txt(g,m.label,lx,y-(lanes?30:(i?-36:22)),{color:m.color,bold:true,size:12,bg:lanes?'':C.wash});
    if(!lanes)txt(g,`${fmt(d,1)} ${v.unit}`,x0+(m.start+m.dir*d/2)*sc,y+(i?34:-38),{color:m.color,size:11});
    else txt(g,`${cm(Math.round(d))} ${v.unit}`,lx,y-15,{color:m.color,size:11})});
  txt(g,`t = ${fmt(time,2)} ${v.tunit}`,W-16,18,{align:'right',bold:true,size:13,bg:C.wash});
  if(!lanes&&(f==='meet'||t>=.999)){const mx=x0+v.meet*sc;ln(g,mx,ys[0]-40,mx,ys[0]+40,{color:C.marker,w:2,dash:[4,3]});badge(g,`meet at ${fmt(v.meet)} ${v.unit}, t = ${fmt(v.T,2)} ${v.tunit}`,Math.min(Math.max(mx,110),W-110),ys[0]+52)}
  if(!lanes&&f==='rate'){v.movers.forEach((m,i)=>{const y=ys[i];const ax=x0+(m.start+m.dir*v.len*0.18)*sc;arrow(g,x0+m.start*sc,y+(i?6:-6)+(i?22:-22),ax,y+(i?6:-6)+(i?22:-22),{color:m.color,w:2});txt(g,`${m.speed} ${v.unit}/${v.tunit}`,(x0+m.start*sc+ax)/2,y+(i?42:-42),{color:m.color,size:11,bold:true})});badge(g,`closing speed ${v.movers[0].speed} + ${v.movers[1].speed} = ${v.movers[0].speed+v.movers[1].speed} ${v.unit}/${v.tunit}`,W/2,H-14)}
  if(lanes){badge(g,`together: ${cm(Math.round(total))} ${v.unit}`,W/2,H-12,f==='total'?C.markerSoft:C.wash);if(f==='rate'){badge(g,`combined rate ${v.movers[0].speed} + ${v.movers[1].speed} = ${v.movers[0].speed+v.movers[1].speed} ${v.unit}/${v.tunit}`,W/2,16)}}
};
/* ---- tank: container + volume-vs-time graph ---- */
R.tank=(g,v,t,f)=>{const {W,H}=g,time=ease(t)*v.T,V=Math.max(0,Math.min(v.cap,v.V0+v.rate*time));
  const cw=W*0.2,cx=26,cy=24,ch=H-64;g.ctx.save();g.ctx.strokeStyle=C.slate;g.ctx.lineWidth=2;g.ctx.strokeRect(cx,cy,cw,ch);g.ctx.restore();

/* ---- linegraph: one or two lines, optional point ---- */
R.linegraph=(g,v,t,f)=>{const ax=axes(g,v,{});const xe=ease(t)*v.xmax;

/* ---- numberline: inequality shading ---- */
R.numberline=(g,v,t,f)=>{const {W,H}=g,x0=30,x1=W-30,y=H*0.5,sc=(x1-x0)/(v.max-v.min),sx=x=>x0+(x-v.min)*sc;

  for(let x=Math.ceil(v.min);x<=v.max;x++){ln(g,sx(x),y-4,sx(x),y+4,{color:C.slate});if(x%step===0)txt(g,x,sx(x),y+18,{size:11,color:C.slate})}

  if(f==='int'){const lo=ge?Math.ceil(v.bound-1e-9):Math.ceil(from),hi=ge?Math.floor(from):Math.floor(v.bound+1e-9);for(let x=lo;x<=hi;x++)dot(g,sx(x),y,x===v.ans?9:4,x===v.ans?C.marker:C.signal);badge(g,v.intLabel||`largest whole number: ${v.ans}`,Math.min(Math.max(sx(v.ans),90),W-90),y+44)}

/* ---- pipeline: unit conversion chain ---- */
R.pipeline=(g,v,t,f)=>{const {W,H}=g,n=v.stages.length,bw=Math.min(120,(W-40)/n-44),gap=(W-40-n*bw)/(n-1),y=H*0.5,prog=ease(t)*(n-1);

    txt(g,s.label,x+bw/2,y-12,{size:11,color:C.slate});txt(g,on?s.value:'?',x+bw/2,y+10,{size:14,bold:true,color:on?C.ink:C.slate});
    if(i<n-1){arrow(g,x+bw+4,y,x+bw+gap-4,y,{color:C.slate,w:1.5});txt(g,v.ops[i],x+bw+gap/2,y-18,{size:10.5,bold:true,color:C.orange,bg:C.scene})}});
  const i0=Math.floor(prog),fr=prog-i0;if(t<.999){const xa=20+i0*(bw+gap)+bw,xb=xa+gap;dot(g,xa+fr*(xb-xa),y,6,C.marker)}
};
/* ---- bars ---- */
R.bars=(g,v,t,f)=>{const {W,H}=g,n=v.bars.length,L=50,B=36,T=22,RM=v.line?96:16,gw=(W-L-RM)/n,bw=Math.min(70,gw*0.6),y0=H-B,ymax=v.ymax,sy=val=>y0-(val/ymax)*(y0-T);

  ln(g,L,y0,W-16,y0,{color:C.slate});
  v.bars.forEach((b,i)=>{const x=L+gw*i+(gw-bw)/2,val=b.value*ease(Math.min(1,t*n-i*0.6)),h=y0-sy(val);g.ctx.fillStyle=(f===i)?C.marker:(b.color||C.signal);g.ctx.fillRect(x,y0-h,bw,h);txt(g,b.label,x+bw/2,y0+13,{size:11,color:C.slate});if(val>0)txt(g,b.fmt?b.fmt(val):fmt(val,2),x+bw/2,Math.max(12,y0-h-10),{size:12,bold:true,bg:C.paper})});

  if(f==='diff'&&n>=2){const a=v.bars[0].value,b=v.bars[1].value,x=L+gw*1+(gw-bw)/2+bw+8;ln(g,x,sy(a),x,sy(b),{color:C.marker,w:3});ln(g,x-6,sy(a),x+6,sy(a),{color:C.marker,w:2});ln(g,x-6,sy(b),x+6,sy(b),{color:C.marker,w:2});badge(g,v.diffLabel||`change ${fmt(b-a)}`,x+14,(sy(a)+sy(b))/2)}

/* ---- mixture: proportional beakers + ratio blocks ---- */
R.mixture=(g,v,t,f)=>{const {W,H}=g,mx=Math.max(v.a.amt,v.b.amt),bh=H*0.5,by=20,bw=Math.min(90,W*0.18);const e=ease(t);
  [[v.a,W*0.05],[v.b,W*0.05+bw+22]].forEach(([s,x])=>{g.ctx.save();g.ctx.strokeStyle=C.slate;g.ctx.lineWidth=2;g.ctx.strokeRect(x,by,bw,bh);const h=bh*(s.amt/mx)*e;g.ctx.fillStyle=s.color;g.ctx.globalAlpha=.75;g.ctx.fillRect(x+1,by+bh-h,bw-2,h);g.ctx.restore();txt(g,s.label,x+bw/2,by+bh+14,{size:11,color:C.slate});txt(g,`${fmt(s.amt*e,1)} ${s.unit}`,x+bw/2,by+bh+30,{size:12,bold:true,color:s.color})});
  const bx=W*0.05+2*bw+50,unit=Math.min(22,(W-bx-70)/Math.max(v.ratio[0],v.ratio[1]));let yy=by+10;
  txt(g,'ratio',bx,yy-4,{align:'left',size:11,color:C.slate});yy+=12;
  const drawBlocks=(n,color,y)=>{for(let i=0;i<n;i++){g.ctx.fillStyle=color;g.ctx.globalAlpha=f==='ratio'?1:.8;g.ctx.fillRect(bx+i*(unit+3),y,unit,unit);g.ctx.globalAlpha=1}};
  drawBlocks(v.ratio[0],v.a.color,yy);txt(g,`${v.ratio[0]} ${v.a.label}`,bx+v.ratio[0]*(unit+3)+8,yy+unit/2,{align:'left',size:11});yy+=unit+8;
  drawBlocks(v.ratio[1],v.b.color,yy);txt(g,`${v.ratio[1]} ${v.b.label}`,bx+v.ratio[1]*(unit+3)+8,yy+unit/2,{align:'left',size:11});yy+=unit+22;
  if(f==='k'||t>=.999){badge(g,`scale factor ×${fmt(v.k,2)}`,bx+60,yy,f==='k'?C.markerSoft:C.wash);yy+=22;txt(g,`${v.ratio[0]} × ${fmt(v.k,2)} = ${fmt(v.a.amt)}   ${v.ratio[1]} × ${fmt(v.k,2)} = ${fmt(v.b.amt)}`,bx,yy,{align:'left',size:11,color:C.slate})}

  for(let x=Math.ceil(loX);x<=hiX;x++){ln(g,sx(x),sy(loY),sx(x),sy(hiY),{color:x===0?C.slate:C.rule,w:x===0?1.6:1});if(x%2===0)txt(g,x,sx(x),sy(0)+13,{size:9.5,color:C.slate})}for(let y=Math.ceil(loY);y<=hiY;y++){ln(g,sx(loX),sy(y),sx(hiX),sy(y),{color:y===0?C.slate:C.rule,w:y===0?1.6:1});if(y!==0&&y%2===0)txt(g,y,sx(0)-7,sy(y),{align:'right',size:9.5,color:C.slate})}
  const cx=sx(v.h),cy=sy(v.k),rad=v.r*s;c.save();c.strokeStyle=C.signal;c.lineWidth=3;c.beginPath();c.arc(cx,cy,rad*e,0,Math.PI*2);c.stroke();c.restore();dot(g,cx,cy,7,f==='center'?C.marker:C.signal,C.paper);
  ln(g,cx,cy,cx+rad*e,cy,{color:f==='radius'?C.marker:C.orange,w:3});
  if(f==='center'||t>=.999)badge(g,`center (${v.h}, ${v.k})`,Math.min(Math.max(cx,75),g.W-75),cy-18);
  if(f==='radius'||t>=.999)txt(g,`r = ${v.r}`,cx+rad/2,cy-14,{size:11,bold:true,color:C.orange,bg:C.paper});
};

const TEX_SEQ_RE=/[\s\d.,$%+−\-×÷=≤≥<>/()\[\]{}:;·°π√^→≈±]*⟦[^⟧]+⟧(?:[\s\d.,$%+−\-×÷=≤≥<>/()\[\]{}:;·°π√^→≈±]*⟦[^⟧]+⟧)*[\s\d.,$%+−\-×÷=≤≥<>/()\[\]{}:;·°π√^→≈±]*/g;

function mathChunk(s){const held=[];s=s.replace(TEX_SEQ_RE,m=>{let lead=(m.match(/^\s*/)||[''])[0],tail=(m.match(/\s*$/)||[''])[0],core=m.slice(lead.length,m.length-tail.length);while(/^[,.;:]/.test(core)){lead+=core[0];core=core.slice(1)}while(/[,.;:]$/.test(core)){tail=core.slice(-1)+tail;core=core.slice(0,-1)}if(!core)return m;const n=held.push(latexMath(texOf(core)))-1;return`${lead}\uE000${n}\uE001${tail}`});s=s.replace(NUM_EQ_RE,m=>latexMath(m));return s.replace(/\uE000(\d+)\uE001/g,(_,n)=>held[+n])}

def({id:'p31',sk:'prob',dom:'psda',skill:'Probability · expected count from a probability',fmt:'spr',gen(r){const p=r.pick([0.15,0.2,0.35,0.4,0.65]),n=r.pick([200,300,400,500]);const ans=p*n;

def({id:'p33',sk:'infer',dom:'psda',skill:'Inference · interpreting a margin of error',fmt:'mc',gen(r){const mean=r.pick([6.4,7.2,7.8,8.5]),moe=r.pick([0.3,0.4,0.5]);const lo=+(mean-moe).toFixed(1),hi=+(mean+moe).toFixed(1);

def({id:'p34',sk:'infer',dom:'psda',skill:'Inference · sample size and margin of error',fmt:'mc',gen(r){const n=r.pick([100,200,250]),p=r.pick([0.4,0.55,0.6]);

def({id:'p37',sk:'one',dom:'psda',skill:'One-variable data · correcting a value changes the mean',fmt:'spr',difficulty:'Medium',gen(r){const n=r.pick([6,8,10]),oldMean=r.pick([68,72,75,80]),rise=r.pick([1,2]),recorded=r.pick([48,54,60,64]),correct=recorded+n*rise,newMean=oldMean+rise;

  steps:[{t:`The recorded total was ${n} × ${oldMean} = ${n*oldMean}.`,f:'s0'},{t:`Replace ${recorded} with ${correct}: the total increases by ${correct-recorded}, from ${n*oldMean} to ${n*oldMean+correct-recorded}.`,f:'s1'},{t:`Correct mean = ${n*oldMean+correct-recorded} ÷ ${n} = ${newMean}.`,f:'s2'}]}}});

def({id:'p42',sk:'one',dom:'psda',skill:'One-variable data · adding a constant and standard deviation',fmt:'mc',difficulty:'Hard',gen(r){const m=r.pick([10,15,20]),shift=r.pick([5,8,12]),A=[m-3,m-2,m-1,m,m+1,m+2,m+3],B=A.map(x=>x+shift);

00%">Choose another set</button></aside><section><article class="card"><div class="question-top"><div class="row"><span class="pill">${limited?s.index-lo+1:s.index+1}</span><span class="mini">${limited?'Math':esc(q.skill)}</span>${!limited&&q.referenceModule?'<span class="mini muted">Module '+q.referenceModule+' · Q'+q.referenceQuestion+'</span>':''}${!limited?'<span class="pill '+(q.level==='Easy'?'green':'gold')+'">'+esc(q.level)+'</span>':''}<span class="mini muted qtime" title="Time on this question">⏱ <span id="qTime">${fmtTime(s.times[q.id])}</span></span></div><div class="tools"><button id="flagBtn" class="small" aria-pressed="${!!s.flags[q.id]}">${s.flags[q.id]?'★ Bookmarked':'☆ Bookmark'}</button><button id="calcBtn" class="small">Calculator</button><button id="refBtn" class="small">Reference</button></div></div><div class="question-body"><div><div class="prompt">${(q.source==='Vertex verified generator'?'<p class="mini muted">Verified built-in practice · AI retries did not pass review</p>':'')+rich(q.prompt)}</div>${visual(q.visual)}${['Gemini','LM Studio'].includes(q.source)?'<span class="pill">AI-generated · review if uncertain</span>':''}</div><div class="answer-col"><label>${q.choices?'Choose one answer':'Enter your answer'}</label>${choices.map((c,j)=>`<div class="choice ${choiceClass(j)}"><button data-answer="${j}" aria-pressed="${s.answers[q.id]===String(j)}"><span class="letter">${'ABCD'[j]}</span><span>${rich(c)}</span></button><button class="eliminate" data-eliminate="${j}" aria-label="${elim.includes(j)?'Restore':'Eliminate'} choice ${'ABCD'[j]}">⊘</button></div>`).join('')}${!q.choices?`<input class="num-input ${reveal&&has?(ok?'ok':'bad'):''}" id="response" autocomplete="off" placeholder="e.g. 3/4 or 0.75" aria-label="Numeric answer" value="${esc(s.answers[q.id]||'')}"><p class="mini muted">Use a number, decimal, or fraction.</p><p class="mini error" id="inputError"></p>`:''}<p class="mini instant-fb ${reveal&&has?(ok?'good':'bad'):'hide'}" id="instantFb" aria-live="polite">${reveal&&has?(ok?'✓ Correct':'✗ Not yet — try again or open the solution'):''}</p><div class="row" style="margin-top:8px">${has?'<button class="quiet small" id="clearAnswer">Clear answer</button>':''}${!limited&&q.steps?.length>1?'<button class="quiet small" id="hintBtn">'+(showHint?'Hide hint':'💡 Hint')+'</button>':''}</div>${showHint&&!limited?'<div class="hint"><strong>Hint</strong> '+rich(q.steps[0])+'</div>':''}${!limited?'<div style="margin-top:20px"><button class="dark" id="checkBtn">'+(showSolution?'Hide solution':'Check & see solution')+'</button></div>':''}</div></div>${showSolution&&!limited?solutionHTML(q,s.answers[q.id]):''}<div class="question-bottom"><button id="prevBtn" ${s.index===lo?'disabled':''}>← Previous</button><span class="mini muted">${limited?s.index-lo+1:s.index+1} of ${limited?hi-lo:s.questions.length}</span><button id="nextBtn" class="primary">${s.index===hi-1?(limited&&s.module===0?'Submit module':'Finish & report'):'Next question →'}</button></div></article>${!limited?'<div class="practice-banner"><div><strong>Generate similar questions</strong><p>New '+esc(q.skill)+' problems with AI · opens in a practice window</p></div>'+aiControls('similar','Generate')+'</div>':''}</section></div><p class="footer-note">Original practice content. Not affiliated with or endorsed by College Board. SAT is a registered trademark of College Board.</p>`;
    $('app').querySelectorAll('[data-q]').forEach(b => b.onclick = () => go(Number(b.dataset.q)));

    $('app').querySelectorAll('[data-eliminate]').forEach(b => b.onclick = () => {

        }

        $('inputError').textContent = bad ? 'Enter a finite number or a fraction.' : '';

            show = instant && !isBlank(e.target.value) && !bad,
            good = show && correct(q, e.target.value);
        fb.className = 'mini instant-fb ' + (show ? (good ? 'good' : 'bad') : 'hide');

function selectChoice(n) {
    const s = db.session,
        q = s.questions[s.index];
    if (!q.choices || n < 0 || n >= q.choices.length) return;
    if (isBlank(s.answers[q.id])) logActivity();
    s.answers[q.id] = String(n);
    s.eliminated[q.id] = (s.eliminated[q.id] || []).filter(x => x !== n);
    render();
}

function updateGridCell() {
    const s = db.session,
        b = document.querySelector('[data-q="' + s.index + '"]');
    if (b) b.classList.toggle('answered', !isBlank(s.answers[s.questions[s.index].id]));
}

function nextUnanswered() {
    const s = db.session,
        [lo, hi] = activeRange();
    for (let k = 1; k <= hi - lo; k++) {
        const i = lo + ((s.index - lo + k) % (hi - lo));
        if (isBlank(s.answers[s.questions[i].id])) {
            go(i);
            return;
        }
    }
    toast('Every question in this module has an answer.');
}
// Keyboard shortcuts for the workspace. Ignored inside inputs and floating windows.
function handleShortcut(e) {
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    const t = e.target;
    if (t.closest && (t.closest('.window') || t.matches('input,textarea,select,[contenteditable]'))) return;
    if (e.key === '?') {
        e.preventDefault();
        shortcutsWindow();
        return;
    }
    if (view !== 'practice' || db.session.complete || activePopupSet) return;
    const s = db.session,
        q = s.questions[s.index],
        [lo, hi] = activeRange(),
        k = e.key.toLowerCase();
    if (e.key === 'ArrowRight' || k === 'j') {
        if (s.index < hi - 1) go(s.index + 1);
    } else if (e.key === 'ArrowLeft' || k === 'k') {
        if (s.index > lo) go(s.index - 1);
    } else if (/^[1-4]$/.test(k) && q.choices) selectChoice(Number(k) - 1);
    else if (/^[a-d]$/.test(k) && q.choices) selectChoice(k.charCodeAt(0) - 97);
    else if (k === 'f') {
        s.flags[q.id] = !s.flags[q.id];
        render();
    } else if (k === 'n') nextUnanswered();
    else if (k === 'c' && !s.timed) $('checkBtn')?.click();
    else if (k === 'h' && !s.timed) $('hintBtn')?.click();
    else if (k === 'x' && !q.choices) $('response')?.focus();
    else if (k === '=') calculatorWindow();
    else if (k === 'r') referenceWindow();
    else if (k === 's') notesWindow();
    else return;
    e.preventDefault();
}

function solutionHTML(q,a){
 return baseSolutionHTML(q,a)+(q.arithmeticCheck?'<p class="mini muted">Arithmetic calculation checked automatically.</p>':'')+(a!=null && a!=='' && !correct(q,a)?'<div class="pad"><button class="primary" data-practice-mistake="'+esc(q.id)+'" data-student-answer="'+esc(encodeURIComponent(String(a)))+'">Practice this mistake</button></div>':'');

function go(i) {
    const [lo, hi] = activeRange();
    i = Math.max(lo, Math.min(hi - 1, i));
    db.session.index = i;
    showSolution = false;
    showHint = false;
    lastTick = Date.now();
    render();
}

function requestFinish() {
    let s = db.session,
        [lo, hi] = activeRange(),
        blank = s.questions.slice(lo, hi).filter(q => s.answers[q.id] == null || String(s.answers[q.id]).trim() === '').length;
    confirmWindow(s.timed && s.module === 0 ? 'Submit module 1?' : 'Finish this set?', `${blank?blank+' unanswered question'+(blank===1?'':'s')+'. ':''}${s.timed?'You cannot return to this module after submitting.':'Your report will include every question, including unanswered ones.'}`, () => finish());
}

function finish() {
    let s = db.session;
    if (s.complete) return;
    if (s.timed && s.module === 0) {
        s.module = 1;
        s.index = 22;
        s.deadline = Date.now() + 35 * 60000;
        showSolution = false;
        save();
        render();
        toast('Module 2 started. Module 1 is locked.');
        return;
    }
    s.complete = true;
    s.finished = Date.now();
    s.deadline = null;
    showHint = false;
    logActivity();
    db.history.unshift(structuredClone(s));
    syncMissedHistory();
    reportId = s.id;
    view = 'report';
    showSolution = false;
    render();
}

function startSet(qs, name, timed = false, parentTestId = qs[0]?.parentTestId || 'word-problems', startIndex = 0) {
    if (!qs.length) return toast('No questions to practice.');
    const run = () => {
        if ($('aiPracticeWindow')) closeAIPractice();
        db.session = makeSession(qs, name, timed, parentTestId);
        if (!timed) db.session.index = Math.max(0, Math.min(qs.length - 1, startIndex));
        db.selectedTestId = parentTestId;
        view = 'practice';
        showSolution = false;
        showHint = false;
        gridFilter = 'all';
        lastTick = Date.now();
        render();
    };
    if (!db.session.complete && Object.keys(db.session.answers).length) confirmWindow('Start a new set?', 'Your unfinished set will be replaced. Finish it first if you want a report.', run);
    else run();
}

function updateTimer() {
    const s = db.session;
    if (!s.timed || s.complete) return;
    let left = Math.max(0, Math.ceil((s.deadline - Date.now()) / 1000));
    if ($('timer')) {
        $('timer').textContent = String(Math.floor(left / 60)).padStart(2, '0') + ':' + String(left % 60).padStart(2, '0');
        $('timer').classList.toggle('warn', left < 300);
    }
    if (left === 0) {
        document.querySelectorAll('.window').forEach(w => w.remove());
        finish();
        toast('Time expired. Your module was submitted.');
    }
}

}, 1000);

function trendChart(history) {
    const pts = history.slice().filter(h => h.finished).sort((a, b) => a.finished - b.finished).slice(-12).map(h => Math.round(100 * h.questions.filter(q => correct(q, h.answers[q.id])).length / h.questions.length));
    if (pts.length < 2) return '<p class="mini muted">Finish two or more sets to see your accuracy trend.</p>';
    const W = 420,
        H = 170,
        X = i => 34 + i * (W - 50) / (pts.length - 1),
        Y = v => 18 + (100 - v) * (H - 48) / 100;
    let o = '<svg class="chart trend" viewBox="0 0 ' + W + ' ' + H + '" role="img"><title>Accuracy across your last ' + pts.length + ' attempts</title>';
    for (const v of [0, 25, 50, 75, 100]) o += '<path d="M34 ' + Y(v) + 'H' + (W - 12) + '" stroke="var(--line)"/><text x="28" y="' + (Y(v) + 4) + '" text-anchor="end" font-size="11" fill="var(--muted)">' + v + '</text>';
    o += '<path d="' + pts.map((v, i) => (i ? 'L' : 'M') + X(i).toFixed(1) + ' ' + Y(v).toFixed(1)).join('') + '" fill="none" stroke="var(--accent)" stroke-width="3" stroke-linejoin="round"/>';
    o += pts.map((v, i) => '<circle cx="' + X(i) + '" cy="' + Y(v) + '" r="4.5" fill="var(--accent)"><title>Attempt ' + (i + 1) + ': ' + v + '%</title></circle><text x="' + X(i) + '" y="' + (H - 8) + '" text-anchor="middle" font-size="11" fill="var(--muted)">' + (i + 1) + '</text>').join('');
    return o + '</svg>';
}

function domainBars(domains, keys = Object.keys(DOMAIN_NAMES)) {
    return keys.map(d => {
        const x = domains[d];
        if (!x) return '<div class="domain"><div class="row between"><strong>' + esc(DOMAIN_NAMES[d]) + '</strong><span class="mini muted">Not yet practiced</span></div><div class="meter"><i style="width:0"></i></div></div>';
        const pct = Math.round(100 * x.ok / x.n);
        return '<div class="domain"><div class="row between"><strong>' + esc(DOMAIN_NAMES[d]) + '</strong><span>' + pct + '% · ' + x.ok + '/' + x.n + '</span></div><div class="meter"><i class="' + (pct < 60 ? 'low' : pct < 80 ? 'mid' : '') + '" style="width:' + pct + '%"></i></div></div>';
    }).join('');
}

function weakSkills(stats, limit = 5) {
    return Object.entries(stats.skills).filter(([, v]) => v.n >= 1 && v.ok < v.n).sort((a, b) => a[1].ok / a[1].n - b[1].ok / b[1].n || b[1].n - a[1].n).slice(0, limit);
}

// Custom drill builder: filter stored questions by domain, level, and source, then shuffle and start.
function drillWindow(testId = db.selectedTestId) {
    const test = db.tests.find(t => t.id === testId) || db.tests[0],
        originals = testQuestions(test),
        aiQs = testSets(test.id).flatMap(x => x.questions),
        levels = ['Easy', 'Hard', 'Harder'],
        domains = Object.keys(DOMAIN_NAMES),
        prefs = db.drillPrefs || {
            domains,
            levels,
            ai: true,
            count: 10,
            shuffle: true,
            onlyMissed: false
        };
    const missedIds = new Set(db.history.flatMap(h => h.questions.filter(q => !correct(q, h.answers[q.id])).map(q => q.id)));
    openWindow('drillWindow', esc(test.name) + ' · Custom drill', '<div class="field"><label>Domains</label><div class="check-grid">' + domains.map(d => '<label class="switch"><input type="checkbox" data-dom="' + d + '" ' + (prefs.domains.includes(d) ? 'checked' : '') + '><span>' + esc(DOMAIN_NAMES[d]) + '</span></label>').join('') + '</div></div><div class="field"><label>Levels</label><div class="check-grid three">' + levels.map(l => '<label class="switch"><input type="checkbox" data-lvl="' + l + '" ' + (prefs.levels.includes(l) ? 'checked' : '') + '><span>' + l + '</span></label>').join('') + '</div></div><div class="field check-grid"><label class="switch"><input type="checkbox" id="drillAI" ' + (prefs.ai ? 'checked' : '') + ' ' + (aiQs.length ? '' : 'disabled') + '><span>Include AI sets (' + aiQs.length + ')</span></label><label class="switch"><input type="checkbox" id="drillMissed" ' + (prefs.onlyMissed ? 'checked' : '') + '><span>Only questions I have missed</span></label><label class="switch"><input type="checkbox" id="drillShuffle" ' + (prefs.shuffle ? 'checked' : '') + '><span>Shuffle order</span></label></div><div class="field"><label for="drillCount">Length</label><div class="row">' + [5, 10, 15, 20].map(n => '<button class="small" data-dcount="' + n + '">' + n + '</button>').join('') + '<button class="small" data-dcount="all">All</button><input id="drillCount" type="number" min="1" max="200" value="' + prefs.count + '" style="width:80px" aria-label="Number of questions"></div></div><p id="drillMatch" class="mini" role="status"></p><button id="drillStart" class="primary full">Start drill</button>');
    const w = $('drillWindow');
    const current = () => {
        const doms = [...w.querySelectorAll('[data-dom]:checked')].map(x => x.dataset.dom),
            lv = [...w.querySelectorAll('[data-lvl]:checked')].map(x => x.dataset.lvl),
            useAI = $('drillAI').checked,
            onlyMissed = $('drillMissed').checked;
        const pool = [...originals, ...(useAI ? aiQs : [])].filter(q => doms.includes(q.domain) && lv.includes(q.level) && (!onlyMissed || missedIds.has(q.id)));
        return {
            doms,
            lv,
            useAI,
            onlyMissed,
            pool
        };
    };
    const refresh = () => {
        const {
            pool
        } = current();
        $('drillMatch').textContent = pool.length ? pool.length + ' question' + (pool.length === 1 ? '' : 's') + ' match these filters.' : 'No stored questions match. Widen the filters or generate AI practice.';
        $('drillStart').disabled = !pool.length;
    };
    w.querySelectorAll('input[type=checkbox]').forEach(x => x.onchange = refresh);
    w.querySelectorAll('[data-dcount]').forEach(b => b.onclick = () => {
        $('drillCount').value = b.dataset.dcount === 'all' ? current().pool.length || 1 : b.dataset.dcount;
        w.querySelectorAll('[data-dcount]').forEach(x => x.classList.toggle('dark', x === b));
    });
    bind('drillStart', () => {
        const c = current(),
            n = Math.max(1, Math.min(200, Number($('drillCount').value) || 10)),
            ordered = $('drillShuffle').checked ? shuffle(c.pool) : c.pool,
            qs = ordered.slice(0, n);
        db.drillPrefs = {
            domains: c.doms,
            levels: c.lv,
            ai: c.useAI,
            count: n,
            shuffle: $('drillShuffle').checked,
            onlyMissed: c.onlyMissed
        };
        save();
        w.remove();
        startSet(qs, 'Drill · ' + (c.doms.length === domains.length ? 'Mixed domains' : c.doms.map(d => DOMAIN_NAMES[d]).join(', ')) + ' · ' + qs.length + ' q', false, test.id);
    });
    refresh();
}


function freshPracticeSet(sets,name,parentTestId){
 const id='set-'+crypto.randomUUID();let i=0;const qs=sets.flatMap(set=>set.questions.map(q=>({...structuredClone(q),id:id+'-q'+(++i),parentTestId,originQuestionId:q.originQuestionId||q.id})));
 const levels=[...new Set(qs.map(q=>q.level))];return {id,name,parentTestId,created:Date.now(),questions:qs,level:levels.length===1?levels[0]:'Mixed',derivedFrom:sets.map(s=>s.id)};
}
function applySetAction(action,ids,value){
 const selected=db.sets.filter(x=>ids.includes(x.id));if(!selected.length)throw Error('Select at least one practice set.');
 if(action==='rename'){if(selected.length!==1)throw Error('Select one set to rename.');const name=String(value||'').trim();if(!name||name.length>100)throw Error('Use a name between 1 and 100 characters.');selected[0].name=name;if(selected[0].practice)selected[0].practice.name=name;}
 else if(action==='move'){if(!db.tests.some(t=>t.id===value))throw Error('Choose a test folder.');for(const set of selected){set.parentTestId=value;set.questions.forEach(q=>q.parentTestId=value);if(set.practice){set.practice.parentTestId=value;set.practice.questions.forEach(q=>q.parentTestId=value);}}}
 else if(action==='combine'||action==='duplicate'){if(action==='combine'&&selected.length<2)throw Error('Select at least two sets to combine.');if(action==='combine'){const name=String(value||'').trim();if(!name||name.length>100)throw Error('Enter a name up to 100 characters.');const merged=freshPracticeSet(selected,name,selected[0].parentTestId);db.setTrash=db.setTrash||[];db.setTrash.unshift(...selected.map(x=>({...x,deletedAt:Date.now(),mergedInto:merged.id})));db.sets=[merged,...db.sets.filter(x=>!ids.includes(x.id))];}else db.sets.unshift(...selected.map(x=>freshPracticeSet([x],x.name+' · Copy',x.parentTestId)));}
 else if(action==='delete'){db.setTrash=db.setTrash||[];db.setTrash.unshift(...selected.map(x=>({...x,deletedAt:Date.now()})));db.sets=db.sets.filter(x=>!ids.includes(x.id));}
 else throw Error('Unsupported action.');
}

function download(name, text, type) {
    let a = document.createElement('a'),
        url = URL.createObjectURL(new Blob([text], {
            type
        }));
    a.href = url;
    a.download = name;
    a.click();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
}

function parseMissedFile(text){let data;try{const marker=text.match(/<!-- VERTEX_MISSED_JSON -->\s*(`{3,})json\n([\s\S]*?)\n\1/);const embedded=text.match(/<script type="application\/json" id="vertex-review-data">([\s\S]*?)<\/script>/);data=JSON.parse(marker?marker[2]:embedded?embedded[1]:text);}catch{throw Error('Use a missed-question JSON or Markdown file exported by Vertex.');}if(data?.format!=='vertex-missed-questions'||data.version!==1||!Array.isArray(data.questions)||!data.questions.length||data.questions.length>500)throw Error('This is not a supported missed-question export.');if(data.testId!=='word-problems')throw Error('This file belongs to another test. Import it in that test’s page.');for(const item of data.questions){const q=item.question;if(!q||typeof q.prompt!=='string'||q.prompt.length>10000||typeof q.skill!=='string'||!q.skill.length||q.skill.length>150||!['Algebra','Advanced','Data','Geometry'].includes(q.domain)||!Array.isArray(q.steps)||q.steps.some(t=>typeof t!=='string'))throw Error('The file contains an invalid question.');if(q.choices&&(!Array.isArray(q.choices)||q.choices.length!==4||q.choices.some(x=>typeof x!=='string')||!Number.isInteger(Number(q.answer))||Number(q.answer)<0||Number(q.answer)>3))throw Error('Invalid answer choices.');const v=q.visual;if(v){if(v.type==='table'){if(!Array.isArray(v.headers)||v.headers.length>10||v.headers.some(x=>typeof x!=='string')||!Array.isArray(v.rows)||v.rows.length>100||v.rows.some(r=>!Array.isArray(r)||r.length!==v.headers.length||r.some(x=>!['string','number'].includes(typeof x))))throw Error('Invalid table.');}else if(['curve','scatter'].includes(v.type)){if(!Array.isArray(v.range)||v.range.length!==4||v.range.some(x=>!Number.isFinite(x)||Math.abs(x)>1e6)||v.range[1]-v.range[0]<1e-6||v.range[3]-v.range[2]<1e-6)throw Error('Invalid graph range.');if(v.type==='curve'&&(!Array.isArray(v.coeff)||v.coeff.length>8||v.coeff.some(x=>!Number.isFinite(x))))throw Error('Invalid curve.');if(v.type==='scatter'&&(!Array.isArray(v.points)||v.points.length>500||v.points.some(p=>!Array.isArray(p)||p.length!==2||p.some(x=>!Number.isFinite(x)))))throw Error('Invalid scatterplot.');}else if(['triangle','rightTriangle'].includes(v.type)){if(!Array.isArray(v.labels)||v.labels.length!==3)throw Error('Invalid triangle labels.');}else if(['circleArcs','parallelVertical','histograms','choiceTables','lineSeries','exponential'].includes(v.type))validateSpecialVisual(v);else if(v.type==='wordlab')VertexWordLab.raw(v.family,v.seed);else if(v.type!=='parallel')throw Error('Unsupported diagram.');}}return data;}
function missedImportWindow(){if(db.session.timed&&!db.session.complete){toast('Import practice after finishing the timed test.');return;}openWindow('missedImportWindow','Practice from saved mistakes','<label for="missedFile">Missed-question file</label><input id="missedFile" type="file" accept=".json,.md,.html,application/json,text/markdown,text/html"><p class="mini muted">Choose a Vertex JSON, Markdown, or HTML review pack. Your original workspace stays open.</p><p id="missedImportStatus" class="mini" role="status"></p><div id="missedImportControls"></div>');bind('missedFile',async e=>{const file=e.target.files?.[0];if(!file)return;try{if(file.size>2*1024*1024)throw Error('Choose a file smaller than 2 MB.');const data=parseMissedFile(await file.text());if(!$('missedImportControls'))return;const sources=data.questions.map(x=>({skill:x.question.skill,domain:x.question.domain,parentTestId:data.testId}));$('missedImportStatus').textContent=sources.length+' missed questions · '+new Set(sources.map(x=>x.skill)).size+' skills. New questions will target these skills.';$('missedImportControls').innerHTML='<button id="importedGuide" class="small" style="margin-bottom:12px">Build study guide</button>'+aiControls('importedMissed','Generate recovery practice');bind('importedGuide',()=>studyGuideWindow(data));bindAIControls('importedMissed',sources,true,data.testId);}catch(error){if($('missedImportStatus')){$('missedImportStatus').textContent=error.message;$('missedImportControls').innerHTML='';}}},'change');}
function skillAdvice(skill,domain){const name=skill.toLowerCase();if(/percent|growth|exponential/.test(name))return['Translate percentages into multipliers: increase by p% uses 1 + p/100; decrease uses 1 − p/100. Identify the starting value and count growth periods.','Do not confuse the percent change with the multiplier or apply it to the wrong starting quantity.'];if(/system|substitution|perpendicular|dependent/.test(name))return['Use substitution or elimination. Write a line in slope-intercept form when comparing slopes, and check a solution in both original equations.','Parallel lines have equal slopes; perpendicular nonvertical lines have slopes whose product is −1.'];if(/quadratic|roots|zeros|discriminant|minimum|extrema/.test(name))return['Choose factoring for roots, vertex form for an extremum, or the discriminant b² − 4ac for the number of real roots. Check any stated sign restriction.','The vertex x-coordinate is not the minimum or maximum output. Report the quantity the question asks for.'];if(/circle|area|volume|triangle|pythagorean|radian|angle|geometry/.test(name))return['Label the known dimensions. Choose the relevant geometry relationship, keep units consistent, and distinguish radius from diameter.','Length scales by k, area by k², and volume by k³. Round only at the final step.'];if(/mean|frequency|probability|scatter|statistics/.test(name))return['Identify what each value or frequency represents. Use the full sample size for probabilities and a weighted total for a frequency-table mean.','A zero-frequency row is not an observed value. A correlation alone does not establish causation.'];if(/unit|rate/.test(name))return['Write the rate as a fraction with units. Multiply by conversion factors so unwanted units cancel.','Square conversion factors for area and cube them for volume.'];if(/budget|inequal|constraint/.test(name))return['Separate the fixed charge from the per-unit charge, then write the budget inequality. Enforce whole-number restrictions if needed.','At most means ≤. For a maximum affordable whole number, round down rather than to the nearest integer.'];if(/factor|polynomial|exponent|radical/.test(name))return['Distribute signs carefully, combine only like terms, and track exponent rules. Substitute a simple value to check equivalent expressions.','A subtraction before parentheses changes every sign. Check domains and extraneous roots when squaring.'];return domain==='Algebra'?['Define the variable, translate the relationship into an equation, and isolate the requested quantity. Substitute the result back to check it.','Keep units and signs attached to each term; answer the requested expression, not merely the value of the variable.']:['Identify the given information and the target quantity. Follow the worked example, then solve the same question again without looking.','Check restrictions, units, and whether the answer is reasonable before finishing.'];}
function guideBody(data){const groups=new Map();for(const item of data.questions){const key=item.question.skill;if(!groups.has(key))groups.set(key,[]);groups.get(key).push(item);}return '<h1>'+esc(data.testName)+' · Review study guide</h1><p>'+data.questions.length+' missed or unanswered questions · '+groups.size+' skills</p><p>Work through each example, cover the solution, and solve it again. Mark a skill ready when you can explain the steps without help.</p>'+[...groups].sort((a,b)=>b[1].length-a[1].length).map(([skill,items])=>{const saved=data.studyGuide?.sections?.find(x=>x.skill===skill),advice=saved?[saved.review,saved.commonTrap]:skillAdvice(skill,items[0].question.domain);return '<section class="guide-section"><h2>'+esc(skill)+' <small>('+items.length+')</small></h2><p><strong>Review:</strong> '+esc(advice[0])+'</p><p><strong>Common trap:</strong> '+esc(advice[1])+'</p>'+items.map((item,i)=>{const q=item.question,answer=q.choices&&item.studentAnswer!==null?q.choices[Number(item.studentAnswer)]:item.studentAnswer??'Unanswered';return '<article class="guide-example"><h3>Worked example '+(i+1)+'</h3><p>'+(q.source==='Vertex verified generator'?'<p class="mini muted">Verified built-in practice · AI retries did not pass review</p>':'')+rich(q.prompt)+'</p>'+visual(q.visual)+(q.choices?'<ol type="A">'+q.choices.map(x=>'<li>'+rich(x)+'</li>').join('')+'</ol>':'')+'<p><strong>Your answer:</strong> '+rich(answer)+'<br><strong>Correct answer:</strong> '+rich(item.correctAnswer)+'</p><ol>'+q.steps.map(step=>'<li>'+rich(step)+'</li>').join('')+'</ol><p class="guide-check">□ I can solve this again without the solution.<br>□ I can explain why my previous approach did not work.</p>'+(['Gemini','LM Studio'].includes(q.source)?'<p class="mini muted">AI-generated example: verify any result that appears inconsistent.</p>':'')+'</article>';}).join('')+'</section>';}).join('')+'<h2>Next practice</h2><p>Import the saved missed-question JSON or Markdown file, choose a level and quantity, and generate a new recovery set. Start with Easy for an unfamiliar skill, then use Hard or Harder once the worked examples are clear.</p>';}
function studyGuideDocument(data){return '<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Word Problems · Missed-question study guide</title><style>body{font:17px/1.65 system-ui,sans-serif;max-width:850px;margin:32px auto;padding:0 20px;color:#163047}h1{font-size:28px}h2{font-size:23px}.guide-section{border-top:2px solid #cee0da;margin-top:28px;padding-top:16px}.guide-example{margin:20px 0;padding:18px;border:1px solid #dce5eb;border-radius:10px;break-inside:avoid}.guide-check{background:#eff7f3;padding:12px}.chart{max-width:420px;width:100%;height:auto}.data-table{border-collapse:collapse}.data-table td,.data-table th{border:1px solid #cbd8e0;padding:8px 15px}.mini{font-size:13px}.muted{color:#617385}li{margin:9px 0}button{padding:10px 16px;border:0;border-radius:7px;background:#086c59;color:white}@media print{button{display:none}body{margin:0;max-width:none}h2,h3{break-after:avoid}}</style><button onclick="window.print()">Print / Save as PDF</button>'+guideBody(data)+'<script type="application/json" id="vertex-review-data">'+JSON.stringify(data).replace(/</g,'\\u003c')+'</scr'+'ipt></html>';}

// Nonmodal movable windows; pointer capture supports mouse and touch, arrows move the title bar.
function openWindow(id, title, html, onClose = null) {
    let prev = document.activeElement;
    if ($(id)) {
        $(id).style.zIndex = ++z;
        return $(id);
    }
    let w = document.createElement('section');
    w.id = id;
    w.className = 'window';
    w.style.zIndex = ++z;
    w.setAttribute('role', 'dialog');
    w.setAttribute('aria-label', title);
    w.innerHTML = '<div class="window-bar" tabindex="0" aria-label="Drag window; arrow keys move it"><span>' + esc(title) + '</span><button aria-label="Close window">×</button></div><div class="window-body">' + html + '</div>';
    $('windows').append(w);
    w.style.top = Math.min(100 + (z % 4) * 16, Math.max(12, window.innerHeight - w.offsetHeight - 12)) + 'px';
    let close = () => {
        if (id === 'genWindow' && genController) {
            genController.abort();
        }
        w.remove();
        if (onClose) onClose();
        if (prev?.isConnected) prev.focus();
    };
    w.querySelector('.window-bar button').onclick = close;
    w.addEventListener('pointerdown', () => w.style.zIndex = ++z);
    w.addEventListener('keydown', e => {
        if (e.key === 'Escape') {
            e.stopPropagation();
            close();
        }
    });
    let bar = w.firstElementChild,
        drag = null;

    function move(x, y) {
        w.style.left = Math.max(0, Math.min(innerWidth - w.offsetWidth, x)) + 'px';
        w.style.top = Math.max(0, Math.min(innerHeight - 55, y)) + 'px';
    }
    bar.onpointerdown = e => {
        if (e.target.closest('button')) return;
        let r = w.getBoundingClientRect();
        drag = {
            x: e.clientX - r.left,
            y: e.clientY - r.top
        };
        bar.setPointerCapture(e.pointerId);
    };
    bar.onpointermove = e => {
        if (drag) move(e.clientX - drag.x, e.clientY - drag.y);
    };
    bar.onpointerup = () => drag = null;
    bar.onpointercancel = () => drag = null;
    bar.onkeydown = e => {
        if (['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown'].includes(e.key)) {
            e.preventDefault();
            let r = w.getBoundingClientRect();
            move(r.left + (e.key === 'ArrowRight' ? 15 : e.key === 'ArrowLeft' ? -15 : 0), r.top + (e.key === 'ArrowDown' ? 15 : e.key === 'ArrowUp' ? -15 : 0));
        }
    };
    bar.focus();
    return w;
}

function verifiedAbsoluteVariants(sources, count, level, offset) {
    const result=[];
    for(let i=0;i<count;i++){
        const source=sources[i%sources.length],text=source.generationText||source.searchText||source.prompt||'';
        if(!/absolute value/i.test(source.skill||'') || !/(?:\\frac|\/).*x/.test(text) || !/[<>]/.test(text))return null;
        const k=3+((offset+i)*7)%97,N=k+5+(offset+i)%8,p=2+(offset+i)%3,q=3+(offset+i)%4;
        const mode=(offset+i+(level==='Harder'?1:0))%6;let prompt,answer,steps;
        if(mode===0){answer=2*(N-k);prompt=`How many integers $x$ in the interval $-${N}\\le x\\le ${N}$ satisfy $0<|\\frac{${k}}{x}|<1$?`;
            steps=[`The denominator must be nonzero. The inequality is equivalent to $|x|>${k}$.`,`The positive integers are ${k+1} through ${N}, giving ${N-k} choices.`,`There are equally many negative choices, for a total of $2(${N-k})=${answer}$.`];}
        if(mode===1){answer=(k+1+N)*(N-k)/2;prompt=`Find the sum of all positive integers $x\\le ${N}$ satisfying $|\\frac{${k}}{x}|<1$.`;
            steps=[`For positive x, the inequality requires $x>${k}$.`,`The solutions are the consecutive integers ${k+1} through ${N}, a total of ${N-k} terms.`,`Their sum is $\\frac{(${k+1}+${N})(${N-k})}{2}=${answer}$.`];}
        if(mode===2){answer=Math.floor(k*q/p)+1;prompt=`What is the least positive integer $x$ for which $|\\frac{${k}}{x}|<\\frac{${p}}{${q}}$?`;
            steps=[`For positive x, remove the absolute value and multiply by the positive quantity $${q}x$.`,`This gives $${k*q}<${p}x$, or $x>\\frac{${k*q}}{${p}}$.`,`The least integer strictly above this bound is ${answer}.`];}
        if(mode===3){answer=Math.ceil(k*q/p)-1;prompt=`What is the greatest positive integer $x$ satisfying $|\\frac{${k}}{x}|>\\frac{${p}}{${q}}$?`;
            steps=[`Since x is positive, multiply both sides by $${q}x$ without changing the inequality direction.`,`Then $${k*q}>${p}x$, so $x<\\frac{${k*q}}{${p}}$.`,`The greatest integer strictly below this bound is ${answer}.`];}
        if(mode===4){answer=k;prompt=`The constant $c$ is a positive integer. The least positive integer satisfying $|\\frac{c}{x}|<1$ is ${k+1}. What is $c$?`;
            steps=[`For positive x, the inequality is equivalent to $x>c$.`,`Because c is an integer, the least possible positive integer x is $c+1$.`,`Thus $c+1=${k+1}$ and $c=${k}$.`];}
        if(mode===5){answer=2*(k+1);prompt=`Among the integer solutions to $0<|\\frac{${k}}{x}|<1$, let $u$ be the greatest negative solution and $v$ the least positive solution. What is the distance between $u$ and $v$ on the number line?`;
            steps=[`The inequality is equivalent to $|x|>${k}$.`,`The two solutions closest to zero are $u=-${k+1}$ and $v=${k+1}$.`,`Their distance is $v-u=${k+1}-(-${k+1})=${answer}$.`];}
        result.push({id:'verified-absolute-'+Date.now()+'-'+i+'-'+Math.random().toString(36).slice(2,8),prompt,answer:String(answer),steps,choices:null,visual:null,tolerance:0,skill:source.skill,domain:source.domain,level,source:'Vertex verified generator',modelUsed:'Built-in absolute-value generator',verification:'Constructed and checked with exact arithmetic',sourceQuestionId:source.id,similarityChecked:true,variationAngle:'Absolute-value reasoning variant '+mode,validationParameters:{k,N,p,q,mode}});
    }
    return result;
}

function mapQuestionReviews(review, batch) {
    if(!review || !Array.isArray(review.reviews) || review.reviews.length!==batch.length)throw Error('Incomplete review response.');
    const rows=review.reviews, ids=rows.map(r=>r && (typeof r.id==='string'||typeof r.id==='number')?String(r.id).trim():null);
    if(ids.some(id=>id===null)||new Set(ids).size!==batch.length)throw Error('Missing or duplicate review identifiers.');
    const schemes=[batch.map((_,i)=>'item-'+(i+1)),batch.map(q=>String(q.id)),batch.map((_,i)=>String(i)),batch.map((_,i)=>String(i+1))];
    const scheme=schemes.find(keys=>new Set(keys).size===batch.length && keys.every(key=>ids.includes(key)));
    if(!scheme)throw Error('Review identifiers do not match the submitted questions.');
    return rows.map((r,i)=>({...r,id:scheme.indexOf(ids[i])}));
}

 function unary(){if(s[i]==='+'){i++;return unary();}if(s[i]==='-'){i++;return -unary();}return power();}

function generationExemplar(q) {
    const resolve = value => String(value || '').replace(/@@([^@]+)@@/g, (_, key) => {
        const html = typeof SOURCE_HTML !== 'undefined' ? SOURCE_HTML[key] || '' : '';

    });

        prompt:q.generationText || (!String(q.prompt || '').includes('@@') ? q.prompt : q.searchText || resolve(q.prompt)),
        choices:(q.choices || []).map(resolve), visual:q.visual || null,
        solution:q.steps || [], mistakeContext:q.mistakeContext || null};
}

function abortableWait(ms, signal) {
    return new Promise((resolve, reject) => {
        if (signal.aborted) {
            reject(new DOMException('Cancelled', 'AbortError'));
            return;
        }
        let timer = setTimeout(() => {
            signal.removeEventListener('abort', cancel);
            resolve();
        }, ms);

        function cancel() {
            clearTimeout(timer);
            signal.removeEventListener('abort', cancel);
            reject(new DOMException('Cancelled', 'AbortError'));
        }
        signal.addEventListener('abort', cancel, {
            once: true
        });
    });
}
async function generationWait(ms, signal, message) {
    const until = Date.now() + ms;
    while (Date.now() < until) {
        setGenStatus(message + ' ' + Math.ceil((until - Date.now()) / 1000) + 's…');
        await abortableWait(Math.min(1000, until - Date.now()), signal);
    }
}

function retryInfo(response, data) {
    const e = data?.error || {},
        details = Array.isArray(e.details) ? e.details : [];
    let delay = 0;
    const header = response.headers?.get('Retry-After');
    if (header) {
        delay = /^\d+(\.\d+)?$/.test(header) ? Number(header) * 1000 : Math.max(0, Date.parse(header) - Date.now());
    }
    for (const d of details) {
        if (typeof d.retryDelay === 'string' && /^\d+(\.\d+)?s$/.test(d.retryDelay)) delay = Math.max(delay || 0, parseFloat(d.retryDelay) * 1000);
    }
    const quota = JSON.stringify(details) + ' ' + String(e.message || '');
    const hardQuota = response.status === 429 && (/per[ _]?day|daily|limit:\s*0\b/i.test(quota));
    return {
        delay: Number.isFinite(delay) ? delay : 0,
        hardQuota
    };
}

async function geminiBudgetRequest(prompt, schema, signal, selectedModel, maxAttempts = 2) {
    const key = apiKey,
        phase = genStatus || 'Generating questions…';
    const body = JSON.stringify({
        contents: [{
            parts: [{
                text: prompt
            }]
        }],
        generationConfig: {
            responseMimeType: 'application/json',
            responseJsonSchema: schema
        }
    });
    for (let attempt = 0; attempt < maxAttempts; attempt++) {
        const pace = Math.max(0, 15000 - (Date.now() - lastAIRequest));
        if (pace) await generationWait(pace, signal, 'Spacing requests for limited quotas. Continuing in');
        if (signal.aborted) throw new DOMException('Cancelled', 'AbortError');
        setGenStatus(phase + (attempt ? ' Retry ' + attempt + ' of ' + (maxAttempts - 1) + '.' : ''));
        const controller = new AbortController(),
            abort = () => controller.abort();
        signal.addEventListener('abort', abort, {
            once: true
        });
        const timer = setTimeout(() => controller.abort(), 120000);
        let response, data;
        try {beginBudgetRequest(selectedModel);}catch(e){clearTimeout(timer);signal.removeEventListener('abort',abort);throw e;}
        lastAIRequest = Date.now();
        try {
            response = await fetch('https://generativelanguage.googleapis.com/v1beta/models/' + encodeURIComponent(selectedModel) + ':generateContent', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'x-goog-api-key': key
                },
                body,
                signal: controller.signal
            });
            try {
                data = await response.json();
            } catch {
                data = null;
            }
        } catch (e) {
            if (signal.aborted) throw new DOMException('Cancelled', 'AbortError');
            const problem=new Error(controller.signal.aborted?'Google timed out.':'Could not reach Google.');problem.status=controller.signal.aborted?408:503;throw problem;
        } finally {
            clearTimeout(timer);
            signal.removeEventListener('abort', abort);
        }
        recordCost(data?.usageMetadata,selectedModel,response.status);
        finishBudgetRequest(data?.usageMetadata,response.status);
        aiDiagnostics.push({
            time: new Date().toISOString(),
            model: selectedModel,
            apiSlot:hubWorkingSlot,
            status: response.status,
            message: response.ok ? 'Request succeeded' : safeGoogleMessage(data, key)
        });
        aiDiagnostics = aiDiagnostics.slice(-20);
        if (!response.ok) {
            const info = retryInfo(response, data),
                transient = [408, 429, 500, 502, 503, 504].includes(response.status);
            const saved = hubRunSettings || VertexHub.load();
            const useBackupForQuota = response.status === 429 && hubWorkingSlot === 'key1' && saved.key2 && saved.key2 !== saved.key1;
            if (useBackupForQuota || !transient || info.hardQuota || attempt === maxAttempts - 1 || info.delay > 60000) {
                const error = new Error('[' + selectedModel + '] ' + apiError(response.status) + (info.delay > 60000 ? ' Wait at least ' + Math.ceil(info.delay / 1000) + ' seconds.' : '') + ' ' + safeGoogleMessage(data, key));
                error.status = response.status;
                error.longWait = info.delay > 60000;
                throw error;
            };
            const delay = Math.max(info.delay, 2000 * 2 ** attempt + Math.random() * 1000);
            await generationWait(delay, signal, (response.status === 429 ? 'Google rate limit reached.' : 'Google temporarily unavailable (' + response.status + ').') + ' Retry ' + (attempt + 1) + '/' + (maxAttempts - 1) + ' in');
            continue;
        }
        if (data?.promptFeedback?.blockReason) throw Error('Google blocked this generation. Try a different focus.');
        let candidate = data?.candidates?.[0];
        if (candidate?.finishReason !== 'STOP') throw Error('Google returned an incomplete response. Try fewer questions.');
        let raw = candidate?.content?.parts?.filter(p => !p.thought && p.text).map(p => p.text).join('');
        if (!raw) throw Error('Google returned no question data.');
        try {
            return JSON.parse(raw);
        } catch {
            throw Error('Google returned unreadable question data. Try again.');
        }
    }
}

function validateQuestions(data, n, skills, level) {
    if (!data || !Array.isArray(data.questions) || data.questions.length !== n) throw Error('The AI returned an unexpected question count. No set saved.');
    return data.questions.map((q, i) => {
        if (typeof q.prompt !== 'string' || q.prompt.length < 15 || q.prompt.length > 4000 || !Number.isFinite(numeric(q.answer)) || !Array.isArray(q.steps) || q.steps.length < 2 || q.steps.length > 12 || q.steps.some(s => typeof s !== 'string' || s.length > 3000) || !['Algebra', 'Advanced', 'Data', 'Geometry'].includes(q.domain) || !Number.isFinite(q.tolerance) || q.tolerance < 0 || q.tolerance > 0.5) throw Error('A question failed the content validation. Try generating again.');
        let v = q.visual;
        if (v && v.type !== 'none') {
            if (v.type === 'table') {
                if (!Array.isArray(v.headers) || v.headers.length < 2 || v.headers.length > 6 || !Array.isArray(v.rows) || v.rows.length < 1 || v.rows.length > 25 || v.rows.some(r => !Array.isArray(r) || r.length !== v.headers.length || r.some(x => typeof x !== 'string' || x.length > 100))) throw Error('A generated table was invalid. Try again.');
            } else if (v.type === 'curve' || v.type === 'scatter') {
                if (!Array.isArray(v.range) || v.range.length !== 4 || v.range.some(x => !Number.isFinite(x) || Math.abs(x) > 1e6) || v.range[0] >= v.range[1] || v.range[2] >= v.range[3]) throw Error('A graph had invalid bounds.');
                if (v.type === 'curve' && (!Array.isArray(v.coeff) || v.coeff.length < 2 || v.coeff.length > 5 || v.coeff.some(x => !Number.isFinite(x)))) throw Error('A graph had invalid polynomial data.');
                if (v.type === 'scatter' && (!Array.isArray(v.points) || v.points.length < 2 || v.points.length > 100 || v.points.some(p => !Array.isArray(p) || p.length !== 2 || p.some(x => !Number.isFinite(x))))) throw Error('A scatterplot had invalid points.');
            } else throw Error('Unsupported diagram type. Try again.');
        }
        return {
            ...q,
            skill: skills[i],
            id: 'ai-' + Date.now() + '-' + i + '-' + Math.random().toString(36).slice(2, 8),
            choices: null,
            level,
            source: hubRunSettings?.provider==='lmstudio'?'LM Studio':'Gemini',
            modelUsed: hubRunSettings?.provider==='lmstudio'?hubRunSettings.localModel:workingModel || model,
            visual: v?.type === 'none' ? null : v
        };
    });
}

        const family=m.dataset.family,seed=Number(m.dataset.seed);let g;
        try{g=VertexWordLab.raw(family,seed);}catch{m.remove();return;}
        const canvas=m.querySelector('canvas'),seek=m.querySelector('[data-seek]'),play=m.querySelector('[data-play]'),chips=[...m.querySelectorAll('[data-step]')],steps=[...(m.closest('.solution')?.querySelectorAll('.solution-steps>li')||[])];
        let raf=0,playing=false,t0=0,t=1,active=null;
        const paint=()=>{if(canvas.isConnected)try{VertexWordLab.draw(canvas,family,seed,t,active==null?null:g.steps[active]?.f??null);}catch{}};
        const stop=()=>{playing=false;cancelAnimationFrame(raf);play.textContent='▶ Play';play.setAttribute('aria-pressed','false');};
        const setActive=i=>{active=i;chips.forEach((c,j)=>{c.classList.toggle('on',j===i);c.setAttribute('aria-pressed',String(j===i));});steps.forEach((li,j)=>li.classList.toggle('on',j===i));};
        const start=()=>{if(t>=1)t=0;setActive(null);playing=true;play.textContent='❚❚ Pause';play.setAttribute('aria-pressed','true');t0=performance.now()-t*DUR;const tick=now=>{if(!playing||!canvas.isConnected)return;t=Math.min(1,(now-t0)/DUR);seek.value=Math.round(t*1000);paint();if(t<1)raf=requestAnimationFrame(tick);else stop();};raf=requestAnimationFrame(tick);};
        play.onclick=()=>playing?stop():start();
        seek.oninput=()=>{stop();t=seek.value/1000;paint();};
        const focusStep=i=>{stop();t=1;seek.value=1000;setActive(active===i?null:i);paint();};
        chips.forEach((c,i)=>c.onclick=()=>focusStep(i));
        steps.forEach((li,i)=>{li.tabIndex=0;li.setAttribute('role','button');li.setAttribute('aria-label','Step '+(i+1)+': highlight in the model');li.onclick=()=>focusStep(i);li.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();focusStep(i);}};});
        const po=m.querySelector('[data-popout]');if(po){if(innerWidth<700&&m.requestFullscreen)po.textContent='⤢ Full screen';po.addEventListener('click',()=>{if(innerWidth<700&&m.requestFullscreen){document.fullscreenElement===m?document.exitFullscreen():m.requestFullscreen().catch(()=>popout(family,seed));}else popout(family,seed);});}
        if(m.dataset.autoplay==='1'&&!matchMedia('(prefers-reduced-motion: reduce)').matches)start();else paint();
    }
    function mountAll(){document.querySelectorAll('.model[data-family]').forEach(mountOne);}
    function popout(family,seed){
        if(db.session?.timed&&!db.session.complete)return toast('Review models after finishing the timed test.');
        $('wordModel')?.remove();
        const q=VertexWordLab.make(family,seed);
        const w=openWindow('wordModel','Animated model · '+q.skill,'<div class="solution">'+html(q,true)+'<ol class="solution-steps">'+q.steps.map(x=>'<li>'+rich(x)+'</li>').join('')+'</ol></div>');
        w.classList.add('window-wide');
        w.querySelector('[data-popout]')?.remove();
        w.style.left=Math.max(12,(innerWidth-w.offsetWidth)/2)+'px';
        mountAll();
    }
    new MutationObserver(mountAll).observe(document.body,{childList:true,subtree:true});
    return {html,mountAll,popout,autoKey:k=>{const fresh=k!==lastAuto;lastAuto=k;return fresh;}};
})();

/* Worked solution for WordLab questions: feedback → model → clickable steps */
const baseSolutionHTML=solutionHTML;
solutionHTML=function(q,a,interactive=true){
    if(!q.wordlab||!interactive)return baseSolutionHTML(q,a,interactive);
    const ok=correct(q,a),autoplay=WordModel.autoKey(q.id+'|'+(db.session?.id||''));
    return '<div class="solution"><div class="feedback '+(ok?'':'bad')+'">'+(ok?'✓ Correct':a==null||a===''?'Not answered':'Keep practicing')+' · Answer: '+rich(q.choices?'$'+String.fromCharCode(65+Number(q.answer))+'$ — '+q.choices[Number(q.answer)]:q.answer)+'</div>'+WordModel.html(q,autoplay)+'<div class="solution-steps-head"><h3>Step-by-step solution</h3><span class="mini muted">Select a step to highlight it in the model</span></div><ol class="solution-steps">'+q.steps.map(x=>'<li>'+rich(x)+'</li>').join('')+'</ol></div>';
};

/* Offline number variants (kept from v1.8) */
document.addEventListener('click',e=>{
    const variant=e.target.closest('[data-word-variant]');if(!variant)return;
    if(db.session?.timed&&!db.session.complete)return toast('Make variants after finishing the timed test.');
    const q=VertexWordLab.make(variant.dataset.wordVariant,crypto.getRandomValues(new Uint32Array(1))[0]);
    const set={id:'wl-set-'+crypto.randomUUID(),name:q.topic+' · Variant',level:q.level,parentTestId:'word-problems',questions:[q],created:Date.now(),source:'Offline'};
    db.sets.unshift(set);save();openAIPractice(set);
});

render();

setTimeout(initMastery,0);
document.addEventListener('submit',()=>setTimeout(()=>{if(VertexHub.unlocked())initMastery();},200));
</script></body></html>
