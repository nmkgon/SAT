const BANK = [];

function Q(skill, domain, level, prompt, choices, answer, steps, visual = null) {
    BANK.push({
        id: 'v' + (BANK.length + 1),
        skill,
        domain,
        level,
        prompt,
        choices,
        answer: String(answer),
        steps,
        visual,
        source: 'Original',
        tolerance: 0.0001
    });
}
Q('Percentages', 'Data', 'Easy', 'A gallery sold 240 tickets on Saturday. Of these, 35% were student tickets. How many student tickets were sold?', ['72', '84', '156', '205'], 1, ['Convert 35% to 0.35.', 'Multiply: $0.35(240)=84$.']);
Q('Equivalent equations', 'Algebra', 'Easy', 'Which equation has the same solution as $7x-9=40$?', ['$7x=31$', '$x=49$', '$7x=49$', '$7x=360$'], 2, ['Add 9 to both sides: $7x=49$.', 'Both equations have the solution $x=7$.']);
Q('Budget inequalities', 'Algebra', 'Easy', 'A ceramics studio charges a 16-dollar booking fee and 12 dollars per hour. Mei can spend at most 88 dollars. Which inequality models the possible number of hours, $h$?', ['$16h+12\\le88$', '$12h-16\\le88$', '$16+12h\\ge88$', '$16+12h\\le88$'], 3, ['Total cost is the fixed fee plus the hourly charge: $16+12h$.', 'At most means less than or equal to, so $16+12h\\le88$.']);
Q('Quadratic evaluation', 'Advanced', 'Easy', 'Let $g(t)=2t^2+3$. If $t>0$ and $g(t)=75$, what is $t$?', ['6', '9', '18', '36'], 0, ['Solve $2t^2+3=75$, giving $t^2=36$.', 'The positive solution is $t=6$.']);
Q('Probability', 'Data', 'Easy', 'A bag contains 7 blue, 5 gold, and 8 white tokens. One token is selected at random. What is the probability it is gold?', ['$\\frac15$', '$\\frac14$', '$\\frac38$', '$\\frac34$'], 1, ['There are $7+5+8=20$ tokens.', 'The probability is $\\frac5{20}=\\frac14$.']);
Q('Unit rates', 'Data', 'Easy', 'A conveyor moves 18 boxes every 45 seconds. At this constant rate, how many boxes does it move in 5 minutes?', null, 120, ['Five minutes equals 300 seconds.', 'The rate is $18/45=0.4$ box per second.', 'Multiply $0.4(300)=120$.']);
Q('Function evaluation', 'Algebra', 'Easy', 'If $f(x)=9-4x$, what is $f(-3)$?', null, 21, ['Substitute $x=-3$.', '$f(-3)=9-4(-3)=9+12=21$.']);
Q('Linear modeling', 'Algebra', 'Easy', 'A museum sells adult tickets for 14 dollars and youth tickets for 9 dollars. Ticket revenue is 513 dollars. Which equation relates adult tickets, $a$, and youth tickets, $y$?', ['$23(a+y)=513$', '$9a+14y=513$', '$14a+9y=513$', '$14ay=513$'], 2, ['Adult revenue is $14a$ and youth revenue is $9y$.', 'Add the two revenues: $14a+9y=513$.']);
Q('Similar triangles', 'Geometry', 'Easy', 'Triangles ABC and DEF are similar, with A corresponding to D and B to E. Angle A is 38° and angle B is 72°. What is the measure of angle F?', ['38°', '70°', '72°', '110°'], 1, ['The third angle of ABC is $180-38-72=70$ degrees.', 'Corresponding angles C and F are equal.']);
Q('Linear systems', 'Algebra', 'Easy', 'The equations $y=2x+1$ and $3x+y=26$ intersect. What is the $x$-coordinate of the intersection?', ['4', '5', '7', '11'], 1, ['Substitute $y=2x+1$ into the second equation.', '$3x+2x+1=26$, so $5x=25$ and $x=5$.']);
Q('Scatterplots', 'Data', 'Hard', 'The scatterplot relates practice hours, $x$, to a student’s task completion time, $y$, in minutes. Which model best fits the data?', ['$y=2x+18$', '$y=-2x-18$', '$y=-2x+18$', '$y=-8x+18$'], 2, ['The data decrease by about 2 minutes for each added practice hour.', 'The vertical intercept is about 18, so $y=-2x+18$.'], {

Q('Polynomial zeros', 'Advanced', 'Hard', 'The graph of a polynomial is shown. How many distinct real solutions does $f(x)=0$ have?', ['1', '2', '3', '4'], 2, ['Real zeros occur where the graph meets the horizontal axis.', 'The graph crosses at $x=-3$, $x=1$, and $x=4$: three distinct zeros.'], {

Q('Cost equations', 'Algebra', 'Easy', 'A club spends 146 dollars on notebooks and pens. It buys 18 notebooks at 6 dollars each; pens cost 2 dollars each. How many pens does it buy?', null, 19, ['Notebooks cost $18(6)=108$ dollars.', 'Pens cost $146-108=38$ dollars.', 'The number of pens is $38/2=19$.']);
Q('Quadratic roots', 'Advanced', 'Hard', 'What is the positive solution of $x^2+3x-28=0$?', null, 4, ['Factor: $(x+7)(x-4)=0$.', 'The roots are $-7$ and 4. The positive root is 4.']);
Q('Exponential growth', 'Advanced', 'Hard', 'A culture starts with 640 cells and triples every 4 hours. How many cells are predicted after 12 hours?', ['1920', '5760', '17280', '23040'], 2, ['There are $12/4=3$ growth periods.', 'The count is $640(3)^3=17280$.']);
Q('Factoring expressions', 'Advanced', 'Hard', 'Which expression is equivalent to $15x^7y^3+25x^3y^5$?', ['$5x^3y^3(3x^4+5y^2)$', '$5x^3y^3(3x^4+5y^5)$', '$5xy(3x^6+5y^4)$', '$15x^3y^3(x^4+25y^2)$'], 0, ['The greatest common factor is $5x^3y^3$.', 'Divide each term by it to obtain $3x^4+5y^2$.']);
Q('Interpreting coefficients', 'Algebra', 'Hard', 'A solar array has 12 rooftop panels and 20 ground panels. Its daily energy output is modeled by $12r+20g=184$. What does $r$ represent?', ['Total output of the rooftop array', 'Average daily output per rooftop panel', 'Number of rooftop panels', 'Average daily output per ground panel'], 1, ['The coefficient 12 counts the rooftop panels.', 'Therefore $r$ is the daily energy output of one rooftop panel on average.']);
Q('Graph modeling', 'Algebra', 'Hard', 'The graph shows combinations of small crates, $x$, and large crates, $y$, that fill a truck. Which equation represents the line?', ['$4x+6y=48$', '$6x+4y=48$', '$x+y=48$', '$4x-6y=48$'], 0, ['The intercepts are $(12,0)$ and $(0,8)$.', 'Thus $x/12+y/8=1$. Multiply by 48 to obtain $4x+6y=48$.'], {

Q('Frequency tables', 'Data', 'Easy', 'The table records books read by a group. What is the largest observed number of books?', null, 9, ['A value is observed only if its frequency is positive.', 'The row for 12 has frequency zero. The largest observed value is 9.'], {

Q('Radians and degrees', 'Geometry', 'Hard', 'Angle A measures $\\frac{5\\pi}{6}$ radians. Angle B is $\\frac{\\pi}{4}$ radians larger. What is angle B in degrees?', ['165°', '195°', '210°', '225°'], 1, ['Convert each part: $5\\pi/6=150$ degrees and $\\pi/4=45$ degrees.', 'Add: $150+45=195$ degrees.']);
Q('Area unit conversion', 'Data', 'Hard', 'A rectangular field covers 0.72 square kilometer. How many square meters is this?', null, 720000, ['Since 1 kilometer equals 1000 meters, 1 square kilometer equals $1000^2$ square meters.', '$0.72(1000000)=720000$.']);
Q('Linear translations', 'Algebra', 'Harder', 'The table gives points on line $h$. Line $k$ is formed by shifting $h$ down 7 units. What is the $x$-coordinate of the $x$-intercept of $k$?', null, -1.5, ['The slope is $(29-21)/(4-2)=4$.', 'Using $(2,21)$ gives $h(x)=4x+13$.', 'After shifting down 7, $k(x)=4x+6$. Solve $4x+6=0$: $x=-1.5$.'], {
    type: 'table',
    headers: ['x', 'h(x)'],
    rows: [
        [2, 21],
        [4, 29],
        [7, 41]
    ]
});
Q('Quadratic extrema', 'Advanced', 'Harder', 'The horizontal line $y=c$ meets $y=-2x^2+12x-11$ at exactly one point. What is $c$?', ['-11', '3', '7', '18'], 2, ['The one-point intersection occurs at the vertex.', 'Complete the square: $y=-2(x-3)^2+7$.', 'The vertex height is 7, so $c=7$.']);
Q('Dependent systems', 'Algebra', 'Harder', 'Every solution of $3x+4y=18$ also solves $9x+12y=54$. If $y=t$, which expression gives $x$?', ['$6-\\frac43t$', '$6+\\frac43t$', '$18-4t$', '$\\frac34t-6$'], 0, ['The second equation is 3 times the first.', 'Set $y=t$ in $3x+4y=18$ and isolate $x$: $x=6-4t/3$.']);
Q('Special triangles', 'Geometry', 'Hard', 'An equilateral triangle has perimeter 90 centimeters. Its height is $k\\sqrt3$ centimeters. What is $k$?', null, 15, ['Each side has length $90/3=30$.', 'The altitude is $(30/2)\\sqrt3=15\\sqrt3$, so $k=15$.'], {

    labels: ['30', '30', '30']

Q('Proportional earnings', 'Algebra', 'Easy', 'A translator earns $p$ dollars for 5 pages at a constant rate. How much is earned for 35 pages?', ['$5p$', '$7p$', '$30p$', '$p/7$'], 1, ['There are $35/5=7$ groups of 5 pages.', 'The earnings are $7p$.']);
Q('Rate functions', 'Algebra', 'Easy', 'A drone travels 14 meters each second at a constant speed. Which function gives the distance $d(t)$, in meters, traveled in $t$ seconds?', ['$d(t)=t+14$', '$d(t)=t/14$', '$d(t)=14t$', '$d(t)=14-t$'], 2, ['Distance equals speed times time.', 'Thus $d(t)=14t$.']);
Q('System substitution', 'Algebra', 'Easy', 'If $4x=28$ and $y-2x=9$, what is $y$?', ['5', '14', '21', '23'], 3, ['From $4x=28$, $x=7$.', 'Substitute: $y-14=9$, so $y=23$.']);
Q('Linear evaluation', 'Algebra', 'Easy', 'A tank’s water depth in centimeters is $d=62-3t$, where $t$ is minutes after a valve opens. What is the depth at $t=8$?', ['24', '38', '54', '86'], 1, ['Substitute $t=8$.', '$d=62-3(8)=38$ centimeters.']);
Q('Pythagorean theorem', 'Geometry', 'Easy', 'A right triangle has legs 8 cm and 15 cm. What is its hypotenuse in centimeters?', ['7', '17', '23', '289'], 1, ['Use $c^2=8^2+15^2=289$.', 'Thus $c=17$.'], {
    type: 'rightTriangle',
    labels: ['8', '15', 'c']

Q('Linear equations', 'Algebra', 'Easy', 'Solve $6x-17=103$.', null, 20, ['Add 17 to both sides to get $6x=120$.', 'Divide by 6: $x=20$.']);
Q('Graph intercepts', 'Algebra', 'Easy', 'The line shown crosses the horizontal axis at $(a,0)$. What is $a$?', null, 4, ['At the horizontal intercept, the vertical coordinate is 0.', 'The line crosses at $(4,0)$, so $a=4$.'], {

Q('Vertical intercepts', 'Algebra', 'Easy', 'What is the $y$-intercept of $f(x)=\\frac35x+7$?', ['$(7,0)$', '$(0,7)$', '$(0,3/5)$', '$(3/5,0)$'], 1, ['At a y-intercept, $x=0$.', '$f(0)=7$, so the point is $(0,7)$.']);
Q('Function shifts', 'Advanced', 'Hard', 'The graph of $f(x)=4x^3$ is translated up 9 units. Which function describes the new graph?', ['$g(x)=4(x+9)^3$', '$g(x)=36x^3$', '$g(x)=4x^3-9$', '$g(x)=4x^3+9$'], 3, ['An upward translation adds a constant to the output.', 'Therefore $g(x)=f(x)+9=4x^3+9$.']);
Q('Nonlinear systems', 'Advanced', 'Hard', 'If $x-4=5$ and $y=(x-4)^2+2$, what is $y$?', ['11', '23', '27', '83'], 2, ['The expression $x-4$ already equals 5.', 'Thus $y=5^2+2=27$.']);
Q('Polynomial operations', 'Advanced', 'Hard', 'Simplify $(8x^3-5x+2)-(3x^3+4x-7)$.', ['$5x^3-x-5$', '$5x^3-9x+9$', '$11x^3-9x-5$', '$5x^3+9x+9$'], 1, ['Distribute the subtraction to every term in the second polynomial.', 'Combine: $(8-3)x^3+(-5-4)x+(2+7)=5x^3-9x+9$.']);
Q('Cubic equations', 'Advanced', 'Hard', 'For $p(n)=6n^3$, what is $n$ when $p(n)=162$?', null, 3, ['Divide by 6 to obtain $n^3=27$.', 'Taking the cube root gives $n=3$.']);
Q('Parallel line angles', 'Geometry', 'Hard', 'Two parallel horizontal lines are cut by a transversal. The marked angles are on the same side of the transversal and inside the parallel lines. What is $x$, in degrees?', null, 64, ['Same-side interior angles are supplementary.', '$x+116=180$, so $x=64$.'], {
    type: 'parallel'
});
Q('Mean', 'Data', 'Easy', 'A team records completion times of 12, 18, 15, 21, 9, and 15 minutes. What is the mean time?', null, 15, ['The sum is $12+18+15+21+9+15=90$.', 'Divide by the 6 observations: $90/6=15$.']);
Q('Exponential parameters', 'Advanced', 'Hard', 'The model $N(t)=240(1.12)^t$ predicts subscriptions $t$ months after launch. What does 240 represent?', ['The monthly increase in subscriptions', 'The predicted subscriptions at launch', 'The monthly percentage increase', 'The number of months'], 1, ['At launch, $t=0$.', '$N(0)=240(1.12)^0=240$.']);
Q('Quadratic minimum', 'Advanced', 'Hard', 'What is the minimum value of $g(x)=3(x+2)^2-8$?', ['-8', '-2', '0', '8'], 0, ['A square is nonnegative, so $3(x+2)^2\\ge0$.', 'The minimum occurs at $x=-2$ and equals $-8$.']);
Q('Growth models', 'Advanced', 'Hard', 'The amount of a substance decreases by 6% of its current amount each hour. Which model type describes this change?', ['Increasing linear', 'Decreasing linear', 'Increasing exponential', 'Decreasing exponential'], 3, ['A constant percentage change multiplies the amount by the same factor each hour.', 'The factor is 0.94, which is between 0 and 1: decreasing exponential.']);
Q('Percent multipliers', 'Data', 'Easy', 'A price rises by 18%. The new price is $k$ times the old price. What is $k$?', null, 1.18, ['Keep 100% of the old price and add 18%.', 'The multiplier is $1+0.18=1.18$.']);
Q('Rational exponents', 'Advanced', 'Hard', 'For $a>0$, which expression equals $a^{7/5}$?', ['$\\sqrt[5]{a^7}$', '$\\sqrt[7]{a^5}$', '$a^{12}$', '$a^{35}$'], 0, ['The denominator of a rational exponent gives the root index.', 'Thus $a^{7/5}=\\sqrt[5]{a^7}$.']);
Q('Integer budget constraints', 'Algebra', 'Hard', 'A robotics club pays a 48-dollar registration fee plus 13.50 dollars per participant. It has 260 dollars. What is the greatest number of participants it can afford?', null, 15, ['Solve $48+13.5n\\le260$ to obtain $n\\le212/13.5\\approx15.70$.', 'Participants must be whole people. Round down to 15.']);
Q('Radical equations', 'Advanced', 'Harder', 'If $3x^2-12=135$ and $x>0$, what is $x-2$?', null, 5, ['Add 12 and divide by 3: $x^2=49$.', 'Since $x>0$, $x=7$; therefore $x-2=5$.']);
Q('Composite volume', 'Geometry', 'Harder', 'A sphere of radius 6 cm fits inside a cube of edge length 12 cm. To the nearest cubic centimeter, what volume inside the cube is outside the sphere?', ['452', '823', '905', '1728'], 1, ['Cube volume: $12^3=1728$.', 'Sphere volume: $(4/3)\\pi(6^3)=288\\pi$.', 'The difference is $1728-288\\pi\\approx823.22$, which rounds to 823.']);
Q('Circle equations', 'Geometry', 'Hard', 'The circle $(x+4)^2+(y-6)^2=81$ has what diameter?', ['9', '18', '40.5', '81'], 1, ['The squared radius is 81, so the radius is 9.', 'The diameter is $2(9)=18$.']);
Q('Exponential rewriting', 'Advanced', 'Harder', 'For $f(x)=40(1.5)^x$, let $k=f(2)$. Which equivalent form displays $k$ as its coefficient?', ['$60(1.5)^{x-1}$', '$90(1.5)^{x-2}$', '$40(1.5)^{x+2}$', '$90(1.5)^{x+2}$'], 1, ['Compute $k=40(1.5)^2=90$.', 'Then $f(x)=90(1.5)^{x-2}$, with coefficient $k$.']);
Q('Exponential baseline', 'Advanced', 'Harder', 'A collection increases by 80% each year. It contains 324 items at the end of year 2. Which model gives the number $N(t)$ at the end of year $t$?', ['$N(t)=100(1.8)^t$', '$N(t)=180(0.8)^t$', '$N(t)=324(1.8)^t$', '$N(t)=100(0.8)^t$'], 0, ['An 80% increase has multiplier 1.8.', 'The initial amount is $324/(1.8)^2=100$.', 'Therefore $N(t)=100(1.8)^t$.']);
Q('Perpendicular slopes', 'Algebra', 'Harder', 'A line has equation $6x+5y=20$. A second line is perpendicular to it and passes through $(3,4)$. What is the second line’s $y$-intercept?', null, 1.5, ['The first slope is $-6/5$, so the perpendicular slope is $5/6$.', 'Substitute $(3,4)$ into $y=(5/6)x+b$: $4=2.5+b$.', 'Thus $b=1.5$.']);
Q('Discriminants', 'Advanced', 'Harder', 'The equation $x^2-18x+c=0$ has no real solutions when $c>n$. What is the least possible value of $n$?', null, 81, ['No real roots means the discriminant is negative.', '$(-18)^2-4c<0$, so $324<4c$.', 'Therefore $c>81$ and the threshold is $n=81$.']);
if (typeof module !== 'undefined') module.exports = BANK;

const $ = id => document.getElementById(id),
    esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&#39;'
    } [c]));
// Native MathML: local rendering without fonts, remote scripts, or executable AI markup.
function mathML(input) {
    let s = String(input),
        i = 0;
    const cmds = {
        pi: 'π',
        theta: 'θ',
        alpha: 'α',
        beta: 'β',
        le: '≤',
        leq: '≤',
        ge: '≥',
        geq: '≥',
        ne: '≠',
        times: '×',
        cdot: '·',
        approx: '≈',
        pm: '±',
        infty: '∞',
        circ: '°'
    };

    function group(end) {
        let out = '';
        while (i < s.length && s[i] !== end) {
            let atom = '';
            let c = s[i++];
            if (/\s/.test(c)) continue;
            if (c === '{') {
                atom = '<mrow>' + group('}') + '</mrow>';
                i++;
            } else if (c === '(' || c === '[') {
                // Fence as one group: fixes wide infix spacing around parentheses and puts exponents on the whole group.
                const close = c === '(' ? ')' : ']';
                atom = '<mrow><mo stretchy="false">' + c + '</mo>' + group(close) + '<mo stretchy="false">' + close + '</mo></mrow>';
                if (s[i] === close) i++;
            } else if (c === '-') {
                atom = '<mo>−</mo>';
            } else if (c === '\\') {
                let name = '';
                while (/[a-zA-Z]/.test(s[i] || '') && i < s.length) name += s[i++];
                if (name === 'frac') {
                    atom = '<mfrac>' + arg() + arg() + '</mfrac>';
                } else if (name === 'sqrt') {
                    let index = null;
                    if (s[i] === '[') {
                        i++;
                        index = group(']');
                        i++;
                    }
                    const a = arg();
                    atom = index ? '<mroot>' + a + '<mrow>' + index + '</mrow></mroot>' : '<msqrt>' + a + '</msqrt>';
                } else if (name === 'text' || name === 'mathrm') {
                    if (s[i] === '{') {
                        let start = ++i;
                        while (i < s.length && s[i] !== '}') i++;
                        atom = '<mtext>' + esc(s.slice(start, i++)) + '</mtext>';
                    }
                } else if (name === 'left' || name === 'right') continue;
                else atom = '<mo>' + esc(cmds[name] || name) + '</mo>';
            } else if (/[0-9.]/.test(c)) {
                while (i < s.length && /[0-9.]/.test(s[i])) c += s[i++];
                atom = '<mn>' + esc(c) + '</mn>';
            } else if (/[a-zA-Z]/.test(c)) {
                atom = '<mi>' + c + '</mi>';
            } else atom = '<mo>' + esc(c) + '</mo>';
            while (s[i] === '^' || s[i] === '_') {
                let op = s[i++];
                atom = (op === '^' ? '<msup>' : '<msub>') + atom + arg() + (op === '^' ? '</msup>' : '</msub>');
            }
            out += atom;
        }
        return out;
    }

    function arg() {
        if (s[i] === '{') {
            i++;
            let r = '<mrow>' + group('}') + '</mrow>';
            i++;
            return r;
        }
        let c = s[i++] || '';
        return /[0-9]/.test(c) ? '<mn>' + c + '</mn>' : '<mi>' + esc(c) + '</mi>';
    }
    return '<math xmlns="http://www.w3.org/1998/Math/MathML" aria-label="' + esc(s) + '"><mrow>' + group(null) + '</mrow></math>';
}

function rich(s) {
    return String(s).split('$').map((p, i) => i % 2 ? mathML(p) : esc(p)).join('');
}

function visual(v) {
    if (!v) return '';
    if (v.type === 'table') return '<table class="data-table"><thead><tr>' + v.headers.map(x => '<th scope="col">' + rich(x) + '</th>').join('') + '</tr></thead><tbody>' + v.rows.map(r => '<tr>' + r.map(x => '<td>' + rich(x) + '</td>').join('') + '</tr>').join('') + '</tbody></table>';
    const begin = '<svg class="chart" viewBox="0 0 420 280" role="img" xmlns="http://www.w3.org/2000/svg"><title>' + esc(v.type === 'scatter' ? 'Scatterplot of ' + (v.xLabel || 'x') + ' and ' + (v.yLabel || 'y') : v.type === 'curve' ? 'Coordinate graph with labeled axes' : 'Geometry diagram') + '</title>',
        end = '</svg>';
    if (v.type === 'triangle' || v.type === 'rightTriangle') {
        let right = v.type === 'rightTriangle';

function calculate(src, vars = {}) {

    function expr() {

        while (t[i] === '+' || t[i] === '-') {
            let op = t[i++],
                b = term();
            a = op === '+' ? a + b : a - b;
        }
        return a;
    }

    function term() {
        let a = unary();
        while (t[i] === '*' || t[i] === '/') {

                b = unary();
            a = op === '*' ? a * b : a / b;

        return a;
    }

    function unary() {
        if (t[i] === '+') {
            i++;
            return unary();
        }
        if (t[i] === '-') {
            i++;
            return -unary();
        }
        return power();
    }

    function power() {
        let a = atom();
        if (t[i] === '^') {
            i++;
            a = a ** unary();

        return a;
    }

    function atom() {
        let c = t[i++];
        if (c === '(') {
            let a = expr();
            if (t[i++] !== ')') throw Error('Missing closing parenthesis.');
            return a;
        }
        if (c === 'pi') return Math.PI;
        if (c === 'e') return Math.E;
        if (c in vars) return vars[c];
        if (/^(sqrt|sin|cos|tan|ln|log|abs)$/.test(c || '')) {
            if (t[i++] !== '(') throw Error('Use parentheses after functions.');

            if (t[i++] !== ')') throw Error('Missing closing parenthesis.');

                sin: Math.sin,
                cos: Math.cos,
                tan: Math.tan,

function selectChoice(n) {
    const s = db.session,
        q = s.questions[s.index];
    if (!q.choices || n < 0 || n >= q.choices.length) return;
    if (isBlank(s.answers[q.id])) logActivity();
    s.answers[q.id] = String(n);
    s.eliminated[q.id] = (s.eliminated[q.id] || []).filter(x => x !== n);
    render();
}

function updateGridCell() {
    const s = db.session,
        b = document.querySelector('[data-q="' + s.index + '"]');
    if (b) b.classList.toggle('answered', !isBlank(s.answers[s.questions[s.index].id]));
}

function nextUnanswered() {
    const s = db.session,
        [lo, hi] = activeRange();
    for (let k = 1; k <= hi - lo; k++) {
        const i = lo + ((s.index - lo + k) % (hi - lo));
        if (isBlank(s.answers[s.questions[i].id])) {
            go(i);
            return;
        }
    }
    toast('Every question in this module has an answer.');
}
// Keyboard shortcuts for the workspace. Ignored inside inputs and floating windows.
function handleShortcut(e) {
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    const t = e.target;
    if (t.closest && (t.closest('.window') || t.matches('input,textarea,select,[contenteditable]'))) return;
    if (e.key === '?') {
        e.preventDefault();
        shortcutsWindow();
        return;
    }
    if (view !== 'practice' || db.session.complete || activePopupSet) return;
    const s = db.session,
        q = s.questions[s.index],
        [lo, hi] = activeRange(),
        k = e.key.toLowerCase();
    if (e.key === 'ArrowRight' || k === 'j') {
        if (s.index < hi - 1) go(s.index + 1);
    } else if (e.key === 'ArrowLeft' || k === 'k') {
        if (s.index > lo) go(s.index - 1);
    } else if (/^[1-4]$/.test(k) && q.choices) selectChoice(Number(k) - 1);
    else if (/^[a-d]$/.test(k) && q.choices) selectChoice(k.charCodeAt(0) - 97);
    else if (k === 'f') {
        s.flags[q.id] = !s.flags[q.id];
        render();
    } else if (k === 'n') nextUnanswered();
    else if (k === 'c' && !s.timed) $('checkBtn')?.click();
    else if (k === 'h' && !s.timed) $('hintBtn')?.click();
    else if (k === 'x' && !q.choices) $('response')?.focus();
    else if (k === '=') calculatorWindow();
    else if (k === 'r') referenceWindow();
    else if (k === 's') notesWindow();
    else return;
    e.preventDefault();
}

function go(i) {
    const [lo, hi] = activeRange();

}

function requestFinish() {

}

function finish() {
    let s = db.session;
    if (s.complete) return;
    if (s.timed && s.module === 0) {
        s.module = 1;
        s.index = 22;
        s.deadline = Date.now() + 35 * 60000;
        showSolution = false;
        save();
        render();
        toast('Module 2 started. Module 1 is locked.');
        return;
    }
    s.complete = true;
    s.finished = Date.now();
    s.deadline = null;
    showHint = false;
    logActivity();
    db.history.unshift(structuredClone(s));
    reportId = s.id;

function startSet(qs, name, timed = false, parentTestId = qs[0]?.parentTestId || 'test-1', startIndex = 0) {
    if (!qs.length) return toast('No questions to practice.');

        showHint = false;

    };

function updateTimer() {
    const s = db.session;
    if (!s.timed || s.complete) return;

        $('timer').textContent = String(Math.floor(left / 60)).padStart(2, '0') + ':' + String(left % 60).padStart(2, '0');

    if (left === 0) {
        document.querySelectorAll('.window').forEach(w => w.remove());
        finish();

}

function trendChart(history) {
    const pts = history.slice().filter(h => h.finished).sort((a, b) => a.finished - b.finished).slice(-12).map(h => Math.round(100 * h.questions.filter(q => correct(q, h.answers[q.id])).length / h.questions.length));
    if (pts.length < 2) return '<p class="mini muted">Finish two or more sets to see your accuracy trend.</p>';
    const W = 420,
        H = 170,
        X = i => 34 + i * (W - 50) / (pts.length - 1),
        Y = v => 18 + (100 - v) * (H - 48) / 100;
    let o = '<svg class="chart trend" viewBox="0 0 ' + W + ' ' + H + '" role="img"><title>Accuracy across your last ' + pts.length + ' attempts</title>';
    for (const v of [0, 25, 50, 75, 100]) o += '<path d="M34 ' + Y(v) + 'H' + (W - 12) + '" stroke="var(--line)"/><text x="28" y="' + (Y(v) + 4) + '" text-anchor="end" font-size="11" fill="var(--muted)">' + v + '</text>';
    o += '<path d="' + pts.map((v, i) => (i ? 'L' : 'M') + X(i).toFixed(1) + ' ' + Y(v).toFixed(1)).join('') + '" fill="none" stroke="var(--accent)" stroke-width="3" stroke-linejoin="round"/>';
    o += pts.map((v, i) => '<circle cx="' + X(i) + '" cy="' + Y(v) + '" r="4.5" fill="var(--accent)"><title>Attempt ' + (i + 1) + ': ' + v + '%</title></circle><text x="' + X(i) + '" y="' + (H - 8) + '" text-anchor="middle" font-size="11" fill="var(--muted)">' + (i + 1) + '</text>').join('');
    return o + '</svg>';
}

function domainBars(domains, keys = Object.keys(DOMAIN_NAMES)) {

        const pct = Math.round(100 * x.ok / x.n);

    }).join('');
}

function weakSkills(stats, limit = 5) {

}

function drillWindow(testId = db.selectedTestId) {
    const test = db.tests.find(t => t.id === testId) || db.tests[0],
        originals = testQuestions(test),
        aiQs = testSets(test.id).flatMap(x => x.questions),
        levels = ['Easy', 'Hard', 'Harder'],
        domains = Object.keys(DOMAIN_NAMES),
        prefs = db.drillPrefs || {
            domains,
            levels,
            ai: true,
            count: 10,
            shuffle: true,
            onlyMissed: false
        };
    const missedIds = new Set(db.history.flatMap(h => h.questions.filter(q => !correct(q, h.answers[q.id])).map(q => q.id)));
    openWindow('drillWindow', esc(test.name) + ' · Custom drill', '<div class="field"><label>Domains</label><div class="check-grid">' + domains.map(d => '<label class="switch"><input type="checkbox" data-dom="' + d + '" ' + (prefs.domains.includes(d) ? 'checked' : '') + '><span>' + esc(DOMAIN_NAMES[d]) + '</span></label>').join('') + '</div></div><div class="field"><label>Levels</label><div class="check-grid three">' + levels.map(l => '<label class="switch"><input type="checkbox" data-lvl="' + l + '" ' + (prefs.levels.includes(l) ? 'checked' : '') + '><span>' + l + '</span></label>').join('') + '</div></div><div class="field check-grid"><label class="switch"><input type="checkbox" id="drillAI" ' + (prefs.ai ? 'checked' : '') + ' ' + (aiQs.length ? '' : 'disabled') + '><span>Include AI sets (' + aiQs.length + ')</span></label><label class="switch"><input type="checkbox" id="drillMissed" ' + (prefs.onlyMissed ? 'checked' : '') + '><span>Only questions I have missed</span></label><label class="switch"><input type="checkbox" id="drillShuffle" ' + (prefs.shuffle ? 'checked' : '') + '><span>Shuffle order</span></label></div><div class="field"><label for="drillCount">Length</label><div class="row">' + [5, 10, 15, 20].map(n => '<button class="small" data-dcount="' + n + '">' + n + '</button>').join('') + '<button class="small" data-dcount="all">All</button><input id="drillCount" type="number" min="1" max="200" value="' + prefs.count + '" style="width:80px" aria-label="Number of questions"></div></div><p id="drillMatch" class="mini" role="status"></p><button id="drillStart" class="primary full">Start drill</button>');
    const w = $('drillWindow');
    const current = () => {
        const doms = [...w.querySelectorAll('[data-dom]:checked')].map(x => x.dataset.dom),
            lv = [...w.querySelectorAll('[data-lvl]:checked')].map(x => x.dataset.lvl),
            useAI = $('drillAI').checked,
            onlyMissed = $('drillMissed').checked;
        const pool = [...originals, ...(useAI ? aiQs : [])].filter(q => doms.includes(q.domain) && lv.includes(q.level) && (!onlyMissed || missedIds.has(q.id)));
        return {
            doms,
            lv,
            useAI,
            onlyMissed,
            pool
        };
    };
    const refresh = () => {
        const {

function download(name, text, type) {
    let a = document.createElement('a'),
        url = URL.createObjectURL(new Blob([text], {
            type
        }));
    a.href = url;
    a.download = name;
    a.click();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
}

function reviewToolsWindow(session){openWindow('reviewToolsWindow','Review & save','<div class="row"><button id="toolsGuide" class="primary">Study guide</button><button id="toolsPack">Save review pack</button><button id="toolsImport">Import review pack</button></div><p class="mini muted" style="margin-top:14px">A review pack keeps missed questions and their study guide together.</p><details><summary>More report options</summary><div class="row" style="margin-top:12px"><button id="toolsCSV" class="small">CSV report</button><button id="toolsJSON" class="small">Full JSON report</button><button id="toolsSolutions" class="small">All solutions</button><button id="toolsPrint" class="small">Print report</button><button id="toolsDelete" class="small">Delete report</button></div></details>');bind('toolsGuide',()=>studyGuideWindow(missedPayload(session)));bind('toolsPack',()=>missedExportWindow(session));bind('toolsImport',missedImportWindow);bind('toolsCSV',()=>exportCSV(session));bind('toolsJSON',()=>download('Test1_Full_Report.json',JSON.stringify(session,null,2),'application/json'));bind('toolsSolutions',()=>exportSolutions(session));bind('toolsPrint',()=>window.print());bind('toolsDelete',()=>confirmWindow('Delete this report?','This removes the selected report from My progress.',()=>{db.history=db.history.filter(x=>x.id!==session.id);reportId=null;save();$('reviewToolsWindow')?.remove();render();}));}
function missedPayload(session,includeSkipped=true){const data={format:'vertex-missed-questions',version:1,testId:session.parentTestId||'test-1',testName:testName(session.parentTestId),attemptName:session.name,exportedAt:new Date().toISOString(),questions:session.questions.filter(q=>!correct(q,session.answers[q.id])&&(includeSkipped||String(session.answers[q.id]??'').trim()!=='')).map(q=>({question:structuredClone(q),studentAnswer:session.answers[q.id]??null,status:String(session.answers[q.id]??'').trim()===''?'unanswered':'incorrect',correctAnswer:q.choices?q.choices[Number(q.answer)]:q.answer,solutionOpened:!!session.assisted?.[q.id]}))};data.studyGuide={title:data.testName+' — Missed-question study guide',sections:[...new Set(data.questions.map(x=>x.question.skill))].map(skill=>{const q=data.questions.find(x=>x.question.skill===skill).question,advice=skillAdvice(skill,q.domain);return{skill,review:advice[0],commonTrap:advice[1],checklist:['Solve the missed question again without help.','Explain each step, then generate a fresh recovery set.']};})};return data;}
function missedMarkdown(data){const safe=t=>String(t??'').replace(/</g,'&lt;').replace(/>/g,'&gt;');const text=['# '+safe(data.testName)+' — Missed questions','',safe(data.attemptName),'','## Study guide','',...(data.studyGuide?.sections||[]).flatMap(section=>['### '+safe(section.skill),'','Review: '+safe(section.review),'','Common trap: '+safe(section.commonTrap),'',...section.checklist.map(x=>'- [ ] '+safe(x)),'']),'## Missed questions','',...data.questions.flatMap((item,i)=>['## '+(i+1)+'. '+safe(item.question.skill),'',safe(item.question.prompt),'',...(item.question.choices||[]).map((x,j)=>String.fromCharCode(65+j)+'. '+safe(x)),'','- Status: '+item.status,'- Your answer: '+safe(item.question.choices&&item.studentAnswer!==null?item.question.choices[Number(item.studentAnswer)]:item.studentAnswer??'Unanswered'),'- Correct answer: '+safe(item.correctAnswer),'','### Solution','',...item.question.steps.map((step,j)=>(j+1)+'. '+safe(step)),''])].join('\n');const json=JSON.stringify(data,null,2),fence='`'.repeat(Math.max(3,...(json.match(/`+/g)||[]).map(x=>x.length+1)));return text+'\n## Import data\n\nThis block preserves plots, tables and question details for later import.\n\n<!-- VERTEX_MISSED_JSON -->\n'+fence+'json\n'+json+'\n'+fence+'\n';}
function missedExportWindow(session){openWindow('missedExportWindow','Save review pack','<p>Includes missed questions, your answers, worked solutions, and the study guide.</p><label><input id="includeSkipped" type="checkbox" checked> Include unanswered questions</label><div class="row" style="margin-top:18px"><button id="missedJSON" class="primary">Save JSON</button><button id="missedMD">Markdown</button><button id="missedHTML">Printable HTML</button></div><p id="missedExportStatus" class="mini" role="status"></p>');const write=type=>{const data=missedPayload(session,$('includeSkipped').checked);if(!data.questions.length){$('missedExportStatus').textContent='No missed questions match this selection.';return;}const name='Test1_Review_Pack_'+Date.now();download(name+(type==='json'?'.json':type==='html'?'.html':'.md'),type==='json'?JSON.stringify(data,null,2):type==='html'?studyGuideDocument(data):missedMarkdown(data),type==='json'?'application/json':type==='html'?'text/html':'text/markdown;charset=utf-8');$('missedExportStatus').textContent=data.questions.length+' questions and study guide exported.';};bind('missedJSON',()=>write('json'));bind('missedMD',()=>write('md'));bind('missedHTML',()=>write('html'));}
function parseMissedFile(text){let data;try{const marker=text.match(/<!-- VERTEX_MISSED_JSON -->\s*(`{3,})json\n([\s\S]*?)\n\1/);const embedded=text.match(/<script type="application\/json" id="vertex-review-data">([\s\S]*?)<\/script>/);data=JSON.parse(marker?marker[2]:embedded?embedded[1]:text);}catch{throw Error('Use a missed-question JSON or Markdown file exported by Vertex.');}if(data?.format!=='vertex-missed-questions'||data.version!==1||!Array.isArray(data.questions)||!data.questions.length||data.questions.length>500)throw Error('This is not a supported missed-question export.');if(data.testId!=='test-1')throw Error('This file belongs to another test. Import it in that test’s page.');for(const item of data.questions){const q=item.question;if(!q||typeof q.prompt!=='string'||q.prompt.length>10000||typeof q.skill!=='string'||!q.skill.length||q.skill.length>150||!['Algebra','Advanced','Data','Geometry'].includes(q.domain)||!Array.isArray(q.steps)||q.steps.some(t=>typeof t!=='string'))throw Error('The file contains an invalid question.');if(q.choices&&(!Array.isArray(q.choices)||q.choices.length!==4||q.choices.some(x=>typeof x!=='string')||!Number.isInteger(Number(q.answer))||Number(q.answer)<0||Number(q.answer)>3))throw Error('Invalid answer choices.');const v=q.visual;if(v){if(v.type==='table'){if(!Array.isArray(v.headers)||v.headers.length>10||v.headers.some(x=>typeof x!=='string')||!Array.isArray(v.rows)||v.rows.length>100||v.rows.some(r=>!Array.isArray(r)||r.length!==v.headers.length||r.some(x=>!['string','number'].includes(typeof x))))throw Error('Invalid table.');}else if(['curve','scatter'].includes(v.type)){if(!Array.isArray(v.range)||v.range.length!==4||v.range.some(x=>!Number.isFinite(x)||Math.abs(x)>1e6)||v.range[1]-v.range[0]<1e-6||v.range[3]-v.range[2]<1e-6)throw Error('Invalid graph range.');if(v.type==='curve'&&(!Array.isArray(v.coeff)||v.coeff.length>8||v.coeff.some(x=>!Number.isFinite(x))))throw Error('Invalid curve.');if(v.type==='scatter'&&(!Array.isArray(v.points)||v.points.length>500||v.points.some(p=>!Array.isArray(p)||p.length!==2||p.some(x=>!Number.isFinite(x)))))throw Error('Invalid scatterplot.');}else if(['triangle','rightTriangle'].includes(v.type)){if(!Array.isArray(v.labels)||v.labels.length!==3)throw Error('Invalid triangle labels.');}else if(v.type!=='parallel')throw Error('Unsupported diagram.');}}return data;}
function missedImportWindow(){if(db.session.timed&&!db.session.complete){toast('Import practice after finishing the timed test.');return;}openWindow('missedImportWindow','Practice from saved mistakes','<label for="missedFile">Missed-question file</label><input id="missedFile" type="file" accept=".json,.md,.html,application/json,text/markdown,text/html"><p class="mini muted">Choose a Vertex JSON, Markdown, or HTML review pack. Your original workspace stays open.</p><p id="missedImportStatus" class="mini" role="status"></p><div id="missedImportControls"></div>');bind('missedFile',async e=>{const file=e.target.files?.[0];if(!file)return;try{if(file.size>2*1024*1024)throw Error('Choose a file smaller than 2 MB.');const data=parseMissedFile(await file.text());if(!$('missedImportControls'))return;const sources=data.questions.map(x=>({skill:x.question.skill,domain:x.question.domain,parentTestId:data.testId}));$('missedImportStatus').textContent=sources.length+' missed questions · '+new Set(sources.map(x=>x.skill)).size+' skills. New questions will target these skills.';$('missedImportControls').innerHTML='<button id="importedGuide" class="small" style="margin-bottom:12px">Build study guide</button>'+aiControls('importedMissed','Generate recovery practice');bind('importedGuide',()=>studyGuideWindow(data));bindAIControls('importedMissed',sources,true,data.testId);}catch(error){if($('missedImportStatus')){$('missedImportStatus').textContent=error.message;$('missedImportControls').innerHTML='';}}},'change');}
function skillAdvice(skill,domain){const name=skill.toLowerCase();if(/percent|growth|exponential/.test(name))return['Translate percentages into multipliers: increase by p% uses 1 + p/100; decrease uses 1 − p/100. Identify the starting value and count growth periods.','Do not confuse the percent change with the multiplier or apply it to the wrong starting quantity.'];if(/system|substitution|perpendicular|dependent/.test(name))return['Use substitution or elimination. Write a line in slope-intercept form when comparing slopes, and check a solution in both original equations.','Parallel lines have equal slopes; perpendicular nonvertical lines have slopes whose product is −1.'];if(/quadratic|roots|zeros|discriminant|minimum|extrema/.test(name))return['Choose factoring for roots, vertex form for an extremum, or the discriminant b² − 4ac for the number of real roots. Check any stated sign restriction.','The vertex x-coordinate is not the minimum or maximum output. Report the quantity the question asks for.'];if(/circle|area|volume|triangle|pythagorean|radian|angle|geometry/.test(name))return['Label the known dimensions. Choose the relevant geometry relationship, keep units consistent, and distinguish radius from diameter.','Length scales by k, area by k², and volume by k³. Round only at the final step.'];if(/mean|frequency|probability|scatter|statistics/.test(name))return['Identify what each value or frequency represents. Use the full sample size for probabilities and a weighted total for a frequency-table mean.','A zero-frequency row is not an observed value. A correlation alone does not establish causation.'];if(/unit|rate/.test(name))return['Write the rate as a fraction with units. Multiply by conversion factors so unwanted units cancel.','Square conversion factors for area and cube them for volume.'];if(/budget|inequal|constraint/.test(name))return['Separate the fixed charge from the per-unit charge, then write the budget inequality. Enforce whole-number restrictions if needed.','At most means ≤. For a maximum affordable whole number, round down rather than to the nearest integer.'];if(/factor|polynomial|exponent|radical/.test(name))return['Distribute signs carefully, combine only like terms, and track exponent rules. Substitute a simple value to check equivalent expressions.','A subtraction before parentheses changes every sign. Check domains and extraneous roots when squaring.'];return domain==='Algebra'?['Define the variable, translate the relationship into an equation, and isolate the requested quantity. Substitute the result back to check it.','Keep units and signs attached to each term; answer the requested expression, not merely the value of the variable.']:['Identify the given information and the target quantity. Follow the worked example, then solve the same question again without looking.','Check restrictions, units, and whether the answer is reasonable before finishing.'];}
function guideBody(data){const groups=new Map();for(const item of data.questions){const key=item.question.skill;if(!groups.has(key))groups.set(key,[]);groups.get(key).push(item);}return '<h1>'+esc(data.testName)+' · Review study guide</h1><p>'+data.questions.length+' missed or unanswered questions · '+groups.size+' skills</p><p>Work through each example, cover the solution, and solve it again. Mark a skill ready when you can explain the steps without help.</p>'+[...groups].sort((a,b)=>b[1].length-a[1].length).map(([skill,items])=>{const saved=data.studyGuide?.sections?.find(x=>x.skill===skill),advice=saved?[saved.review,saved.commonTrap]:skillAdvice(skill,items[0].question.domain);return '<section class="guide-section"><h2>'+esc(skill)+' <small>('+items.length+')</small></h2><p><strong>Review:</strong> '+esc(advice[0])+'</p><p><strong>Common trap:</strong> '+esc(advice[1])+'</p>'+items.map((item,i)=>{const q=item.question,answer=q.choices&&item.studentAnswer!==null?q.choices[Number(item.studentAnswer)]:item.studentAnswer??'Unanswered';return '<article class="guide-example"><h3>Worked example '+(i+1)+'</h3><p>'+rich(q.prompt)+'</p>'+visual(q.visual)+(q.choices?'<ol type="A">'+q.choices.map(x=>'<li>'+rich(x)+'</li>').join('')+'</ol>':'')+'<p><strong>Your answer:</strong> '+rich(answer)+'<br><strong>Correct answer:</strong> '+rich(item.correctAnswer)+'</p><ol>'+q.steps.map(step=>'<li>'+rich(step)+'</li>').join('')+'</ol><p class="guide-check">□ I can solve this again without the solution.<br>□ I can explain why my previous approach did not work.</p>'+(q.source==='Gemini'?'<p class="mini muted">AI-generated example: verify any result that appears inconsistent.</p>':'')+'</article>';}).join('')+'</section>';}).join('')+'<h2>Next practice</h2><p>Import the saved missed-question JSON or Markdown file, choose a level and quantity, and generate a new recovery set. Start with Easy for an unfamiliar skill, then use Hard or Harder once the worked examples are clear.</p>';}
function studyGuideDocument(data){return '<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Test 1 · Missed-question study guide</title><style>body{font:17px/1.65 system-ui,sans-serif;max-width:850px;margin:32px auto;padding:0 20px;color:#163047}h1{font-size:28px}h2{font-size:23px}.guide-section{border-top:2px solid #cee0da;margin-top:28px;padding-top:16px}.guide-example{margin:20px 0;padding:18px;border:1px solid #dce5eb;border-radius:10px;break-inside:avoid}.guide-check{background:#eff7f3;padding:12px}.chart{max-width:420px;width:100%;height:auto}.data-table{border-collapse:collapse}.data-table td,.data-table th{border:1px solid #cbd8e0;padding:8px 15px}.mini{font-size:13px}.muted{color:#617385}li{margin:9px 0}button{padding:10px 16px;border:0;border-radius:7px;background:#086c59;color:white}@media print{button{display:none}body{margin:0;max-width:none}h2,h3{break-after:avoid}}</style><button onclick="window.print()">Print / Save as PDF</button>'+guideBody(data)+'<script type="application/json" id="vertex-review-data">'+JSON.stringify(data).replace(/</g,'\\u003c')+'</scr'+'ipt></html>';}

// Nonmodal movable windows; pointer capture supports mouse and touch, arrows move the title bar.
function openWindow(id, title, html, onClose = null) {
    let prev = document.activeElement;
    if ($(id)) {
        $(id).style.zIndex = ++z;
        return $(id);
    }
    let w = document.createElement('section');
    w.id = id;
    w.className = 'window';
    w.style.zIndex = ++z;
    w.setAttribute('role', 'dialog');
    w.setAttribute('aria-label', title);
    w.innerHTML = '<div class="window-bar" tabindex="0" aria-label="Drag window; arrow keys move it"><span>' + esc(title) + '</span><button aria-label="Close window">×</button></div><div class="window-body">' + html + '</div>';
    $('windows').append(w);
    w.style.top = Math.min(100 + (z % 4) * 16, Math.max(12, window.innerHeight - w.offsetHeight - 12)) + 'px';
    let close = () => {
        if (id === 'genWindow' && genController) {
            genController.abort();
        }
        w.remove();
        if (onClose) onClose();
        if (prev?.isConnected) prev.focus();
    };
    w.querySelector('.window-bar button').onclick = close;
    w.addEventListener('pointerdown', () => w.style.zIndex = ++z);
    w.addEventListener('keydown', e => {
        if (e.key === 'Escape') {
            e.stopPropagation();
            close();
        }
    });
    let bar = w.firstElementChild,
        drag = null;

    function move(x, y) {
        w.style.left = Math.max(0, Math.min(innerWidth - w.offsetWidth, x)) + 'px';
        w.style.top = Math.max(0, Math.min(innerHeight - 55, y)) + 'px';
    }
    bar.onpointerdown = e => {
        if (e.target.closest('button')) return;
        let r = w.getBoundingClientRect();
        drag = {
            x: e.clientX - r.left,
            y: e.clientY - r.top
        };
        bar.setPointerCapture(e.pointerId);
    };
    bar.onpointermove = e => {
        if (drag) move(e.clientX - drag.x, e.clientY - drag.y);
    };
    bar.onpointerup = () => drag = null;
    bar.onpointercancel = () => drag = null;
    bar.onkeydown = e => {
        if (['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown'].includes(e.key)) {
            e.preventDefault();
            let r = w.getBoundingClientRect();
            move(r.left + (e.key === 'ArrowRight' ? 15 : e.key === 'ArrowLeft' ? -15 : 0), r.top + (e.key === 'ArrowDown' ? 15 : e.key === 'ArrowUp' ? -15 : 0));
        }
    };
    bar.focus();
    return w;
}

function popupSession(set) {
    if (!set.practice) set.practice = makeSession(set.questions, set.name, false, set.parentTestId);
    return set.practice;
}

function finishPopupSession(set) {
    const p = popupSession(set);
    if (p.complete) return;
    p.complete = true;
    p.finished = Date.now();
    db.history.unshift(structuredClone(p));
    save();
}

function closeAIPractice() {
    save();
    activePopupSet = null;
    popupShowSolution = false;
    lastTick = Date.now();
    $('aiPracticeWindow')?.remove();
    if (view === 'library') {
        const y = window.scrollY;
        renderLibrary();
        window.scrollTo(0, y);
    }
}

function openAIPractice(set) {
    if (activePopupSet) closeAIPractice();
    activePopupSet = set;
    popupShowSolution = false;
    popupSession(set);
    save();
    lastTick = Date.now();
    const w = openWindow('aiPracticeWindow', testName(set.parentTestId) + ' · ' + set.name, '', closeAIPractice);
    w.style.width = 'min(860px, calc(100vw - 24px))';
    w.style.left = Math.max(12, (innerWidth - Math.min(860, innerWidth - 24)) / 2) + 'px';
    w.style.top = '24px';
    w.style.height = 'calc(100dvh - 48px)';
    renderAIPractice();
}

function renderAIPractice() {
    const set = activePopupSet,
        w = $('aiPracticeWindow');
    if (!set || !w) return;
    const p = popupSession(set),
        body = w.querySelector('.window-body'),
        q = p.questions[p.index];
    body.scrollTop = 0;
    const done = p.questions.filter(x => correct(x, p.answers[x.id])).length;
    if (p.complete) {
        body.innerHTML = '<div class="eyebrow">Practice complete</div><h2>' + done + ' of ' + p.questions.length + ' correct</h2><p class="muted">Your report is saved in My progress. Your original workspace is still open behind this window.</p><div class="row"><button id="popupClose" class="primary">Return to workspace</button><button id="popupRetry">Start a fresh attempt</button><button id="popupExport">Download solutions</button></div><h3 style="margin-top:24px">Review your answers</h3>' + p.questions.map((x, i) => '<details class="popup-review"><summary>Question ' + (i + 1) + ' · ' + esc(x.skill) + ' · ' + (correct(x, p.answers[x.id]) ? 'Correct' : 'To revisit') + '</summary><p>' + rich(x.prompt) + '</p>' + visual(x.visual) + solutionHTML(x, p.answers[x.id]) + '</details>').join('');
        bind('popupClose', closeAIPractice);
        bind('popupRetry', () => {
            set.practice = makeSession(set.questions, set.name, false, set.parentTestId);
            popupShowSolution = false;
            save();
            renderAIPractice();
        });
        bind('popupExport', () => exportSolutions(p));
        return;
    }
    body.innerHTML = '<div class="row between"><span class="pill green">' + esc(q.level) + ' · ' + (p.index + 1) + ' / ' + p.questions.length + '</span><button id="popupClose" class="small">Save & return to workspace</button></div><p class="mini muted">Saved in Test library · Your main question and answers stay in place.</p><div class="row" style="margin-bottom:18px">' + p.questions.map((x, i) => '<button class="small ' + (i === p.index ? 'dark' : '') + '" data-popup-q="' + i + '" aria-label="Question ' + (i + 1) + '" ' + (i === p.index ? 'aria-current="step"' : '') + '>' + (i + 1) + (String(p.answers[x.id] ?? '').trim() ? ' ✓' : '') + '</button>').join('') + '</div><div class="prompt">' + rich(q.prompt) + '</div>' + visual(q.visual) + '<div style="margin-top:20px"><label for="popupAnswer">Your answer</label>' + (q.choices ? q.choices.map((c, i) => '<button data-popup-answer="' + i + '" class="full ' + (String(p.answers[q.id]) === String(i) ? 'dark' : '') + '" style="margin-bottom:8px">' + String.fromCharCode(65 + i) + '. ' + rich(c) + '</button>').join('') : '<input id="popupAnswer" class="num-input" autocomplete="off" placeholder="Number, decimal, or fraction" value="' + esc(p.answers[q.id] ?? '') + '"><p id="popupInputError" class="mini error"></p>') + '</div><div class="row" style="margin-top:16px"><button id="popupCheck" class="dark">' + (popupShowSolution ? 'Hide solution' : 'Check & see solution') + '</button><button id="popupCalc" class="small">Calculator</button><button id="popupFinish" class="small">Finish & report</button></div><div id="popupSolution">' + (popupShowSolution ? solutionHTML(q, p.answers[q.id]) : '') + '</div><div class="row between" style="margin-top:24px"><button id="popupPrevious" ' + (p.index === 0 ? 'disabled' : '') + '>← Previous</button><button id="popupNext" class="primary">' + (p.index === p.questions.length - 1 ? 'Finish & report' : 'Next question →') + '</button></div>';
    const go = i => {
        p.index = i;
        popupShowSolution = false;
        save();
        renderAIPractice();
    };
    const submit = () => {
        const blanks = p.questions.filter(x => !String(p.answers[x.id] ?? '').trim()).length;
        confirmWindow('Finish this window practice?', blanks ? blanks + ' unanswered questions will be included in the report.' : 'Save your practice report?', () => {
            finishPopupSession(set);
            if (activePopupSet === set) renderAIPractice();
        });
    };
    body.querySelectorAll('[data-popup-q]').forEach(b => b.onclick = () => go(Number(b.dataset.popupQ)));
    body.querySelectorAll('[data-popup-answer]').forEach(b => b.onclick = () => {
        p.answers[q.id] = b.dataset.popupAnswer;
        popupShowSolution = false;
        save();
        renderAIPractice();
    });
    bind('popupAnswer', e => {
        p.answers[q.id] = e.target.value;
        popupShowSolution = false;
        $('popupSolution').innerHTML = '';
        $('popupCheck').textContent = 'Check & see solution';
        $('popupInputError').textContent = e.target.value.trim() && !Number.isFinite(numeric(e.target.value)) ? 'Enter a finite number or fraction.' : '';
        save();
    }, 'input');
    bind('popupClose', closeAIPractice);
    bind('popupPrevious', () => go(p.index - 1));
    bind('popupNext', () => p.index === p.questions.length - 1 ? submit() : go(p.index + 1));
    bind('popupFinish', submit);
    bind('popupCalc', calculatorWindow);
    bind('popupCheck', () => {
        popupShowSolution = !popupShowSolution;
        if (popupShowSolution) p.assisted[q.id] = true;
        save();
        renderAIPractice();
    });
}

async function runGeneration(sourceQuestions, recovery, parentTestId, capturedLevel, n) {
    if (genController) return toast('A generation is already running.');

        settingsWindow();
        setGenStatus('Connect your Google AI Studio key first.');
        return;
    }

    const focus = [...new Set(sourceQuestions.map(q => q.skill))];
    if (!focus.length) return setGenStatus('No source questions to model on.');
    workingModel = '';

    genController = new AbortController();
    const ctrl = genController;
    setGenStatus('Starting…');
    try {
        for (let start = 0; start < n; start += 5) {
            let count = Math.min(5, n - start),
                batchSkills = Array.from({
                    length: count
                }, (_, i) => focus[(start + i) % focus.length]);
            setGenStatus('Writing questions ' + (start + 1) + '–' + (start + count) + ' of ' + n + '…');
            let difficulty = {
                Easy: 'Direct one- or two-step reasoning with transparent representations.',
                Hard: 'Multi-step SAT reasoning; interpret a model or connect representations.',
                Harder: 'Challenging SAT algebra or geometry reasoning with parameters, constraints, reverse reasoning, or multiple representations. Stay within SAT scope; no calculus.'
            } [capturedLevel];
            let prompt = 'Create exactly ' + count + ' completely original SAT-style math questions. Do not reproduce or paraphrase any published test item. Assign these skills in order: ' + JSON.stringify(batchSkills) + '. Difficulty: ' + capturedLevel + '. ' + difficulty + ' Use diverse scenarios and numbers. Provide at least 3 concise worked solution steps. Use numerical student-response answers only, as plain decimal or fraction strings. Ask for a unique numerical value; no ambiguous multiple roots. All geometry dimensions and statistical values must be supplied. Use inline $LaTeX$ for math, using only frac, sqrt, pi, le, ge, times, cdot, approx and exponents; no align or environments. Include visual data if essential to solve the question; for graph-reading skills include curve or scatter, and table skills include table. Visual types: none, table, curve, scatter. For curve use descending polynomial coefficients; for scatter use [x,y] points. Provide an increasing range [xmin,xmax,ymin,ymax]. Tables require headers and rows of strings. Never include an answer or solution in the visual labels. Set tolerance=0.0001 for exact numeric answers, or half the smallest stated rounding unit for approximate answers. Specify required rounding in prompt when needed. Domains must be Algebra, Advanced, Data, or Geometry. Previously generated prompts to avoid: ' + JSON.stringify(questions.map(q => q.prompt)) + '. Return JSON only.';
            let data = await gemini(prompt, questionSchema, ctrl.signal);
            let batch = validateQuestions(data, count, batchSkills, capturedLevel);
            setGenStatus('Checking answers and diagrams for questions ' + (start + 1) + '–' + (start + count) + '…');
            let review = await gemini('Independently solve each question below without trusting its supplied answer. Verify there is exactly one numerical answer, the steps agree, and visual data match the prompt. Return valid true only if each entire question is correct and unambiguous. For each item include id (zero-based index), valid, computedAnswer as a numeric decimal or fraction string, reason. For a failed item do not repair silently. Questions: ' + JSON.stringify(batch), reviewSchema, ctrl.signal);
            if (!review || !Array.isArray(review.reviews) || review.reviews.length !== count) throw Error('The answer check was incomplete. No set was saved; please try again.');
            let seen = new Set();
            review.reviews.forEach(r => {
                if (!Number.isInteger(r.id) || r.id < 0 || r.id >= count || seen.has(r.id)) throw Error('The answer check returned invalid question IDs. Try again.');
                seen.add(r.id);
                if (r.valid !== true || !correct(batch[r.id], r.computedAnswer)) throw Error('A generated question failed the independent answer check. No set was saved. Try generating again.');
            });

        }
        if (ctrl.signal.aborted) throw new DOMException('Cancelled', 'AbortError');

        if (new Set(prompts).size !== questions.length) throw Error('Duplicate questions were detected. No set was saved. Please try again.');
        let name = (recovery ? 'Recovery' : 'AI Practice') + ' · ' + (focus.length === 1 ? focus[0] : 'Mixed skills');
        let set = {
            id: Date.now().toString(),
            name,
            level: capturedLevel,
            questions: questions.map(q => ({
                ...q,
                parentTestId
            })),
            parentTestId,
            created: Date.now()
        };
        db.sets.unshift(set);
        save();
        genController = null;
        setGenStatus('');
        openAIPractice(set);
        toast('Saved under ' + testName(parentTestId) + ' in your library.');
    } catch (e) {
        genController = null;
        setGenStatus(e.name === 'AbortError' ? 'Cancelled. No partial set was saved.' : e.name === 'TimeoutError' ? 'Google took too long to respond. Try a smaller set.' : e.message);
    } finally {
        if (genController === ctrl) genController = null;
        setGenStatus(genStatus);
    }
}

function abortableWait(ms, signal) {
    return new Promise((resolve, reject) => {
        if (signal.aborted) {
            reject(new DOMException('Cancelled', 'AbortError'));
            return;
        }
        let timer = setTimeout(() => {
            signal.removeEventListener('abort', cancel);
            resolve();
        }, ms);

        function cancel() {
            clearTimeout(timer);
            signal.removeEventListener('abort', cancel);
            reject(new DOMException('Cancelled', 'AbortError'));
        }
        signal.addEventListener('abort', cancel, {
            once: true
        });
    });
}
async function generationWait(ms, signal, message) {
    const until = Date.now() + ms;
    while (Date.now() < until) {
        setGenStatus(message + ' ' + Math.ceil((until - Date.now()) / 1000) + 's…');
        await abortableWait(Math.min(1000, until - Date.now()), signal);
    }
}

function retryInfo(response, data) {
    const e = data?.error || {},
        details = Array.isArray(e.details) ? e.details : [];
    let delay = 0;
    const header = response.headers?.get('Retry-After');
    if (header) {
        delay = /^\d+(\.\d+)?$/.test(header) ? Number(header) * 1000 : Math.max(0, Date.parse(header) - Date.now());
    }
    for (const d of details) {
        if (typeof d.retryDelay === 'string' && /^\d+(\.\d+)?s$/.test(d.retryDelay)) delay = Math.max(delay || 0, parseFloat(d.retryDelay) * 1000);
    }
    const quota = JSON.stringify(details) + ' ' + String(e.message || '');
    const hardQuota = response.status === 429 && (/per[ _]?day|daily|limit:\s*0\b/i.test(quota));
    return {
        delay: Number.isFinite(delay) ? delay : 0,
        hardQuota
    };
}
async function gemini(prompt,schema,signal){const settings=hubRunSettings||VertexHub.load();const slots=hubWorkingSlot==='key2'?['key2']:['key1','key2'];for(let i=0;i<slots.length;i++){const slot=slots[i],key=settings[slot];if(!key)continue;apiKey=key;hubWorkingSlot=slot;updateAIReady();try{return await geminiOne(prompt,schema,signal,settings.model||model);}catch(e){const backup=slot==='key1'&&settings.key2&&settings.key2!==settings.key1;if(signal.aborted||e.longWait||!backup||![401,403,404,408,500,502,503,504].includes(e.status))throw e;await generationWait(15000,signal,'API 1 failed. Switching to saved API 2 in');}}throw Error('No API key is configured. Open AI setup on the index page.');}

async function geminiOne(prompt, schema, signal, selectedModel, maxAttempts = 2) {
    const key = apiKey,
        phase = genStatus || 'Generating questions…';
    const body = JSON.stringify({
        contents: [{
            parts: [{
                text: prompt
            }]
        }],
        generationConfig: {
            responseMimeType: 'application/json',
            responseJsonSchema: schema
        }
    });
    for (let attempt = 0; attempt < maxAttempts; attempt++) {
        const pace = Math.max(0, 15000 - (Date.now() - lastAIRequest));
        if (pace) await generationWait(pace, signal, 'Spacing requests for limited quotas. Continuing in');
        if (signal.aborted) throw new DOMException('Cancelled', 'AbortError');
        setGenStatus(phase + (attempt ? ' Retry ' + attempt + ' of ' + (maxAttempts - 1) + '.' : ''));
        const controller = new AbortController(),
            abort = () => controller.abort();
        signal.addEventListener('abort', abort, {
            once: true
        });
        const timer = setTimeout(() => controller.abort(), 120000);
        let response, data;
        lastAIRequest = Date.now();
        try {
            response = await fetch('https://generativelanguage.googleapis.com/v1beta/models/' + encodeURIComponent(selectedModel) + ':generateContent', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'x-goog-api-key': key
                },
                body,
                signal: controller.signal
            });
            try {
                data = await response.json();
            } catch {
                data = null;
            }
        } catch (e) {
            if (signal.aborted) throw new DOMException('Cancelled', 'AbortError');
            const problem=new Error(controller.signal.aborted?'Google timed out.':'Could not reach Google.');problem.status=controller.signal.aborted?408:503;throw problem;
        } finally {
            clearTimeout(timer);
            signal.removeEventListener('abort', abort);
        }
        aiDiagnostics.push({
            time: new Date().toISOString(),
            model: selectedModel,
            apiSlot:hubWorkingSlot,
            status: response.status,
            message: response.ok ? 'Request succeeded' : safeGoogleMessage(data, key)
        });
        aiDiagnostics = aiDiagnostics.slice(-20);
        if (!response.ok) {
            const info = retryInfo(response, data),
                transient = [408, 429, 500, 502, 503, 504].includes(response.status);
            if (!transient || info.hardQuota || attempt === maxAttempts - 1 || info.delay > 60000) {
                const error = new Error('[' + selectedModel + '] ' + apiError(response.status) + (info.delay > 60000 ? ' Wait at least ' + Math.ceil(info.delay / 1000) + ' seconds.' : '') + ' ' + safeGoogleMessage(data, key));
                error.status = response.status;
                error.longWait = info.delay > 60000;
                throw error;
            };
            const delay = Math.max(info.delay, 2000 * 2 ** attempt + Math.random() * 1000);
            await generationWait(delay, signal, (response.status === 429 ? 'Google rate limit reached.' : 'Google temporarily unavailable (' + response.status + ').') + ' Retry ' + (attempt + 1) + '/' + (maxAttempts - 1) + ' in');
            continue;
        }
        if (data?.promptFeedback?.blockReason) throw Error('Google blocked this generation. Try a different focus.');
        let candidate = data?.candidates?.[0];
        if (candidate?.finishReason !== 'STOP') throw Error('Google returned an incomplete response. Try fewer questions.');
        let raw = candidate?.content?.parts?.filter(p => !p.thought && p.text).map(p => p.text).join('');
        if (!raw) throw Error('Google returned no question data.');
        try {
            return JSON.parse(raw);
        } catch {
            throw Error('Google returned unreadable question data. Try again.');
        }
    }
}

function validateQuestions(data, n, skills, level) {
    if (!data || !Array.isArray(data.questions) || data.questions.length !== n) throw Error('Google returned an unexpected question count. No set saved.');
    return data.questions.map((q, i) => {
        if (typeof q.prompt !== 'string' || q.prompt.length < 15 || q.prompt.length > 4000 || !Number.isFinite(numeric(q.answer)) || !Array.isArray(q.steps) || q.steps.length < 2 || q.steps.length > 12 || q.steps.some(s => typeof s !== 'string' || s.length > 3000) || !['Algebra', 'Advanced', 'Data', 'Geometry'].includes(q.domain) || q.skill !== skills[i] || !Number.isFinite(q.tolerance) || q.tolerance < 0 || q.tolerance > 0.5) throw Error('A question failed the content validation. Try generating again.');
        let v = q.visual;
        if (v && v.type !== 'none') {
            if (v.type === 'table') {
                if (!Array.isArray(v.headers) || v.headers.length < 2 || v.headers.length > 6 || !Array.isArray(v.rows) || v.rows.length < 1 || v.rows.length > 25 || v.rows.some(r => !Array.isArray(r) || r.length !== v.headers.length || r.some(x => typeof x !== 'string' || x.length > 100))) throw Error('A generated table was invalid. Try again.');
            } else if (v.type === 'curve' || v.type === 'scatter') {
                if (!Array.isArray(v.range) || v.range.length !== 4 || v.range.some(x => !Number.isFinite(x) || Math.abs(x) > 1e6) || v.range[0] >= v.range[1] || v.range[2] >= v.range[3]) throw Error('A graph had invalid bounds.');
                if (v.type === 'curve' && (!Array.isArray(v.coeff) || v.coeff.length < 2 || v.coeff.length > 5 || v.coeff.some(x => !Number.isFinite(x)))) throw Error('A graph had invalid polynomial data.');
                if (v.type === 'scatter' && (!Array.isArray(v.points) || v.points.length < 2 || v.points.length > 100 || v.points.some(p => !Array.isArray(p) || p.length !== 2 || p.some(x => !Number.isFinite(x))))) throw Error('A scatterplot had invalid points.');
            } else throw Error('Unsupported diagram type. Try again.');
        }
        return {
            ...q,
            id: 'ai-' + Date.now() + '-' + i + '-' + Math.random().toString(36).slice(2, 8),
            choices: null,
            level,
            source: 'Gemini',
            modelUsed: workingModel || model,
            visual: v?.type === 'none' ? null : v
        };
    });
}
