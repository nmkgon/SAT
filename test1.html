    };
    const choiceClass = j => {

00%">Choose another set</button></aside><section><article class="card"><div class="question-top"><div class="row"><span class="pill">${limited?s.index-lo+1:s.index+1}</span><span class="mini">${limited?'Math':esc(q.skill)}</span>${!limited&&q.referenceModule?'<span class="mini muted">Module '+q.referenceModule+' · Q'+q.referenceQuestion+'</span>':''}${!limited?'<span class="pill '+(q.level==='Easy'?'green':'gold')+'">'+esc(q.level)+'</span>':''}<span class="mini muted qtime" title="Time on this question">⏱ <span id="qTime">${fmtTime(s.times[q.id])}</span></span></div><div class="tools"><button id="flagBtn" class="small" aria-pressed="${!!s.flags[q.id]}">${s.flags[q.id]?'★ Bookmarked':'☆ Bookmark'}</button><button id="calcBtn" class="small">Calculator</button><button id="refBtn" class="small">Reference</button></div></div><div class="question-body"><div><div class="prompt">${rich(q.prompt)}</div>${visual(q.visual)}${['Gemini','LM Studio'].includes(q.source)?'<span class="pill">AI-generated · review if uncertain</span>':''}</div><div class="answer-col"><label>${q.choices?'Choose one answer':'Enter your answer'}</label>${choices.map((c,j)=>`<div class="choice ${choiceClass(j)}"><button data-answer="${j}" aria-pressed="${s.answers[q.id]===String(j)}"><span class="letter">${'ABCD'[j]}</span><span>${rich(c)}</span></button><button class="eliminate" data-eliminate="${j}" aria-label="${elim.includes(j)?'Restore':'Eliminate'} choice ${'ABCD'[j]}">⊘</button></div>`).join('')}${!q.choices?`<input class="num-input ${reveal&&has?(ok?'ok':'bad'):''}" id="response" autocomplete="off" placeholder="e.g. 3/4 or 0.75" aria-label="Numeric answer" value="${esc(s.answers[q.id]||'')}"><p class="mini muted">Use a number, decimal, or fraction.</p><p class="mini error" id="inputError"></p>`:''}<p class="mini instant-fb ${reveal&&has?(ok?'good':'bad'):'hide'}" id="instantFb" aria-live="polite">${reveal&&has?(ok?'✓ Correct':'✗ Not yet — try again or open the solution'):''}</p><div class="row" style="margin-top:8px">${has?'<button class="quiet small" id="clearAnswer">Clear answer</button>':''}${!limited&&q.steps?.length>1?'<button class="quiet small" id="hintBtn">'+(showHint?'Hide hint':'💡 Hint')+'</button>':''}</div>${showHint&&!limited?'<div class="hint"><strong>Hint</strong> '+rich(q.steps[0])+'</div>':''}${!limited?'<div style="margin-top:20px"><button class="dark" id="checkBtn">'+(showSolution?'Hide solution':'Check & see solution')+'</button></div>':''}</div></div>${showSolution&&!limited?solutionHTML(q,s.answers[q.id]):''}<div class="question-bottom"><button id="prevBtn" ${s.index===lo?'disabled':''}>← Previous</button><span class="mini muted">${limited?s.index-lo+1:s.index+1} of ${limited?hi-lo:s.questions.length}</span><button id="nextBtn" class="primary">${s.index===hi-1?(limited&&s.module===0?'Submit module':'Finish & report'):'Next question →'}</button></div></article>${!limited?'<div class="practice-banner"><div><strong>Generate similar questions</strong><p>New '+esc(q.skill)+' problems with AI · opens in a practice window</p></div>'+aiControls('similar','Generate')+'</div>':''}</section></div><p class="footer-note">Original practice content. Not affiliated with or endorsed by College Board. SAT is a registered trademark of College Board.</p>`;
    $('app').querySelectorAll('[data-q]').forEach(b => b.onclick = () => go(Number(b.dataset.q)));
    $('app').querySelectorAll('[data-gf]').forEach(b => b.onclick = () => {

        render();
    });

    $('app').querySelectorAll('[data-eliminate]').forEach(b => b.onclick = () => {
        let n = Number(b.dataset.eliminate),
            a = s.eliminated[q.id] || [];
        s.eliminated[q.id] = a.includes(n) ? a.filter(x => x !== n) : [...a, n];
        if (s.answers[q.id] === String(n)) delete s.answers[q.id];

            showSolution = false;
            document.querySelector('.solution')?.remove();

            show = instant && !isBlank(e.target.value) && !bad,
            good = show && correct(q, e.target.value);

        fb.textContent = show ? (good ? '✓ Correct' : '✗ Not yet — keep working') : '';

        e.target.classList.toggle('bad', show && !good);

        save();

    });

        delete s.answers[q.id];
        render();
    });
    bind('hintBtn', () => {

        if (showHint) s.assisted[q.id] = true;

    });
    bind('checkBtn', () => {
        showSolution = !showSolution;
        if (showSolution) s.assisted[q.id] = true;

    });

    bindAIControls('similar', [q], false, s.parentTestId);
    updateTimer();
}

function selectChoice(n) {
    const s = db.session,
        q = s.questions[s.index];
    if (!q.choices || n < 0 || n >= q.choices.length) return;
    if (isBlank(s.answers[q.id])) logActivity();
    s.answers[q.id] = String(n);
    s.eliminated[q.id] = (s.eliminated[q.id] || []).filter(x => x !== n);
    render();
}

function updateGridCell() {
    const s = db.session,
        b = document.querySelector('[data-q="' + s.index + '"]');
    if (b) b.classList.toggle('answered', !isBlank(s.answers[s.questions[s.index].id]));
}

function nextUnanswered() {
    const s = db.session,
        [lo, hi] = activeRange();
    for (let k = 1; k <= hi - lo; k++) {
        const i = lo + ((s.index - lo + k) % (hi - lo));
        if (isBlank(s.answers[s.questions[i].id])) {
            go(i);
            return;
        }
    }
    toast('Every question in this module has an answer.');
}
// Keyboard shortcuts for the workspace. Ignored inside inputs and floating windows.
function handleShortcut(e) {
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    const t = e.target;
    if (t.closest && (t.closest('.window') || t.matches('input,textarea,select,[contenteditable]'))) return;
    if (e.key === '?') {
        e.preventDefault();
        shortcutsWindow();
        return;
    }
    if (view !== 'practice' || db.session.complete || activePopupSet) return;
    const s = db.session,
        q = s.questions[s.index],
        [lo, hi] = activeRange(),
        k = e.key.toLowerCase();
    if (e.key === 'ArrowRight' || k === 'j') {
        if (s.index < hi - 1) go(s.index + 1);
    } else if (e.key === 'ArrowLeft' || k === 'k') {
        if (s.index > lo) go(s.index - 1);
    } else if (/^[1-4]$/.test(k) && q.choices) selectChoice(Number(k) - 1);
    else if (/^[a-d]$/.test(k) && q.choices) selectChoice(k.charCodeAt(0) - 97);
    else if (k === 'f') {
        s.flags[q.id] = !s.flags[q.id];
        render();
    } else if (k === 'n') nextUnanswered();
    else if (k === 'c' && !s.timed) $('checkBtn')?.click();
    else if (k === 'h' && !s.timed) $('hintBtn')?.click();
    else if (k === 'x' && !q.choices) $('response')?.focus();
    else if (k === '=') calculatorWindow();
    else if (k === 'r') referenceWindow();
    else if (k === 's') notesWindow();
    else return;
    e.preventDefault();
}

        ['F', 'Bookmark this question'],

        ['C', 'Check & toggle the solution (study mode)'],
        ['H', 'Show a hint (study mode)'],
        ['=', 'Calculator'],
        ['R', 'Reference sheet'],
        ['S', 'Scratch notes'],
        ['Esc', 'Close the focused window'],

    ];
    openWindow('shortcutsWindow', 'Keyboard shortcuts', '<table class="data-table shortcuts">' + rows.map(r => '<tr><td><kbd>' + esc(r[0]) + '</kbd></td><td>' + esc(r[1]) + '</td></tr>').join('') + '</table><p class="mini muted">Shortcuts pause while you type in a box or use a floating window.</p>');
}

function solutionHTML(q, a) {
    return '<div class="solution"><div class="feedback ' + (correct(q, a) ? '' : 'bad') + '">' + (correct(q, a) ? '✓ Correct' : a == null || a === '' ? 'Not answered' : 'Keep practicing') + ' · Answer: ' + rich(q.choices ? '$' + String.fromCharCode(65 + Number(q.answer)) + '$ — ' + q.choices[Number(q.answer)] : q.answer) + '</div><h3>Step-by-step solution</h3><ol>' + q.steps.map(x => '<li>' + rich(x) + '</li>').join('') + '</ol></div>';
}

function go(i) {
    const [lo, hi] = activeRange();
    i = Math.max(lo, Math.min(hi - 1, i));
    db.session.index = i;
    showSolution = false;
    showHint = false;
    lastTick = Date.now();
    render();
}

function requestFinish() {
    let s = db.session,
        [lo, hi] = activeRange(),
        blank = s.questions.slice(lo, hi).filter(q => s.answers[q.id] == null || String(s.answers[q.id]).trim() === '').length;
    confirmWindow(s.timed && s.module === 0 ? 'Submit module 1?' : 'Finish this set?', `${blank?blank+' unanswered question'+(blank===1?'':'s')+'. ':''}${s.timed?'You cannot return to this module after submitting.':'Your report will include every question, including unanswered ones.'}`, () => finish());
}

function finish() {
    let s = db.session;
    if (s.complete) return;
    if (s.timed && s.module === 0) {
        s.module = 1;
        s.index = 22;
        s.deadline = Date.now() + 35 * 60000;
        showSolution = false;
        save();
        render();
        toast('Module 2 started. Module 1 is locked.');
        return;
    }
    s.complete = true;
    s.finished = Date.now();
    s.deadline = null;
    showHint = false;
    logActivity();
    db.history.unshift(structuredClone(s));
    reportId = s.id;
    view = 'report';
    showSolution = false;
    render();
}

function startSet(qs, name, timed = false, parentTestId = qs[0]?.parentTestId || 'test-1', startIndex = 0) {
    if (!qs.length) return toast('No questions to practice.');
    const run = () => {
        if ($('aiPracticeWindow')) closeAIPractice();
        db.session = makeSession(qs, name, timed, parentTestId);
        if (!timed) db.session.index = Math.max(0, Math.min(qs.length - 1, startIndex));
        db.selectedTestId = parentTestId;
        view = 'practice';
        showSolution = false;
        showHint = false;
        gridFilter = 'all';
        lastTick = Date.now();
        render();
    };
    if (!db.session.complete && Object.keys(db.session.answers).length) confirmWindow('Start a new set?', 'Your unfinished set will be replaced. Finish it first if you want a report.', run);
    else run();
}

function updateTimer() {
    const s = db.session;
    if (!s.timed || s.complete) return;
    let left = Math.max(0, Math.ceil((s.deadline - Date.now()) / 1000));
    if ($('timer')) {
        $('timer').textContent = String(Math.floor(left / 60)).padStart(2, '0') + ':' + String(left % 60).padStart(2, '0');
        $('timer').classList.toggle('warn', left < 300);
    }
    if (left === 0) {
        document.querySelectorAll('.window').forEach(w => w.remove());
        finish();
        toast('Time expired. Your module was submitted.');
    }
}
setInterval(() => {
    let now = Date.now(),
        s = db.session;
    if (!activePopupSet && view === 'practice' && !s.complete && document.visibilityState === 'visible') {
        let q = s.questions[s.index];
        s.times[q.id] = (s.times[q.id] || 0) + Math.min((now - lastTick) / 1000, 3);
        if ($('qTime')) $('qTime').textContent = fmtTime(s.times[q.id]);
    }
    if (activePopupSet?.practice && !activePopupSet.practice.complete && document.visibilityState === 'visible') {
        let p = activePopupSet.practice,
            q = p.questions[p.index];
        p.times[q.id] = (p.times[q.id] || 0) + Math.min((now - lastTick) / 1000, 3);
    }
    lastTick = now;
    updateTimer();
    if (now % 10000 < 1100) save();
}, 1000);
document.addEventListener('visibilitychange', () => {
    updateTimer();
    lastTick = Date.now();
});
window.addEventListener('beforeunload', save);

function trendChart(history) {
    const pts = history.slice().filter(h => h.finished).sort((a, b) => a.finished - b.finished).slice(-12).map(h => Math.round(100 * h.questions.filter(q => correct(q, h.answers[q.id])).length / h.questions.length));
    if (pts.length < 2) return '<p class="mini muted">Finish two or more sets to see your accuracy trend.</p>';
    const W = 420,
        H = 170,
        X = i => 34 + i * (W - 50) / (pts.length - 1),
        Y = v => 18 + (100 - v) * (H - 48) / 100;
    let o = '<svg class="chart trend" viewBox="0 0 ' + W + ' ' + H + '" role="img"><title>Accuracy across your last ' + pts.length + ' attempts</title>';
    for (const v of [0, 25, 50, 75, 100]) o += '<path d="M34 ' + Y(v) + 'H' + (W - 12) + '" stroke="var(--line)"/><text x="28" y="' + (Y(v) + 4) + '" text-anchor="end" font-size="11" fill="var(--muted)">' + v + '</text>';
    o += '<path d="' + pts.map((v, i) => (i ? 'L' : 'M') + X(i).toFixed(1) + ' ' + Y(v).toFixed(1)).join('') + '" fill="none" stroke="var(--accent)" stroke-width="3" stroke-linejoin="round"/>';
    o += pts.map((v, i) => '<circle cx="' + X(i) + '" cy="' + Y(v) + '" r="4.5" fill="var(--accent)"><title>Attempt ' + (i + 1) + ': ' + v + '%</title></circle><text x="' + X(i) + '" y="' + (H - 8) + '" text-anchor="middle" font-size="11" fill="var(--muted)">' + (i + 1) + '</text>').join('');
    return o + '</svg>';
}

function domainBars(domains, keys = Object.keys(DOMAIN_NAMES)) {
    return keys.map(d => {
        const x = domains[d];
        if (!x) return '<div class="domain"><div class="row between"><strong>' + esc(DOMAIN_NAMES[d]) + '</strong><span class="mini muted">Not yet practiced</span></div><div class="meter"><i style="width:0"></i></div></div>';
        const pct = Math.round(100 * x.ok / x.n);
        return '<div class="domain"><div class="row between"><strong>' + esc(DOMAIN_NAMES[d]) + '</strong><span>' + pct + '% · ' + x.ok + '/' + x.n + '</span></div><div class="meter"><i class="' + (pct < 60 ? 'low' : pct < 80 ? 'mid' : '') + '" style="width:' + pct + '%"></i></div></div>';
    }).join('');
}

function weakSkills(stats, limit = 5) {
    return Object.entries(stats.skills).filter(([, v]) => v.n >= 1 && v.ok < v.n).sort((a, b) => a[1].ok / a[1].n - b[1].ok / b[1].n || b[1].n - a[1].n).slice(0, limit);
}

// Custom drill builder: filter stored questions by domain, level, and source, then shuffle and start.
function drillWindow(testId = db.selectedTestId) {
    const test = db.tests.find(t => t.id === testId) || db.tests[0],
        originals = testQuestions(test),
        aiQs = testSets(test.id).flatMap(x => x.questions),
        levels = ['Easy', 'Hard', 'Harder'],
        domains = Object.keys(DOMAIN_NAMES),
        prefs = db.drillPrefs || {
            domains,
            levels,
            ai: true,
            count: 10,
            shuffle: true,
            onlyMissed: false
        };
    const missedIds = new Set(db.history.flatMap(h => h.questions.filter(q => !correct(q, h.answers[q.id])).map(q => q.id)));
    openWindow('drillWindow', esc(test.name) + ' · Custom drill', '<div class="field"><label>Domains</label><div class="check-grid">' + domains.map(d => '<label class="switch"><input type="checkbox" data-dom="' + d + '" ' + (prefs.domains.includes(d) ? 'checked' : '') + '><span>' + esc(DOMAIN_NAMES[d]) + '</span></label>').join('') + '</div></div><div class="field"><label>Levels</label><div class="check-grid three">' + levels.map(l => '<label class="switch"><input type="checkbox" data-lvl="' + l + '" ' + (prefs.levels.includes(l) ? 'checked' : '') + '><span>' + l + '</span></label>').join('') + '</div></div><div class="field check-grid"><label class="switch"><input type="checkbox" id="drillAI" ' + (prefs.ai ? 'checked' : '') + ' ' + (aiQs.length ? '' : 'disabled') + '><span>Include AI sets (' + aiQs.length + ')</span></label><label class="switch"><input type="checkbox" id="drillMissed" ' + (prefs.onlyMissed ? 'checked' : '') + '><span>Only questions I have missed</span></label><label class="switch"><input type="checkbox" id="drillShuffle" ' + (prefs.shuffle ? 'checked' : '') + '><span>Shuffle order</span></label></div><div class="field"><label for="drillCount">Length</label><div class="row">' + [5, 10, 15, 20].map(n => '<button class="small" data-dcount="' + n + '">' + n + '</button>').join('') + '<button class="small" data-dcount="all">All</button><input id="drillCount" type="number" min="1" max="200" value="' + prefs.count + '" style="width:80px" aria-label="Number of questions"></div></div><p id="drillMatch" class="mini" role="status"></p><button id="drillStart" class="primary full">Start drill</button>');
    const w = $('drillWindow');
    const current = () => {
        const doms = [...w.querySelectorAll('[data-dom]:checked')].map(x => x.dataset.dom),
            lv = [...w.querySelectorAll('[data-lvl]:checked')].map(x => x.dataset.lvl),
            useAI = $('drillAI').checked,
            onlyMissed = $('drillMissed').checked;
        const pool = [...originals, ...(useAI ? aiQs : [])].filter(q => doms.includes(q.domain) && lv.includes(q.level) && (!onlyMissed || missedIds.has(q.id)));
        return {
            doms,
            lv,
            useAI,
            onlyMissed,
            pool
        };
    };
    const refresh = () => {
        const {
            pool
        } = current();
        $('drillMatch').textContent = pool.length ? pool.length + ' question' + (pool.length === 1 ? '' : 's') + ' match these filters.' : 'No stored questions match. Widen the filters or generate AI practice.';
        $('drillStart').disabled = !pool.length;
    };
    w.querySelectorAll('input[type=checkbox]').forEach(x => x.onchange = refresh);
    w.querySelectorAll('[data-dcount]').forEach(b => b.onclick = () => {
        $('drillCount').value = b.dataset.dcount === 'all' ? current().pool.length || 1 : b.dataset.dcount;
        w.querySelectorAll('[data-dcount]').forEach(x => x.classList.toggle('dark', x === b));
    });
    bind('drillStart', () => {
        const c = current(),
            n = Math.max(1, Math.min(200, Number($('drillCount').value) || 10)),
            ordered = $('drillShuffle').checked ? shuffle(c.pool) : c.pool,
            qs = ordered.slice(0, n);
        db.drillPrefs = {
            domains: c.doms,
            levels: c.lv,
            ai: c.useAI,
            count: n,
            shuffle: $('drillShuffle').checked,
            onlyMissed: c.onlyMissed
        };
        save();
        w.remove();
        startSet(qs, 'Drill · ' + (c.doms.length === domains.length ? 'Mixed domains' : c.doms.map(d => DOMAIN_NAMES[d]).join(', ')) + ' · ' + qs.length + ' q', false, test.id);
    });
    refresh();
}


function freshPracticeSet(sets,name,parentTestId){
 const id='set-'+crypto.randomUUID();let i=0;const qs=sets.flatMap(set=>set.questions.map(q=>({...structuredClone(q),id:id+'-q'+(++i),parentTestId,originQuestionId:q.originQuestionId||q.id})));
 const levels=[...new Set(qs.map(q=>q.level))];return {id,name,parentTestId,created:Date.now(),questions:qs,level:levels.length===1?levels[0]:'Mixed',derivedFrom:sets.map(s=>s.id)};

function applySetAction(action,ids,value){
 const selected=db.sets.filter(x=>ids.includes(x.id));if(!selected.length)throw Error('Select at least one practice set.');
 if(action==='rename'){if(selected.length!==1)throw Error('Select one set to rename.');const name=String(value||'').trim();if(!name||name.length>100)throw Error('Use a name between 1 and 100 characters.');selected[0].name=name;if(selected[0].practice)selected[0].practice.name=name;}
 else if(action==='move'){if(!db.tests.some(t=>t.id===value))throw Error('Choose a test folder.');for(const set of selected){set.parentTestId=value;set.questions.forEach(q=>q.parentTestId=value);if(set.practice){set.practice.parentTestId=value;set.practice.questions.forEach(q=>q.parentTestId=value);}}}
 else if(action==='combine'||action==='duplicate'){if(action==='combine'&&selected.length<2)throw Error('Select at least two sets to combine.');if(action==='combine'){const name=String(value||'').trim();if(!name||name.length>100)throw Error('Enter a name up to 100 characters.');const merged=freshPracticeSet(selected,name,selected[0].parentTestId);db.setTrash=db.setTrash||[];db.setTrash.unshift(...selected.map(x=>({...x,deletedAt:Date.now(),mergedInto:merged.id})));db.sets=[merged,...db.sets.filter(x=>!ids.includes(x.id))];}else db.sets.unshift(...selected.map(x=>freshPracticeSet([x],x.name+' · Copy',x.parentTestId)));}
 else if(action==='delete'){db.setTrash=db.setTrash||[];db.setTrash.unshift(...selected.map(x=>({...x,deletedAt:Date.now()})));db.sets=db.sets.filter(x=>!ids.includes(x.id));}
 else throw Error('Unsupported action.');
}

actice estimate from raw correct answers, not an official College Board conversion.':'Practice accuracy, not an official SAT scaled score. Study answers may include solution assistance.'}</p></div><div class="card pad" style="margin-top:18px"><h3>Turn mistakes into progress</h3><p class="muted mini">Generate new questions targeting this attempt’s missed skills, or retry the missed originals.</p>${wrong.length?aiControls('recovery','Build recovery set'):'<p class="mini muted">Nothing missed — nice work.</p>'}<button id="retryWrong" class="small" style="margin-top:10px" ${wrong.length?'':'disabled'}>↻ Retry missed originals</button></div><div class="card pad" style="margin-top:18px"><h3>This attempt by skill</h3>${(()=>{const m={};s.questions.forEach(q=>{m[q.skill]=m[q.skill]||{n:0,ok:0,t:0};m[q.skill].n++;if(correct(q,s.answers[q.id]))m[q.skill].ok++;m[q.skill].t+=s.times[q.id]||0;});const rows=Object.entries(m).sort((a,b)=>a[1].ok/a[1].n-b[1].ok/b[1].n||b[1].t-a[1].t);return '<table class="data-table skill-table"><thead><tr><th>Skill</th><th>Score</th><th>Avg time</th></tr></thead><tbody>'+rows.map(([k,v])=>'<tr class="'+(v.ok<v.n?'miss':'')+'"><td>'+esc(k)+'</td><td>'+v.ok+'/'+v.n+'</td><td>'+fmtTime(v.t/v.n)+'</td></tr>').join('')+'</tbody></table>';})()}<p class="mini muted">Average active time per question in this set: ${fmtTime(time/total)}.</p></div><div class="card pad" style="margin-top:18px"><h3>Accuracy trend</h3>${trendChart(db.history)}</div><div class="card pad" style="margin-top:18px"><label for="historySelect">Previous attempts</label><select id="historySelect" style="width:100%">${db.history.map(h=>'<option value="'+esc(h.id)+'" '+(h.id===s.id?'selected':'')+'>'+esc(testName(h.parentTestId)+' / '+h.name)+' · '+new Date(h.finished).toLocaleDateString()+'</option>').join('')}</select></div></section><section class="card pad"><div class="row between"><h2>Question review</h2><select id="reviewFilter" aria-label="Review filter"><option value="all">All questions</option><option value="wrong">Incorrect & skipped</option><option value="right">Correct</option></select></div><div id="reviewList"></div></section></div>`;

function download(name, text, type) {
    let a = document.createElement('a'),
        url = URL.createObjectURL(new Blob([text], {
            type
        }));
    a.href = url;
    a.download = name;
    a.click();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
}

function missedPayload(session,includeSkipped=true){const data={format:'vertex-missed-questions',version:1,testId:session.parentTestId||'test-1',testName:testName(session.parentTestId),attemptName:session.name,exportedAt:new Date().toISOString(),questions:session.questions.filter(q=>!correct(q,session.answers[q.id])&&(includeSkipped||String(session.answers[q.id]??'').trim()!=='')).map(q=>({question:structuredClone(q),studentAnswer:session.answers[q.id]??null,status:String(session.answers[q.id]??'').trim()===''?'unanswered':'incorrect',correctAnswer:q.choices?q.choices[Number(q.answer)]:q.answer,solutionOpened:!!session.assisted?.[q.id]}))};data.studyGuide={title:data.testName+' — Missed-question study guide',sections:[...new Set(data.questions.map(x=>x.question.skill))].map(skill=>{const q=data.questions.find(x=>x.question.skill===skill).question,advice=skillAdvice(skill,q.domain);return{skill,review:advice[0],commonTrap:advice[1],checklist:['Solve the missed question again without help.','Explain each step, then generate a fresh recovery set.']};})};return data;}
function missedMarkdown(data){const safe=t=>String(t??'').replace(/</g,'&lt;').replace(/>/g,'&gt;');const text=['# '+safe(data.testName)+' — Missed questions','',safe(data.attemptName),'','## Study guide','',...(data.studyGuide?.sections||[]).flatMap(section=>['### '+safe(section.skill),'','Review: '+safe(section.review),'','Common trap: '+safe(section.commonTrap),'',...section.checklist.map(x=>'- [ ] '+safe(x)),'']),'## Missed questions','',...data.questions.flatMap((item,i)=>['## '+(i+1)+'. '+safe(item.question.skill),'',safe(item.question.prompt),'',...(item.question.choices||[]).map((x,j)=>String.fromCharCode(65+j)+'. '+safe(x)),'','- Status: '+item.status,'- Your answer: '+safe(item.question.choices&&item.studentAnswer!==null?item.question.choices[Number(item.studentAnswer)]:item.studentAnswer??'Unanswered'),'- Correct answer: '+safe(item.correctAnswer),'','### Solution','',...item.question.steps.map((step,j)=>(j+1)+'. '+safe(step)),''])].join('\n');const json=JSON.stringify(data,null,2),fence='`'.repeat(Math.max(3,...(json.match(/`+/g)||[]).map(x=>x.length+1)));return text+'\n## Import data\n\nThis block preserves plots, tables and question details for later import.\n\n<!-- VERTEX_MISSED_JSON -->\n'+fence+'json\n'+json+'\n'+fence+'\n';}
function missedExportWindow(session){openWindow('missedExportWindow','Save review pack','<p>Includes missed questions, your answers, worked solutions, and the study guide.</p><label><input id="includeSkipped" type="checkbox" checked> Include unanswered questions</label><div class="row" style="margin-top:18px"><button id="missedJSON" class="primary">Save JSON</button><button id="missedMD">Markdown</button><button id="missedHTML">Printable HTML</button></div><p id="missedExportStatus" class="mini" role="status"></p>');const write=type=>{const data=missedPayload(session,$('includeSkipped').checked);if(!data.questions.length){$('missedExportStatus').textContent='No missed questions match this selection.';return;}const name='Test1_Review_Pack_'+Date.now();download(name+(type==='json'?'.json':type==='html'?'.html':'.md'),type==='json'?JSON.stringify(data,null,2):type==='html'?studyGuideDocument(data):missedMarkdown(data),type==='json'?'application/json':type==='html'?'text/html':'text/markdown;charset=utf-8');$('missedExportStatus').textContent=data.questions.length+' questions and study guide exported.';};bind('missedJSON',()=>write('json'));bind('missedMD',()=>write('md'));bind('missedHTML',()=>write('html'));}
function parseMissedFile(text){let data;try{const marker=text.match(/<!-- VERTEX_MISSED_JSON -->\s*(`{3,})json\n([\s\S]*?)\n\1/);const embedded=text.match(/<script type="application\/json" id="vertex-review-data">([\s\S]*?)<\/script>/);data=JSON.parse(marker?marker[2]:embedded?embedded[1]:text);}catch{throw Error('Use a missed-question JSON or Markdown file exported by Vertex.');}if(data?.format!=='vertex-missed-questions'||data.version!==1||!Array.isArray(data.questions)||!data.questions.length||data.questions.length>500)throw Error('This is not a supported missed-question export.');if(data.testId!=='test-1')throw Error('This file belongs to another test. Import it in that test’s page.');for(const item of data.questions){const q=item.question;if(!q||typeof q.prompt!=='string'||q.prompt.length>10000||typeof q.skill!=='string'||!q.skill.length||q.skill.length>150||!['Algebra','Advanced','Data','Geometry'].includes(q.domain)||!Array.isArray(q.steps)||q.steps.some(t=>typeof t!=='string'))throw Error('The file contains an invalid question.');if(q.choices&&(!Array.isArray(q.choices)||q.choices.length!==4||q.choices.some(x=>typeof x!=='string')||!Number.isInteger(Number(q.answer))||Number(q.answer)<0||Number(q.answer)>3))throw Error('Invalid answer choices.');const v=q.visual;if(v){if(v.type==='table'){if(!Array.isArray(v.headers)||v.headers.length>10||v.headers.some(x=>typeof x!=='string')||!Array.isArray(v.rows)||v.rows.length>100||v.rows.some(r=>!Array.isArray(r)||r.length!==v.headers.length||r.some(x=>!['string','number'].includes(typeof x))))throw Error('Invalid table.');}else if(['curve','scatter'].includes(v.type)){if(!Array.isArray(v.range)||v.range.length!==4||v.range.some(x=>!Number.isFinite(x)||Math.abs(x)>1e6)||v.range[1]-v.range[0]<1e-6||v.range[3]-v.range[2]<1e-6)throw Error('Invalid graph range.');if(v.type==='curve'&&(!Array.isArray(v.coeff)||v.coeff.length>8||v.coeff.some(x=>!Number.isFinite(x))))throw Error('Invalid curve.');if(v.type==='scatter'&&(!Array.isArray(v.points)||v.points.length>500||v.points.some(p=>!Array.isArray(p)||p.length!==2||p.some(x=>!Number.isFinite(x)))))throw Error('Invalid scatterplot.');}else if(['triangle','rightTriangle'].includes(v.type)){if(!Array.isArray(v.labels)||v.labels.length!==3)throw Error('Invalid triangle labels.');}else if(v.type!=='parallel')throw Error('Unsupported diagram.');}}return data;}
function missedImportWindow(){if(db.session.timed&&!db.session.complete){toast('Import practice after finishing the timed test.');return;}openWindow('missedImportWindow','Practice from saved mistakes','<label for="missedFile">Missed-question file</label><input id="missedFile" type="file" accept=".json,.md,.html,application/json,text/markdown,text/html"><p class="mini muted">Choose a Vertex JSON, Markdown, or HTML review pack. Your original workspace stays open.</p><p id="missedImportStatus" class="mini" role="status"></p><div id="missedImportControls"></div>');bind('missedFile',async e=>{const file=e.target.files?.[0];if(!file)return;try{if(file.size>2*1024*1024)throw Error('Choose a file smaller than 2 MB.');const data=parseMissedFile(await file.text());if(!$('missedImportControls'))return;const sources=data.questions.map(x=>({skill:x.question.skill,domain:x.question.domain,parentTestId:data.testId}));$('missedImportStatus').textContent=sources.length+' missed questions · '+new Set(sources.map(x=>x.skill)).size+' skills. New questions will target these skills.';$('missedImportControls').innerHTML='<button id="importedGuide" class="small" style="margin-bottom:12px">Build study guide</button>'+aiControls('importedMissed','Generate recovery practice');bind('importedGuide',()=>studyGuideWindow(data));bindAIControls('importedMissed',sources,true,data.testId);}catch(error){if($('missedImportStatus')){$('missedImportStatus').textContent=error.message;$('missedImportControls').innerHTML='';}}},'change');}
function skillAdvice(skill,domain){const name=skill.toLowerCase();if(/percent|growth|exponential/.test(name))return['Translate percentages into multipliers: increase by p% uses 1 + p/100; decrease uses 1 − p/100. Identify the starting value and count growth periods.','Do not confuse the percent change with the multiplier or apply it to the wrong starting quantity.'];if(/system|substitution|perpendicular|dependent/.test(name))return['Use substitution or elimination. Write a line in slope-intercept form when comparing slopes, and check a solution in both original equations.','Parallel lines have equal slopes; perpendicular nonvertical lines have slopes whose product is −1.'];if(/quadratic|roots|zeros|discriminant|minimum|extrema/.test(name))return['Choose factoring for roots, vertex form for an extremum, or the discriminant b² − 4ac for the number of real roots. Check any stated sign restriction.','The vertex x-coordinate is not the minimum or maximum output. Report the quantity the question asks for.'];if(/circle|area|volume|triangle|pythagorean|radian|angle|geometry/.test(name))return['Label the known dimensions. Choose the relevant geometry relationship, keep units consistent, and distinguish radius from diameter.','Length scales by k, area by k², and volume by k³. Round only at the final step.'];if(/mean|frequency|probability|scatter|statistics/.test(name))return['Identify what each value or frequency represents. Use the full sample size for probabilities and a weighted total for a frequency-table mean.','A zero-frequency row is not an observed value. A correlation alone does not establish causation.'];if(/unit|rate/.test(name))return['Write the rate as a fraction with units. Multiply by conversion factors so unwanted units cancel.','Square conversion factors for area and cube them for volume.'];if(/budget|inequal|constraint/.test(name))return['Separate the fixed charge from the per-unit charge, then write the budget inequality. Enforce whole-number restrictions if needed.','At most means ≤. For a maximum affordable whole number, round down rather than to the nearest integer.'];if(/factor|polynomial|exponent|radical/.test(name))return['Distribute signs carefully, combine only like terms, and track exponent rules. Substitute a simple value to check equivalent expressions.','A subtraction before parentheses changes every sign. Check domains and extraneous roots when squaring.'];return domain==='Algebra'?['Define the variable, translate the relationship into an equation, and isolate the requested quantity. Substitute the result back to check it.','Keep units and signs attached to each term; answer the requested expression, not merely the value of the variable.']:['Identify the given information and the target quantity. Follow the worked example, then solve the same question again without looking.','Check restrictions, units, and whether the answer is reasonable before finishing.'];}
function guideBody(data){const groups=new Map();for(const item of data.questions){const key=item.question.skill;if(!groups.has(key))groups.set(key,[]);groups.get(key).push(item);}return '<h1>'+esc(data.testName)+' · Review study guide</h1><p>'+data.questions.length+' missed or unanswered questions · '+groups.size+' skills</p><p>Work through each example, cover the solution, and solve it again. Mark a skill ready when you can explain the steps without help.</p>'+[...groups].sort((a,b)=>b[1].length-a[1].length).map(([skill,items])=>{const saved=data.studyGuide?.sections?.find(x=>x.skill===skill),advice=saved?[saved.review,saved.commonTrap]:skillAdvice(skill,items[0].question.domain);return '<section class="guide-section"><h2>'+esc(skill)+' <small>('+items.length+')</small></h2><p><strong>Review:</strong> '+esc(advice[0])+'</p><p><strong>Common trap:</strong> '+esc(advice[1])+'</p>'+items.map((item,i)=>{const q=item.question,answer=q.choices&&item.studentAnswer!==null?q.choices[Number(item.studentAnswer)]:item.studentAnswer??'Unanswered';return '<article class="guide-example"><h3>Worked example '+(i+1)+'</h3><p>'+rich(q.prompt)+'</p>'+visual(q.visual)+(q.choices?'<ol type="A">'+q.choices.map(x=>'<li>'+rich(x)+'</li>').join('')+'</ol>':'')+'<p><strong>Your answer:</strong> '+rich(answer)+'<br><strong>Correct answer:</strong> '+rich(item.correctAnswer)+'</p><ol>'+q.steps.map(step=>'<li>'+rich(step)+'</li>').join('')+'</ol><p class="guide-check">□ I can solve this again without the solution.<br>□ I can explain why my previous approach did not work.</p>'+(['Gemini','LM Studio'].includes(q.source)?'<p class="mini muted">AI-generated example: verify any result that appears inconsistent.</p>':'')+'</article>';}).join('')+'</section>';}).join('')+'<h2>Next practice</h2><p>Import the saved missed-question JSON or Markdown file, choose a level and quantity, and generate a new recovery set. Start with Easy for an unfamiliar skill, then use Hard or Harder once the worked examples are clear.</p>';}
function studyGuideDocument(data){return '<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Test 1 · Missed-question study guide</title><style>body{font:17px/1.65 system-ui,sans-serif;max-width:850px;margin:32px auto;padding:0 20px;color:#163047}h1{font-size:28px}h2{font-size:23px}.guide-section{border-top:2px solid #cee0da;margin-top:28px;padding-top:16px}.guide-example{margin:20px 0;padding:18px;border:1px solid #dce5eb;border-radius:10px;break-inside:avoid}.guide-check{background:#eff7f3;padding:12px}.chart{max-width:420px;width:100%;height:auto}.data-table{border-collapse:collapse}.data-table td,.data-table th{border:1px solid #cbd8e0;padding:8px 15px}.mini{font-size:13px}.muted{color:#617385}li{margin:9px 0}button{padding:10px 16px;border:0;border-radius:7px;background:#086c59;color:white}@media print{button{display:none}body{margin:0;max-width:none}h2,h3{break-after:avoid}}</style><button onclick="window.print()">Print / Save as PDF</button>'+guideBody(data)+'<script type="application/json" id="vertex-review-data">'+JSON.stringify(data).replace(/</g,'\\u003c')+'</scr'+'ipt></html>';}

async function runGeneration(sourceQuestions, recovery, parentTestId, capturedLevel, n) {
    if (genController) return toast('A generation is already running.');
    if (aiBusy) return toast('Wait for the model test or model refresh to finish.');
    restoreAISettings();hubRunSettings=VertexHub.load();hubWorkingSlot='key1';updateAIReady();if (!(hubRunSettings.provider==='lmstudio'?hubRunSettings.localModel:apiKey)) {
        settingsWindow();
        setGenStatus('Choose Gemini or connect LM Studio in AI setup first.');
        return;
    }
    if (!Number.isInteger(n) || n < 1 || n > 30) return setGenStatus('Choose 1 to 30 questions.');
    const focus = [...new Set(sourceQuestions.map(q => q.skill))];
    if (!focus.length) return setGenStatus('No source questions to model on.');
    workingModel = '';
    let questions = [];
    aiDiagnostics = [];runCosts=[];
    genController = new AbortController();
    const ctrl = genController;
    setGenStatus('Starting…');
    try {
        const batchSize=hubRunSettings.provider==='lmstudio'?1:5;
        for (let start = 0; start < n; start += batchSize) {
            let count = Math.min(batchSize, n - start),
                batchSkills = Array.from({
                    length: count
                }, (_, i) => focus[(start + i) % focus.length]);
            setGenStatus('Writing questions ' + (start + 1) + '–' + (start + count) + ' of ' + n + '…');
            let difficulty = {
                Easy: 'Direct one- or two-step reasoning with transparent representations.',
                Hard: 'Multi-step SAT reasoning; interpret a model or connect representations.',
                Harder: 'Challenging SAT algebra or geometry reasoning with parameters, constraints, reverse reasoning, or multiple representations. Stay within SAT scope; no calculus.'
            } [capturedLevel];
            let prompt = 'Create exactly ' + count + ' completely original SAT-style math questions. Do not reproduce or paraphrase any published test item. Assign these skills in order: ' + JSON.stringify(batchSkills) + '. Difficulty: ' + capturedLevel + '. ' + difficulty + ' Use diverse scenarios and numbers. Write currency as words (for example, 2200 dollars); never use a bare dollar sign for money. Reserve paired dollar signs exclusively for mathematical expressions, never prose. Provide at least 3 concise worked solution steps. Use numerical student-response answers only, as plain decimal or fraction strings. Ask for a unique numerical value; no ambiguous multiple roots. All geometry dimensions and statistical values must be supplied. Use inline $LaTeX$ for math, using only frac, sqrt, pi, le, ge, times, cdot, approx and exponents; no align or environments. Include visual data if essential to solve the question; for graph-reading skills include curve or scatter, and table skills include table. Visual types: none, table, curve, scatter. For curve use descending polynomial coefficients; for scatter use [x,y] points. Provide an increasing range [xmin,xmax,ymin,ymax]. Tables require headers and rows of strings. Never include an answer or solution in the visual labels. Set tolerance=0.0001 for exact numeric answers, or half the smallest stated rounding unit for approximate answers. Specify required rounding in prompt when needed. Domains must be Algebra, Advanced, Data, or Geometry. Previously generated prompts to avoid: ' + JSON.stringify(questions.map(q => q.prompt)) + '. Return JSON only.';
            let data = await gemini(prompt, questionSchema, ctrl.signal);
            let batch = validateQuestions(data, count, batchSkills, capturedLevel);
            setGenStatus('Checking answers and diagrams for questions ' + (start + 1) + '–' + (start + count) + '…');
            let review = await gemini('Independently solve each question below without trusting its supplied answer. Verify there is exactly one numerical answer, the steps agree, and visual data match the prompt. Return valid true only if each entire question is correct and unambiguous. For each item include id (zero-based index), valid, computedAnswer as a numeric decimal or fraction string, reason. For a failed item do not repair silently. Questions: ' + JSON.stringify(batch), reviewSchema, ctrl.signal);
            if (!review || !Array.isArray(review.reviews) || review.reviews.length !== count) throw Error('The answer check was incomplete. No set was saved; please try again.');
            let seen = new Set();
            review.reviews.forEach(r => {
                if (!Number.isInteger(r.id) || r.id < 0 || r.id >= count || seen.has(r.id)) throw Error('The answer check returned invalid question IDs. Try again.');
                seen.add(r.id);
                if (r.valid !== true || !correct(batch[r.id], r.computedAnswer)) throw Error('A generated question failed the independent answer check. No set was saved. Try generating again.');
            });
            questions.push(...batch);
        }
        if (ctrl.signal.aborted) throw new DOMException('Cancelled', 'AbortError');
        let prompts = questions.map(q => q.prompt.toLowerCase().replace(/\s/g, ''));
        if (new Set(prompts).size !== questions.length) throw Error('Duplicate questions were detected. No set was saved. Please try again.');
        let name = (recovery ? 'Recovery' : 'AI Practice') + ' · ' + (focus.length === 1 ? focus[0] : 'Mixed skills');
        let set = {
            id: Date.now().toString(),
            name,
            level: capturedLevel,
            questions: questions.map(q => ({
                ...q,
                parentTestId
            })),
            parentTestId,
            created: Date.now(),
            costEstimate: {provider:hubRunSettings.provider||'gemini',requests:runCosts.slice()}
        };
        db.sets.unshift(set);
        save();
        genController = null;
        setGenStatus('');
        openAIPractice(set);
        toast('Saved under ' + testName(parentTestId) + ' in your library.');
    } catch (e) {
        genController = null;
        setGenStatus(e.name === 'AbortError' ? 'Cancelled. No partial set was saved.' : e.name === 'TimeoutError' ? 'Google took too long to respond. Try a smaller set.' : e.message);
    } finally {
        if (genController === ctrl) genController = null;
        setGenStatus(genStatus);
    }
}

function abortableWait(ms, signal) {
    return new Promise((resolve, reject) => {
        if (signal.aborted) {
            reject(new DOMException('Cancelled', 'AbortError'));
            return;
        }
        let timer = setTimeout(() => {
            signal.removeEventListener('abort', cancel);
            resolve();
        }, ms);

        function cancel() {
            clearTimeout(timer);
            signal.removeEventListener('abort', cancel);
            reject(new DOMException('Cancelled', 'AbortError'));
        }
        signal.addEventListener('abort', cancel, {
            once: true
        });
    });
}
async function generationWait(ms, signal, message) {
    const until = Date.now() + ms;
    while (Date.now() < until) {
        setGenStatus(message + ' ' + Math.ceil((until - Date.now()) / 1000) + 's…');
        await abortableWait(Math.min(1000, until - Date.now()), signal);
    }
}

function retryInfo(response, data) {
    const e = data?.error || {},
        details = Array.isArray(e.details) ? e.details : [];
    let delay = 0;
    const header = response.headers?.get('Retry-After');
    if (header) {
        delay = /^\d+(\.\d+)?$/.test(header) ? Number(header) * 1000 : Math.max(0, Date.parse(header) - Date.now());
    }
    for (const d of details) {
        if (typeof d.retryDelay === 'string' && /^\d+(\.\d+)?s$/.test(d.retryDelay)) delay = Math.max(delay || 0, parseFloat(d.retryDelay) * 1000);
    }
    const quota = JSON.stringify(details) + ' ' + String(e.message || '');
    const hardQuota = response.status === 429 && (/per[ _]?day|daily|limit:\s*0\b/i.test(quota));
    return {
        delay: Number.isFinite(delay) ? delay : 0,
        hardQuota
    };
}
async function gemini(prompt,schema,signal){const settings=hubRunSettings||VertexHub.load();if(settings.provider==='lmstudio')return VertexHub.localGenerate(settings,prompt,schema,signal);const slots=hubWorkingSlot==='key2'?['key2']:['key1','key2'];for(let i=0;i<slots.length;i++){const slot=slots[i],key=settings[slot];if(!key)continue;apiKey=key;hubWorkingSlot=slot;updateAIReady();try{return await geminiOne(prompt,schema,signal,settings.model||model);}catch(e){const backup=slot==='key1'&&settings.key2&&settings.key2!==settings.key1;if(signal.aborted||(e.longWait&&e.status!==429)||!backup||![401,403,404,408,429,500,502,503,504].includes(e.status))throw e;await generationWait(15000,signal,e.status===429?'API 1 limit reached. Switching to saved API 2 (paid usage may apply) in':'API 1 failed. Switching to saved API 2 in');}}throw Error('No API key is configured. Open AI setup on the index page.');}

async function geminiOne(prompt,schema,signal,selectedModel,maxAttempts=2){
 if(!navigator.locks)throw Error('Monthly budget protection needs a browser with Web Locks. Use current Chrome or Edge on HTTPS or localhost.');
 return navigator.locks.request(VertexHub.settingsKey+':budget-lock',{signal},()=>geminiBudgetRequest(prompt,schema,signal,selectedModel,maxAttempts));
}
async function geminiBudgetRequest(prompt, schema, signal, selectedModel, maxAttempts = 2) {
    const key = apiKey,
        phase = genStatus || 'Generating questions…';
    const body = JSON.stringify({
        contents: [{
            parts: [{
                text: prompt
            }]
        }],
        generationConfig: {
            responseMimeType: 'application/json',
            responseJsonSchema: schema
        }
    });
    for (let attempt = 0; attempt < maxAttempts; attempt++) {
        const pace = Math.max(0, 15000 - (Date.now() - lastAIRequest));
        if (pace) await generationWait(pace, signal, 'Spacing requests for limited quotas. Continuing in');
        if (signal.aborted) throw new DOMException('Cancelled', 'AbortError');
        setGenStatus(phase + (attempt ? ' Retry ' + attempt + ' of ' + (maxAttempts - 1) + '.' : ''));
        const controller = new AbortController(),
            abort = () => controller.abort();
        signal.addEventListener('abort', abort, {
            once: true
        });
        const timer = setTimeout(() => controller.abort(), 120000);
        let response, data;
        try {beginBudgetRequest(selectedModel);}catch(e){clearTimeout(timer);signal.removeEventListener('abort',abort);throw e;}
        lastAIRequest = Date.now();
        try {
            response = await fetch('https://generativelanguage.googleapis.com/v1beta/models/' + encodeURIComponent(selectedModel) + ':generateContent', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'x-goog-api-key': key
                },
                body,
                signal: controller.signal
            });
            try {
                data = await response.json();
            } catch {
                data = null;
            }
        } catch (e) {
            if (signal.aborted) throw new DOMException('Cancelled', 'AbortError');
            const problem=new Error(controller.signal.aborted?'Google timed out.':'Could not reach Google.');problem.status=controller.signal.aborted?408:503;throw problem;
        } finally {
            clearTimeout(timer);
            signal.removeEventListener('abort', abort);
        }
        recordCost(data?.usageMetadata,selectedModel,response.status);
        finishBudgetRequest(data?.usageMetadata,response.status);
        aiDiagnostics.push({
            time: new Date().toISOString(),
            model: selectedModel,
            apiSlot:hubWorkingSlot,
            status: response.status,
            message: response.ok ? 'Request succeeded' : safeGoogleMessage(data, key)
        });
        aiDiagnostics = aiDiagnostics.slice(-20);
        if (!response.ok) {
            const info = retryInfo(response, data),
                transient = [408, 429, 500, 502, 503, 504].includes(response.status);
            const saved = hubRunSettings || VertexHub.load();
            const useBackupForQuota = response.status === 429 && hubWorkingSlot === 'key1' && saved.key2 && saved.key2 !== saved.key1;
            if (useBackupForQuota || !transient || info.hardQuota || attempt === maxAttempts - 1 || info.delay > 60000) {
                const error = new Error('[' + selectedModel + '] ' + apiError(response.status) + (info.delay > 60000 ? ' Wait at least ' + Math.ceil(info.delay / 1000) + ' seconds.' : '') + ' ' + safeGoogleMessage(data, key));
                error.status = response.status;
                error.longWait = info.delay > 60000;
                throw error;
            };
            const delay = Math.max(info.delay, 2000 * 2 ** attempt + Math.random() * 1000);
            await generationWait(delay, signal, (response.status === 429 ? 'Google rate limit reached.' : 'Google temporarily unavailable (' + response.status + ').') + ' Retry ' + (attempt + 1) + '/' + (maxAttempts - 1) + ' in');
            continue;
        }
        if (data?.promptFeedback?.blockReason) throw Error('Google blocked this generation. Try a different focus.');
        let candidate = data?.candidates?.[0];
        if (candidate?.finishReason !== 'STOP') throw Error('Google returned an incomplete response. Try fewer questions.');
        let raw = candidate?.content?.parts?.filter(p => !p.thought && p.text).map(p => p.text).join('');
        if (!raw) throw Error('Google returned no question data.');
        try {
            return JSON.parse(raw);
        } catch {
            throw Error('Google returned unreadable question data. Try again.');
        }
    }
}

function validateQuestions(data, n, skills, level) {
    if (!data || !Array.isArray(data.questions) || data.questions.length !== n) throw Error('The AI returned an unexpected question count. No set saved.');
    return data.questions.map((q, i) => {
        if (typeof q.prompt !== 'string' || q.prompt.length < 15 || q.prompt.length > 4000 || !Number.isFinite(numeric(q.answer)) || !Array.isArray(q.steps) || q.steps.length < 2 || q.steps.length > 12 || q.steps.some(s => typeof s !== 'string' || s.length > 3000) || !['Algebra', 'Advanced', 'Data', 'Geometry'].includes(q.domain) || q.skill !== skills[i] || !Number.isFinite(q.tolerance) || q.tolerance < 0 || q.tolerance > 0.5) throw Error('A question failed the content validation. Try generating again.');
        let v = q.visual;
        if (v && v.type !== 'none') {
            if (v.type === 'table') {
                if (!Array.isArray(v.headers) || v.headers.length < 2 || v.headers.length > 6 || !Array.isArray(v.rows) || v.rows.length < 1 || v.rows.length > 25 || v.rows.some(r => !Array.isArray(r) || r.length !== v.headers.length || r.some(x => typeof x !== 'string' || x.length > 100))) throw Error('A generated table was invalid. Try again.');
            } else if (v.type === 'curve' || v.type === 'scatter') {
                if (!Array.isArray(v.range) || v.range.length !== 4 || v.range.some(x => !Number.isFinite(x) || Math.abs(x) > 1e6) || v.range[0] >= v.range[1] || v.range[2] >= v.range[3]) throw Error('A graph had invalid bounds.');
                if (v.type === 'curve' && (!Array.isArray(v.coeff) || v.coeff.length < 2 || v.coeff.length > 5 || v.coeff.some(x => !Number.isFinite(x)))) throw Error('A graph had invalid polynomial data.');
                if (v.type === 'scatter' && (!Array.isArray(v.points) || v.points.length < 2 || v.points.length > 100 || v.points.some(p => !Array.isArray(p) || p.length !== 2 || p.some(x => !Number.isFinite(x))))) throw Error('A scatterplot had invalid points.');
            } else throw Error('Unsupported diagram type. Try again.');
        }
        return {
            ...q,
            id: 'ai-' + Date.now() + '-' + i + '-' + Math.random().toString(36).slice(2, 8),
            choices: null,
            level,
            source: hubRunSettings?.provider==='lmstudio'?'LM Studio':'Gemini',
            modelUsed: hubRunSettings?.provider==='lmstudio'?hubRunSettings.localModel:workingModel || model,
            visual: v?.type === 'none' ? null : v
        };
    });
}

const MONTHLY_AI_LIMIT=10;
function budgetMonth(){return new Date().toISOString().slice(0,7);}
function monthlyBudget(){let all,pending;try{all=JSON.parse(localStorage.getItem(VertexHub.settingsKey+':costs')||'[]');pending=JSON.parse(localStorage.getItem(VertexHub.settingsKey+':budget-pending')||'null');if(!Array.isArray(all))throw Error();}catch{throw Error('Cost history is unavailable. Gemini is paused to protect the monthly budget.');}
 const month=budgetMonth();let checkpoint;try{checkpoint=JSON.parse(localStorage.getItem(VertexHub.settingsKey+':budget-checkpoint')||'null');}catch{throw Error('Budget reconciliation data is unavailable.');}const current=checkpoint?.month===month;if(current&&(!Number.isFinite(checkpoint.total)||checkpoint.total<0||!Number.isInteger(checkpoint.index)||checkpoint.index<0||checkpoint.index>all.length))throw Error('Budget reconciliation data is invalid.');const rows=(current?all.slice(checkpoint.index):all).filter(x=>String(x.time).startsWith(month));const spent=(current?checkpoint.total:0)+rows.reduce((a,r)=>a+(Number.isFinite(r.usd)?Math.max(0,r.usd):0),0);
 return {month,spent,remaining:Math.max(0,MONTHLY_AI_LIMIT-spent),uncertain:!!(pending&&pending.month===month)||rows.some(r=>r.tier==='paid'&&r.usd===null)};
}
function beginBudgetRequest(selectedModel){const b=monthlyBudget();if(b.uncertain)throw Error('Gemini paused after an interrupted request. Open Cost → Reconcile month to confirm spending and resume. The $10 limit remains active.');if(b.spent>=MONTHLY_AI_LIMIT)throw Error('$10 monthly Gemini budget reached. Use LM Studio or wait until next month (UTC).');
 const settings=hubRunSettings||VertexHub.load(),tier=settings[hubWorkingSlot==='key2'?'billing2':'billing1']||(hubWorkingSlot==='key2'?'paid':'free');
 if(tier==='paid'){if(!VertexHub.rates(settings,selectedModel))throw Error('Set pricing for this model in AI setup before paid generation.');if(b.remaining<0.25)throw Error('Gemini paused: less than $0.25 remains in the $10 monthly budget. This safety margin reduces overshoot. LM Studio remains available.');}
 try{localStorage.setItem(VertexHub.settingsKey+':budget-pending',JSON.stringify({month:b.month,started:new Date().toISOString(),tier}));}catch{throw Error('Cannot save budget tracking. Gemini is paused.');}
}
function finishBudgetRequest(usage,status){if(usage||[400,401,403,404,429].includes(status))localStorage.removeItem(VertexHub.settingsKey+':budget-pending');}

function reconcileMonthAmount(value){
 if(typeof value==='string'&&!value.trim())throw Error('Enter the checked month-to-date amount.');const amount=Number(value);if(!Number.isFinite(amount)||amount<0)throw Error('Enter a valid nonnegative dollar amount.');
 const budget=monthlyBudget(),history=costHistory();if(amount+1e-8<budget.spent)throw Error('Use at least the tracked estimate of $'+budget.spent.toFixed(5)+'.');
 const checkpoint={month:budget.month,index:history.length,total:Math.max(amount,budget.spent),reconciledAt:new Date().toISOString()};
 localStorage.setItem(VertexHub.settingsKey+':budget-checkpoint',JSON.stringify(checkpoint));localStorage.removeItem(VertexHub.settingsKey+':budget-pending');return checkpoint;
}
function reconcileBudgetWindow(){openWindow('reconcileBudgetWindow','Reconcile monthly spending','<p>A cancelled, timed-out or interrupted request may have incurred a charge even if its token usage was not received.</p><p>Check month-to-date Gemini API spending for both projects in Google AI Studio or Cloud Billing. Billing updates may be delayed. Enter a conservative total covering those requests; use at least the tracked estimate.</p><label for="reconcileAmount">Month-to-date total · USD</label><input id="reconcileAmount" class="full" type="number" min="0" step="any" placeholder="Enter checked total"><label style="margin-top:12px"><input id="reconcileChecked" type="checkbox"> I checked usage and included interrupted requests.</label><p class="mini muted">Keeps request history and the $10 limit. New request costs are added to this total. This does not change Google billing.</p><p id="reconcileError" class="error" role="status"></p><button id="reconcileSave" class="primary">Save total</button>');bind('reconcileSave',async()=>{const button=$('reconcileSave');try{if(!$('reconcileChecked').checked)throw Error('Check your usage and tick the confirmation first.');if(!navigator.locks)throw Error('Use Chrome or Edge on HTTPS or localhost.');button.disabled=true;await navigator.locks.request(VertexHub.settingsKey+':budget-lock',{ifAvailable:true},lock=>{if(!lock)throw Error('A Gemini request is still running in another tab. Wait for it to finish.');reconcileMonthAmount($('reconcileAmount').value);});$('reconcileBudgetWindow')?.remove();setGenStatus('');costWindow();toast('Budget updated. Generate again if funds remain.');}catch(e){$('reconcileError').textContent=e.message;button.disabled=false;}});}

function costTotal(rows){const known=rows.reduce((a,r)=>a+(r.usd||0),0);return '$'+known.toFixed(5)+(rows.some(r=>r.usd===null)?' + unknown':'');}

function costWindow(){const budget=monthlyBudget();const all=costHistory(),today=new Date().toISOString().slice(0,10),recent=all.filter(x=>x.time.startsWith(today));openWindow('costWindow','Estimated API cost','<h3>Monthly Gemini budget: $'+budget.spent.toFixed(4)+' / $10.00</h3><p>Remaining: $'+budget.remaining.toFixed(4)+' · '+budget.month+' (UTC)'+(budget.uncertain?' · Paused: unconfirmed cost':'')+'</p><h3>This generation: '+costTotal(runCosts)+'</h3><p>Today (UTC): '+costTotal(recent)+' · Recorded total: '+costTotal(all)+'</p><table class="full"><thead><tr><th>Key</th><th>Input tokens</th><th>Output + thinking</th><th>Estimate</th></tr></thead><tbody>'+['key1','key2'].map((slot,i)=>{const rows=runCosts.filter(r=>r.slot===slot);return '<tr><td>API '+(i+1)+'</td><td>'+rows.reduce((a,r)=>a+(r.input||0),0)+'</td><td>'+rows.reduce((a,r)=>a+(r.output||0),0)+'</td><td>'+costTotal(rows)+'</td></tr>';}).join('')+'</tbody></table><p class="mini muted">Includes generation and answer-check requests received by this browser, even if the set fails validation. Missing usage, failed requests and unknown prices are marked unknown. Local mode has no Gemini API cost. Totals are estimates, not your Google bill. Cache discounts are not applied; cached input is conservatively estimated at the full input rate. Pricing and free/paid key settings are in AI setup.</p><div class="row"><button id="exportCosts">Export cost history</button><button id="reconcileBudget" class="small">Reconcile month</button></div>');bind('reconcileBudget',reconcileBudgetWindow);bind('exportCosts',()=>download('vertex-cost-history.json',JSON.stringify(all,null,2),'application/json'));}
