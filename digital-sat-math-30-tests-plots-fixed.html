<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Digital SAT Math — 30 Adaptive Tests with Study Sidebar</title>
<style>
:root{
  --ink:#12233C;
  --ink-soft:#48607F;
  --paper:#EEF1F6;
  --surface:#FFFFFF;
  --rule:#D3DAE5;
  --primary:#2447C9;
  --primary-dk:#1A34A0;
  --accent:#2447C9;
  --pencil:#F2B705;
  --right:#17754C;
  --wrong:#BE2F2F;
  --shadow:0 1px 0 rgba(18,35,60,.06), 0 8px 24px -14px rgba(18,35,60,.35);
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;
  --ui:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--paper);color:var(--ink);font-family:var(--ui);
  -webkit-font-smoothing:antialiased;line-height:1.5;
}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--primary);outline-offset:2px;border-radius:4px}
.hidden{display:none !important}

/* ---------- shell ---------- */
.wrap{max-width:960px;margin:0 auto;padding:24px 20px 64px}
.eyebrow{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-soft);font-weight:600}

/* ---------- home ---------- */
.home-head{padding:36px 0 8px;border-bottom:2px solid var(--ink)}
.home-head h1{font-family:var(--serif);font-size:clamp(30px,5vw,46px);line-height:1.05;margin:10px 0 12px;letter-spacing:-.01em}
.home-head p{max-width:60ch;color:var(--ink-soft);margin:0 0 26px}
.rule-note{display:flex;flex-wrap:wrap;gap:10px;margin:18px 0 30px}
.chip{background:var(--surface);border:1px solid var(--rule);border-radius:999px;padding:6px 12px;font-size:13px;color:var(--ink-soft)}
.chip b{color:var(--ink);font-weight:600}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px;margin-top:26px}
.card{background:var(--surface);border:1px solid var(--rule);border-radius:10px;padding:16px;text-align:left;box-shadow:var(--shadow);transition:transform .12s ease,border-color .12s ease}
.card:hover{transform:translateY(-2px);border-color:var(--primary)}
.card .tno{font-family:var(--mono);font-size:12px;color:var(--ink-soft)}
.card h3{font-family:var(--serif);font-size:20px;margin:6px 0 10px}
.card .meta{font-size:13px;color:var(--ink-soft)}
.card .score{font-family:var(--mono);font-size:26px;font-weight:600;color:var(--primary)}
.card .badge{display:inline-block;font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;padding:3px 7px;border-radius:4px;background:#E8EDFA;color:var(--primary-dk)}
.foot{margin-top:34px;font-size:13px;color:var(--ink-soft);border-top:1px solid var(--rule);padding-top:16px;max-width:70ch}

/* ---------- test top bar ---------- */
.topbar{position:sticky;top:0;z-index:30;background:var(--surface);border-bottom:1px solid var(--rule)}
.topbar-in{max-width:1040px;margin:0 auto;padding:10px 18px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px}
.mod-label{font-weight:600}
.mod-label small{display:block;font-weight:400;font-size:12px;color:var(--ink-soft)}
.clock{text-align:center}
.clock .time{font-family:var(--mono);font-size:26px;font-weight:600;letter-spacing:.02em}
.clock.warn .time{color:var(--wrong)}
.clock button{background:none;border:1px solid var(--rule);border-radius:999px;padding:2px 10px;font-size:11px;color:var(--ink-soft);margin-top:2px}
.tools{display:flex;gap:8px;justify-content:flex-end}
.tool{background:var(--surface);border:1px solid var(--rule);border-radius:8px;padding:7px 11px;font-size:13px;display:flex;gap:6px;align-items:center}
.tool:hover{border-color:var(--primary);color:var(--primary-dk)}
.divider-line{height:1px;background:repeating-linear-gradient(90deg,var(--rule) 0 6px,transparent 6px 12px)}

/* ---------- question ---------- */
.qwrap{max-width:760px;margin:0 auto;padding:22px 20px 130px}
.qhead{display:flex;align-items:center;gap:12px;padding-bottom:10px;border-bottom:2px solid var(--ink);margin-bottom:20px}
.qnum{background:var(--ink);color:#fff;font-family:var(--mono);font-weight:600;width:30px;height:30px;border-radius:6px;display:grid;place-items:center;font-size:15px}
.flagbtn{margin-left:auto;background:none;border:1px solid var(--rule);border-radius:8px;padding:5px 10px;font-size:13px;color:var(--ink-soft);display:flex;gap:6px;align-items:center}
.flagbtn.on{background:#FFF6DF;border-color:var(--pencil);color:#7A5A00;font-weight:600}
.domtag{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-soft)}
.stem{font-family:var(--serif);font-size:19px;line-height:1.6;margin-bottom:22px}
.stem .v,.stem i{font-style:italic}
.sys{margin:14px 0;padding-left:14px;border-left:3px solid var(--rule);font-family:var(--serif);line-height:1.9}
.rad{border-top:1px solid currentColor;padding:0 3px}
.qtab{border-collapse:collapse;margin:14px 0;font-family:var(--ui);font-size:15px;background:var(--surface)}
.qtab th,.qtab td{border:1px solid var(--ink);padding:6px 14px;text-align:center}
.qtab thead th{background:#E8EDFA;font-weight:600}
.qtab th[scope=row]{font-weight:500;text-align:left}

.choices{display:flex;flex-direction:column;gap:10px}
.choice-row{display:flex;align-items:center;gap:8px}
.choice{flex:1;display:flex;gap:12px;align-items:flex-start;text-align:left;background:var(--surface);border:1.5px solid var(--rule);border-radius:9px;padding:12px 14px;font-family:var(--serif);font-size:18px;transition:border-color .1s,background .1s}
.choice:hover{border-color:var(--primary)}
.choice .ltr{flex:none;width:26px;height:26px;border-radius:50%;border:1.5px solid var(--ink-soft);display:grid;place-items:center;font-family:var(--ui);font-size:13px;font-weight:600;color:var(--ink-soft)}
.choice.sel{border-color:var(--primary);background:#F2F5FE}
.choice.sel .ltr{background:var(--primary);border-color:var(--primary);color:#fff}
.choice.struck{opacity:.45}
.choice.struck .txt{text-decoration:line-through}
.xbtn{flex:none;width:28px;height:28px;border-radius:50%;border:1px dashed var(--rule);background:none;font-size:12px;color:var(--ink-soft);display:grid;place-items:center}
.xbtn:hover{border-color:var(--wrong);color:var(--wrong)}
.xbtn.on{background:var(--ink);color:#fff;border-style:solid;border-color:var(--ink)}

.sprbox{background:var(--surface);border:1.5px solid var(--rule);border-radius:9px;padding:16px}
.sprbox label{display:block;font-size:13px;color:var(--ink-soft);margin-bottom:8px}
.sprbox input{width:100%;max-width:280px;font-family:var(--mono);font-size:22px;padding:10px 12px;border:1.5px solid var(--rule);border-radius:8px;background:#FBFCFE}
.sprbox input:focus{border-color:var(--primary);outline:none}
.sprhint{font-size:12px;color:var(--ink-soft);margin-top:10px;line-height:1.5}

/* ---------- bottom bar ---------- */
.bottombar{position:fixed;left:0;right:0;bottom:0;background:var(--ink);color:#fff;z-index:30}
.bottom-in{max-width:1040px;margin:0 auto;padding:12px 18px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px}
.bottom-in .who{font-size:13px;opacity:.7}
.navbtns{display:flex;gap:10px;justify-content:flex-end}
.btn{background:var(--primary);color:#fff;border:none;border-radius:999px;padding:10px 22px;font-weight:600;font-size:15px}
.btn:hover{background:#3B5EDB}
.btn.ghost{background:transparent;border:1.5px solid rgba(255,255,255,.45)}
.btn.ghost:hover{background:rgba(255,255,255,.12)}
.btn.big{border-radius:10px;padding:13px 26px}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.progbtn{background:#1D3557;border:1px solid rgba(255,255,255,.2);color:#fff;border-radius:8px;padding:8px 16px;font-size:14px;font-weight:500}
.progbtn:hover{background:#27456E}

/* ---------- review page + modals ---------- */
.sheet{position:fixed;inset:0;background:rgba(18,35,60,.45);z-index:50;display:grid;place-items:center;padding:20px}
.panel{background:var(--surface);border-radius:14px;max-width:640px;width:100%;max-height:85vh;overflow:auto;padding:26px;box-shadow:0 24px 60px -20px rgba(18,35,60,.5)}
.panel h2{font-family:var(--serif);margin:0 0 4px;font-size:26px}
.panel .close{float:right;background:none;border:1px solid var(--rule);border-radius:8px;padding:4px 10px;font-size:13px}
.qmap{display:grid;grid-template-columns:repeat(auto-fill,minmax(46px,1fr));gap:8px;margin:18px 0 6px}
.qmap button{aspect-ratio:1;border:1.5px dashed var(--ink-soft);background:var(--surface);border-radius:8px;font-family:var(--mono);font-weight:600;position:relative}
.qmap button.done{border-style:solid;background:var(--ink);color:#fff;border-color:var(--ink)}
.qmap button.cur{outline:3px solid var(--primary);outline-offset:1px}
.qmap button.flag::after{content:"";position:absolute;top:-5px;right:-5px;width:11px;height:11px;background:var(--pencil);border-radius:50%;border:2px solid var(--surface)}
.legend{display:flex;gap:16px;font-size:12px;color:var(--ink-soft);margin-top:12px;flex-wrap:wrap}
.refsheet{font-family:var(--serif);font-size:15px}
.refsheet .grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin-top:12px}
.refsheet .item{border:1px solid var(--rule);border-radius:8px;padding:10px 12px;background:#FBFCFE}
.refsheet .item b{display:block;font-family:var(--ui);font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-soft);margin-bottom:4px;font-weight:600}
.calcpad{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}
.calcpad button{background:#F3F5F9;border:1px solid var(--rule);border-radius:8px;padding:12px;font-family:var(--mono);font-size:16px}
.calcpad button:hover{background:#E8EDFA}
.calcdisp{font-family:var(--mono);font-size:22px;text-align:right;background:#0E1B2E;color:#fff;border-radius:8px;padding:14px;min-height:56px;word-break:break-all}

/* ---------- intro / routing / results ---------- */
.stage{max-width:720px;margin:0 auto;padding:56px 20px 80px;text-align:center}
.stage h1{font-family:var(--serif);font-size:34px;margin:12px 0 10px}
.stage p{color:var(--ink-soft);max-width:56ch;margin:0 auto 12px}
.directions{background:var(--surface);border:1px solid var(--rule);border-radius:12px;padding:22px;text-align:left;margin:26px 0;box-shadow:var(--shadow)}
.directions ul{margin:10px 0 0;padding-left:20px;color:var(--ink-soft);font-size:15px}
.directions li{margin-bottom:6px}

/* routing ribbon — the signature */
.route{display:grid;grid-template-columns:1fr 40px 1fr;align-items:center;gap:0;margin:34px 0;font-family:var(--mono)}
.route .node{border:1.5px solid var(--rule);border-radius:10px;padding:14px;background:var(--surface);color:var(--ink-soft);font-size:13px}
.route .node.live{border-color:var(--ink);background:var(--ink);color:#fff}
.route .node .lab{font-family:var(--ui);font-weight:600;font-size:15px;margin-bottom:2px}
.route .fork{height:2px;background:var(--rule);position:relative}
.route .fork.live{background:var(--ink)}
.dial{width:210px;height:210px;margin:8px auto 0}
.scorebig{font-family:var(--mono);font-size:52px;font-weight:700;letter-spacing:-.02em}
.bd{background:var(--surface);border:1px solid var(--rule);border-radius:12px;padding:20px;text-align:left;margin:22px 0;box-shadow:var(--shadow)}
.bd h3{margin:0 0 14px;font-size:15px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-soft)}
.bar{display:grid;grid-template-columns:170px 1fr 54px;align-items:center;gap:12px;margin-bottom:10px;font-size:14px}
.bar .track{height:10px;background:var(--paper);border-radius:999px;overflow:hidden}
.bar .fill{height:100%;background:var(--primary);border-radius:999px}
.bar .val{font-family:var(--mono);text-align:right;color:var(--ink-soft)}

/* answer review */
.rev{background:var(--surface);border:1px solid var(--rule);border-left-width:5px;border-radius:10px;padding:18px;margin-bottom:12px;text-align:left}
.rev.ok{border-left-color:var(--right)}
.rev.no{border-left-color:var(--wrong)}
.rev .rhead{display:flex;gap:10px;align-items:center;font-size:13px;color:var(--ink-soft);margin-bottom:10px}
.rev .verdict{font-weight:700;font-size:12px;letter-spacing:.06em;text-transform:uppercase}
.rev.ok .verdict{color:var(--right)}
.rev.no .verdict{color:var(--wrong)}
.rev .stem{font-size:17px;margin-bottom:12px}
.rev .ansline{font-family:var(--mono);font-size:14px;margin-bottom:4px}
.rev .exp{background:#F7F9FC;border-radius:8px;padding:12px 14px;font-family:var(--serif);font-size:16px;line-height:1.6;margin-top:10px}
.tabs{display:flex;gap:8px;margin:22px 0 14px;flex-wrap:wrap}
.tabs button{background:var(--surface);border:1px solid var(--rule);border-radius:999px;padding:7px 16px;font-size:14px}
.tabs button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
@media (max-width:640px){
  .topbar-in{grid-template-columns:1fr auto;gap:8px}
  .tools{grid-column:1/-1;justify-content:flex-start;flex-wrap:wrap}
  .bottom-in{grid-template-columns:1fr;gap:8px}
  .bottom-in .who{display:none}
  .navbtns{justify-content:space-between}
  .bar{grid-template-columns:110px 1fr 44px}
}
@media (prefers-reduced-motion:reduce){*{transition:none !important;animation:none !important}}

/* ---- picker (original + enriched test sets) ---- */
.picker{display:grid;grid-template-columns:1.15fr .85fr;gap:22px;margin-top:26px;align-items:start}
@media(max-width:760px){.picker{grid-template-columns:1fr}}
.pk{background:var(--surface);border:1px solid var(--rule);border-radius:12px;padding:20px;box-shadow:var(--shadow)}
.pk label{display:block;font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-soft);margin-bottom:8px}
select.sel{width:100%;font:inherit;font-size:16px;color:var(--ink);background:#fff;border:1.5px solid var(--rule);border-radius:9px;padding:12px 14px;appearance:none;
  background-image:linear-gradient(45deg,transparent 50%,var(--ink-soft) 50%),linear-gradient(135deg,var(--ink-soft) 50%,transparent 50%);
  background-position:calc(100% - 20px) 20px,calc(100% - 14px) 20px;background-size:6px 6px,6px 6px;background-repeat:no-repeat;cursor:pointer}
select.sel:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px rgba(36,71,201,.14)}
.pkinfo{margin-top:16px;border-top:1px solid var(--rule);padding-top:14px}
.pkinfo h3{font-family:var(--serif);font-size:22px;margin:0 0 6px}
.pkinfo .meta{font-size:13px;color:var(--ink-soft)}
.pkinfo .score{font-family:var(--mono);font-size:30px;font-weight:600;color:var(--primary);line-height:1.1;margin-top:6px}
.pkacts{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
.strip{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}
.strip button{width:30px;height:30px;border-radius:7px;border:1px solid var(--rule);background:#fff;font-family:var(--mono);font-size:11px;color:var(--ink-soft);cursor:pointer}
.strip button.done{background:var(--primary);border-color:var(--primary);color:#fff}
.strip button.on{outline:2px solid var(--accent);outline-offset:1px}
.pk .sub{font-size:13px;color:var(--ink-soft);margin:0 0 14px}
/* ---- mistake bank ---- */
.bankhead{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;border-bottom:2px solid var(--ink);padding:30px 0 14px}
.bankhead h1{font-family:var(--serif);font-size:clamp(26px,4vw,38px);margin:6px 0 0}
.bankacts{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0 6px}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 18px}
.filters button{border:1px solid var(--rule);background:var(--surface);border-radius:999px;padding:6px 13px;font-size:13px;color:var(--ink-soft);cursor:pointer}
.filters button.on{background:var(--ink);border-color:var(--ink);color:#fff}
.rev .pick{float:right;font-size:13px;color:var(--ink-soft);display:flex;gap:6px;align-items:center}
.rev .drop{background:none;border:1px solid var(--rule);border-radius:6px;font-size:12px;padding:2px 8px;color:var(--ink-soft);cursor:pointer}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:11px 18px;border-radius:999px;font-size:14px;box-shadow:0 12px 30px -10px rgba(18,35,60,.6);z-index:99}
.empty{background:var(--surface);border:1px dashed var(--rule);border-radius:12px;padding:40px;text-align:center;color:var(--ink-soft)}


/* ---------- enriched learning + visual tools ---------- */
.visual{margin:18px auto 22px;border:1px solid var(--rule);border-radius:12px;background:#FBFCFE;padding:12px;max-width:650px;overflow:hidden}
.visual svg{display:block;width:100%;height:auto;max-height:330px}
.viz-caption{font-family:var(--ui);font-size:12px;color:var(--ink-soft);text-align:center;margin-top:7px}
.learning-tools{margin-top:22px;border-top:1px solid var(--rule);padding-top:16px;display:grid;grid-template-columns:minmax(230px,.8fr) minmax(280px,1.2fr);gap:16px}
@media(max-width:700px){.learning-tools{grid-template-columns:1fr}}
.confidence,.notes{background:var(--surface);border:1px solid var(--rule);border-radius:10px;padding:13px}
.confidence label,.notes label{display:block;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-soft);margin-bottom:9px}
.confrow{display:flex;gap:7px;flex-wrap:wrap}
.confrow button{background:#F6F8FB;border:1px solid var(--rule);border-radius:999px;padding:7px 12px;font-size:13px;color:var(--ink-soft)}
.confrow button.on{background:var(--ink);border-color:var(--ink);color:#fff}
.notes textarea{width:100%;min-height:70px;resize:vertical;border:1px solid var(--rule);border-radius:8px;padding:9px 10px;font:14px/1.45 var(--ui);color:var(--ink);background:#FBFCFE}
.notes textarea:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px rgba(36,71,201,.12)}
.shortcut{font-size:11px;color:var(--ink-soft);margin-top:8px}
.kbd{font-family:var(--mono);font-size:10px;border:1px solid var(--rule);border-bottom-width:2px;border-radius:4px;padding:1px 5px;background:#fff;color:var(--ink)}
.resume{margin-top:18px;border:1px solid #B8C6F2;background:#F4F7FF;border-radius:11px;padding:14px 16px;display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap}
.resume strong{font-family:var(--serif);font-size:18px}
.resume .meta{font-size:13px;color:var(--ink-soft)}
.metricgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:18px 0}
.metric{background:var(--surface);border:1px solid var(--rule);border-radius:10px;padding:14px}
.metric .lab{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--ink-soft);font-weight:700}
.metric .num{font-family:var(--mono);font-size:25px;font-weight:700;margin-top:3px}
.metric .sub{font-size:12px;color:var(--ink-soft);margin-top:3px}
.focusbox{border-left:5px solid var(--pencil);background:#FFF9E9;border-radius:10px;padding:15px 17px;margin:16px 0}
.focusbox b{font-family:var(--serif);font-size:18px}
.trend{margin-top:14px;border-top:1px solid var(--rule);padding-top:14px}
.trend svg{width:100%;height:auto;display:block}
.timepill{font-family:var(--mono);font-size:11px;background:#EFF3F8;color:var(--ink-soft);border-radius:999px;padding:3px 8px}
.review-meta{display:flex;gap:7px;flex-wrap:wrap;margin:9px 0 2px}
.review-note{margin-top:9px;padding:9px 11px;border-left:3px solid var(--pencil);background:#FFF9E9;font-size:13px;color:#5E4B12}
.qmap button.low::before{content:"!";position:absolute;left:-4px;bottom:-5px;width:15px;height:15px;display:grid;place-items:center;border-radius:50%;background:var(--wrong);color:#fff;font:700 9px var(--ui);border:2px solid var(--surface)}
.report-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.home-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
.home-stat{background:#F7F9FC;border:1px solid var(--rule);border-radius:8px;padding:10px;text-align:center}
.home-stat b{display:block;font-family:var(--mono);font-size:20px}
.home-stat span{font-size:11px;color:var(--ink-soft)}
@media print{.topbar,.bottombar,.report-actions,.tabs,.bankhead button,#retake,#bank,#home{display:none!important}.wrap{max-width:none;padding:0}.rev{break-inside:avoid}.bd{box-shadow:none}.stage{padding-top:0}}



/* ---------- persistent left study sidebar ---------- */
:root{--study-side-w:310px}
body.with-study-sidebar #app{margin-left:var(--study-side-w);min-height:100vh}
.study-sidebar{position:fixed;inset:0 auto 0 0;width:var(--study-side-w);z-index:42;background:#0F2038;color:#fff;border-right:1px solid rgba(255,255,255,.13);overflow-y:auto;overscroll-behavior:contain;padding:18px 14px 28px;box-shadow:8px 0 28px -18px rgba(0,0,0,.65)}
.study-sidebar *{box-sizing:border-box}
.side-brand{padding:2px 4px 15px;border-bottom:1px solid rgba(255,255,255,.17);margin-bottom:13px}
.side-brand .eyebrow{color:#AFC1DD}
.side-brand h2{font-family:var(--serif);font-size:23px;line-height:1.08;margin:6px 0 4px;color:#fff}
.side-brand p{font-size:12px;color:#B9C7DB;margin:0}
.side-section{border:1px solid rgba(255,255,255,.15);background:rgba(255,255,255,.055);border-radius:12px;padding:12px;margin:0 0 11px}
.side-section summary{cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:center;font-weight:700;font-size:13px;letter-spacing:.02em}
.side-section summary::-webkit-details-marker{display:none}
.side-section summary::after{content:'▾';font-size:12px;color:#AFC1DD}
.side-section[open] summary::after{content:'▴'}
.side-body{margin-top:11px}
.side-lab{display:block;font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#AFC1DD;margin:9px 0 5px}
.side-row{display:grid;grid-template-columns:1fr auto;gap:6px;align-items:center;margin-bottom:7px}
.side-select{width:100%;min-width:0;border:1px solid rgba(255,255,255,.22);border-radius:8px;background:#172C49;color:#fff;padding:8px 9px;font-size:12px;outline:none}
.side-select:focus{border-color:#8EA9FF;box-shadow:0 0 0 3px rgba(142,169,255,.18)}
.side-select option,.side-select optgroup{background:#fff;color:#12233C}
.side-btn{width:100%;border:1px solid rgba(255,255,255,.25);border-radius:8px;background:#2447C9;color:#fff;padding:8px 10px;font-size:12px;font-weight:700;text-align:center}
.side-btn:hover{background:#3B5EDB}
.side-btn:disabled{opacity:.42;cursor:not-allowed;filter:grayscale(.35)}
.side-btn:disabled:hover{background:#2447C9}
.side-btn.secondary{background:transparent;color:#E8EEF8}
.side-btn.secondary:hover{background:rgba(255,255,255,.10)}
.side-btn.warn{background:#FFF1C5;color:#5E4700;border-color:#EBCF6B}
.side-btn.warn:hover{background:#FFE59A}
.side-mini{font-size:11px;line-height:1.45;color:#B9C7DB;margin:6px 0 9px}
.side-stat{display:flex;justify-content:space-between;gap:8px;font-size:12px;margin:5px 0;color:#DCE6F4}
.side-stat b{font-family:var(--mono);color:#fff}
.side-qmap{display:grid;grid-template-columns:repeat(6,1fr);gap:5px;margin:8px 0}
.side-qmap button{aspect-ratio:1;border:1px solid rgba(255,255,255,.24);border-radius:6px;background:transparent;color:#DCE6F4;font:700 10px var(--mono);padding:0;position:relative}
.side-qmap button.done{background:#E8EEF8;color:#12233C;border-color:#E8EEF8}
.side-qmap button.cur{outline:2px solid #F2B705;outline-offset:1px}
.side-qmap button.flag::after{content:'';position:absolute;right:-2px;top:-2px;width:6px;height:6px;border-radius:50%;background:#F2B705}
.side-count{display:inline-grid;place-items:center;min-width:22px;height:22px;padding:0 6px;border-radius:999px;background:#BE2F2F;color:#fff;font:700 10px var(--mono)}
.side-empty{font-size:12px;color:#AFC1DD;padding:4px 0}
.side-toggle{display:none;position:fixed;left:10px;top:10px;z-index:46;border:0;border-radius:9px;background:#0F2038;color:#fff;padding:9px 12px;font-weight:700;box-shadow:var(--shadow)}
body.with-study-sidebar .bottombar{left:var(--study-side-w)}
.solution-panel .solution-answer{border-left:5px solid var(--right);background:#F1FAF6;border-radius:9px;padding:12px 14px;margin:15px 0;font-family:var(--serif);font-size:18px}
.solution-panel .solution-warning{font-size:12px;color:#7A5A00;background:#FFF9E9;border:1px solid #EBD27B;border-radius:8px;padding:9px 11px;margin:10px 0}
@media(max-width:980px){
  body.with-study-sidebar #app{margin-left:0}
  .study-sidebar{transform:translateX(-102%);transition:transform .2s ease}
  body.side-open .study-sidebar{transform:translateX(0)}
  .side-toggle{display:block}
  body.with-study-sidebar .bottombar{left:0}
  body.side-open::after{content:'';position:fixed;inset:0;background:rgba(7,16,30,.48);z-index:41}
}
@media print{.study-sidebar,.side-toggle{display:none!important}body.with-study-sidebar #app{margin-left:0}.bottombar{left:0!important}}


/* ---------- post-expiration access gate ---------- */
.access-gate{position:fixed;inset:0;z-index:10000;display:grid;place-items:center;padding:22px;background:linear-gradient(145deg,#0B182B,#132B49);font-family:var(--ui);color:#fff}
.access-gate[hidden]{display:none!important}
.access-card{width:min(430px,100%);background:#fff;color:var(--ink);border-radius:16px;padding:28px;box-shadow:0 28px 80px -26px rgba(0,0,0,.85);border:1px solid rgba(255,255,255,.2)}
.access-mark{width:48px;height:48px;border-radius:12px;background:#E8EDFA;color:var(--primary);display:grid;place-items:center;font-size:23px;font-weight:800;margin-bottom:16px}
.access-card h1{font-family:var(--serif);font-size:28px;line-height:1.15;margin:0 0 8px}
.access-card p{margin:0 0 18px;color:var(--ink-soft);font-size:15px}
.access-card label{display:block;font-size:12px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-soft);margin-bottom:7px}
.access-row{display:grid;grid-template-columns:1fr auto;gap:9px}
.access-input{min-width:0;width:100%;font-family:var(--mono);font-size:20px;letter-spacing:.18em;border:1.5px solid var(--rule);border-radius:9px;padding:11px 13px;background:#FBFCFE;color:var(--ink)}
.access-input:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px rgba(36,71,201,.14)}
.access-submit{border:0;border-radius:9px;padding:0 20px;background:var(--primary);color:#fff;font-weight:700}
.access-submit:hover{background:var(--primary-dk)}
.access-error{min-height:22px;margin:9px 0 0!important;color:var(--wrong)!important;font-size:13px!important;font-weight:600}
body.access-locked{overflow:hidden}
body.access-locked>#app{visibility:hidden}

<body>
<div id="app"></div>
<script>
/* ============================================================
   Digital SAT Math — seeded question engine
   Domains: ALG (Algebra), ADV (Advanced Math),
            PSD (Problem-Solving & Data Analysis),
            GEO (Geometry & Trigonometry)
   Each template: {id, dom, diffs, spr, gen(R,d)}
   gen returns { stem, opts:[correct, w1, w2, w3], exp }
   opts[0] is always the correct answer.
   ============================================================ */

/* ---------- seeded RNG ---------- */
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function RNG(seed){const f=mulberry32(seed);return{
  f,
  i:(a,b)=>a+Math.floor(f()*(b-a+1)),
  nz:(a,b)=>{let v=0;while(v===0)v=a+Math.floor(f()*(b-a+1));return v;},
  pick:(arr)=>arr[Math.floor(f()*arr.length)],
  sign:()=>(f()<0.5?-1:1),
  shuffle:(arr)=>{const a=arr.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(f()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
};}

/* ---------- formatting helpers ---------- */
const V=(s)=>`<i class="v">${s}</i>`;                       // variable
const P=(n)=>`<sup>${n}</sup>`;                             // exponent
const money=(n)=>'$'+n.toLocaleString('en-US');
const sgn=(n)=>(n<0?'&minus;'+Math.abs(n):''+n);            // signed number for display
const term=(c,v)=>{ // c*v with sign, e.g. +3x, -x, x
  if(c===0)return'';
  const a=Math.abs(c);
  const co=(a===1?'':a);
  return (c<0?' &minus; ':' + ')+co+v;
};
const lead=(c,v)=>{ // leading term
  if(c===0)return'0';
  const a=Math.abs(c); const co=(a===1?'':a);
  return (c<0?'&minus;':'')+co+v;
};
const linexp=(a,b,v)=>{ // ax + b
  let s=lead(a,v);
  if(b!==0)s+=(b<0?' &minus; ':' + ')+Math.abs(b);
  return s;
};
const quad=(a,b,c,v)=>{
  let s=lead(a,v+P(2));
  if(b!==0)s+=term(b,v);
  if(c!==0)s+=(c<0?' &minus; ':' + ')+Math.abs(c);
  return s;
};
const gcd=(a,b)=>{a=Math.abs(a);b=Math.abs(b);while(b){[a,b]=[b,a%b];}return a;};
const fracStr=(n,d)=>{const g=gcd(n,d)||1;n/=g;d/=g;if(d<0){n=-n;d=-d;}return d===1?''+n:`${n}/${d}`;};
const round2=(x)=>Math.round(x*100)/100;

/* build 4 unique options from a correct value + candidate distractors */
function mkOpts(R,correct,cands){
  const out=[correct];
  const seen=new Set([String(correct)]);
  for(const c of cands){
    if(out.length>=4)break;
    if(c===undefined||c===null)continue;
    const k=String(c);
    if(seen.has(k))continue;
    seen.add(k);out.push(c);
  }
  let bump=1;
  while(out.length<4){
    const c=(typeof correct==='number')?correct+bump:String(correct)+' ';
    if(!seen.has(String(c))){seen.add(String(c));out.push(c);}
    bump++;
    if(bump>50)break;
  }
  return out;
}

/* table builder */
function table(headers,rows,caption){
  let h='<table class="qtab">';
  if(caption)h+=`<caption>${caption}</caption>`;
  h+='<thead><tr>'+headers.map(x=>`<th>${x}</th>`).join('')+'</tr></thead><tbody>';
  h+=rows.map(r=>'<tr>'+r.map((x,i)=>i===0?`<th scope="row">${x}</th>`:`<td>${x}</td>`).join('')+'</tr>').join('');
  return h+'</tbody></table>';
}

/* ---------- professional inline visuals ---------- */
function graphicCard(svg,caption){
  return `<div class="visual">${svg}${caption?`<div class="viz-caption">${caption}</div>`:''}</div>`;
}
function svgText(x,y,t,size=12,anchor='middle',weight=400){
  return `<text x="${x}" y="${y}" text-anchor="${anchor}" font-family="system-ui,Segoe UI,sans-serif" font-size="${size}" font-weight="${weight}" fill="#12233C">${t}</text>`;
}
function lineGraphSVG(m,b,points=[]){
  const W=560,H=300,p=38,x0=-6,x1=6,y0=-6,y1=6;
  const X=x=>p+(x-x0)/(x1-x0)*(W-2*p),Y=y=>H-p-(y-y0)/(y1-y0)*(H-2*p);
  let g='';
  for(let i=-6;i<=6;i++){
    const xx=X(i),yy=Y(i);
    g+=`<line x1="${xx}" y1="${p}" x2="${xx}" y2="${H-p}" stroke="#E3E8F0" stroke-width="1"/>`;
    g+=`<line x1="${p}" y1="${yy}" x2="${W-p}" y2="${yy}" stroke="#E3E8F0" stroke-width="1"/>`;
    if(i!==0){g+=svgText(xx,H-p+18,i,10);g+=svgText(p-10,yy+4,i,10,'end');}
  }
  g+=`<line x1="${p}" y1="${Y(0)}" x2="${W-p}" y2="${Y(0)}" stroke="#12233C" stroke-width="2"/>`;
  g+=`<line x1="${X(0)}" y1="${p}" x2="${X(0)}" y2="${H-p}" stroke="#12233C" stroke-width="2"/>`;
  g+=svgText(W-p+14,Y(0)+4,'x',13);g+=svgText(X(0)+8,p-10,'y',13,'start');
  const pts=[];for(let x=x0;x<=x1;x+=.12){const y=m*x+b;if(y>=y0-.4&&y<=y1+.4)pts.push(`${X(x)},${Y(y)}`);}
  g+=`<polyline points="${pts.join(' ')}" fill="none" stroke="#2447C9" stroke-width="4" stroke-linecap="round"/>`;
  points.forEach(([x,y,label])=>{g+=`<circle cx="${X(x)}" cy="${Y(y)}" r="5" fill="#BE2F2F" stroke="#fff" stroke-width="2"/>`;if(label)g+=svgText(X(x)+8,Y(y)-10,label,11,'start',600);});
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Coordinate graph of a line">${g}</svg>`;
}
function twoLineGraphSVG(m1,b1,m2,b2,pt){
  let a=lineGraphSVG(m1,b1,[]).replace('</svg>','');
  const W=560,H=300,p=38,x0=-6,x1=6,y0=-6,y1=6,X=x=>p+(x-x0)/(x1-x0)*(W-2*p),Y=y=>H-p-(y-y0)/(y1-y0)*(H-2*p);
  const pts=[];for(let x=x0;x<=x1;x+=.12){const y=m2*x+b2;if(y>=y0-.4&&y<=y1+.4)pts.push(`${X(x)},${Y(y)}`);}
  a+=`<polyline points="${pts.join(' ')}" fill="none" stroke="#17754C" stroke-width="4" stroke-linecap="round"/>`;
  a+=`<circle cx="${X(pt[0])}" cy="${Y(pt[1])}" r="6" fill="#F2B705" stroke="#12233C" stroke-width="2"/>`;
  a+=svgText(440,28,'blue line',11,'start',600)+svgText(500,28,'green line',11,'start',600)+'</svg>';
  return a;
}
function parabolaSVG(a,h,k){
  const W=560,H=300,p=38,x0=-6,x1=6,y0=-6,y1=8,X=x=>p+(x-x0)/(x1-x0)*(W-2*p),Y=y=>H-p-(y-y0)/(y1-y0)*(H-2*p);
  let g='';for(let i=-6;i<=6;i++){g+=`<line x1="${X(i)}" y1="${p}" x2="${X(i)}" y2="${H-p}" stroke="#E3E8F0"/>`;if(i!==0)g+=svgText(X(i),H-p+18,i,10);}for(let j=-6;j<=8;j+=2){g+=`<line x1="${p}" y1="${Y(j)}" x2="${W-p}" y2="${Y(j)}" stroke="#E3E8F0"/>`;if(j!==0)g+=svgText(p-10,Y(j)+4,j,10,'end');}
  g+=`<line x1="${p}" y1="${Y(0)}" x2="${W-p}" y2="${Y(0)}" stroke="#12233C" stroke-width="2"/><line x1="${X(0)}" y1="${p}" x2="${X(0)}" y2="${H-p}" stroke="#12233C" stroke-width="2"/>`;
  const pts=[];for(let x=x0;x<=x1;x+=.07){const y=a*(x-h)*(x-h)+k;if(y<=y1+.8)pts.push(`${X(x)},${Y(y)}`);}g+=`<polyline points="${pts.join(' ')}" fill="none" stroke="#2447C9" stroke-width="4"/>`;
  g+=`<circle cx="${X(h)}" cy="${Y(k)}" r="6" fill="#F2B705" stroke="#12233C" stroke-width="2"/>`;
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Graph of a parabola">${g}</svg>`;
}
function scatterSVG(points,m,b){
  const W=560,H=300,p=44,x0=0,x1=10,y0=0,y1=10,X=x=>p+(x-x0)/(x1-x0)*(W-2*p),Y=y=>H-p-(y-y0)/(y1-y0)*(H-2*p);
  let g='';for(let i=0;i<=10;i++){g+=`<line x1="${X(i)}" y1="${p}" x2="${X(i)}" y2="${H-p}" stroke="#E6EAF1"/><line x1="${p}" y1="${Y(i)}" x2="${W-p}" y2="${Y(i)}" stroke="#E6EAF1"/>`;if(i%2===0){g+=svgText(X(i),H-p+18,i,10);g+=svgText(p-10,Y(i)+4,i,10,'end');}}
  g+=`<line x1="${p}" y1="${H-p}" x2="${W-p}" y2="${H-p}" stroke="#12233C" stroke-width="2"/><line x1="${p}" y1="${p}" x2="${p}" y2="${H-p}" stroke="#12233C" stroke-width="2"/>`;
  points.forEach(([x,y])=>g+=`<circle cx="${X(x)}" cy="${Y(y)}" r="5" fill="#2447C9" opacity=".82"/>`);
  const yA=m*0+b,yB=m*10+b;g+=`<line x1="${X(0)}" y1="${Y(yA)}" x2="${X(10)}" y2="${Y(yB)}" stroke="#BE2F2F" stroke-width="3" stroke-dasharray="9 6"/>`;
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Scatterplot with a line of best fit">${g}</svg>`;
}
function boxPlotSVG(min,q1,med,q3,max){
  const W=560,H=190,p=50,lo=0,hi=20,X=x=>p+(x-lo)/(hi-lo)*(W-2*p),y=92;
  let g=`<line x1="${p}" y1="145" x2="${W-p}" y2="145" stroke="#12233C" stroke-width="2"/>`;
  for(let i=0;i<=20;i+=2){g+=`<line x1="${X(i)}" y1="139" x2="${X(i)}" y2="151" stroke="#12233C"/>`+svgText(X(i),170,i,10);}
  g+=`<line x1="${X(min)}" y1="${y}" x2="${X(q1)}" y2="${y}" stroke="#2447C9" stroke-width="4"/><line x1="${X(q3)}" y1="${y}" x2="${X(max)}" y2="${y}" stroke="#2447C9" stroke-width="4"/>`;
  g+=`<rect x="${X(q1)}" y="55" width="${X(q3)-X(q1)}" height="74" fill="#E8EDFA" stroke="#2447C9" stroke-width="3"/><line x1="${X(med)}" y1="55" x2="${X(med)}" y2="129" stroke="#BE2F2F" stroke-width="4"/>`;
  g+=`<line x1="${X(min)}" y1="70" x2="${X(min)}" y2="114" stroke="#2447C9" stroke-width="3"/><line x1="${X(max)}" y1="70" x2="${X(max)}" y2="114" stroke="#2447C9" stroke-width="3"/>`;
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Box plot">${g}</svg>`;
}
function histogramSVG(vals){
  const W=560,H=280,p=46,max=Math.max(...vals),bw=(W-2*p)/vals.length;
  let g=`<line x1="${p}" y1="${H-p}" x2="${W-p}" y2="${H-p}" stroke="#12233C" stroke-width="2"/><line x1="${p}" y1="${p}" x2="${p}" y2="${H-p}" stroke="#12233C" stroke-width="2"/>`;
  for(let i=0;i<=max;i+=2){const yy=H-p-i/max*(H-2*p);g+=`<line x1="${p}" y1="${yy}" x2="${W-p}" y2="${yy}" stroke="#E6EAF1"/>`+svgText(p-9,yy+4,i,10,'end');}
  vals.forEach((v,i)=>{const h=v/max*(H-2*p);g+=`<rect x="${p+i*bw+3}" y="${H-p-h}" width="${bw-6}" height="${h}" fill="#2447C9" opacity=".85"/>`+svgText(p+(i+.5)*bw,H-p+18,`${i*10}-${i*10+9}`,9);});
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Histogram">${g}</svg>`;
}
function rightTriangleSVG(a,b,c,label=''){
  const W=560,H=300,A=[95,235],B=[455,235],C=[95,65];
  let g=`<polygon points="${A.join(',')} ${B.join(',')} ${C.join(',')}" fill="#F4F7FF" stroke="#2447C9" stroke-width="4"/>`;
  g+=`<path d="M95 210 H120 V235" fill="none" stroke="#12233C" stroke-width="2"/>`;
  g+=svgText(72,155,b,15,'middle',600)+svgText(275,260,a,15,'middle',600)+svgText(292,135,c,15,'middle',600);
  if(label)g+=svgText(275,30,label,13,'middle',600);
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Right triangle diagram">${g}</svg>`;
}
function sectorSVG(r,deg){
  const W=500,H=300,cx=245,cy=155,R=105,ang=deg*Math.PI/180,x=cx+R*Math.cos(-ang),y=cy+R*Math.sin(-ang),large=deg>180?1:0;
  let g=`<circle cx="${cx}" cy="${cy}" r="${R}" fill="#F8FAFD" stroke="#2447C9" stroke-width="4"/>`;
  g+=`<path d="M${cx} ${cy} L${cx+R} ${cy} A${R} ${R} 0 ${large} 0 ${x} ${y} Z" fill="#E8EDFA" stroke="#2447C9" stroke-width="2"/>`;
  g+=`<circle cx="${cx}" cy="${cy}" r="4" fill="#12233C"/>`+svgText(cx+55,cy-12,`${deg}°`,16,'middle',700)+svgText(cx+R/2,cy+22,`r = ${r}`,14,'middle',600);
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Circle with a shaded sector">${g}</svg>`;
}

/* ============================================================
   ALGEBRA
   ============================================================ */
const T_ALG=[
{id:'alg-lin-solve',dom:'ALG',diffs:['E','M','H'],spr:true,gen(R,d){
  const x0=R.nz(-8,9);
  if(d==='E'){
    const a=R.i(2,7), b=R.nz(-9,12); const c=a*x0+b;
    return{stem:`If ${linexp(a,b,V('x'))} = ${c}, what is the value of ${V('x')}?`,
      opts:mkOpts(R,x0,[x0+1,x0-1,-x0,c-b]),
      exp:`Subtract ${sgn(b)} from both sides: ${a}${V('x')} = ${c-b}. Divide by ${a}: ${V('x')} = ${x0}.`};
  }
  const a=R.i(3,9), c=R.i(2,a-1), b=R.nz(-12,12);
  const dd=b+(a-c)*x0;
  return{stem:`If ${linexp(a,b,V('x'))} = ${linexp(c,dd,V('x'))}, what is the value of ${V('x')}?`,
    opts:mkOpts(R,x0,[-x0,x0+2,x0-1,Math.round((dd+b)/(a+c))]),
    exp:`Collect like terms: ${a-c}${V('x')} = ${dd-b}, so ${V('x')} = ${dd-b} / ${a-c} = ${x0}.`};
}},

{id:'alg-slope-pts',dom:'ALG',diffs:['E','M'],spr:true,gen(R,d){
  const m=R.nz(-4,5), x1=R.i(-4,4), y1=R.i(-6,6), k=R.i(1,4);
  const x2=x1+k, y2=y1+m*k;
  return{stem:`In the <i>xy</i>-plane, a line passes through the points (${x1}, ${y1}) and (${x2}, ${y2}). What is the slope of the line?`,
    opts:mkOpts(R,m,[-m,m+1,m-1,round2(1/m)]),

  return{stem:`The number of members of a club increased from ${a} to ${b}. What was the percent increase in the number of members?`,
    opts:mkOpts(R,`${p}%`,[`${Math.round((b-a)/b*100)}%`,`${p+10}%`,`${Math.round(b/a*100)}%`]),
    exp:`Percent increase = (${b} &minus; ${a})/${a} &times; 100% = ${b-a}/${a} &times; 100% = ${p}%.`};
}},

{id:'psd-discount',dom:'PSD',diffs:['M','H'],spr:true,gen(R,d){
  const price=R.i(4,20)*10, disc=R.pick([10,20,25,40]), tax=R.pick([5,8,10]);
  const ans=round2(price*(1-disc/100)*(1+tax/100));
  return{stem:`A jacket is on sale for ${disc}% off its regular price of ${money(price)}. A sales tax of ${tax}% is applied to the sale price. What is the total cost, in dollars, of the jacket?`,
    opts:mkOpts(R,ans,[round2(price*(1-disc/100)),round2(price*(1-disc/100+tax/100)),round2(price*(1+tax/100)),round2(ans+1)]),
    exp:`Sale price = ${money(price)} &times; ${(1-disc/100).toFixed(2)} = ${money(round2(price*(1-disc/100)))}. With ${tax}% tax: ${round2(price*(1-disc/100))} &times; ${(1+tax/100).toFixed(2)} = ${ans}.`};
}},

{id:'psd-mean-missing',dom:'PSD',diffs:['E','M','H'],spr:true,gen(R,d){
  const n=R.i(4,6), mean=R.i(6,20);
  const vals=[];for(let i=0;i<n-1;i++)vals.push(R.i(mean-6,mean+6));
  const miss=mean*n-vals.reduce((s,x)=>s+x,0);
  return{stem:`The mean of ${n} numbers is ${mean}. ${n-1} of the numbers are ${vals.join(', ')}. What is the ${n}th number?`,
    opts:mkOpts(R,miss,[mean,miss+2,miss-3,Math.round(vals.reduce((s,x)=>s+x,0)/(n-1))]),
    exp:`The sum of all ${n} numbers is ${n} &times; ${mean} = ${n*mean}. The listed numbers total ${vals.reduce((s,x)=>s+x,0)}, so the missing number is ${n*mean} &minus; ${vals.reduce((s,x)=>s+x,0)} = ${miss}.`};
}},

{id:'psd-median-table',dom:'PSD',diffs:['M','H'],spr:true,gen(R,d){
  const vals=[R.i(1,3),R.i(4,5),R.i(6,7),R.i(8,10)].map((v,i)=>v);
  const freqs=[R.i(2,6),R.i(3,8),R.i(2,7),R.i(1,5)];
  const list=[];vals.forEach((v,i)=>{for(let j=0;j<freqs[i];j++)list.push(v);});
  list.sort((a,b)=>a-b);
  const n=list.length;
  const med=n%2?list[(n-1)/2]:(list[n/2-1]+list[n/2])/2;
  const tab=table(['Value','Frequency'],vals.map((v,i)=>[v,freqs[i]]));
  return{stem:`${tab}The table shows the frequency of each value in a data set. What is the median of the data set?`,
    opts:mkOpts(R,med,[round2(list.reduce((s,x)=>s+x,0)/n),vals[R.i(0,3)],med+1,med-1]),
    exp:`There are ${n} values in all. Listing them in order and finding the middle value gives a median of ${med}.`};
}},

{id:'psd-twoway',dom:'PSD',diffs:['M','H'],spr:false,gen(R,d){
  const a=R.i(10,40),b=R.i(10,40),c=R.i(10,40),e=R.i(10,40);
  const total=a+b+c+e;
  const tab=table(['','Passed','Did not pass','Total'],[
    ['Group A',a,b,a+b],['Group B',c,e,c+e],['Total',a+c,b+e,total]]);
  const p=round2((a+c)/total*100);
  return{stem:`${tab}One participant is selected at random from those in the table. What is the probability that the selected participant passed?`,
    opts:mkOpts(R,`${a+c}/${total}`,[`${a}/${total}`,`${a+c}/${a+b}`,`${b+e}/${total}`]),
    exp:`${a+c} of the ${total} participants passed, so the probability is ${a+c}/${total} &asymp; ${round2((a+c)/total)}.`};
}},

{id:'psd-proportion',dom:'PSD',diffs:['E','M'],spr:true,gen(R,d){
  const scale=R.pick([4,5,8,10,12]), inches=R.i(3,9), miles=scale*inches, ask=R.i(2,7)*scale;
  const ans=ask/scale;
  return{stem:`On a map, ${inches} inches represents ${miles} miles. At this scale, how many inches represent ${ask} miles?`,
    opts:mkOpts(R,ans,[ans*2,ask,round2(ask/inches),ans+1]),
    exp:`The scale is ${miles}/${inches} = ${scale} miles per inch. So ${ask} miles &divide; ${scale} = ${ans} inches.`};
}},

{id:'psd-ratio',dom:'PSD',diffs:['E','M','H'],spr:true,gen(R,d){
  const a=R.i(2,7), b=R.i(2,7), k=R.i(4,15);
  const total=(a+b)*k, big=Math.max(a,b)*k;
  return{stem:`A recipe uses flour and sugar in a ratio of ${a} to ${b} by weight. A baker uses a total of ${total} ounces of flour and sugar combined. How many ounces of ${a>=b?'flour':'sugar'} does the baker use?`,
    opts:mkOpts(R,big,[Math.min(a,b)*k,total/2,big+k,k]),
    exp:`The ${a} : ${b} ratio splits the total into ${a+b} parts, so each part is ${total} &divide; ${a+b} = ${k} ounces. The larger share is ${Math.max(a,b)} &times; ${k} = ${big} ounces.`};
}},

{id:'psd-bestfit',dom:'PSD',diffs:['M','H'],spr:true,gen(R,d){
  const m=R.i(2,9), b=R.i(5,40), x=R.i(6,20);
  const y=m*x+b;
  return{stem:`A line of best fit for a scatterplot of a plant's height <i>y</i> (in centimeters) versus time <i>x</i> (in weeks) is given by <i>y</i> = ${m}<i>x</i> + ${b}. Based on the model, what is the predicted height, in centimeters, at week ${x}?`,
    opts:mkOpts(R,y,[m*x,y+m,b,m+b]),
    exp:`Substitute <i>x</i> = ${x}: <i>y</i> = ${m}(${x}) + ${b} = ${y} centimeters.`};
}},

{id:'psd-spread',dom:'PSD',diffs:['M','H'],spr:false,gen(R,d){
  const c=R.i(20,30);
  const A=[c-1,c,c,c+1], B=[c-9,c-3,c+3,c+9];
  return{stem:`Data set A: ${A.join(', ')}<br>Data set B: ${B.join(', ')}<br><br>The two data sets have the same mean. Which statement correctly compares their standard deviations?`,
    opts:mkOpts(R,`The standard deviation of data set B is greater than that of data set A.`,[
      `The standard deviation of data set A is greater than that of data set B.`,
      `The standard deviations are equal.`,
      `The standard deviation cannot be compared without knowing the medians.`]),
    exp:`Standard deviation measures spread about the mean. The values in B are much farther from the mean of ${c} than the values in A, so B has the greater standard deviation.`};
}},

{id:'psd-sampling',dom:'PSD',diffs:['M','H'],spr:false,gen(R,d){
  const n=R.i(2,6)*100, p=R.i(30,70), moe=round2(R.i(20,40)/10);
  return{stem:`A researcher surveyed a random sample of ${n} students from a large university and found that ${p}% of them own a bicycle, with an associated margin of error of ${moe}%. Which conclusion is best supported?`,
    opts:mkOpts(R,`It is plausible that between ${round2(p-moe)}% and ${round2(p+moe)}% of all students at the university own a bicycle.`,[
      `Exactly ${p}% of all students at the university own a bicycle.`,
      `The result can be generalized to students at every university.`,
      `Increasing the sample size would increase the margin of error.`]),
    exp:`A random sample supports an inference about the population it was drawn from &mdash; here, students at that university. The margin of error gives a plausible interval: ${p}% &plusmn; ${moe}%.`};
}},

{id:'psd-percent-of',dom:'PSD',diffs:['E','M'],spr:true,gen(R,d){
  const p=R.pick([15,20,24,30,35,45]), total=R.i(2,9)*100;
  const ans=total*p/100;
  return{stem:`At a school, ${p}% of the ${total} students take a music class. How many students take a music class?`,
    opts:mkOpts(R,ans,[total-ans,p,round2(total*p/1000),ans*2]),
    exp:`${p}% of ${total} = ${(p/100).toFixed(2)} &times; ${total} = ${ans} students.`};
}},

{id:'psd-density',dom:'PSD',diffs:['M','H'],spr:true,gen(R,d){
  const speed=R.i(40,70), hours=R.i(2,6), miles=speed*hours;
  const mpg=R.pick([20,25,30,35]);
  const gal=miles/mpg;
  if(!Number.isInteger(gal))return this.gen(R,d);
  return{stem:`A car travels at a constant speed of ${speed} miles per hour for ${hours} hours. The car's fuel efficiency is ${mpg} miles per gallon. How many gallons of fuel does the car use during this trip?`,
    opts:mkOpts(R,gal,[miles,gal*2,round2(mpg/speed),gal+1]),
    exp:`Distance = ${speed} &times; ${hours} = ${miles} miles. Fuel = ${miles} &divide; ${mpg} = ${gal} gallons.`};
}}
];

{id:'geo-similar',dom:'GEO',diffs:['E','M','H'],spr:true,gen(R,d){
  const k=R.i(2,5), a=R.i(3,9), b=R.i(4,12);
  const A=a*k, B=b*k;
  return{stem:`Triangle <i>ABC</i> is similar to triangle <i>DEF</i>, where side <i>AB</i> corresponds to side <i>DE</i> and side <i>BC</i> corresponds to side <i>EF</i>. If <i>AB</i> = ${a}, <i>BC</i> = ${b}, and <i>DE</i> = ${A}, what is the length of <i>EF</i>?`,
    opts:mkOpts(R,B,[b,B+k,A,b*k+1]),
    exp:`The scale factor is ${A}/${a} = ${k}. So <i>EF</i> = ${k} &times; ${b} = ${B}.`};
}},

{id:'geo-trig-ratio',dom:'GEO',diffs:['M','H'],spr:false,gen(R,d){
  const [a,b,c]=R.pick([[3,4,5],[6,8,10],[5,12,13],[8,15,17],[9,12,15],[7,24,25]]);
  const which=R.pick(['sin','cos','tan']);
  const val=which==='sin'?fracStr(a,c):which==='cos'?fracStr(b,c):fracStr(a,b);
  return{stem:`In right triangle <i>XYZ</i>, angle <i>Z</i> is the right angle. The leg opposite angle <i>X</i> has length ${a}, the leg adjacent to angle <i>X</i> has length ${b}, and the hypotenuse has length ${c}. What is the value of ${which}(<i>X</i>)?`,
    opts:mkOpts(R,val,[fracStr(b,c),fracStr(a,c),fracStr(b,a)]),
    exp:`sin = opposite/hypotenuse = ${a}/${c}; cos = adjacent/hypotenuse = ${b}/${c}; tan = opposite/adjacent = ${a}/${b}. So ${which}(<i>X</i>) = ${val}.`};
}},

{id:'geo-cofunction',dom:'GEO',diffs:['M','H'],spr:true,gen(R,d){
  const a=R.i(10,80);
  return{stem:`If sin(${a}&deg;) = cos(<i>k</i>&deg;) and 0 &lt; <i>k</i> &lt; 90, what is the value of <i>k</i>?`,
    opts:mkOpts(R,90-a,[a,180-a,a/2,90+a]),
    exp:`Sine and cosine are cofunctions: sin(&theta;) = cos(90&deg; &minus; &theta;). So <i>k</i> = 90 &minus; ${a} = ${90-a}.`};
}},

{id:'geo-circle-area',dom:'GEO',diffs:['E','M'],spr:true,gen(R,d){
  const r=R.i(2,30);
  const askC=R.f()<0.5;
  if(askC)return{stem:`A circle has a radius of ${r}. What is the circumference of the circle, in terms of &pi;?`,
    opts:mkOpts(R,`${2*r}&pi;`,[`${r*r}&pi;`,`${r}&pi;`,`${4*r}&pi;`]),
    exp:`Circumference = 2&pi;<i>r</i> = 2&pi;(${r}) = ${2*r}&pi;.`};
  return{stem:`A circle has an area of ${r*r}&pi; square units. What is the radius of the circle?`,
    opts:mkOpts(R,r,[r*r,2*r,r/2,r+2]),
    exp:`Area = &pi;<i>r</i><sup>2</sup> = ${r*r}&pi;, so <i>r</i><sup>2</sup> = ${r*r} and <i>r</i> = ${r}.`};
}},

{id:'geo-circle-eq',dom:'GEO',diffs:['M','H'],spr:true,gen(R,d){
  const h=R.nz(-7,7), k=R.nz(-7,7), r=R.i(2,9);
  const askR=R.f()<0.5;
  const eq=`(${V('x')} ${h<0?'+ '+Math.abs(h):'&minus; '+h})<sup>2</sup> + (${V('y')} ${k<0?'+ '+Math.abs(k):'&minus; '+k})<sup>2</sup> = ${r*r}`;
  if(askR)return{stem:`The equation ${eq} defines a circle in the <i>xy</i>-plane. What is the radius of the circle?`,
    opts:mkOpts(R,r,[r*r,2*r,Math.abs(h),r/2]),
    exp:`In the form (<i>x</i> &minus; <i>h</i>)<sup>2</sup> + (<i>y</i> &minus; <i>k</i>)<sup>2</sup> = <i>r</i><sup>2</sup>, the right side is <i>r</i><sup>2</sup> = ${r*r}, so <i>r</i> = ${r}.`};
  return{stem:`The equation ${eq} defines a circle in the <i>xy</i>-plane. What is the center of the circle?`,
    opts:mkOpts(R,`(${h}, ${k})`,[`(${-h}, ${-k})`,`(${k}, ${h})`,`(${h}, ${-k})`]),
    exp:`The center is (<i>h</i>, <i>k</i>) = (${h}, ${k}) and the radius is ${r}.`};
}},

{id:'geo-volume',dom:'GEO',diffs:['M','H'],spr:false,gen(R,d){
  const kind=R.pick(['cylinder','cone','sphere']);
  const r=R.i(2,8), h=R.i(3,12);
  if(kind==='cylinder'){const v=r*r*h;
    return{stem:`A right circular cylinder has a radius of ${r} and a height of ${h}. What is the volume of the cylinder, in terms of &pi;?`,
      opts:mkOpts(R,`${v}&pi;`,[`${round2(v/3)}&pi;`,`${2*r*h}&pi;`,`${r*h}&pi;`]),
      exp:`<i>V</i> = &pi;<i>r</i><sup>2</sup><i>h</i> = &pi;(${r})<sup>2</sup>(${h}) = ${v}&pi;.`};}
  if(kind==='cone'){const h2=3*R.i(1,4), v=r*r*h2/3;
    return{stem:`A right circular cone has a radius of ${r} and a height of ${h2}. What is the volume of the cone, in terms of &pi;?`,
      opts:mkOpts(R,`${v}&pi;`,[`${r*r*h2}&pi;`,`${round2(v/2)}&pi;`,`${r*h2}&pi;`]),
      exp:`<i>V</i> = (1/3)&pi;<i>r</i><sup>2</sup><i>h</i> = (1/3)&pi;(${r})<sup>2</sup>(${h2}) = ${v}&pi;.`};}
  const rr=R.pick([3,6,9]); const v=fracStr(4*rr*rr*rr,3);
  return{stem:`A sphere has a radius of ${rr}. What is the volume of the sphere, in terms of &pi;?`,
    opts:mkOpts(R,`${v}&pi;`,[`${4*rr*rr}&pi;`,`${rr*rr*rr}&pi;`,`${fracStr(4*rr*rr,3)}&pi;`]),
    exp:`<i>V</i> = (4/3)&pi;<i>r</i><sup>3</sup> = (4/3)&pi;(${rr})<sup>3</sup> = ${v}&pi;.`};
}},

{id:'geo-parallel',dom:'GEO',diffs:['E','M'],spr:true,gen(R,d){
  const a=R.i(35,75);
  const graph=graphicCard(
    parallelLinesSVG(a,'co'),
    'Lines m and n are parallel; the marked angles are on the same side of transversal t.'
  );
  return{stem:`${graph}In the figure, lines <i>m</i> and <i>n</i> are parallel and are cut by transversal <i>t</i>. One exterior angle measures ${a}&deg;. What is the measure, in degrees, of the exterior angle marked <i>x</i>&deg; on the same side of the transversal?`,
    opts:mkOpts(R,180-a,[a,90-a,2*a,360-a]),
    exp:`Same-side exterior angles formed by a transversal cutting parallel lines are supplementary. Therefore, ${V('x')} = 180 &minus; ${a} = ${180-a}.`,
    alt:`Two parallel horizontal lines m and n are cut by a slanted transversal t. An exterior angle above line m measures ${a} degrees, and the same-side exterior angle below line n is labeled x degrees.`};
}},

{id:'geo-triangle-angles',dom:'GEO',diffs:['E','M','H'],spr:true,gen(R,d){
  const x=R.i(10,40), a=R.i(2,4), b=R.i(5,25), c=R.i(20,60);
  const third=180-(a*x+b)-c;
  if(third<=0||third>=180)return this.gen(R,d);
  return{stem:`In a triangle, the measures of two of the angles are (${a}<i>x</i> + ${b})&deg; and ${c}&deg;. The third angle measures ${third}&deg;. What is the value of <i>x</i>?`,
    opts:mkOpts(R,x,[x+2,x-1,180-x,a*x+b]),
    exp:`The angles of a triangle sum to 180&deg;: (${a}<i>x</i> + ${b}) + ${c} + ${third} = 180, so ${a}<i>x</i> = ${a*x} and <i>x</i> = ${x}.`};
}},

{id:'geo-special-right',dom:'GEO',diffs:['M','H'],spr:false,gen(R,d){
  const leg=R.i(2,9);
  const which=R.pick(['45','30']);
  if(which==='45')return{stem:`In a right triangle, the two acute angles each measure 45&deg; and each leg has length ${leg}. What is the length of the hypotenuse?`,
    opts:mkOpts(R,`${leg}&radic;<span class="rad">2</span>`,[`${leg}&radic;<span class="rad">3</span>`,`${2*leg}`,`${leg}/&radic;<span class="rad">2</span>`]),
    exp:`In a 45&deg;-45&deg;-90&deg; triangle the sides are in the ratio 1 : 1 : &radic;2, so the hypotenuse is ${leg}&radic;2.`};
  return{stem:`In a 30&deg;-60&deg;-90&deg; triangle, the side opposite the 30&deg; angle has length ${leg}. What is the length of the side opposite the 60&deg; angle?`,
    opts:mkOpts(R,`${leg}&radic;<span class="rad">3</span>`,[`${2*leg}`,`${leg}&radic;<span class="rad">2</span>`,`${leg}/2`]),
    exp:`The sides are in the ratio 1 : &radic;3 : 2 (short leg : long leg : hypotenuse), so the long leg is ${leg}&radic;3.`};
}},

{id:'geo-arc',dom:'GEO',diffs:['H'],spr:false,gen(R,d){
  const r=R.i(3,12), deg=R.pick([30,45,60,90,120,135,150,180]);
  const arc=fracStr(deg*2*r,360);
  return{stem:`In a circle with radius ${r}, a central angle measures ${deg}&deg;. What is the length of the arc it intercepts, in terms of &pi;?`,
    opts:mkOpts(R,`${arc}&pi;`,[`${fracStr(deg*r*r,360)}&pi;`,`${2*r}&pi;`,`${fracStr(deg,360)}&pi;`]),
    exp:`Arc length = (${deg}/360) &times; 2&pi;(${r}) = ${arc}&pi;.`};
}},

{id:'geo-pyth',dom:'GEO',diffs:['E','M'],spr:true,gen(R,d){
  const base=R.pick([[3,4,5],[5,12,13],[8,15,17],[7,24,25],[20,21,29],[9,40,41]]),k=R.i(1,5),a=base[0]*k,b=base[1]*k,c=base[2]*k;
  return{stem:`A right triangle has legs of length ${a} and ${b}. What is the length of the hypotenuse?`,
    opts:mkOpts(R,c,[a+b,c+1,Math.abs(b-a),c-2]),
    exp:`<i>c</i><sup>2</sup> = ${a}<sup>2</sup> + ${b}<sup>2</sup> = ${a*a} + ${b*b} = ${c*c}, so <i>c</i> = ${c}.`};
}},

{id:'geo-rect',dom:'GEO',diffs:['M','H'],spr:true,gen(R,d){
  const w=R.i(3,12), extra=R.i(2,9), l=w+extra;
  const per=2*(l+w);
  return{stem:`A rectangle has a perimeter of ${per}. Its length is ${extra} more than its width. What is the area of the rectangle?`,
    opts:mkOpts(R,l*w,[per,l+w,2*l*w,(l*w)+extra]),
    exp:`If the width is <i>w</i>, then 2(<i>w</i> + ${extra}) + 2<i>w</i> = ${per}, so <i>w</i> = ${w} and the length is ${l}. Area = ${l} &times; ${w} = ${l*w}.`};
}}
];

/* ============================================================
   ADDITIONAL VISUALS  (charts, diagrams, curves)
   ============================================================ */
function axesFrame(W,H,p,xTicks,yTicks,xLab,yLab){
  let g=`<line x1="${p}" y1="${H-p}" x2="${W-p}" y2="${H-p}" stroke="#12233C" stroke-width="2"/>`;
  g+=`<line x1="${p}" y1="${p-8}" x2="${p}" y2="${H-p}" stroke="#12233C" stroke-width="2"/>`;
  if(xLab)g+=svgText((W+p)/2,H-8,xLab,12,'middle',600);
  if(yLab)g+=`<text x="14" y="${H/2}" transform="rotate(-90 14 ${H/2})" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" font-weight="600" fill="#12233C">${yLab}</text>`;
  return g;
}
/* grouped bar chart: labels + up to 2 series */
function barChartSVG(labels,s1,s2,names,xLab,yLab){
  const W=560,H=310,p=52,max=Math.max(...s1,...(s2||[0]))*1.15;
  const bw=(W-2*p)/labels.length;
  let g=axesFrame(W,H,p,0,0,xLab,yLab);
  const Y=v=>H-p-v/max*(H-2*p);
  for(let i=0;i<=5;i++){const v=Math.round(max/5*i),yy=Y(v);
    g+=`<line x1="${p}" y1="${yy}" x2="${W-p}" y2="${yy}" stroke="#E6EAF1"/>`+svgText(p-9,yy+4,v,10,'end');}
  labels.forEach((L,i)=>{
    const cx=p+i*bw;
    if(s2){
      const w=(bw-18)/2;
      g+=`<rect x="${cx+6}" y="${Y(s1[i])}" width="${w}" height="${H-p-Y(s1[i])}" fill="#2447C9"/>`;
      g+=`<rect x="${cx+10+w}" y="${Y(s2[i])}" width="${w}" height="${H-p-Y(s2[i])}" fill="#F2B705"/>`;
    }else{
      g+=`<rect x="${cx+bw*.2}" y="${Y(s1[i])}" width="${bw*.6}" height="${H-p-Y(s1[i])}" fill="#2447C9"/>`;
      g+=svgText(cx+bw/2,Y(s1[i])-6,s1[i],11,'middle',700);
    }
    g+=svgText(cx+bw/2,H-p+18,L,11);
  });
  if(s2&&names){
    g+=`<rect x="${W-190}" y="16" width="12" height="12" fill="#2447C9"/>`+svgText(W-172,27,names[0],11,'start',600);
    g+=`<rect x="${W-100}" y="16" width="12" height="12" fill="#F2B705"/>`+svgText(W-82,27,names[1],11,'start',600);
  }
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Bar graph">${g}</svg>`;
}
/* line chart with markers */
function lineChartSVG(labels,vals,xLab,yLab){
  const W=560,H=300,p=54,max=Math.max(...vals)*1.2,min=0;
  const X=i=>p+i*(W-2*p)/(labels.length-1),Y=v=>H-p-(v-min)/(max-min)*(H-2*p);
  let g=axesFrame(W,H,p,0,0,xLab,yLab);
  for(let i=0;i<=5;i++){const v=Math.round(max/5*i),yy=Y(v);g+=`<line x1="${p}" y1="${yy}" x2="${W-p}" y2="${yy}" stroke="#E6EAF1"/>`+svgText(p-9,yy+4,v,10,'end');}
  g+=`<polyline points="${vals.map((v,i)=>`${X(i)},${Y(v)}`).join(' ')}" fill="none" stroke="#2447C9" stroke-width="4" stroke-linejoin="round"/>`;
  vals.forEach((v,i)=>{g+=`<circle cx="${X(i)}" cy="${Y(v)}" r="5" fill="#fff" stroke="#2447C9" stroke-width="3"/>`+svgText(X(i),H-p+18,labels[i],11)+svgText(X(i),Y(v)-12,v,10,'middle',700);});
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Line graph of values over time">${g}</svg>`;
}
/* exponential curve with two labeled points */
function expCurveSVG(A,g0,decay,xMax,xLab,yLab){
  const W=560,H=300,p=54;
  const f=x=>decay?A*Math.pow(g0,-x):A*Math.pow(g0,x);
  const yMax=Math.max(f(0),f(xMax))*1.15;
  const X=x=>p+x/xMax*(W-2*p),Y=y=>H-p-y/yMax*(H-2*p);
  let g=axesFrame(W,H,p,0,0,xLab,yLab);
  for(let i=0;i<=4;i++){const v=Math.round(yMax/4*i),yy=Y(v);g+=`<line x1="${p}" y1="${yy}" x2="${W-p}" y2="${yy}" stroke="#E6EAF1"/>`+svgText(p-9,yy+4,v,10,'end');}
  for(let i=0;i<=xMax;i++)g+=svgText(X(i),H-p+18,i,10);
  const pts=[];for(let x=0;x<=xMax;x+=xMax/160)pts.push(`${X(x)},${Y(f(x))}`);
  g+=`<polyline points="${pts.join(' ')}" fill="none" stroke="#2447C9" stroke-width="4"/>`;
  g+=`<circle cx="${X(0)}" cy="${Y(f(0))}" r="5" fill="#BE2F2F" stroke="#fff" stroke-width="2"/>`;
  g+=`<circle cx="${X(1)}" cy="${Y(f(1))}" r="5" fill="#BE2F2F" stroke="#fff" stroke-width="2"/>`;
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Exponential curve">${g}</svg>`;
}
/* cubic / polynomial with integer zeros */
function polyGraphSVG(roots,a){
  const W=560,H=310,p=40,x0=-6,x1=6,y0=-10,y1=10;
  const X=x=>p+(x-x0)/(x1-x0)*(W-2*p),Y=y=>H-p-(y-y0)/(y1-y0)*(H-2*p);
  let g='';
  for(let i=-6;i<=6;i++){g+=`<line x1="${X(i)}" y1="${p}" x2="${X(i)}" y2="${H-p}" stroke="#E6EAF1"/>`;if(i!==0)g+=svgText(X(i),Y(0)+16,i,10);}
  for(let j=-10;j<=10;j+=2){g+=`<line x1="${p}" y1="${Y(j)}" x2="${W-p}" y2="${Y(j)}" stroke="#E6EAF1"/>`;}
  g+=`<line x1="${p}" y1="${Y(0)}" x2="${W-p}" y2="${Y(0)}" stroke="#12233C" stroke-width="2"/><line x1="${X(0)}" y1="${p}" x2="${X(0)}" y2="${H-p}" stroke="#12233C" stroke-width="2"/>`;
  const f=x=>a*roots.reduce((acc,r)=>acc*(x-r),1);
  const pts=[];for(let x=x0;x<=x1;x+=.05){const y=f(x);if(y>=y0-1&&y<=y1+1)pts.push(`${X(x)},${Y(y)}`);else pts.push('');}
  g+=`<polyline points="${pts.filter(Boolean).join(' ')}" fill="none" stroke="#2447C9" stroke-width="4"/>`;
  roots.forEach(r=>{g+=`<circle cx="${X(r)}" cy="${Y(0)}" r="6" fill="#F2B705" stroke="#12233C" stroke-width="2"/>`;});
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Graph of a polynomial with marked x-intercepts">${g}</svg>`;
}
/* circle on the coordinate plane */
function circleCoordSVG(h,k,r){
  const W=560,H=320,p=40,x0=-8,x1=8,y0=-8,y1=8;
  const X=x=>p+(x-x0)/(x1-x0)*(W-2*p),Y=y=>H-p-(y-y0)/(y1-y0)*(H-2*p);
  let g='';
  for(let i=-8;i<=8;i++){g+=`<line x1="${X(i)}" y1="${p}" x2="${X(i)}" y2="${H-p}" stroke="#E6EAF1"/><line x1="${p}" y1="${Y(i)}" x2="${W-p}" y2="${Y(i)}" stroke="#E6EAF1"/>`;if(i!==0&&i%2===0){g+=svgText(X(i),Y(0)+16,i,10);g+=svgText(X(0)-8,Y(i)+4,i,10,'end');}}
  g+=`<line x1="${p}" y1="${Y(0)}" x2="${W-p}" y2="${Y(0)}" stroke="#12233C" stroke-width="2"/><line x1="${X(0)}" y1="${p}" x2="${X(0)}" y2="${H-p}" stroke="#12233C" stroke-width="2"/>`;
  const rx=(X(1)-X(0))*r;
  g+=`<circle cx="${X(h)}" cy="${Y(k)}" r="${rx}" fill="#E8EDFA" fill-opacity=".55" stroke="#2447C9" stroke-width="4"/>`;
  g+=`<circle cx="${X(h)}" cy="${Y(k)}" r="4" fill="#BE2F2F"/>`;
  g+=`<line x1="${X(h)}" y1="${Y(k)}" x2="${X(h+r)}" y2="${Y(k)}" stroke="#BE2F2F" stroke-width="2" stroke-dasharray="5 4"/>`;
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Circle graphed on a coordinate plane">${g}</svg>`;
}
/* parallel lines cut by a transversal */
function parallelLinesSVG(ang,relation='alt'){

  g+=`<line x1="150" y1="30" x2="410" y2="260" stroke="#BE2F2F" stroke-width="3"/>`;
  g+=svgText(516,94,'m',14,'start',700)+svgText(516,204,'n',14,'start',700)+svgText(420,270,'t',14,'start',700);
  g+=svgText(topX+38,70,`${ang}&#176;`,15,'middle',700);
  g+=svgText(xLabelX,230,'x&#176;',15,'middle',700);
  g+=`<path d="M${topX+28} 90 Q${topX+24} 73 ${topX+12} 62" fill="none" stroke="#12233C" stroke-width="2"/>`;
  if(sameSide){
    g+=`<path d="M${bottomX+28} 200 Q${bottomX+25} 218 ${bottomX+13} 231" fill="none" stroke="#12233C" stroke-width="2"/>`;

}

/* composite solid: cylinder with a cone on top */
function coneCylinderSVG(r,hc,hn){
  const W=520,H=320,cx=260,ry=26,base=270,top=base-110;
  let g=`<path d="M${cx-90} ${top} V${base} a90 ${ry} 0 0 0 180 0 V${top}" fill="#E8EDFA" stroke="#2447C9" stroke-width="4"/>`;
  g+=`<ellipse cx="${cx}" cy="${top}" rx="90" ry="${ry}" fill="#F4F7FF" stroke="#2447C9" stroke-width="4"/>`;
  g+=`<path d="M${cx-90} ${top} L${cx} ${top-95} L${cx+90} ${top}" fill="#FFF6DA" stroke="#F2B705" stroke-width="4"/>`;
  g+=`<line x1="${cx+120}" y1="${top}" x2="${cx+120}" y2="${base}" stroke="#12233C" stroke-width="2"/>`;
  g+=svgText(cx+142,(top+base)/2,`h = ${hc}`,13,'start',600);

/* dot/number-line style shading for inequality solution */
function numberLineSVG(lo,hi,a,dir){
  const W=560,H=140,p=50,X=x=>p+(x-lo)/(hi-lo)*(W-2*p);
  let g=`<line x1="${p}" y1="80" x2="${W-p}" y2="80" stroke="#12233C" stroke-width="2"/>`;
  for(let i=lo;i<=hi;i++){g+=`<line x1="${X(i)}" y1="74" x2="${X(i)}" y2="86" stroke="#12233C"/>`+svgText(X(i),106,i,11);}
  const x2=dir==='ge'?W-p:p;
  g+=`<line x1="${X(a)}" y1="80" x2="${x2}" y2="80" stroke="#2447C9" stroke-width="6"/>`;
  g+=`<circle cx="${X(a)}" cy="80" r="8" fill="#2447C9"/>`;
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Number line with a shaded solution region">${g}</svg>`;
}

{id:'c-adv-quad-linear',dom:'ADV',diffs:['H'],spr:true,gen(R,d){
