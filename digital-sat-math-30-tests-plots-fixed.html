    exp:`In a right triangle the two acute angles are complementary, and the sine of an angle equals the cosine of its complement: sin(&#952;) = cos(90&#176; &minus; &#952;). Here 90 &minus; (90 &minus; ${a}) = ${a}, so cos((90 &minus; ${a})&#176;) = sin(${a}&#176;) = ${val}.`};
}},
/* --- coordinate midpoint / segment in context --- */
{id:'c-geo-midpoint',dom:'GEO',diffs:['M','H'],spr:true,gen(R,d){
  const x1=R.i(-5,0),y1=R.i(-4,1),dx=R.pick([2,4,6]),dy=R.pick([2,4,6]);
  const x2=x1+dx,y2=y1+dy,mx=(x1+x2)/2,my=(y1+y2)/2;
  const m=dy/dx,b=y1-m*x1;
  const g=graphicCard(lineGraphSVG(m,b,[[x1,y1,'P'],[x2,y2,'Q']]),'Points P and Q are the endpoints of the segment.');
  return{
    stem:`${g}A surveyor marks two stakes on a coordinate map at points P and Q, shown on the grid, where each unit represents 10 meters. She needs to place a third stake at the <b>midpoint</b> of segment PQ. What is the sum of the coordinates of that midpoint?`,
    opts:mkOpts(R,mx+my,[mx*my,x2+y2,mx+my+1,(x2-x1)+(y2-y1)]),
    exp:`The midpoint is the average of the coordinates: ((${x1} + ${x2})/2, (${y1} + ${y2})/2) = (${mx}, ${my}). The requested sum is ${mx} + ${my} = ${mx+my}. Subtracting coordinates would give the distance components, not the midpoint.`,
    alt:`Coordinate grid with points P at (${x1}, ${y1}) and Q at (${x2}, ${y2}) on a line.`};
}}
);

/* ============================================================
   ADDITIONAL SET C MODELS — widen the pool so no test repeats
   ============================================================ */
T_ALG.push(
{id:'c-alg-nosolution',dom:'ALG',diffs:['H'],spr:true,gen(R,d){
  const a=R.i(2,6),b=R.i(2,9),k=R.i(2,5),c=R.i(3,12);
  const A=a*k,B=b*k;
  return{
    stem:`A civil engineer writes the system of equations ${linexp(a,0,V('x'))} + ${b}${V('y')} = ${c} and ${linexp(A,0,V('x'))} + ${B}${V('y')} = ${V('t')}, where ${V('t')} is a constant. She finds that the system has <b>no solution</b>. What is the value of ${V('t')}, if it is known that ${V('t')} &ne; ${c*k}? Enter the one value of ${V('t')} that must be excluded &mdash; that is, the value for which the system would instead have infinitely many solutions.`,
    opts:mkOpts(R,c*k,[c,c+k,a*k+b*k,c/k]),
    exp:`Multiplying the first equation by ${k} gives ${A}${V('x')} + ${B}${V('y')} = ${c*k}. The two left sides are now identical, so the lines are parallel. If ${V('t')} = ${c*k} the equations describe the <i>same</i> line (infinitely many solutions); for every other value of ${V('t')} the lines never meet (no solution).`};
}},
{id:'c-alg-table-linear',dom:'ALG',diffs:['M','H'],spr:true,gen(R,d){
  const m=R.nz(-4,5),b=R.i(-6,8),xs=[1,3,5,7];
  const tab=table([`${V('x')}`,`${V('f')}(${V('x')})`],xs.map(x=>[x,m*x+b]));
  const ask=R.pick([9,11,12]);
  return{
    stem:`${tab}A materials scientist records four measurements of a linear function ${V('f')}, shown in the table. The values increase at a constant rate, so ${V('f')} can be written as ${V('f')}(${V('x')}) = ${V('m')}${V('x')} + ${V('b')}. What is the value of ${V('f')}(${ask})?`,
    opts:mkOpts(R,m*ask+b,[m*ask,m+b,b*ask,m*ask+b+m]),
    exp:`The rate of change is (${m*xs[1]+b} &minus; ${m*xs[0]+b}) / (${xs[1]} &minus; ${xs[0]}) = ${m}. Back-solving with ${V('x')} = ${xs[0]}: ${m*xs[0]+b} = ${m}(${xs[0]}) + ${V('b')}, so ${V('b')} = ${b}. Then ${V('f')}(${ask}) = ${m}(${ask}) + ${b} = ${m*ask+b}.`};
}}
);

T_ADV.push(
{id:'c-adv-radical',dom:'ADV',diffs:['H'],spr:true,gen(R,d){
  const x=R.i(3,12),a=R.i(1,6),b=R.i(1,4);
  const inner=a*x+b,r=Math.sqrt(inner);
  if(!Number.isInteger(r))return this.gen(R,d);
  return{
    stem:`A technician models the settling time of a component, in seconds, by the expression &radic;<span class="rad">${a}${V('t')} + ${b}</span>, where ${V('t')} is the load index. On one trial the settling time was exactly ${r} seconds. What was the value of ${V('t')} for that trial?`,
    opts:mkOpts(R,x,[r,inner,x+1,r*r+b]),
    exp:`Square both sides: ${a}${V('t')} + ${b} = ${r}<sup>2</sup> = ${inner}. Then ${a}${V('t')} = ${inner-b}, so ${V('t')} = ${x}. Check by substituting back &mdash; squaring can introduce extraneous solutions, and &radic;<span class="rad">${inner}</span> = ${r} confirms this one is valid.`};
}},
{id:'c-adv-vertex-form',dom:'ADV',diffs:['H'],spr:true,gen(R,d){
  const h=R.nz(-4,4),k=R.i(-6,6);
  const b=-2*h,c=h*h+k;
  return{
    stem:`An analyst rewrites the quadratic ${V('f')}(${V('x')}) = ${quad(1,b,c,V('x'))} in the form ${V('f')}(${V('x')}) = (${V('x')} &minus; ${V('h')})<sup>2</sup> + ${V('k')} in order to read off the minimum value directly. What is the value of ${V('k')}?`,
    opts:mkOpts(R,k,[h,c,-k,h+k]),
    exp:`Complete the square: ${V('x')}<sup>2</sup> ${term(b,V('x'))} = (${V('x')} ${h<0?'+ '+Math.abs(h):'&minus; '+h})<sup>2</sup> &minus; ${h*h}. So ${V('f')}(${V('x')}) = (${V('x')} ${h<0?'+ '+Math.abs(h):'&minus; '+h})<sup>2</sup> &minus; ${h*h} + ${c} = (${V('x')} ${h<0?'+ '+Math.abs(h):'&minus; '+h})<sup>2</sup> ${k<0?'&minus; '+Math.abs(k):'+ '+k}. Therefore ${V('k')} = ${k}, which is also the minimum value of ${V('f')}.`};
}},
{id:'c-adv-geo-sequence',dom:'ADV',diffs:['M','H'],spr:true,gen(R,d){
  const a=R.pick([2,3,5]),r=R.pick([2,3]),n=R.i(4,6);
  const ans=a*Math.pow(r,n-1);
  return{
    stem:`A biologist starts a culture with ${a} colonies. Each day, every colony splits so that the number of colonies is multiplied by ${r}. The counts on successive days form a geometric sequence whose first term is the count on day 1. What is the ${n}th term of that sequence &mdash; that is, the number of colonies on day ${n}?`,
    opts:mkOpts(R,ans,[a*r*n,a*Math.pow(r,n),a+r*(n-1),a*r*(n-1)]),
    exp:`A geometric sequence has ${V('a')}<sub>${V('n')}</sub> = ${V('a')}<sub>1</sub> &middot; ${V('r')}<sup>${V('n')} &minus; 1</sup>. Here ${V('a')}<sub>1</sub> = ${a} and ${V('r')} = ${r}, so the day-${n} count is ${a} &middot; ${r}<sup>${n-1}</sup> = ${ans}. Using an exponent of ${n} instead of ${n} &minus; 1 overshoots by one full day.`};
}}
);

T_PSD.push(
{id:'c-psd-stdev',dom:'PSD',diffs:['H'],spr:false,gen(R,d){
  const center=R.i(40,70);
  const A=[center-2,center-1,center,center+1,center+2];
  const B=[center-14,center-7,center,center+7,center+14];
  const tab=table(['Data set','Values'],[['Set A',A.join(', ')],['Set B',B.join(', ')]]);
  return{
    stem:`${tab}Two data sets, each with five values, are shown in the table. A statistics student notices that both sets have the same mean and the same median. Which statement correctly compares the <b>standard deviations</b> of the two sets?`,
    opts:mkOpts(R,'The standard deviation of Set B is greater, because its values are spread farther from the mean.',[
      'The standard deviation of Set A is greater, because it contains smaller numbers.',
      'The standard deviations are equal, because the means are equal.',
      'The standard deviation of Set B is smaller, because its values increase by a constant amount.']),
    exp:`Standard deviation measures spread about the mean, not center. Both sets have mean ${center}, but Set A's values sit within 2 units of ${center} while Set B's stretch 14 units away. Set B therefore has the greater standard deviation. Equal means say nothing about spread.`};
}},
{id:'c-psd-prob-bar',dom:'PSD',diffs:['M','H'],spr:true,gen(R,d){
  const labs=['Blue','Green','Red','Gray'];
  const vals=labs.map(()=>R.i(10,40)),tot=vals.reduce((a,b)=>a+b,0);
  const i=R.i(0,3);
  const g=graphicCard(barChartSVG(labs,vals,null,null,'color chosen','number of respondents'),'Each bar gives the number of respondents choosing that color.');
  const ans=fracStr(vals[i],tot);
  return{
    stem:`${g}A survey asked ${tot} residents of ${R.pick(CITYZ)} to name their preferred color for a new bus fleet; the results are shown in the bar graph. If one of the surveyed residents is selected at random, what is the probability that the person chose ${labs[i]}? Give your answer as a fraction.`,
    opts:mkOpts(R,ans,[fracStr(vals[i],tot-vals[i]),fracStr(1,4),fracStr(tot,vals[i])]),
    exp:`Read the ${labs[i]} bar: ${vals[i]} respondents. The total surveyed is ${vals.join(' + ')} = ${tot}. The probability is ${vals[i]}/${tot} = ${ans}. Assuming each of the four colors is equally likely (1/4) ignores the graph.`,
    alt:`Bar graph of color preferences: ${labs.map((l,j)=>l+': '+vals[j]).join(', ')}; total ${tot}.`};
}}
);

T_GEO.push(
{id:'c-geo-circle-complete',dom:'GEO',diffs:['H'],spr:true,gen(R,d){
  const h=R.nz(-5,5),k=R.nz(-5,5),r=R.i(2,7);
  const b=-2*h,c=-2*k,e=r*r-h*h-k*k;
  return{
    stem:`In the ${V('xy')}-plane, a circular boundary is described by the equation ${V('x')}<sup>2</sup> + ${V('y')}<sup>2</sup> ${term(b,V('x'))} ${term(c,V('y'))} = ${e}. A planner needs the radius of the boundary, in coordinate units. What is the radius?`,
    opts:mkOpts(R,r,[r*r,Math.abs(h)+Math.abs(k),r+1,e]),
    exp:`Complete the square in both variables: (${V('x')} ${h<0?'+ '+Math.abs(h):'&minus; '+h})<sup>2</sup> + (${V('y')} ${k<0?'+ '+Math.abs(k):'&minus; '+k})<sup>2</sup> = ${e} + ${h*h} + ${k*k} = ${r*r}. The right side is ${V('r')}<sup>2</sup>, so ${V('r')} = ${r} &mdash; not ${r*r}, which is the common slip.`};
}},
{id:'c-geo-radian',dom:'GEO',diffs:['M','H'],spr:false,gen(R,d){
  const deg=R.pick([30,45,60,120,135,150,210,240,300]);
  const g0=gcd(deg,180),n=deg/g0,dd=180/g0;
  const corr=dd===1?`${n}&pi;`:`${n===1?'':n}&pi;/${dd}`;
  return{
    stem:`A rotating radar antenna turns through an angle of ${deg}&#176; from its starting position. The control software requires all angles to be entered in <b>radians</b>. What is the radian measure of this angle?`,
    opts:mkOpts(R,corr,[`${deg}&pi;`,`${dd===1?n:`${n}/${dd}`}`,`${dd===1?'':dd}&pi;/${n}`]),
    exp:`Multiply degrees by &pi;/180: ${deg} &times; &pi;/180 = ${corr} radians. Multiplying by 180/&pi; instead converts the wrong direction.`};
}},
{id:'c-geo-triangle-area-coord',dom:'GEO',diffs:['H'],spr:true,gen(R,d){
  const b=R.i(3,8),h=R.i(3,8);
  const x1=R.i(-5,0),y1=R.i(-5,0);
  const area=b*h/2;
  const g=graphicCard(lineGraphSVG(h/b,y1-(h/b)*x1,[[x1,y1,'A'],[x1+b,y1,'B'],[x1+b,y1+h,'C']]),'Triangle ABC has a horizontal leg AB and a vertical leg BC.');
  return{
    stem:`${g}A landscape architect plots triangle ABC on a coordinate grid, where A is at (${x1}, ${y1}), B is directly to the right of A, and C is directly above B. Segment AB is ${b} units long and segment BC is ${h} units long, so angle B is a right angle. What is the <b>area</b> of triangle ABC, in square units?`,
    opts:mkOpts(R,area,[b*h,b+h,round2(Math.sqrt(b*b+h*h)),area+1]),
    exp:`With legs AB = ${b} and BC = ${h} meeting at a right angle, the area is (1/2)(base)(height) = (1/2)(${b})(${h}) = ${area} square units. Forgetting the factor of 1/2 gives ${b*h}, the area of the surrounding rectangle.`,
    alt:`Right triangle on a coordinate grid with a horizontal leg of ${b} units and a vertical leg of ${h} units.`};
}}
);

const ENRICHED_TEMPLATES=[...T_ALG,...T_ADV,...T_PSD,...T_GEO];
const NEW_TEMPLATE_IDS=new Set(ENRICHED_TEMPLATES.filter(t=>!CORE_TEMPLATE_IDS.has(t.id)).map(t=>t.id));

/* ============================================================
   TEST ASSEMBLY
   ============================================================ */
const BLUEPRINT={ALG:7,ADV:7,PSD:4,GEO:4};   // 22 questions per module
const SPR_PLAN={ALG:2,ADV:2,PSD:1,GEO:1};    // 6 student-produced responses
const DIFF_PLAN={
  m1:      {E:7,M:10,H:5},
  easy:    {E:9,M:10,H:3},
  hard:    {E:2,M:9,H:11}
};
/* Tests 21-30 run a harder mix: fewer easy items, many more hard ones. */
const ENRICHED_DIFF_PLAN={
  m1:      {E:3,M:10,H:9},
  easy:    {E:6,M:11,H:5},
  hard:    {E:0,M:6,H:16}
};

function SPR_OK(v){
  const s=String(v).replace(/<[^>]+>/g,'').trim();
  return /^-?\d+(\.\d+)?$/.test(s)||/^-?\d+\/\d+$/.test(s);
}
function TIDY(s){ // clean "+ -3" / "- -3" / "= + 4" artifacts from generated text
  if(s===null||s===undefined)return s;
  return String(s)
    .replace(/\+\s*-\s*(\d)/g,'\u2212 $1')
    .replace(/-\s*-\s*(\d)/g,'+ $1')
    .replace(/\(\s*\+\s*/g,'(')
    .replace(/\s{2,}/g,' ');
}
function stemKey(s,ans){return String(s).replace(/\s+/g,' ').trim()+'||'+String(ans);} // figure data included, so two graphs with different numbers are different questions
function buildModule(seed,kind,templates=CORE_TEMPLATES,enrichedMode=false,usedInit=null,seen=null){ // kind: 'm1' | 'easy' | 'hard'
  const R=RNG(seed);
  const plan=(enrichedMode?ENRICHED_DIFF_PLAN:DIFF_PLAN)[kind];
  // build slots
  let slots=[];
  for(const dom of Object.keys(BLUEPRINT)){
    for(let i=0;i<BLUEPRINT[dom];i++) slots.push({dom,spr:i<SPR_PLAN[dom]});
  }
  // difficulty pool
  let diffs=[];
  for(const k of ['E','M','H']) for(let i=0;i<plan[k];i++) diffs.push(k);
  diffs=R.shuffle(diffs);
  slots=R.shuffle(slots);
  slots.forEach((s,i)=>{s.diff=diffs[i];});
  // order: interleave domains, SPR questions clustered near the end (as on the real test)
  const mc=R.shuffle(slots.filter(s=>!s.spr));
  const spr=R.shuffle(slots.filter(s=>s.spr));
  const ordered=[...mc,...spr];

  const used=usedInit?new Set(usedInit):new Set();   // shared across both modules of a test
  const SEEN=seen||new Set();                         // every stem generated across all tests
  const qs=[];
  const enrichedDomains=new Set();
  ordered.forEach((slot,idx)=>{
    let pool=templates.filter(t=>t.dom===slot.dom&&t.diffs.includes(slot.diff)&&(!slot.spr||t.spr)&&!used.has(t.id));

    // Enriched tests draw from the wordy / figure-based models whenever one fits the slot.
    if(enrichedMode){
      let rich=pool.filter(t=>NEW_TEMPLATE_IDS.has(t.id));
      if(!rich.length) rich=templates.filter(t=>t.dom===slot.dom&&(!slot.spr||t.spr)&&NEW_TEMPLATE_IDS.has(t.id)&&!used.has(t.id));
      if(rich.length) pool=rich;
    }

    // never repeat a template inside one 44-question test: widen the bank before allowing a reuse
    if(!pool.length) pool=templates.filter(t=>t.dom===slot.dom&&(!slot.spr||t.spr)&&!used.has(t.id));
    if(!pool.length) pool=ALL_TEMPLATES.filter(t=>t.dom===slot.dom&&(!slot.spr||t.spr)&&!used.has(t.id));
    if(!pool.length) pool=ALL_TEMPLATES.filter(t=>(!slot.spr||t.spr)&&!used.has(t.id));
    if(!pool.length) pool=templates.filter(t=>t.dom===slot.dom&&(!slot.spr||t.spr));
    const okOpts=(cq)=>{
      if(slot.spr)return SPR_OK(cq.opts[0]);
      const four=cq.opts.slice(0,4).map(x=>String(x).trim());
      return four.length===4&&new Set(four).size===4;   // four genuinely distinct choices
    };
    let t=null,q=null,correct=null,fallback=null;
    // Try progressively wider candidate pools, re-rolling each model, until a question
    // that no test has used turns up. Escalating to another template in the same domain
    // is always preferred over repeating an exhausted one.
    const unused=x=>!used.has(x.id);
    const domAll=templates.filter(x=>x.dom===slot.dom&&(!slot.spr||x.spr)&&unused(x));
    const domAny=ALL_TEMPLATES.filter(x=>x.dom===slot.dom&&(!slot.spr||x.spr)&&unused(x));
    const anyDom=ALL_TEMPLATES.filter(x=>(!slot.spr||x.spr)&&unused(x));
    // Tiers 0-2 never repeat a template already used in this test; the widest is the
    // no-repeat fallback pool. Only if all are exhausted do we allow a within-test reuse.
    const tiers=[pool.filter(unused),domAll,domAny,anyDom];
    outer: for(const tier of tiers){
      if(!tier.length)continue;
      const order=R.shuffle(tier);
      for(let pass=0;pass<6&&!t;pass++){
        for(const cand of order){
          const cq=cand.gen(R,slot.diff||'M');
          const cc=cq.opts[0];
          if(!okOpts(cq))continue;
          if(!fallback)fallback={t:cand,q:cq,correct:cc};
          if(!SEEN.has(stemKey(cq.stem,cc))){t=cand;q=cq;correct=cc;break outer;}
        }
      }
    }
    // Prefer an unused template (even if its question repeats one from another test)
    // over reusing a template already in this test.
    if(!t){
      const freshPool=(pool.filter(unused).length?pool.filter(unused):domAny.length?domAny:anyDom);
      for(let k=0;k<40&&!t&&freshPool.length;k++){
        const cand=R.pick(freshPool);const cq=cand.gen(R,slot.diff||'M');
        if(!okOpts(cq))continue;
        if(!fallback)fallback={t:cand,q:cq,correct:cq.opts[0]};
        if(!SEEN.has(stemKey(cq.stem,cq.opts[0]))){t=cand;q=cq;correct=cq.opts[0];}
      }
    }
    if(!t&&fallback){t=fallback.t;q=fallback.q;correct=fallback.correct;}
    if(!t){ // last resort: multiple-choice item from the same domain
      slot.spr=false;
      t=R.pick(pool); q=t.gen(R,slot.diff); correct=q.opts[0];
    }
    SEEN.add(stemKey(q.stem,correct));
    used.add(t.id);
    if(NEW_TEMPLATE_IDS.has(t.id)) enrichedDomains.add(t.dom);
    let choices=null,answer=null;
    if(slot.spr){
      answer=String(correct);
    }else{
      choices=R.shuffle(q.opts.slice(0,4));
      answer=choices.indexOf(correct);
    }
    // Honest difficulty label: if escalation had to place a template outside the slot's
    // target difficulty, record the difficulty the template actually supports.
    const ORD=['E','M','H'];
    let effDiff=slot.diff;
    if(t.diffs&&!t.diffs.includes(slot.diff)){
      effDiff=t.diffs.slice().sort((p,q2)=>Math.abs(ORD.indexOf(p)-ORD.indexOf(slot.diff))-Math.abs(ORD.indexOf(q2)-ORD.indexOf(slot.diff)))[0];
    }
    qs.push({
      n:idx+1,id:t.id,dom:slot.dom,diff:effDiff,
      type:slot.spr?'spr':'mc',
      stem:TIDY(q.stem),choices,answer,exp:TIDY(q.exp),
      fig:/<svg|<table/.test(q.stem),alt:q.alt||null
    });
  });
  return qs;
}

const ALL_TEMPLATES=ENRICHED_TEMPLATES;
const GLOBAL_SEEN=new Set();     // every question stem ever generated, across all 30 tests
const TEST_CACHE={};
function buildOne(testNum){
  const base=testNum*100000+7919;
  const enriched=testNum>20;
  const bank=enriched?ENRICHED_TEMPLATES:CORE_TEMPLATES;
  const m1=buildModule(base+11,'m1',bank,enriched,null,GLOBAL_SEEN);
  const usedM1=new Set(m1.map(q=>q.id));
  // Module 2 (either path) never reuses a template from Module 1 of the same test.
  const m2easy=buildModule(base+23,'easy',bank,enriched,usedM1,GLOBAL_SEEN);
  const m2hard=buildModule(base+37,'hard',bank,enriched,usedM1,GLOBAL_SEEN);
  return{num:testNum,enriched,m1,m2easy,m2hard};
}
function buildTest(testNum){
  // built in ascending order so the global no-repeat guarantee is deterministic
  for(let t=1;t<=testNum;t++) if(!TEST_CACHE[t]) TEST_CACHE[t]=buildOne(t);
  return TEST_CACHE[testNum];
}

</script>
<script>
/* ============================================================
   Digital SAT Math — practice app
   ============================================================ */
const APP=document.getElementById('app');
const MODULE_SECONDS=35*60;
const ROUTE_THRESHOLD=14;           // correct on Module 1 needed for the harder Module 2
const DOMS={ALG:'Algebra',ADV:'Advanced Math',PSD:'Problem-Solving & Data Analysis',GEO:'Geometry & Trigonometry'};

/* ---------- storage (works in Claude artifacts, local files, or memory-only) ---------- */
const Store=(()=>{
  const mem={};
  const hasW=(typeof window!=='undefined'&&window.storage&&typeof window.storage.get==='function');
  return{
    async get(k){
      if(hasW){try{const r=await window.storage.get(k);return r?JSON.parse(r.value):null;}catch(e){return null;}}
      try{const v=localStorage.getItem(k);return v?JSON.parse(v):null;}catch(e){return mem[k]??null;}
    },
    async set(k,v){
      if(hasW){try{await window.storage.set(k,JSON.stringify(v));return;}catch(e){}}
      try{localStorage.setItem(k,JSON.stringify(v));}catch(e){mem[k]=v;}
    }
  };
})();
let RESULTS={};   // {"3": {score, m1c, m2c, path, date}}
let MISTAKES=[];  // missed questions saved across tests
let ACTIVE_SESSION=null;
let SAVE_T=null;

const NUM_TESTS=30;
const CORE_TESTS=20;
const NAMES=['Baseline','Foundations','Functions Focus','Mixed Review','Data & Rates',
             'Geometry Push','Full Length','Timing Drill','Advanced Math','Final Check',
             'Second Baseline','Linear Systems','Quadratics & Roots','Mixed Review II','Ratios & Percents',
             'Circles & Triangles','Full Length II','Timing Drill II','Advanced Math II','Final Check II',
             'Visual Foundations','Graph Analysis','Data Displays','Geometry Visuals','Modeling & Rates',

function scoreTrendSVG(){
  const rows=Object.entries(RESULTS).map(([n,r])=>({n:+n,score:r.score})).sort((a,b)=>a.n-b.n);
  if(rows.length<2)return '';
  const W=420,H=145,p=26,min=200,max=800,X=i=>p+i/(rows.length-1)*(W-2*p),Y=v=>H-p-(v-min)/(max-min)*(H-2*p);
  let grid='';[200,400,600,800].forEach(v=>grid+=`<line x1="${p}" y1="${Y(v)}" x2="${W-p}" y2="${Y(v)}" stroke="#E2E7EF"/>${svgText(p-5,Y(v)+3,v,9,'end')}`);
  const pts=rows.map((r,i)=>`${X(i)},${Y(r.score)}`).join(' ');
  const dots=rows.map((r,i)=>`<circle cx="${X(i)}" cy="${Y(r.score)}" r="4" fill="#2447C9"/><text x="${X(i)}" y="${H-5}" text-anchor="middle" font-family="ui-monospace,monospace" font-size="8" fill="#48607F">${r.n}</text>`).join('');
  return `<div class="trend"><div class="eyebrow">Score trend</div><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Score trend across completed tests">${grid}<polyline points="${pts}" fill="none" stroke="#2447C9" stroke-width="3"/>${dots}</svg></div>`;
}

function sprValue(str){
  if(str===null||str===undefined)return NaN;
  const s=String(str).trim().replace(/\s/g,'');
  if(!s)return NaN;
  if(/^-?\d+\/\d+$/.test(s)){const[n,d]=s.split('/').map(Number);return d===0?NaN:n/d;}
  if(/^-?\d*\.?\d+$/.test(s))return parseFloat(s);
  return NaN;
}
function sprCorrect(given,answer){
  const a=sprValue(answer),g=sprValue(given);
  if(isNaN(a)||isNaN(g))return false;
  return Math.abs(a-g)<=Math.max(0.005,Math.abs(a)*1e-6);
}
function isCorrect(q,a){
  if(a===null||a===undefined)return false;
  return q.type==='mc'?a===q.answer:sprCorrect(a,q.answer);
}
function scaledScore(m1c,m2c,path){
  const tot=m1c+m2c;
  let s = path==='hard' ? 380+9.6*tot : 200+10*tot;
  const cap = path==='hard' ? 800 : 610;
  s=Math.min(cap,Math.max(200,s));
  return Math.round(s/10)*10;
}

function mistakeId(testNum,module,n){return `t${testNum}-${module}-${n}`;}

async function saveMistakes(){
  const stamp=new Date().toISOString().slice(0,10);
  const add=[];
  [['m1',S.m1],['m2',S.m2]].forEach(([mod,g])=>{
    (g.items||[]).forEach(x=>{
      if(x.ok)return;
      add.push({id:mistakeId(S.testNum,mod,x.q.n),test:S.testNum,module:mod,n:x.q.n,
        dom:x.q.dom,diff:x.q.diff,type:x.q.type,stem:x.q.stem,
        choices:x.q.type==='mc'?x.q.choices:null,
        answer:x.q.type==='mc'?x.q.choices[x.q.answer]:String(x.q.answer),
        given:x.q.type==='mc'?(x.given===null?null:x.q.choices[x.given]):(x.given||null),
        exp:x.q.exp,fig:!!x.q.fig,alt:x.q.alt||null,confidence:x.confidence||'',seconds:x.seconds||0,note:x.note||'',revealed:!!x.revealed,date:stamp});
    });
  });
  const keep=MISTAKES.filter(m=>!add.some(a=>a.id===m.id));
  MISTAKES=[...add,...keep];
  await Store.set('sat-math-mistakes',MISTAKES);
}

function bankText(list,kind){
  const lines=list.map((m,i)=>{
    const ch=m.choices?m.choices.map((c,j)=>`   ${LTR[j]}. ${strip(c)}`).join('\n'):'   (student-produced response \u2014 enter a number)';
    const figline=m.fig?`\n   Figure: ${m.alt?strip(m.alt):'this question included a graph or table \u2014 see the app'}`:'';
    return `${i+1}. [${DOMS[m.dom]} \u00b7 ${{E:'easy',M:'medium',H:'hard'}[m.diff]} \u00b7 Test ${m.test} ${m.module==='m1'?'Module 1':'Module 2'} Q${m.n}]\n   ${strip(m.stem)}${figline}\n${ch}\n   Correct answer: ${strip(m.answer)}\n   My answer: ${m.given?strip(m.given):'(blank)'}\n   Why: ${strip(m.exp)}`;
  }).join('\n\n');
  if(kind==='prompt'){
    return `I am preparing for the Digital SAT Math section. Below are ${list.length} questions I got wrong, with the correct answer and my answer.

For each one:
1. Diagnose in one or two sentences what concept or step I most likely missed.
2. Write 3 NEW practice problems that test the same skill at the same difficulty, changing the numbers and the context. Keep the Digital SAT format: 4 answer choices for multiple choice, or a numeric entry for student-produced response.
3. Give the answer and a short worked solution for each new problem.
   Where a question included a graph, chart, or table, its contents are given on a "Figure:" line \u2014 recreate an equivalent figure in words or as a small table in the new problems.

Then finish with a short study plan grouping my errors by theme.

--- MY MISSED QUESTIONS ---

${lines}`;
  }
  return `# SAT Math \u2014 mistake bank (${list.length} questions)\nExported ${new Date().toISOString().slice(0,10)}\n\n${lines}\n`;
}
function strip(h){return String(h).replace(/<svg[\s\S]*?<\/svg>/g,'').replace(/<\/div>|<\/table>/g,'\n   ').replace(/<caption>|<\/caption>/g,' ').replace(/<\/t[dh]>/g,' | ').replace(/<\/tr>/g,'\n     ').replace(/<sup>(.*?)<\/sup>/g,'^$1').replace(/<sub>(.*?)<\/sub>/g,'_$1').replace(/<[^>]+>/g,'').replace(/&minus;/g,'-').replace(/&nbsp;/g,' ').replace(/&pi;/g,'pi').replace(/&radic;/g,'sqrt').replace(/&times;/g,'x').replace(/&divide;/g,'/').replace(/&le;/g,'<=').replace(/&ge;/g,'>=').replace(/&ne;/g,'!=').replace(/&amp;/g,'&').replace(/&mdash;/g,'--').replace(/&ndash;/g,'-').replace(/&deg;|&#176;/g,' deg').replace(/&#952;/g,'theta').replace(/&asymp;/g,'~=').replace(/&#10003;/g,'(ok)').replace(/&#9651;/g,'triangle ').replace(/&[a-z#0-9]+;/g,'').replace(/[ \t]{2,}/g,' ').trim();}

function toast(msg){
  const t=el(`<div class="toast">${msg}</div>`);
  document.body.appendChild(t);
  setTimeout(()=>t.remove(),2200);
}
function copyText(txt,msg){
  const done=()=>toast(msg);
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(txt).then(done,()=>fallback());
  }else fallback();
  function fallback(){
    const ta=document.createElement('textarea');ta.value=txt;ta.style.position='fixed';ta.style.opacity='0';
    document.body.appendChild(ta);ta.select();
    try{document.execCommand('copy');done();}catch(e){toast('Copy failed \u2014 use Download instead');}
    ta.remove();
  }
}
function download(txt,name,type){
  const b=new Blob([txt],{type:type||'text/plain'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(b);a.download=name;document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},500);
  toast('Downloaded '+name);
}

      <button id="hideclock">${S.hideClock?'Show':'Hide'}</button>
    </div>
    <div class="tools">
      <button class="tool" id="calcbtn">Calculator</button>
      <button class="tool" id="refbtn">Reference</button>
    </div>
  </div><div class="divider-line"></div></div>

  <div class="qwrap">
    <div class="qhead">

      <div class="domtag">${DOMS[q.dom]}</div>
      <button class="flagbtn ${S.flag[S.idx]?'on':''}" id="flagbtn">${S.flag[S.idx]?'Flagged':'Flag for review'}</button>
    </div>
    <div class="stem">${q.stem}</div>
    <div id="answerzone"></div>
    <div class="learning-tools">
      <div class="confidence"><label>How confident are you?</label><div class="confrow">
        ${['low','medium','high'].map(c=>`<button data-c="${c}" class="${S.confidence[S.idx]===c?'on':''}">${c[0].toUpperCase()+c.slice(1)}</button>`).join('')}
      </div><div class="shortcut">Keyboard: <span class="kbd">1–4</span> answer, <span class="kbd">←</span>/<span class="kbd">→</span> navigate, <span class="kbd">F</span> flag.</div></div>
      <div class="notes"><label for="qnote">Scratch note for this question</label><textarea id="qnote" placeholder="Write a formula, plan, or reminder…">${escAttr(S.notes[S.idx])}</textarea></div>

  <div class="bottombar"><div class="bottom-in">
    <div class="who">${isEnrichedTest(S.testNum)?'Enriched ':'Original '}Practice Test ${String(S.testNum).padStart(2,'0')}</div>
    <button class="progbtn" id="mapbtn">Question ${S.idx+1} of 22 &nbsp;&#9650;</button>
    <div class="navbtns">
      <button class="btn ghost" id="back" ${S.idx===0?'disabled':''}>Back</button>
      <button class="btn" id="next">${S.idx===21?'Review':'Next'}</button>
    </div>
  </div></div>`;

  const zone=document.getElementById('answerzone');
  if(q.type==='mc'){
    zone.className='choices';
    q.choices.forEach((c,i)=>{
      const struck=S.strike[S.idx].includes(i);
      const row=el(`<div class="choice-row">
        <button class="choice ${S.ans[S.idx]===i?'sel':''} ${struck?'struck':''}">
          <span class="ltr">${LTR[i]}</span><span class="txt">${c}</span>
        </button>
        <button class="xbtn ${struck?'on':''}" title="Cross out choice ${LTR[i]}">${LTR[i]}&#8260;</button>
      </div>`);
      row.querySelector('.choice').onclick=()=>{S.ans[S.idx]=(S.ans[S.idx]===i?null:i);queueSave();render();};
      row.querySelector('.xbtn').onclick=()=>{
        const st=S.strike[S.idx];
        const k=st.indexOf(i);
        if(k>=0)st.splice(k,1); else {st.push(i); if(S.ans[S.idx]===i)S.ans[S.idx]=null;}
        queueSave();render();
      };
      zone.appendChild(row);
    });
  }else{
    zone.innerHTML=`<div class="sprbox">
      <label for="sprin">Student-produced response &mdash; enter your answer</label>
      <input id="sprin" inputmode="text" autocomplete="off" spellcheck="false" value="${escAttr(S.ans[S.idx]??'')}" placeholder="e.g. 12, -3, 7/2, 0.75">
      <div class="sprhint">Fractions and decimals are both accepted. Do not enter symbols such as %, $, or &pi;.</div>
    </div>`;
    const inp=document.getElementById('sprin');
    inp.oninput=()=>{S.ans[S.idx]=inp.value;queueSave();};
    inp.focus();
    const v=inp.value;inp.value='';inp.value=v;

  document.querySelectorAll('.confrow button').forEach(b=>b.onclick=()=>{S.confidence[S.idx]=b.dataset.c;queueSave();render();});
  document.getElementById('qnote').oninput=(e)=>{S.notes[S.idx]=e.target.value;queueSave();};

  document.getElementById('next').onclick=()=>{if(S.idx<21){S.idx++;queueSave();render();}else{S.view='review';queueSave();render();}};

/* ---------- calculator ---------- */
let CALC='';
function openCalc(){
  const keys=['7','8','9','/','4','5','6','*','1','2','3','-','0','.','(',')','^','sqrt(',',','+'];
  const sheet=el(`<div class="sheet"><div class="panel" style="max-width:380px">
    <button class="close">Close</button>
    <h2>Calculator</h2>
    <div class="calcdisp" id="cd">${CALC||'0'}</div>
    <div class="calcpad">
      ${keys.map(k=>`<button data-k="${k}">${k==='sqrt('?'&radic;':k===','?'C':k}</button>`).join('')}
      <button data-k="DEL" style="grid-column:span 2">Delete</button>
      <button data-k="=" style="grid-column:span 2;background:var(--primary);color:#fff;border-color:var(--primary)">=</button>
    </div>
  </div></div>`);
  document.body.appendChild(sheet);
  const disp=sheet.querySelector('#cd');
  const upd=()=>disp.textContent=CALC||'0';
  sheet.querySelectorAll('.calcpad button').forEach(b=>b.onclick=()=>{
    const k=b.dataset.k;
    if(k===','){CALC='';}
    else if(k==='DEL'){CALC=CALC.slice(0,-1);}
    else if(k==='='){
      try{
        const safe=CALC.replace(/\^/g,'**').replace(/sqrt\(/g,'Math.sqrt(');
        if(!/^[-+*/().\d\sMathsqrt*]+$/.test(safe))throw 0;
        const val=Function('"use strict";return('+safe+')')();
        CALC=Number.isFinite(val)?String(Math.round(val*1e10)/1e10):'Error';
      }catch(e){CALC='Error';}
    }
    else{if(CALC==='Error')CALC='';CALC+=k;}
    upd();
  });
  sheet.querySelector('.close').onclick=()=>sheet.remove();
  sheet.onclick=(e)=>{if(e.target===sheet)sheet.remove();};
}

/* ============================================================
   SUBMIT / ROUTE / RESULTS
   ============================================================ */
function gradeModule(){
  const items=S.qs.map((q,i)=>({q,given:S.ans[i],ok:isCorrect(q,S.ans[i]),confidence:S.confidence[i]||'',note:S.notes[i]||'',seconds:S.spent[i]||0,revealed:!!(S.revealed&&S.revealed[i])}));
  return{items,correct:items.filter(x=>x.ok).length};
}
function submitModule(){
  stopTimer();
  const g=gradeModule();
  if(S.module==='m1'){
    S.m1=g;
    S.path=g.correct>=ROUTE_THRESHOLD?'hard':'easy';
    S.view='route';
    render();
  }else{
    S.m2=g;
    finish();
  }
}
function startModule2(){
  S.module='m2';
  S.qs=S.path==='hard'?S.T.m2hard:S.T.m2easy;
  S.idx=0;S.ans=Array(22).fill(null);S.flag=Array(22).fill(false);
  S.strike=Array(22).fill(null).map(()=>[]);S.confidence=Array(22).fill('');S.notes=Array(22).fill('');S.spent=Array(22).fill(0);S.revealed=Array(22).fill(false);
  S.left=MODULE_SECONDS;S.view='intro';queueSave();
  render();
}
function viewRoute(){
  const harder=S.path==='hard';
  APP.innerHTML=`
  <div class="stage">
    <div class="eyebrow">Module 1 submitted</div>
    <h1>${S.m1.correct} of 22 correct</h1>
    <p>The Digital SAT routes you to a second module based on Module 1. You crossed the routing bar for the <b>${harder?'harder':'easier'}</b> module.${harder?'':` Answering ${ROUTE_THRESHOLD} or more correctly would have routed you to the harder module.`}</p>
    ${routeRibbon(harder)}
    <button class="btn big" id="go">Continue to Module 2</button>
    <div style="margin-top:16px"><button class="tool" id="quit" style="margin:0 auto">Stop here and exit</button></div>
  </div>`;
  document.getElementById('go').onclick=startModule2;
  document.getElementById('quit').onclick=()=>{queueSave();S={view:'home',pick:S.testNum};render();};
}

async function finish(){
  const score=scaledScore(S.m1.correct,S.m2.correct,S.path);
  const report=[...S.m1.items,...S.m2.items];
  const totalSeconds=report.reduce((a,x)=>a+(x.seconds||0),0);
  RESULTS[S.testNum]={score,m1c:S.m1.correct,m2c:S.m2.correct,path:S.path,date:new Date().toISOString().slice(0,10),totalSeconds,report};
  await Store.set('sat-math-results',RESULTS);
  await saveMistakes();
  await clearSession();
  S.view='results';S.revTab='all';
  render();
}

function viewResults(){
  const all=[...S.m1.items,...S.m2.items];
  const score=RESULTS[S.testNum].score;
  const totC=S.m1.correct+S.m2.correct;
  // domain breakdown
  const dom={};
  for(const k of Object.keys(DOMS))dom[k]={c:0,t:0};
  all.forEach(x=>{dom[x.q.dom].t++;if(x.ok)dom[x.q.dom].c++;});
  const bars=Object.keys(DOMS).map(k=>{
    const p=Math.round(dom[k].c/dom[k].t*100);
    return `<div class="bar"><div>${DOMS[k]}</div><div class="track"><div class="fill" style="width:${p}%"></div></div><div class="val">${dom[k].c}/${dom[k].t}</div></div>`;
  }).join('');
  const tab=S.revTab||'all';
  const shown=all.map((x,i)=>({...x,gi:i})).filter(x=>tab==='all'||(tab==='wrong'&&!x.ok)||(tab==='m1'&&x.gi<22)||(tab==='m2'&&x.gi>=22));
  const totalSec=all.reduce((a,x)=>a+(x.seconds||0),0),avgSec=Math.round(totalSec/44);
  const low=all.filter(x=>x.confidence==='low'),lowRight=low.filter(x=>x.ok).length;
  const hard=all.filter(x=>x.q.diff==='H'),hardRight=hard.filter(x=>x.ok).length;
  const weakest=Object.keys(DOMS).sort((a,b)=>(dom[a].c/dom[a].t)-(dom[b].c/dom[b].t))[0];
  const diffBars=['E','M','H'].map(k=>{const z=all.filter(x=>x.q.diff===k),c=z.filter(x=>x.ok).length,p=z.length?Math.round(c/z.length*100):0;return `<div class="bar"><div>${{E:'Easy',M:'Medium',H:'Hard'}[k]}</div><div class="track"><div class="fill" style="width:${p}%"></div></div><div class="val">${c}/${z.length}</div></div>`;}).join('');

  APP.innerHTML=`
  <div class="wrap">
    <div class="stage" style="padding-top:34px;padding-bottom:10px">
      <div class="eyebrow">${setName(S.testNum)} &middot; Test ${String(S.testNum).padStart(2,'0')} &middot; Math section</div>
      ${dial(score,S.path)}
      <div class="scorebig">${score}</div>
      <p style="margin-top:6px">${totC} of 44 correct &middot; Module 1: ${S.m1.correct}/22 &middot; Module 2 (${S.path==='hard'?'harder':'easier'}): ${S.m2.correct}/22</p>
      <p style="font-size:13px">Estimated section score on the 200&ndash;800 scale. ${S.path==='easy'?'The easier Module 2 caps the reachable score near 610 &mdash; the same is true on the real test.':''}</p>
    </div>
    <div class="metricgrid">
      <div class="metric"><div class="lab">Average pace</div><div class="num">${avgSec}s</div><div class="sub">per question</div></div>
      <div class="metric"><div class="lab">Hard questions</div><div class="num">${hardRight}/${hard.length}</div><div class="sub">accuracy on hard items</div></div>
      <div class="metric"><div class="lab">Low confidence</div><div class="num">${lowRight}/${low.length||0}</div><div class="sub">correct despite uncertainty</div></div>
      <div class="metric"><div class="lab">Time used</div><div class="num">${fmtTime(totalSec)}</div><div class="sub">across both modules</div></div>
    </div>
    <div class="focusbox"><b>Recommended focus: ${DOMS[weakest]}</b><div>Your lowest domain accuracy was ${dom[weakest].c}/${dom[weakest].t}. Start with the missed items in this domain, then retry similar questions without looking at the explanations.</div></div>
    <div class="bd"><h3>By domain</h3>${bars}
      <p style="font-size:13px;color:var(--ink-soft);margin:14px 0 0">The ${all.filter(x=>!x.ok).length} question${all.filter(x=>!x.ok).length===1?'':'s'} you missed ${all.filter(x=>!x.ok).length===1?'was':'were'} saved to your mistake bank, where you can review ${all.filter(x=>!x.ok).length===1?'it':'them'} later or export ${all.filter(x=>!x.ok).length===1?'it':'them'} as a prompt for fresh practice problems.</p>
    </div>
    <div class="bd"><h3>By difficulty</h3>${diffBars}</div>
    <div class="tabs">
      <button data-t="all" class="${tab==='all'?'on':''}">All 44</button>
      <button data-t="wrong" class="${tab==='wrong'?'on':''}">Missed (${all.filter(x=>!x.ok).length})</button>
      <button data-t="m1" class="${tab==='m1'?'on':''}">Module 1</button>
      <button data-t="m2" class="${tab==='m2'?'on':''}">Module 2</button>
    </div>
    <div id="revlist">${shown.map(x=>revCard(x)).join('')||'<div class="bd">Nothing here.</div>'}</div>
    <div style="margin-top:26px;display:flex;gap:10px;flex-wrap:wrap">
      <button class="btn" id="retake">Retake this test</button>
      <button class="btn ghost" id="bank" style="border-color:var(--rule);color:var(--ink)">Mistake bank (${MISTAKES.length})</button>
      <button class="btn ghost" id="home" style="border-color:var(--rule);color:var(--ink)">Back to all tests</button>
      <button class="btn ghost" id="csv" style="border-color:var(--rule);color:var(--ink)">Download CSV</button>
      <button class="btn ghost" id="print" style="border-color:var(--rule);color:var(--ink)">Print report</button>
    </div>
  </div>`;
  APP.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{S.revTab=b.dataset.t;render();});
  document.getElementById('retake').onclick=()=>{newRun(S.testNum);render();};
  document.getElementById('bank').onclick=()=>{S={view:'bank',pick:S.testNum,bankDom:'all'};render();};
  document.getElementById('home').onclick=()=>{S={view:'home',pick:S.testNum};render();};
  document.getElementById('csv').onclick=()=>download(resultCSV(all),`sat-math-test-${String(S.testNum).padStart(2,'0')}-report.csv`,'text/csv');
  document.getElementById('print').onclick=()=>window.print();
}
function resultCSV(all){
  const rows=[['Module','Question','Domain','Difficulty','Type','Correct','Confidence','Seconds','Your answer','Correct answer','Note']];
  all.forEach((x,i)=>{const q=x.q,yours=q.type==='mc'?(x.given===null?'':strip(q.choices[x.given])):String(x.given??''),right=q.type==='mc'?strip(q.choices[q.answer]):String(q.answer);rows.push([i<22?'Module 1':'Module 2',q.n,DOMS[q.dom],{E:'Easy',M:'Medium',H:'Hard'}[q.diff],q.type==='mc'?'Multiple choice':'Student-produced',x.ok?'Yes':'No',x.confidence||'',x.seconds||0,yours,right,x.note||'']);});
  return rows.map(r=>r.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(',')).join('\n');
}

function revCard(x){
  const q=x.q;
  const mod=x.gi<22?'Module 1':'Module 2';
  const yours=q.type==='mc'
    ? (x.given===null?'&mdash; no answer &mdash;':`${LTR[x.given]}. ${q.choices[x.given]}`)
    : (x.given===null||x.given===''?'&mdash; no answer &mdash;':x.given);
  const right=q.type==='mc'?`${LTR[q.answer]}. ${q.choices[q.answer]}`:q.answer;
  return `<div class="rev ${x.ok?'ok':'no'}">
    <div class="rhead">
      <span class="verdict">${x.ok?'Correct':'Missed'}</span>
      <span>${mod} &middot; Q${q.n} &middot; ${DOMS[q.dom]} &middot; ${{E:'easy',M:'medium',H:'hard'}[q.diff]}</span>
    </div>
    <div class="stem">${q.stem}</div>
    <div class="ansline">Your answer: ${yours}</div>
    <div class="ansline">Correct answer: <b>${right}</b></div>
    <div class="review-meta"><span class="timepill">${fmtTime(x.seconds||0)}</span>${x.confidence?`<span class="timepill">${x.confidence} confidence</span>`:''}${x.revealed?'<span class="timepill">solution viewed</span>':''}</div>
    ${x.note?`<div class="review-note"><b>Your note:</b> ${x.note}</div>`:''}
    <div class="exp">${q.exp}</div>
  </div>`;
}
function dial(score,path){
  const frac=(score-200)/600;
  const r=88,C=2*Math.PI*r*0.75; // 270-degree arc
  return `<svg class="dial" viewBox="0 0 220 220" role="img" aria-label="Score ${score} out of 800">
    <g transform="rotate(135 110 110)">
      <circle cx="110" cy="110" r="${r}" fill="none" stroke="#D3DAE5" stroke-width="14" stroke-linecap="round"
        stroke-dasharray="${C} 999"/>
      <circle cx="110" cy="110" r="${r}" fill="none" stroke="${path==='hard'?'#2447C9':'#48607F'}" stroke-width="14" stroke-linecap="round"
        stroke-dasharray="${C*frac} 999"/>
    </g>
    <text x="110" y="196" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#48607F">200 &#8212; 800</text>
  </svg>`;
}


/* ============================================================
   PERSISTENT LEFT STUDY SIDEBAR + SOLUTION VIEWER
   ============================================================ */
function ensureStudySidebar(){
  document.body.classList.add('with-study-sidebar');
  let side=document.getElementById('study-sidebar');
  if(!side){
    side=document.createElement('aside');side.id='study-sidebar';side.className='study-sidebar';side.setAttribute('aria-label','SAT practice navigation');
    document.body.insertBefore(side,APP);
    const tog=document.createElement('button');tog.id='side-toggle';tog.className='side-toggle';tog.textContent='☰ Study menu';
    tog.onclick=()=>document.body.classList.toggle('side-open');
    document.body.appendChild(tog);
  }
  return side;
}
function sideOption(n){
  const r=RESULTS[n];
  return `<option value="${n}">Test ${String(n).padStart(2,'0')} — ${NAMES[n-1]}${r?` — ${r.score}`:''}</option>`;
}
function sideTestSelect(id,a,b,label,active){
  let opts=`<option value="">${label}</option>`;
  for(let i=a;i<=b;i++)opts+=sideOption(i);
  return `<div class="side-row"><select class="side-select" id="${id}" aria-label="${label}">${opts}</select><button class="side-btn secondary" data-open-select="${id}">Open</button></div>`;
}
function answerHTML(q){return q.type==='mc'?`${LTR[q.answer]}. ${q.choices[q.answer]}`:String(q.answer);}
function openSolutionSheet(q,meta,given,revealedNote){
  const yours=q.type==='mc'?(given===null||given===undefined?'— no answer —':`${LTR[given]}. ${q.choices[given]}`):(given===null||given===undefined||given===''?'— no answer —':String(given));
  const sheet=el(`<div class="sheet"><div class="panel solution-panel">
    <button class="close">Close</button>
    <div class="eyebrow">${meta||'Worked solution'}</div>
    <h2>Question ${q.n}</h2>
    ${revealedNote?`<div class="solution-warning">${revealedNote}</div>`:''}
    <div class="stem">${q.stem}</div>
    <div class="ansline">Your answer: ${yours}</div>
    <div class="solution-answer"><b>Correct answer:</b> ${answerHTML(q)}</div>
    <div class="exp">${q.exp}</div>
  </div></div>`);
  document.body.appendChild(sheet);
  sheet.querySelector('.close').onclick=()=>sheet.remove();
  sheet.onclick=e=>{if(e.target===sheet)sheet.remove();};
}
function openCurrentSolution(){
  if(!S.qs||!S.qs[S.idx])return;
  if((S.view==='test'||S.view==='review')&&!confirm('Reveal the solution to this question? The test will continue, and the report will note that the solution was viewed.'))return;
  S.revealed=S.revealed||Array(22).fill(false);S.revealed[S.idx]=true;queueSave();
  const q=S.qs[S.idx];
  openSolutionSheet(q,`Test ${String(S.testNum).padStart(2,'0')} · ${S.module==='m1'?'Module 1':'Module 2'}`,S.ans?S.ans[S.idx]:null,'Solution access is intended for learning. For an accurate timed score, finish the module before revealing answers.');
  renderStudySidebar();
}
function openMistakeSolution(id){
  const m=MISTAKES.find(x=>x.id===id);if(!m)return;
  const q={n:m.n,stem:m.stem,type:m.type,choices:m.choices||[],answer:m.type==='mc'?Math.max(0,(m.choices||[]).findIndex(c=>c===m.answer)):m.answer,exp:m.exp};
  const given=m.type==='mc'?Math.max(-1,(m.choices||[]).findIndex(c=>c===m.given)):(m.given||'');
  openSolutionSheet(q,`Incorrect problem · Test ${String(m.test).padStart(2,'0')} · ${m.module==='m1'?'Module 1':'Module 2'}`,given<0?null:given,'Review the worked explanation, then retry a similar problem without looking at the answer.');
}
function openStoredReviewSolution(index){
  if(S.view!=='results')return;
  const all=[...(S.m1.items||[]),...(S.m2.items||[])],x=all[index];if(!x)return;
  openSolutionSheet(x.q,`${index<22?'Module 1':'Module 2'} · ${x.ok?'Correct':'Missed'}`,x.given,'This is the stored solution from your most recent completed attempt.');
}
function renderStudySidebar(){
  const side=ensureStudySidebar();
  const active=S.testNum||S.pick||1;
  const completed=Object.keys(RESULTS).map(Number).sort((a,b)=>a-b);
  const reviewOpts=completed.length?completed.map(n=>`<option value="${n}" ${n===active?'selected':''}>Test ${String(n).padStart(2,'0')} — ${RESULTS[n].score} — ${RESULTS[n].m1c+RESULTS[n].m2c}/44</option>`).join(''):'<option value="">No completed tests</option>';
  const mistakeOpts=MISTAKES.length?MISTAKES.map(m=>`<option value="${m.id}">T${String(m.test).padStart(2,'0')} ${m.module==='m1'?'M1':'M2'} Q${m.n} — ${DOMS[m.dom]}</option>`).join(''):'<option value="">No incorrect problems</option>';
  let current='';
  if(['intro','test','review','route'].includes(S.view)&&S.testNum){
    const answered=S.ans?S.ans.filter(a=>a!==null&&a!=='').length:0;
    const map=(S.qs||[]).map((q,i)=>`<button data-side-q="${i}" class="${S.ans&&S.ans[i]!==null&&S.ans[i]!==''?'done':''} ${i===S.idx?'cur':''} ${S.flag&&S.flag[i]?'flag':''}">${i+1}</button>`).join('');
    current=`<details class="side-section" open><summary>Current practice <span>${S.module==='m1'?'M1':'M2'}</span></summary><div class="side-body">
      <div class="side-stat"><span>Test</span><b>${String(S.testNum).padStart(2,'0')}</b></div>
      <div class="side-stat"><span>Status</span><b>${S.view==='test'||S.view==='review'?`${answered}/22`:{intro:'Ready',route:'Routed'}[S.view]}</b></div>
      ${(S.view==='test'||S.view==='review')?`<div class="side-qmap">${map}</div><button class="side-btn warn" id="side-current-solution">${S.revealed&&S.revealed[S.idx]?'View solution again':'Check current solution'}</button><button class="side-btn secondary" id="side-module-review" style="margin-top:6px">Module review page</button>`:'<div class="side-mini">Use this panel to move among tests, review misses, and reopen completed reports.</div>'}
    </div></details>`;
  }else if(S.view==='results'){
    const all=[...(S.m1.items||[]),...(S.m2.items||[])];
    const qopts=all.map((x,i)=>`<option value="${i}">${i<22?'M1':'M2'} Q${x.q.n} — ${x.ok?'Correct':'Missed'} — ${DOMS[x.q.dom]}</option>`).join('');
    current=`<details class="side-section" open><summary>Solutions <span>${all.length}</span></summary><div class="side-body"><label class="side-lab" for="side-result-q">Completed-test questions</label><select class="side-select" id="side-result-q">${qopts}</select><button class="side-btn warn" id="side-result-solution" style="margin-top:7px">Open selected solution</button></div></details>`;
  }
  side.innerHTML=`
    <div class="side-brand"><div class="eyebrow">Digital SAT Math</div><h2>Study Navigation</h2><p>Tests, incorrect problems, reports, and worked solutions.</p></div>
    <details class="side-section" open><summary>All practice tests <span>${NUM_TESTS}</span></summary><div class="side-body">
      <label class="side-lab">Original Set A</label>${sideTestSelect('side-test-a',1,10,'Tests 01–10',active)}
      <label class="side-lab">Original Set B</label>${sideTestSelect('side-test-b',11,20,'Tests 11–20',active)}
      <label class="side-lab">Enriched Test Set</label>${sideTestSelect('side-test-c',21,30,'Tests 21–30',active)}
      <button class="side-btn secondary" id="side-home">Test dashboard</button>
    </div></details>
    ${current}
    <details class="side-section" open><summary>Incorrect problems <span class="side-count">${MISTAKES.length}</span></summary><div class="side-body">
      <select class="side-select" id="side-mistake">${mistakeOpts}</select>
      <button class="side-btn warn" id="side-mistake-solution" style="margin-top:7px" ${MISTAKES.length?'':'disabled'}>View problem & solution</button>
      <button class="side-btn secondary" id="side-bank" style="margin-top:6px">Open all incorrect</button>
    </div></details>
    <details class="side-section" open><summary>Completed reviews <span>${completed.length}</span></summary><div class="side-body">
      <select class="side-select" id="side-review">${reviewOpts}</select>
      <button class="side-btn" id="side-open-review" style="margin-top:7px" ${completed.length?'':'disabled'}>Open selected report</button>
      <div class="side-mini">Reports include every question, your answer, the correct answer, and the worked explanation.</div>
    </div></details>`;
  side.querySelectorAll('[data-open-select]').forEach(b=>b.onclick=()=>{const n=+(side.querySelector('#'+b.dataset.openSelect).value||0);if(!n)return;S={view:'home',pick:n};document.body.classList.remove('side-open');render();});
  const home=side.querySelector('#side-home');if(home)home.onclick=()=>{S={view:'home',pick:active};document.body.classList.remove('side-open');render();};
  const bank=side.querySelector('#side-bank');if(bank)bank.onclick=()=>{S={view:'bank',pick:active,bankDom:'all'};document.body.classList.remove('side-open');render();};
  const ms=side.querySelector('#side-mistake-solution');if(ms)ms.onclick=()=>{const id=side.querySelector('#side-mistake').value;if(id)openMistakeSolution(id);};
  const rr=side.querySelector('#side-open-review');if(rr)rr.onclick=()=>{const n=+(side.querySelector('#side-review').value||0);if(n){document.body.classList.remove('side-open');replayResult(n);}};
  side.querySelectorAll('[data-side-q]').forEach(b=>b.onclick=()=>{S.idx=+b.dataset.sideQ;S.view='test';document.body.classList.remove('side-open');render();});
  const cs=side.querySelector('#side-current-solution');if(cs)cs.onclick=openCurrentSolution;
  const mr=side.querySelector('#side-module-review');if(mr)mr.onclick=()=>{S.view='review';document.body.classList.remove('side-open');render();};
  const rs=side.querySelector('#side-result-solution');if(rs)rs.onclick=()=>openStoredReviewSolution(+(side.querySelector('#side-result-q').value||0));
}

/* ============================================================
   TIMER
   ============================================================ */
function startTimer(){
  stopTimer();
  S.timer=setInterval(()=>{
    S.left--;
    if(S.view==='test'&&S.spent)S.spent[S.idx]=(S.spent[S.idx]||0)+1;
    if(S.left%15===0)queueSave();
    if(S.left<=0){S.left=0;stopTimer();autoSubmit();return;}
    const t=document.querySelector('.clock .time');
    const c=document.querySelector('.clock');
    if(t&&!S.hideClock)t.textContent=mmss(S.left);
    if(c&&S.left<=300)c.classList.add('warn');
  },1000);
}
function stopTimer(){if(S.timer){clearInterval(S.timer);S.timer=null;}}
function autoSubmit(){
  const sheets=document.querySelectorAll('.sheet');sheets.forEach(s=>s.remove());
  alert(`Time is up on ${S.module==='m1'?'Module 1':'Module 2'}. Your answers have been submitted.`);
  submitModule();
}

/* ============================================================
   RENDER
   ============================================================ */
function render(){
  const v=S.view||'home';
  if(v!=='test'&&v!=='review')stopTimer();
  if(v==='home')viewHome();
  else if(v==='intro')viewIntro();
  else if(v==='test')viewTest();
  else if(v==='review')viewReview();
  else if(v==='route')viewRoute();
  else if(v==='results')viewResults();
  else if(v==='bank')viewBank();
  renderStudySidebar();
  if((v==='test'||v==='review')&&!S.timer)startTimer();
  if(['intro','test','review','route'].includes(v)&&S.testNum)queueSave();
  if(v==='home'||v==='results'||v==='intro'||v==='route'||v==='bank')window.scrollTo(0,0);
}

document.addEventListener('keydown',(e)=>{
  if(S.view!=='test'||e.target.matches('input,textarea'))return;
  const q=S.qs[S.idx];
  if(q.type==='mc'&&['1','2','3','4'].includes(e.key)){S.ans[S.idx]=Number(e.key)-1;queueSave();render();e.preventDefault();return;}
  if(e.key==='ArrowRight'){if(S.idx<21)S.idx++;else S.view='review';queueSave();render();e.preventDefault();}
  else if(e.key==='ArrowLeft'&&S.idx>0){S.idx--;queueSave();render();e.preventDefault();}
  else if(e.key.toLowerCase()==='f'){S.flag[S.idx]=!S.flag[S.idx];queueSave();render();e.preventDefault();}
});


/* ============================================================
   ACCESS GATE
   The date and credential are intentionally not displayed in the UI.
   This is a client-side convenience lock for a standalone HTML file.
   ============================================================ */
const ACCESS_GATE_START = new Date(2027, 0, 1, 0, 0, 0, 0);
const ACCESS_SESSION_KEY = 'sat-math-access-unlocked';
const ACCESS_CODE = ['0','2','8','0'].join('');

function accessGateRequired(){
  return new Date().getTime() >= ACCESS_GATE_START.getTime();
}
function accessSessionUnlocked(){
  try{return sessionStorage.getItem(ACCESS_SESSION_KEY)==='yes';}catch(e){return false;}
}
function rememberAccessUnlock(){
  try{sessionStorage.setItem(ACCESS_SESSION_KEY,'yes');}catch(e){}
}
function showAccessGate(onUnlock){
  document.body.classList.add('access-locked');
  const gate=document.createElement('div');
  gate.className='access-gate';
  gate.setAttribute('role','dialog');
  gate.setAttribute('aria-modal','true');
  gate.setAttribute('aria-labelledby','access-title');
  gate.innerHTML=`
    <section class="access-card">
      <div class="access-mark" aria-hidden="true">&#128274;</div>
      <h1 id="access-title">Practice App Locked</h1>
      <p>Enter the access password to continue.</p>
      <form id="access-form" autocomplete="off">
        <label for="access-password">Password</label>
        <div class="access-row">
          <input id="access-password" class="access-input" type="password" inputmode="numeric" maxlength="12" autocomplete="current-password" aria-describedby="access-error">
          <button class="access-submit" type="submit">Unlock</button>
        </div>
        <p id="access-error" class="access-error" role="alert" aria-live="polite"></p>
      </form>
    </section>`;
  document.body.appendChild(gate);
  const form=gate.querySelector('#access-form');
  const input=gate.querySelector('#access-password');
  const error=gate.querySelector('#access-error');
  form.addEventListener('submit',(event)=>{
    event.preventDefault();
    if(input.value===ACCESS_CODE){
      rememberAccessUnlock();
      gate.remove();
      document.body.classList.remove('access-locked');
      onUnlock();
    }else{
      error.textContent='Incorrect password. Please try again.';
      input.value='';
      input.focus();
    }
  });
  setTimeout(()=>input.focus(),0);
}
function runAccessGate(onUnlock){
  if(!accessGateRequired()||accessSessionUnlocked())onUnlock();
  else showAccessGate(onUnlock);
}


async function startApp(){
  const saved=await Store.get('sat-math-results');
  if(saved)RESULTS=saved;
  const mb=await Store.get('sat-math-mistakes');
  if(Array.isArray(mb))MISTAKES=mb;
  const active=await Store.get('sat-math-active-session');
  if(active&&active.testNum)ACTIVE_SESSION=active;
  S={view:'home',pick:ACTIVE_SESSION?.testNum||1};
  render();
}

runAccessGate(startApp);

</script>
