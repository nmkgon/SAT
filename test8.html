=2.5$ satisfies the original but not III. Only II must be true."], "visual": null, "source": "Panda Test 5 · Native conversion", "level": "Medium", "answer": "1", "choices": ["I and II only", "II only", "II and III only", "I, II, and III"]}, {"skill": "Percentages", "domain": "Data", "referenceModule": 4, "referenceQuestion": 31, "id": "t8-native-51", "parentTestId": "test-8", "prompt": "A random sample finds that 30% of fast-food orders include fries. Out of 550 orders, how many are estimated NOT to include fries?", "steps": ["The fraction without fries is $1-0.30=0.70$.", "The estimate is $550(0.70)=385$."], "visual": null, "source": "Panda Test 5 · Native conversion", "level": "Medium", "answer": "385"}, {"skill": "Angle relationships", "domain": "Geometry", "referenceModule": 4, "referenceQuestion": 32, "id": "t8-native-52", "parentTestId": "test-8", "prompt": "In the figure, angle AOB is $\\frac25$ of angle AOC. What is $x$, in degrees?", "steps": ["Angle AOC is $x+30$. Thus $x=(2/5)(x+30)$.", "Then $5x=2x+60$, giving $x=20$."], "visual": {"type": "nativeSVG", "name": "t8-angles", "svg": "<svg xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"angles\" viewBox=\"0 0 540 350\" style=\"width:100%;max-width:540px;height:auto;background:#fff;border-radius:12px\"><polyline points=\"185,265 270,55\" fill=\"none\" stroke=\"#17384d\" stroke-width=\"2.3\" stroke-linejoin=\"round\" stroke-linecap=\"round\"/><polyline points=\"185,265 450,210\" fill=\"none\" stroke=\"#17384d\" stroke-width=\"2.3\" stroke-linejoin=\"round\" stroke-linecap=\"round\"/><polyline points=\"185,265 410,320\" fill=\"none\" stroke=\"#17384d\" stroke-width=\"2.3\" stroke-linejoin=\"round\" stroke-linecap=\"round\"/><text x=\"173\" y=\"282\" font-family=\"Arial,sans-serif\" font-size=\"16\" fill=\"#17384d\" text-anchor=\"middle\">O</text><text x=\"273\" y=\"36\" font-family=\"Arial,sans-serif\" font-size=\"16\" fill=\"#17384d\" text-anchor=\"middle\">A</text><text x=\"468\" y=\"211\" fon }

function numeric(s) {
    s = String(s).trim();
    if (!/^[+-]?(?:\d+(?:\.\d*)?|\.\d+)(?:\/[+-]?(?:\d+(?:\.\d*)?|\.\d+))?$/.test(s)) return NaN;
    let a = s.split('/').map(Number);
    return a.length === 2 ? a[0] / a[1] : a[0];
}

function correct(q, a) {

    if (q.choices) return [q.answer,...(q.acceptedAnswers||[])].some(v=>String(a)===String(v));
    if(q.answerRange){const x=numeric(a),r=q.answerRange;return Number.isFinite(x)&&(r.min==null||(r.minInclusive?x>=r.min:x>r.min))&&(r.max==null||(r.maxInclusive?x<=r.max:x<r.max));}
    let x = numeric(a),
        y = numeric(q.answer);
    return Number.isFinite(x) && [q.answer,...(q.acceptedAnswers || [])].some(v => Math.abs(x - numeric(v)) <= Number(q.tolerance || 0.0001));
}

// Keyboard shortcuts for the workspace. Ignored inside inputs and floating windows.
function handleShortcut(e) {
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    const t = e.target;
    if (t.closest && (t.closest('.window') || t.matches('input,textarea,select,[contenteditable]'))) return;
    if (e.key === '?') {
        e.preventDefault();
        shortcutsWindow();
        return;
    }
    if (view !== 'practice' || db.session.complete || activePopupSet) return;
    const s = db.session,
        q = s.questions[s.index],
        [lo, hi] = activeRange(),
        k = e.key.toLowerCase();
    if (e.key === 'ArrowRight' || k === 'j') {
        if (s.index < hi - 1) go(s.index + 1);
    } else if (e.key === 'ArrowLeft' || k === 'k') {
        if (s.index > lo) go(s.index - 1);
    } else if (/^[1-4]$/.test(k) && q.choices) selectChoice(Number(k) - 1);
    else if (/^[a-d]$/.test(k) && q.choices) selectChoice(k.charCodeAt(0) - 97);
    else if (k === 'f') {
        s.flags[q.id] = !s.flags[q.id];
        render();
    } else if (k === 'n') nextUnanswered();
    else if (k === 'c' && !s.timed) $('checkBtn')?.click();
    else if (k === 'h' && !s.timed) $('hintBtn')?.click();
    else if (k === 'x' && !q.choices) $('response')?.focus();
    else if (k === '=') calculatorWindow();
    else if (k === 'r') referenceWindow();
    else if (k === 's') notesWindow();
    else return;
    e.preventDefault();
}

        blank = s.questions.slice(lo, hi).filter(q => s.answers[q.id] == null || String(s.answers[q.id]).trim() === '').length;
    confirmWindow(s.timed && s.module === 0 ? 'Submit section 3?' : 'Finish this set?', `${blank?blank+' unanswered question'+(blank===1?'':'s')+'. ':''}${s.timed?'You cannot return to this section after submitting.':'Your report will include every question, including unanswered ones.'}`, () => finish());
}

function finish() {
    let s = db.session;
    if (s.complete) return;
    if (s.timed && s.module === 0) {
        s.module = 1;
        s.index = 20;
        s.deadline = Date.now() + 55 * 60000;
        showSolution = false;
        save();
        render();
        toast('Section 4 started. Section 3 is locked.');
        return;
    }
    s.complete = true;
    s.finished = Date.now();
    s.deadline = null;
    showHint = false;
    logActivity();
    db.history.unshift(structuredClone(s));
    syncMissedHistory();
    reportId = s.id;
    view = 'report';
    showSolution = false;
    render();
}

function startSet(qs, name, timed = false, parentTestId = qs[0]?.parentTestId || 'test-8', startIndex = 0) {
    if (!qs.length) return toast('No questions to practice.');
    const run = () => {
        if ($('aiPracticeWindow')) closeAIPractice();
        db.session = makeSession(qs, name, timed, parentTestId);
        if (!timed) db.session.index = Math.max(0, Math.min(qs.length - 1, startIndex));
        db.selectedTestId = parentTestId;
        view = 'practice';
        showSolution = false;
        showHint = false;
        gridFilter = 'all';
        lastTick = Date.now();
        render();
    };
    if (!db.session.complete && Object.keys(db.session.answers).length) confirmWindow('Start a new set?', 'Your unfinished set will be replaced. Finish it first if you want a report.', run);
    else run();
}

function updateTimer() {
    const s = db.session;
    if (!s.timed || s.complete) return;
    let left = Math.max(0, Math.ceil((s.deadline - Date.now()) / 1000));
    if ($('timer')) {
        $('timer').textContent = String(Math.floor(left / 60)).padStart(2, '0') + ':' + String(left % 60).padStart(2, '0');
        $('timer').classList.toggle('warn', left < 300);
    }
    if (left === 0) {
        document.querySelectorAll('.window').forEach(w => w.remove());
        finish();
        toast('Time expired. Your section was submitted.');
    }
}

function trendChart(history) {
    const pts = history.slice().filter(h => h.finished).sort((a, b) => a.finished - b.finished).slice(-12).map(h => Math.round(100 * h.questions.filter(q => correct(q, h.answers[q.id])).length / h.questions.length));
    if (pts.length < 2) return '<p class="mini muted">Finish two or more sets to see your accuracy trend.</p>';
    const W = 420,
        H = 170,
        X = i => 34 + i * (W - 50) / (pts.length - 1),
        Y = v => 18 + (100 - v) * (H - 48) / 100;
    let o = '<svg class="chart trend" viewBox="0 0 ' + W + ' ' + H + '" role="img"><title>Accuracy across your last ' + pts.length + ' attempts</title>';
    for (const v of [0, 25, 50, 75, 100]) o += '<path d="M34 ' + Y(v) + 'H' + (W - 12) + '" stroke="var(--line)"/><text x="28" y="' + (Y(v) + 4) + '" text-anchor="end" font-size="11" fill="var(--muted)">' + v + '</text>';
    o += '<path d="' + pts.map((v, i) => (i ? 'L' : 'M') + X(i).toFixed(1) + ' ' + Y(v).toFixed(1)).join('') + '" fill="none" stroke="var(--accent)" stroke-width="3" stroke-linejoin="round"/>';
    o += pts.map((v, i) => '<circle cx="' + X(i) + '" cy="' + Y(v) + '" r="4.5" fill="var(--accent)"><title>Attempt ' + (i + 1) + ': ' + v + '%</title></circle><text x="' + X(i) + '" y="' + (H - 8) + '" text-anchor="middle" font-size="11" fill="var(--muted)">' + (i + 1) + '</text>').join('');
    return o + '</svg>';
}

function domainBars(domains, keys = Object.keys(DOMAIN_NAMES)) {
    return keys.map(d => {

        const pct = Math.round(100 * x.ok / x.n);
        return '<div class="domain"><div class="row between"><strong>' + esc(DOMAIN_NAMES[d]) + '</strong><span>' + pct + '% · ' + x.ok + '/' + x.n + '</span></div><div class="meter"><i class="' + (pct < 60 ? 'low' : pct < 80 ? 'mid' : '') + '" style="width:' + pct + '%"></i></div></div>';
    }).join('');
}

function weakSkills(stats, limit = 5) {

}

    const w = $('drillWindow');

            lv = [...w.querySelectorAll('[data-lvl]:checked')].map(x => x.dataset.lvl),
            useAI = $('drillAI').checked,
            onlyMissed = $('drillMissed').checked;
        const pool = [...originals, ...(useAI ? aiQs : [])].filter(q => doms.includes(q.domain) && lv.includes(q.level) && (!onlyMissed || missedIds.has(q.id)));
        return {
            doms,
            lv,
            useAI,
            onlyMissed,
            pool
        };
    };
    const refresh = () => {
        const {
            pool
        } = current();
        $('drillMatch').textContent = pool.length ? pool.length + ' question' + (pool.length === 1 ? '' : 's') + ' match these filters.' : 'No stored questions match. Widen the filters or generate AI practice.';

        $('drillCount').value = b.dataset.dcount === 'all' ? current().pool.length || 1 : b.dataset.dcount;

    });

        const c = current(),
            n = Math.max(1, Math.min(200, Number($('drillCount').value) || 10)),
            ordered = $('drillShuffle').checked ? shuffle(c.pool) : c.pool,
            qs = ordered.slice(0, n);

            levels: c.lv,

            count: n,
            shuffle: $('drillShuffle').checked,
            onlyMissed: c.onlyMissed
        };

    });
    refresh();
}

function getReport() {

}

inal paper-test format; not an official SAT score.':'Practice accuracy, not an official SAT scaled score. Study answers may include solution assistance.'}</p></div><div class="card pad" style="margin-top:18px"><h3>Turn mistakes into progress</h3><p class="muted mini">Generate new questions targeting this attempt’s missed skills, or retry the missed originals.</p>${wrong.length?aiControls('recovery','Build recovery set'):'<p class="mini muted">Nothing missed — nice work.</p>'}<button id="retryWrong" class="small" style="margin-top:10px" ${wrong.length?'':'disabled'}>↻ Retry missed originals</button></div><div class="card pad" style="margin-top:18px"><h3>This attempt by skill</h3>${(()=>{const m={};s.questions.forEach(q=>{m[q.skill]=m[q.skill]||{n:0,ok:0,t:0};m[q.skill].n++;if(correct(q,s.answers[q.id]))m[q.skill].ok++;m[q.skill].t+=s.times[q.id]||0;});const rows=Object.entries(m).sort((a,b)=>a[1].ok/a[1].n-b[1].ok/b[1].n||b[1].t-a[1].t);return '<table class="data-table skill-table"><thead><tr><th>Skill</th><th>Score</th><th>Avg time</th></tr></thead><tbody>'+rows.map(([k,v])=>'<tr class="'+(v.ok<v.n?'miss':'')+'"><td>'+esc(k)+'</td><td>'+v.ok+'/'+v.n+'</td><td>'+fmtTime(v.t/v.n)+'</td></tr>').join('')+'</tbody></table>';})()}<p class="mini muted">Average active time per question in this set: ${fmtTime(time/total)}.</p></div><div class="card pad" style="margin-top:18px"><h3>Accuracy trend</h3>${trendChart(db.history)}</div><div class="card pad" style="margin-top:18px"><label for="historySelect">Previous attempts</label><select id="historySelect" style="width:100%">${db.history.map(h=>'<option value="'+esc(h.id)+'" '+(h.id===s.id?'selected':'')+'>'+esc(testName(h.parentTestId)+' / '+h.name)+' · '+new Date(h.finished).toLocaleDateString()+'</option>').join('')}</select></div></section><section class="card pad"><div class="row between"><h2>Question review</h2><select id="reviewFilter" aria-label="Review filter"><option value="all">All questions</option><option value="wro function download(name, text, type) {
    let a = document.createElement('a'),
        url = URL.createObjectURL(new Blob([text], {
            type
        }));
    a.href = url;
    a.download = name;
    a.click();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
}

function missedPayload(session,includeSkipped=true){const data={format:'vertex-missed-questions',version:1,testId:session.parentTestId||'test-8',testName:testName(session.parentTestId),attemptName:session.name,exportedAt:new Date().toISOString(),questions:session.questions.filter(q=>!correct(q,session.answers[q.id])&&(includeSkipped||String(session.answers[q.id]??'').trim()!=='')).map(q=>({question:structuredClone(q),studentAnswer:session.answers[q.id]??null,status:String(session.answers[q.id]??'').trim()===''?'unanswered':'incorrect',correctAnswer:q.choices?q.choices[Number(q.answer)]:q.answer,solutionOpened:!!session.assisted?.[q.id]}))};data.studyGuide={title:data.testName+' — Missed-question study guide',sections:[...new Set(data.questions.map(x=>x.question.skill))].map(skill=>{const q=data.questions.find(x=>x.question.skill===skill).question,advice=skillAdvice(skill,q.domain);return{skill,review:advice[0],commonTrap:advice[1],checklist:['Solve the missed question again without help.','Explain each step, then generate a fresh recovery set.']};})};return data;}
function missedMarkdown(data){const safe=t=>String(t??'').replace(/</g,'&lt;').replace(/>/g,'&gt;');const text=['# '+safe(data.testName)+' — Missed questions','',safe(data.attemptName),'','## Study guide','',...(data.studyGuide?.sections||[]).flatMap(section=>['### '+safe(section.skill),'','Review: '+safe(section.review),'','Common trap: '+safe(section.commonTrap),'',...section.checklist.map(x=>'- [ ] '+safe(x)),'']),'## Missed questions','',...data.questions.flatMap((item,i)=>['## '+(i+1)+'. '+safe(item.question.skill),'',safe(item.question.prompt),'',...(item.question.choices||[]).map((x,j)=>String.fromCharCode(65+j)+'. '+safe(x)),'','- Status: '+item.status,'- Your answer: '+safe(item.question.choices&&item.studentAnswer!==null?item.question.choices[Number(item.studentAnswer)]:item.studentAnswer??'Unanswered'),'- Correct answer: '+safe(item.correctAnswer),'','### Solution','',...item.question.steps.map((step,j)=>(j+1)+'. '+safe(step)),''])].join('\n');const json=JSON.stringify(data,null,2),fence='`'.repeat(Math.max(3,...(json.match(/`+/g)||[]).map(x=>x.length+1)));return text+'\n## Import data\n\nThis block preserves plots, tables and question details for later import.\n\n<!-- VERTEX_MISSED_JSON -->\n'+fence+'json\n'+json+'\n'+fence+'\n';}

function parseMissedFile(text){let data;try{const marker=text.match(/<!-- VERTEX_MISSED_JSON -->\s*(`{3,})json\n([\s\S]*?)\n\1/);const embedded=text.match(/<script type="application\/json" id="vertex-review-data">([\s\S]*?)<\/script>/);data=JSON.parse(marker?marker[2]:embedded?embedded[1]:text);}catch{throw Error('Use a missed-question JSON or Markdown file exported by Vertex.');}if(data?.format!=='vertex-missed-questions'||data.version!==1||!Array.isArray(data.questions)||!data.questions.length||data.questions.length>500)throw Error('This is not a supported missed-question export.');if(data.testId!=='test-8')throw Error('This file belongs to another test. Import it in that test’s page.');for(const item of data.questions){const q=item.question;if(!q||typeof q.prompt!=='string'||q.prompt.length>10000||typeof q.skill!=='string'||!q.skill.length||q.skill.length>150||!['Algebra','Advanced','Data','Geometry'].includes(q.domain)||!Array.isArray(q.steps)||q.steps.some(t=>typeof t!=='string'))throw Error('The file contains an invalid question.');if(q.choices&&(!Array.isArray(q.choices)||q.choices.length!==4||q.choices.some(x=>typeof x!=='string')||!Number.isInteger(Number(q.answer))||Number(q.answer)<0||Number(q.answer)>3))throw Error('Invalid answer choices.');const v=q.visual;if(v){if(v.type==='table'){if(!Array.isArray(v.headers)||v.headers.length>10||v.headers.some(x=>typeof x!=='string')||!Array.isArray(v.rows)||v.rows.length>100||v.rows.some(r=>!Array.isArray(r)||r.length!==v.headers.length||r.some(x=>!['string','number'].includes(typeof x))))throw Error('Invalid table.');}else if(['curve','scatter'].includes(v.type)){if(!Array.isArray(v.range)||v.range.length!==4||v.range.some(x=>!Number.isFinite(x)||Math.abs(x)>1e6)||v.range[1]-v.range[0]<1e-6||v.range[3]-v.range[2]<1e-6)throw Error('Invalid graph range.');if(v.type==='curve'&&(!Array.isArray(v.coeff)||v.coeff.length>8||v.coeff.some(x=>!Number.isFinite(x))))throw Error('Invalid curve.');if(v.type==='scatter'&&(!Array.isArray(v.points)||v.points.length>500||v.points.some(p=>!Array.isArray(p)||p.length!==2||p.some(x=>!Number.isFinite(x)))))throw Error('Invalid scatterplot.');}else if(['triangle','rightTriangle'].includes(v.type)){if(!Array.isArray(v.labels)||v.labels.length!==3)throw Error('Invalid triangle labels.');}else if(['circleArcs','parallelVertical','histograms','choiceTables','lineSeries','exponential'].includes(v.type))validateSpecialVisual(v);else if(v.type==='nativeSVG'){const original=BANK.find(b=>b.visual?.type==='nativeSVG'&&b.visual.name===v.name);if(!original)throw Error('Unknown native figure.');q.visual=structuredClone(original.visual);}else if(v.type!=='parallel')throw Error('Unsupported diagram.');}}return data;}
function missedImportWindow(){if(db.session.timed&&!db.session.complete){toast('Import practice after finishing the timed test.');return;}openWindow('missedImportWindow','Practice from saved mistakes','<label for="missedFile">Missed-question file</label><input id="missedFile" type="file" accept=".json,.md,.html,application/json,text/markdown,text/html"><p class="mini muted">Choose a Vertex JSON, Markdown, or HTML review pack. Your original workspace stays open.</p><p id="missedImportStatus" class="mini" role="status"></p><div id="missedImportControls"></div>');bind('missedFile',async e=>{const file=e.target.files?.[0];if(!file)return;try{if(file.size>2*1024*1024)throw Error('Choose a file smaller than 2 MB.');const data=parseMissedFile(await file.text());if(!$('missedImportControls'))return;const sources=data.questions.map(x=>({skill:x.question.skill,domain:x.question.domain,parentTestId:data.testId}));$('missedImportStatus').textContent=sources.length+' missed questions · '+new Set(sources.map(x=>x.skill)).size+' skills. New questions will target these skills.';$('missedImportControls').innerHTML='<button id="importedGuide" class="small" style="margin-bottom:12px">Build study guide</button>'+aiControls('importedMissed','Generate recovery practice');bind('importedGuide',()=>studyGuideWindow(data));bindAIControls('importedMissed',sources,true,data.testId);}catch(error){if($('missedImportStatus')){$('missedImportStatus').textContent=error.message;$('missedImportControls').innerHTML='';}}},'change');}
function skillAdvice(skill,domain){const name=skill.toLowerCase();if(/percent|growth|exponential/.test(name))return['Translate percentages into multipliers: increase by p% uses 1 + p/100; decrease uses 1 − p/100. Identify the starting value and count growth periods.','Do not confuse the percent change with the multiplier or apply it to the wrong starting quantity.'];if(/system|substitution|perpendicular|dependent/.test(name))return['Use substitution or elimination. Write a line in slope-intercept form when comparing slopes, and check a solution in both original equations.','Parallel lines have equal slopes; perpendicular nonvertical lines have slopes whose product is −1.'];if(/quadratic|roots|zeros|discriminant|minimum|extrema/.test(name))return['Choose factoring for roots, vertex form for an extremum, or the discriminant b² − 4ac for the number of real roots. Check any stated sign restriction.','The vertex x-coordinate is not the minimum or maximum output. Report the quantity the question asks for.'];if(/circle|area|volume|triangle|pythagorean|radian|angle|geometry/.test(name))return['Label the known dimensions. Choose the relevant geometry relationship, keep units consistent, and distinguish radius from diameter.','Length scales by k, area by k², and volume by k³. Round only at the final step.'];if(/mean|frequency|probability|scatter|statistics/.test(name))return['Identify what each value or frequency represents. Use the full sample size for probabilities and a weighted total for a frequency-table mean.','A zero-frequency row is not an observed value. A correlation alone does not establish causation.'];if(/unit|rate/.test(name))return['Write the rate as a fraction with units. Multiply by conversion factors so unwanted units cancel.','Square conversion factors for area and cube them for volume.'];if(/budget|inequal|constraint/.test(name))return['Separate the fixed charge from the per-unit charge, then write the budget inequality. Enforce whole-number restrictions if needed.','At most means ≤. For a maximum affordable whole number, round down rather than to the nearest integer.'];if(/factor|polynomial|exponent|radical/.test(name))return['Distribute signs carefully, combine only like terms, and track exponent rules. Substitute a simple value to check equivalent expressions.','A subtraction before parentheses changes every sign. Check domains and extraneous roots when squaring.'];return domain==='Algebra'?['Define the variable, translate the relationship into an equation, and isolate the requested quantity. Substitute the result back to check it.','Keep units and signs attached to each term; answer the requested expression, not merely the value of the variable.']:['Identify the given information and the target quantity. Follow the worked example, then solve the same question again without looking.','Check restrictions, units, and whether the answer is reasonable before finishing.'];}
function guideBody(data){const groups=new Map();for(const item of data.questions){const key=item.question.skill;if(!groups.has(key))groups.set(key,[]);groups.get(key).push(item);}return '<h1>'+esc(data.testName)+' · Review study guide</h1><p>'+data.questions.length+' missed or unanswered questions · '+groups.size+' skills</p><p>Work through each example, cover the solution, and solve it again. Mark a skill ready when you can explain the steps without help.</p>'+[...groups].sort((a,b)=>b[1].length-a[1].length).map(([skill,items])=>{const saved=data.studyGuide?.sections?.find(x=>x.skill===skill),advice=saved?[saved.review,saved.commonTrap]:skillAdvice(skill,items[0].question.domain);return '<section class="guide-section"><h2>'+esc(skill)+' <small>('+items.length+')</small></h2><p><strong>Review:</strong> '+esc(advice[0])+'</p><p><strong>Common trap:</strong> '+esc(advice[1])+'</p>'+items.map((item,i)=>{const q=item.question,answer=q.choices&&item.studentAnswer!==null?q.choices[Number(item.studentAnswer)]:item.studentAnswer??'Unanswered';return '<article class="guide-example"><h3>Worked example '+(i+1)+'</h3><p>'+(q.source==='Vertex verified generator'?'<p class="mini muted">Verified built-in practice · AI retries did not pass review</p>':'')+rich(q.prompt)+'</p>'+visual(q.visual)+(q.choices?'<ol type="A">'+q.choices.map(x=>'<li>'+rich(x)+'</li>').join('')+'</ol>':'')+'<p><strong>Your answer:</strong> '+rich(answer)+'<br><strong>Correct answer:</strong> '+rich(item.correctAnswer)+'</p><ol>'+q.steps.map(step=>'<li>'+rich(step)+'</li>').join('')+'</ol><p class="guide-check">□ I can solve this again without the solution.<br>□ I can explain why my previous approach did not work.</p>'+(['Gemini','LM Studio'].includes(q.source)?'<p class="mini muted">AI-generated example: verify any result that appears inconsistent.</p>':'')+'</article>';}).join('')+'</section>';}).join('')+'<h2>Next practice</h2><p>Import the saved missed-question JSON or Markdown file, choose a level and quantity, and generate a new recovery set. Start with Easy for an unfamiliar skill, then use Hard or Harder once the worked examples are clear.</p>';}
function studyGuideDocument(data){return '<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Test 8 · Missed-question study guide</title><style>body{font:17px/1.65 system-ui,sans-serif;max-width:850px;margin:32px auto;padding:0 20px;color:#163047}h1{font-size:28px}h2{font-size:23px}.guide-section{border-top:2px solid #cee0da;margin-top:28px;padding-top:16px}.guide-example{margin:20px 0;padding:18px;border:1px solid #dce5eb;border-radius:10px;break-inside:avoid}.guide-check{background:#eff7f3;padding:12px}.chart{max-width:420px;width:100%;height:auto}.data-table{border-collapse:collapse}.data-table td,.data-table th{border:1px solid #cbd8e0;padding:8px 15px}.mini{font-size:13px}.muted{color:#617385}li{margin:9px 0}button{padding:10px 16px;border:0;border-radius:7px;background:#086c59;color:white}@media print{button{display:none}body{margin:0;max-width:none}h2,h3{break-after:avoid}}</style><button onclick="window.print()">Print / Save as PDF</button>'+guideBody(data)+'<script type="application/json" id="vertex-review-data">'+JSON.stringify(data).replace(/</g,'\\u003c')+'</scr'+'ipt></html>';}

// Nonmodal movable windows; pointer capture supports mouse and touch, arrows move the title bar.
function openWindow(id, title, html, onClose = null) {
    let prev = document.activeElement;
    if ($(id)) {
        $(id).style.zIndex = ++z;
        return $(id);
    }
    let w = document.createElement('section');
    w.id = id;
    w.className = 'window';
    w.style.zIndex = ++z;
    w.setAttribute('role', 'dialog');
    w.setAttribute('aria-label', title);
    w.innerHTML = '<div class="window-bar" tabindex="0" aria-label="Drag window; arrow keys move it"><span>' + esc(title) + '</span><button aria-label="Close window">×</button></div><div class="window-body">' + html + '</div>';
    $('windows').append(w);
    w.style.top = Math.min(100 + (z % 4) * 16, Math.max(12, window.innerHeight - w.offsetHeight - 12)) + 'px';
    let close = () => {
        if (id === 'genWindow' && genController) {
            genController.abort();
        }
        w.remove();
        if (onClose) onClose();
        if (prev?.isConnected) prev.focus();
    };
    w.querySelector('.window-bar button').onclick = close;
    w.addEventListener('pointerdown', () => w.style.zIndex = ++z);
    w.addEventListener('keydown', e => {
        if (e.key === 'Escape') {
            e.stopPropagation();
            close();
        }
    });
    let bar = w.firstElementChild,
        drag = null;

    function move(x, y) {
        w.style.left = Math.max(0, Math.min(innerWidth - w.offsetWidth, x)) + 'px';
        w.style.top = Math.max(0, Math.min(innerHeight - 55, y)) + 'px';
    }
    bar.onpointerdown = e => {
        if (e.target.closest('button')) return;
        let r = w.getBoundingClientRect();
        drag = {
            x: e.clientX - r.left,
            y: e.clientY - r.top
        };
        bar.setPointerCapture(e.pointerId);
    };
    bar.onpointermove = e => {
        if (drag) move(e.clientX - drag.x, e.clientY - drag.y);
    };
    bar.onpointerup = () => drag = null;
    bar.onpointercancel = () => drag = null;
    bar.onkeydown = e => {
        if (['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown'].includes(e.key)) {
            e.preventDefault();
            let r = w.getBoundingClientRect();
            move(r.left + (e.key === 'ArrowRight' ? 15 : e.key === 'ArrowLeft' ? -15 : 0), r.top + (e.key === 'ArrowDown' ? 15 : e.key === 'ArrowUp' ? -15 : 0));
        }
    };
    bar.focus();
    return w;
}

function popupSession(set) {
    if (!set.practice) set.practice = makeSession(set.questions, set.name, false, set.parentTestId);
    return set.practice;
}

function finishPopupSession(set) {
    const p = popupSession(set);
    if (p.complete) return;
    p.complete = true;
    p.finished = Date.now();
    db.history.unshift(structuredClone(p));
    syncMissedHistory();
    save();
}

function closeAIPractice() {
    save();
    activePopupSet = null;
    popupShowSolution = false;
    lastTick = Date.now();
    $('aiPracticeWindow')?.remove();
    if (view === 'library') {
        const y = window.scrollY;
        renderLibrary();
        window.scrollTo(0, y);
    }
}

function openAIPractice(set) {
    if (activePopupSet) closeAIPractice();
    activePopupSet = set;
    popupShowSolution = false;
    popupSession(set);
    save();
    lastTick = Date.now();
    const w = openWindow('aiPracticeWindow', testName(set.parentTestId) + ' · ' + set.name, '', closeAIPractice);
    w.style.width = 'min(860px, calc(100vw - 24px))';
    w.style.left = Math.max(12, (innerWidth - Math.min(860, innerWidth - 24)) / 2) + 'px';
    w.style.top = '24px';
    w.style.height = 'calc(100dvh - 48px)';
    renderAIPractice();
}

function renderAIPractice() {
    const set = activePopupSet,
        w = $('aiPracticeWindow');
    if (!set || !w) return;

        body = w.querySelector('.window-body'),
        q = p.questions[p.index];

Previous</button><button id="popupNext" class="primary">' + (p.index === p.questions.length - 1 ? 'Finish & report' : 'Next question →') + '</button></div>';

function verifiedAbsoluteVariants(sources, count, level, offset) {
    const result=[];
    for(let i=0;i<count;i++){
        const source=sources[i%sources.length],text=source.generationText||source.searchText||source.prompt||'';
        if(!/absolute value/i.test(source.skill||'') || !/(?:\\frac|\/).*x/.test(text) || !/[<>]/.test(text))return null;
        const k=3+((offset+i)*7)%97,N=k+5+(offset+i)%8,p=2+(offset+i)%3,q=3+(offset+i)%4;
        const mode=(offset+i+(level==='Harder'?1:0))%6;let prompt,answer,steps;
        if(mode===0){answer=2*(N-k);prompt=`How many integers $x$ in the interval $-${N}\\le x\\le ${N}$ satisfy $0<|\\frac{${k}}{x}|<1$?`;
            steps=[`The denominator must be nonzero. The inequality is equivalent to $|x|>${k}$.`,`The positive integers are ${k+1} through ${N}, giving ${N-k} choices.`,`There are equally many negative choices, for a total of $2(${N-k})=${answer}$.`];}
        if(mode===1){answer=(k+1+N)*(N-k)/2;prompt=`Find the sum of all positive integers $x\\le ${N}$ satisfying $|\\frac{${k}}{x}|<1$.`;
            steps=[`For positive x, the inequality requires $x>${k}$.`,`The solutions are the consecutive integers ${k+1} through ${N}, a total of ${N-k} terms.`,`Their sum is $\\frac{(${k+1}+${N})(${N-k})}{2}=${answer}$.`];}
        if(mode===2){answer=Math.floor(k*q/p)+1;prompt=`What is the least positive integer $x$ for which $|\\frac{${k}}{x}|<\\frac{${p}}{${q}}$?`;
            steps=[`For positive x, remove the absolute value and multiply by the positive quantity $${q}x$.`,`This gives $${k*q}<${p}x$, or $x>\\frac{${k*q}}{${p}}$.`,`The least integer strictly above this bound is ${answer}.`];}
        if(mode===3){answer=Math.ceil(k*q/p)-1;prompt=`What is the greatest positive integer $x$ satisfying $|\\frac{${k}}{x}|>\\frac{${p}}{${q}}$?`;
            steps=[`Since x is positive, multiply both sides by $${q}x$ without changing the inequality direction.`,`Then $${k*q}>${p}x$, so $x<\\frac{${k*q}}{${p}}$.`,`The greatest integer strictly below this bound is ${answer}.`];}
        if(mode===4){answer=k;prompt=`The constant $c$ is a positive integer. The least positive integer satisfying $|\\frac{c}{x}|<1$ is ${k+1}. What is $c$?`;
            steps=[`For positive x, the inequality is equivalent to $x>c$.`,`Because c is an integer, the least possible positive integer x is $c+1$.`,`Thus $c+1=${k+1}$ and $c=${k}$.`];}
        if(mode===5){answer=2*(k+1);prompt=`Among the integer solutions to $0<|\\frac{${k}}{x}|<1$, let $u$ be the greatest negative solution and $v$ the least positive solution. What is the distance between $u$ and $v$ on the number line?`;
            steps=[`The inequality is equivalent to $|x|>${k}$.`,`The two solutions closest to zero are $u=-${k+1}$ and $v=${k+1}$.`,`Their distance is $v-u=${k+1}-(-${k+1})=${answer}$.`];}
        result.push({id:'verified-absolute-'+Date.now()+'-'+i+'-'+Math.random().toString(36).slice(2,8),prompt,answer:String(answer),steps,choices:null,visual:null,tolerance:0,skill:source.skill,domain:source.domain,level,source:'Vertex verified generator',modelUsed:'Built-in absolute-value generator',verification:'Constructed and checked with exact arithmetic',sourceQuestionId:source.id,similarityChecked:true,variationAngle:'Absolute-value reasoning variant '+mode,validationParameters:{k,N,p,q,mode}});
    }
    return result;
}

function mapQuestionReviews(review, batch) {
    if(!review || !Array.isArray(review.reviews) || review.reviews.length!==batch.length)throw Error('Incomplete review response.');
    const rows=review.reviews, ids=rows.map(r=>r && (typeof r.id==='string'||typeof r.id==='number')?String(r.id).trim():null);
    if(ids.some(id=>id===null)||new Set(ids).size!==batch.length)throw Error('Missing or duplicate review identifiers.');
    const schemes=[batch.map((_,i)=>'item-'+(i+1)),batch.map(q=>String(q.id)),batch.map((_,i)=>String(i)),batch.map((_,i)=>String(i+1))];
    const scheme=schemes.find(keys=>new Set(keys).size===batch.length && keys.every(key=>ids.includes(key)));
    if(!scheme)throw Error('Review identifiers do not match the submitted questions.');
    return rows.map((r,i)=>({...r,id:scheme.indexOf(ids[i])}));

function checkedArithmetic(expression) {
 const s=String(expression).replace(/\s+/g,'');
 if(!s||s.length>500||!/^[0-9.+*/()^\-]+$/.test(s))throw Error('Unsupported arithmetic expression.');
 let i=0,depth=0;
 function atom(){if(++depth>40)throw Error('Expression too deeply nested.');let v;if(s[i]==='('){i++;v=sum();if(s[i++]!==')')throw Error('Unbalanced arithmetic.');}else{const m=s.slice(i).match(/^(?:\d+(?:\.\d*)?|\.\d+)/);if(!m)throw Error('Missing number.');i+=m[0].length;v=Number(m[0]);}depth--;return v;}

 function unary(){if(s[i]==='+'){i++;return unary();}if(s[i]==='-'){i++;return -unary();}return power();}
 function product(){let v=unary();while(s[i]==='*'||s[i]==='/'){const op=s[i++],r=unary();v=op==='*'?v*r:v/r;}return v;}
 function sum(){let v=product();while(s[i]==='+'||s[i]==='-'){const op=s[i++],r=product();v=op==='+'?v+r:v-r;}return v;}
 const value=sum();if(i!==s.length||!Number.isFinite(value))throw Error('Invalid or nonfinite arithmetic.');return value;
}

function abortableWait(ms, signal) {
    return new Promise((resolve, reject) => {
        if (signal.aborted) {
            reject(new DOMException('Cancelled', 'AbortError'));
            return;
        }
        let timer = setTimeout(() => {
            signal.removeEventListener('abort', cancel);
            resolve();
        }, ms);

        function cancel() {
            clearTimeout(timer);
            signal.removeEventListener('abort', cancel);
            reject(new DOMException('Cancelled', 'AbortError'));
        }
        signal.addEventListener('abort', cancel, {
            once: true
        });
    });
}
async function generationWait(ms, signal, message) {
    const until = Date.now() + ms;
    while (Date.now() < until) {
        setGenStatus(message + ' ' + Math.ceil((until - Date.now()) / 1000) + 's…');
        await abortableWait(Math.min(1000, until - Date.now()), signal);
    }
}

function retryInfo(response, data) {
    const e = data?.error || {},
        details = Array.isArray(e.details) ? e.details : [];
    let delay = 0;
    const header = response.headers?.get('Retry-After');
    if (header) {
        delay = /^\d+(\.\d+)?$/.test(header) ? Number(header) * 1000 : Math.max(0, Date.parse(header) - Date.now());
    }
    for (const d of details) {
        if (typeof d.retryDelay === 'string' && /^\d+(\.\d+)?s$/.test(d.retryDelay)) delay = Math.max(delay || 0, parseFloat(d.retryDelay) * 1000);
    }
    const quota = JSON.stringify(details) + ' ' + String(e.message || '');
    const hardQuota = response.status === 429 && (/per[ _]?day|daily|limit:\s*0\b/i.test(quota));
    return {
        delay: Number.isFinite(delay) ? delay : 0,
        hardQuota
    };
}

function monthlyBudget(){let all,pending;try{all=JSON.parse(localStorage.getItem(VertexHub.settingsKey+':costs')||'[]');pending=JSON.parse(localStorage.getItem(VertexHub.settingsKey+':budget-pending')||'null');if(!Array.isArray(all))throw Error();}catch{throw Error('Cost history is unavailable. Gemini is paused to protect the monthly budget.');}
 const month=budgetMonth();let checkpoint;try{checkpoint=JSON.parse(localStorage.getItem(VertexHub.settingsKey+':budget-checkpoint')||'null');}catch{throw Error('Budget reconciliation data is unavailable.');}const current=checkpoint?.month===month;if(current&&(!Number.isFinite(checkpoint.total)||checkpoint.total<0||!Number.isInteger(checkpoint.index)||checkpoint.index<0||checkpoint.index>all.length))throw Error('Budget reconciliation data is invalid.');const rows=(current?all.slice(checkpoint.index):all).filter(x=>String(x.time).startsWith(month));const spent=(current?checkpoint.total:0)+rows.reduce((a,r)=>a+(Number.isFinite(r.usd)?Math.max(0,r.usd):0),0);
 return {month,spent,remaining:Math.max(0,MONTHLY_AI_LIMIT-spent),uncertain:!!(pending&&pending.month===month)||rows.some(r=>r.tier==='paid'&&r.usd===null)};
}
function beginBudgetRequest(selectedModel){const b=monthlyBudget();if(b.uncertain)throw Error('Gemini paused after an interrupted request. Open Cost → Reconcile month to confirm spending and resume. The $10 limit remains active.');if(b.spent>=MONTHLY_AI_LIMIT)throw Error('$10 monthly Gemini budget reached. Use LM Studio or wait until next month (UTC).');
 const settings=hubRunSettings||VertexHub.load(),tier=settings[hubWorkingSlot==='key2'?'billing2':'billing1']||(hubWorkingSlot==='key2'?'paid':'free');
 if(tier==='paid'){if(!VertexHub.rates(settings,selectedModel))throw Error('Set pricing for this model in AI setup before paid generation.');if(b.remaining<0.25)throw Error('Gemini paused: less than $0.25 remains in the $10 monthly budget. This safety margin reduces overshoot. LM Studio remains available.');}
 try{localStorage.setItem(VertexHub.settingsKey+':budget-pending',JSON.stringify({month:b.month,started:new Date().toISOString(),tier}));}catch{throw Error('Cannot save budget tracking. Gemini is paused.');}
}
function finishBudgetRequest(usage,status){if(usage||[400,401,403,404,429].includes(status))localStorage.removeItem(VertexHub.settingsKey+':budget-pending');}

function reconcileMonthAmount(value){
 if(typeof value==='string'&&!value.trim())throw Error('Enter the checked month-to-date amount.');const amount=Number(value);if(!Number.isFinite(amount)||amount<0)throw Error('Enter a valid nonnegative dollar amount.');
 const budget=monthlyBudget(),history=costHistory();if(amount+1e-8<budget.spent)throw Error('Use at least the tracked estimate of $'+budget.spent.toFixed(5)+'.');
 const checkpoint={month:budget.month,index:history.length,total:Math.max(amount,budget.spent),reconciledAt:new Date().toISOString()};
 localStorage.setItem(VertexHub.settingsKey+':budget-checkpoint',JSON.stringify(checkpoint));localStorage.removeItem(VertexHub.settingsKey+':budget-pending');return checkpoint;
}
function reconcileBudgetWindow(){openWindow('reconcileBudgetWindow','Reconcile monthly spending','<p>A cancelled, timed-out or interrupted request may have incurred a charge even if its token usage was not received.</p><p>Check month-to-date Gemini API spending for both projects in Google AI Studio or Cloud Billing. Billing updates may be delayed. Enter a conservative total covering those requests; use at least the tracked estimate.</p><label for="reconcileAmount">Month-to-date total · USD</label><input id="reconcileAmount" class="full" type="number" min="0" step="any" placeholder="Enter checked total"><label style="margin-top:12px"><input id="reconcileChecked" type="checkbox"> I checked usage and included interrupted requests.</label><p class="mini muted">Keeps request history and the $10 limit. New request costs are added to this total. This does not change Google billing.</p><p id="reconcileError" class="error" role="status"></p><button id="reconcileSave" class="primary">Save total</button>');bind('reconcileSave',async()=>{const button=$('reconcileSave');try{if(!$('reconcileChecked').checked)throw Error('Check your usage and tick the confirmation first.');if(!navigator.locks)throw Error('Use Chrome or Edge on HTTPS or localhost.');button.disabled=true;await navigator.locks.request(VertexHub.settingsKey+':budget-lock',{ifAvailable:true},lock=>{if(!lock)throw Error('A Gemini request is still running in another tab. Wait for it to finish.');reconcileMonthAmount($('reconcileAmount').value);});$('reconcileBudgetWindow')?.remove();setGenStatus('');costWindow();toast('Budget updated. Generate again if funds remain.');}catch(e){$('reconcileError').textContent=e.message;button.disabled=false;}});}

function costTotal(rows){const known=rows.reduce((a,r)=>a+(r.usd||0),0);return '$'+known.toFixed(5)+(rows.some(r=>r.usd===null)?' + unknown':'');}
function costHistory(){try{return JSON.parse(localStorage.getItem(VertexHub.settingsKey+':costs')||'[]');}catch{return [];}}
function recordCost(usage,selectedModel,status){const item={...VertexHub.estimateUsage(hubRunSettings||VertexHub.load(),selectedModel,hubWorkingSlot,usage),time:new Date().toISOString(),status};if(!usage&&[400,401,403,404,429].includes(status)){item.usd=0;item.rejected=true;}else if(!usage)item.usd=null;runCosts.push(item);try{localStorage.setItem(VertexHub.settingsKey+':costs',JSON.stringify([...costHistory(),item]));}catch{throw Error('Cannot save cost history. Gemini is paused for budget protection.');}if($('costBtn'))$('costBtn').textContent='Est. '+costTotal(runCosts);}
function costWindow(){const budget=monthlyBudget();const all=costHistory(),today=new Date().toISOString().slice(0,10),recent=all.filter(x=>x.time.startsWith(today));openWindow('costWindow','Estimated API cost','<h3>Monthly Gemini budget: $'+budget.spent.toFixed(4)+' / $10.00</h3><p>Remaining: $'+budget.remaining.toFixed(4)+' · '+budget.month+' (UTC)'+(budget.uncertain?' · Paused: unconfirmed cost':'')+'</p><h3>This generation: '+costTotal(runCosts)+'</h3><p>Today (UTC): '+costTotal(recent)+' · Recorded total: '+costTotal(all)+'</p><table class="full"><thead><tr><th>Key</th><th>Input tokens</th><th>Output + thinking</th><th>Estimate</th></tr></thead><tbody>'+['key1','key2'].map((slot,i)=>{const rows=runCosts.filter(r=>r.slot===slot);return '<tr><td>API '+(i+1)+'</td><td>'+rows.reduce((a,r)=>a+(r.input||0),0)+'</td><td>'+rows.reduce((a,r)=>a+(r.output||0),0)+'</td><td>'+costTotal(rows)+'</td></tr>';}).join('')+'</tbody></table><p class="mini muted">Includes generation and answer-check requests received by this browser, even if the set fails validation. Missing usage, failed requests and unknown prices are marked unknown. Local mode has no Gemini API cost. Totals are estimates, not your Google bill. Cache discounts are not applied; cached input is conservatively estimated at the full input rate. Pricing and free/paid key settings are in AI setup.</p><div class="row"><button id="exportCosts">Export cost history</button><button id="reconcileBudget" class="small">Reconcile month</button></div>');bind('reconcileBudget',reconcileBudgetWindow);bind('exportCosts',()=>download('vertex-cost-history.json',JSON.stringify(all,null,2),'application/json'));}
bind('costBtn',costWindow);

restoreAISettings();
window.addEventListener('storage',e=>{if(e.key===VertexHub.settingsKey&&!genController){restoreAISettings();updateAIReady();}});
bind('settingsBtn', settingsWindow);
updateAIReady();
applyTheme();
bind('prefsBtn', preferencesWindow);
document.addEventListener('keydown', handleShortcut);
render();
updateTimer();

function exportSolutions(s) {
    let css = 'body{font:17px/1.65 system-ui,sans-serif;color:#142d43;max-width:850px;margin:40px auto;padding:0 20px}h1{font-size:28px}.question{break-inside:avoid;border-top:1px solid #ccd7df;padding:24px 0}.chart{width:420px;max-width:100%;height:auto}.data-table{border-collapse:collapse;margin:20px 0}.data-table td,.data-table th{border:1px solid #ccd7df;padding:8px 18px}.solution{background:#f1f8f5;padding:18px;margin:20px 0}.feedback{font-weight:bold}li{margin:8px 0}.muted{color:#596b7b}math{font-size:1.1em}';
    let html = '<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Vertex — Worked solutions</title><style>' + css + '</style><body><h1>' + esc(s.name) + ' — Worked solutions</h1><p class="muted">Original practice questions · ' + new Date(s.finished).toLocaleDateString() + '</p>' + s.questions.map((q, i) => '<section class="question"><h2>Question ' + (i + 1) + ' · ' + esc(q.skill) + '</h2><p>' + (q.source==='Vertex verified generator'?'<p class="mini muted">Verified built-in practice · AI retries did not pass review</p>':'')+rich(q.prompt) + '</p>' + visual(q.visual) + (q.choices ? '<ol type="A">' + q.choices.map(c => '<li>' + rich(c) + '</li>').join('') + '</ol>' : '') + '<p>Your answer: ' + rich(q.choices && s.answers[q.id] != null ? q.choices[Number(s.answers[q.id])] : s.answers[q.id] ?? 'Not answered') + '</p>' + solutionHTML(q, s.answers[q.id]) + '</section>').join('') + '</body></html>';
    download('Vertex_Worked_Solutions.html', html, 'text/html');
}
setTimeout(initMastery,0);
document.addEventListener('submit',()=>setTimeout(()=>{if(VertexHub.unlocked())initMastery();},200));
